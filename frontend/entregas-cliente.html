<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu producción — Inmuebles Audiovisuales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper-0:#F7F4EC; --paper-1:#FFFDF8; --paper-2:#EFEADF;
  --line:#E2DBCB; --line-2:#D2C9B3;
  --onyx:#1C1C1E; --gold:#B08D2E; --gold-leaf:#C9A84C; --gold-hi:#D4B65C;
  --ink-1:#211E18; --ink-2:#5C564A; --ink-3:#918975; --ink-4:#B8B0A0;
  --ok:#2F7D55; --ok-bg:#E7F1EA; --wa:#25D366;
  --font-ui:'Inter',system-ui,sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --font-mono:'Spline Sans Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--font-ui);background:var(--paper-0);color:var(--ink-1);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{display:block;max-width:100%}

.device{position:relative;width:100%;max-width:1080px;margin:0 auto;background:var(--paper-0);
  min-height:100vh}

header{background:var(--onyx);padding:13px 24px;display:flex;align-items:center;justify-content:center}
.logo{font-family:var(--font-display);font-size:14px;color:var(--paper-0);letter-spacing:.03em}
.logo em{font-style:normal;color:var(--gold-leaf)}
.hair{height:1px;background:var(--gold-leaf);opacity:.55}

/* El hero es SIEMPRE una foto (la que Bruno eligio como portada). El video ya no
   vive aqui: tiene su propia seccion, donde caben varios. */
.hero{position:relative;overflow:hidden;background:#3a3630 center/cover;
  height:clamp(260px,42vh,420px)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(20,16,10,.86),rgba(20,16,10,.05) 62%)}
.hero .ov{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  justify-content:flex-end;padding:20px}
.hero .ey{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-hi);margin-bottom:6px}
.hero .ti{font-family:var(--font-display);font-weight:500;color:#fff;font-size:25px;line-height:1.12}

.body{padding:24px 18px 46px;max-width:760px;margin:0 auto}
.sect{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;margin:0 0 13px}
.sect::after{content:'';flex:1;height:1px;background:var(--line-2)}
.sect .n{font-family:var(--font-mono);font-weight:400;color:var(--ink-3);letter-spacing:.02em}
.bloque{margin-bottom:30px}

/* Descarga: lo primero del cuerpo. Es a lo que vino el cliente. */
.dbox{background:var(--ok-bg);border:1px solid rgba(47,125,85,.3);border-radius:12px;
  padding:16px;margin-bottom:26px}
.dhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.dhead .ic{color:var(--ok);flex:0 0 auto;margin-top:1px}
.dhead b{display:block;font-size:14px;font-weight:600;color:var(--ok);margin-bottom:3px}
.dhead p{font-size:12px;color:var(--ink-2);line-height:1.5}
.dgrid{display:flex;flex-direction:column;gap:9px}
.dbtn{display:flex;align-items:center;gap:12px;background:var(--paper-1);border:1px solid var(--line-2);
  border-radius:10px;padding:13px 15px;text-decoration:none;color:inherit;cursor:pointer;
  font-family:inherit;text-align:left;width:100%}
.dbtn.pri{background:var(--gold-leaf);border-color:var(--gold-leaf);color:#1a1509}
.dbtn .ic{flex:0 0 auto;opacity:.85}
.dbtn .tx{flex:1;min-width:0}
.dbtn b{display:block;font-size:13.5px;font-weight:600}
.dbtn span{font-family:var(--font-mono);font-size:11px;opacity:.72}
.nota{font-size:11.5px;color:var(--ink-2);line-height:1.55;margin-top:11px}

.banner{border-radius:11px;padding:14px 16px;margin-bottom:26px;display:flex;gap:12px;align-items:flex-start}
.banner.lock{background:var(--paper-2);border:1px solid var(--line-2)}
.banner .ic{flex:0 0 auto;margin-top:1px;color:var(--ink-3)}
.banner b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.banner p{font-size:12px;color:var(--ink-2);line-height:1.5}

/* Video: rejilla que se adapta al numero. Uno solo ocupa el ancho; dos o mas van
   en dos columnas, y con tres no queda una pieza huerfana rara porque todas miden
   igual. */
.videos{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){ .videos.multi{grid-template-columns:1fr 1fr} }
.vcard{position:relative;border-radius:12px;overflow:hidden;background:#2a2724;
  aspect-ratio:16/9;border:none;padding:0;cursor:pointer;display:block;width:100%}
.vcard img{width:100%;height:100%;object-fit:cover}
.vcard::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(18,15,10,.72),rgba(18,15,10,0) 55%)}
.vcard .pl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
  width:52px;height:52px;border-radius:50%;background:rgba(255,253,248,.94);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(0,0,0,.4)}
.vcard .cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:12px 14px}
.vcard .cap b{font-size:13px;font-weight:600;color:#fff;line-height:1.3;display:block;text-align:left}

/* Fotos: mosaico por columnas. Respeta la proporcion de cada foto, asi que una
   vertical se ve vertical en vez de salir recortada a 4:3. */
.mosaico{column-count:2;column-gap:8px}
@media(min-width:640px){ .mosaico{column-count:3;column-gap:12px} }
.ph{break-inside:avoid;margin:0 0 8px;position:relative;border-radius:9px;overflow:hidden;
  background:var(--paper-2);cursor:zoom-in;display:block;width:100%;border:none;padding:0}
@media(min-width:640px){ .ph{margin-bottom:12px} }
.ph img{width:100%;height:auto;opacity:0;transition:opacity .35s}
.ph img.ok{opacity:1}
.ph::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(33,30,24,.09);
  border-radius:9px;pointer-events:none}

.tour{background:var(--paper-1);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.tour .fila{display:flex;gap:10px;align-items:center}
.tour .tx{flex:1;min-width:0}
.tour b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.tour p{font-size:12px;color:var(--ink-2);line-height:1.5}
.copyrow{display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line)}
.copyrow .u{flex:1;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{font-family:var(--font-ui);font-size:13.5px;font-weight:600;border-radius:9px;
  padding:11px 17px;border:1px solid transparent;cursor:pointer;white-space:nowrap;
  text-decoration:none;display:inline-block}
.btn-ghost{background:var(--paper-1);border-color:var(--line-2);color:var(--ink-1)}
.mini{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;
  font-size:11.5px;font-weight:600;border:1px solid var(--line-2);background:var(--paper-2);
  color:var(--ink-1);flex:0 0 auto;cursor:pointer;font-family:inherit}

.wa{margin-top:6px;border:1px solid var(--wa);color:var(--ok);border-radius:11px;padding:14px;
  width:100%;background:none;font-family:inherit;font-weight:600;font-size:13px;display:flex;
  align-items:center;justify-content:center;gap:8px;text-decoration:none}
.foot{text-align:center;margin-top:26px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.foot b{color:var(--gold);font-weight:500}

/* Visor: lo que antes no existia. Sin esto, ver 45 fotos son 45 abrir y cerrar. */
/* Opaco a proposito: con fondo translucido se alcanzaba a ver la cuadricula detras
   y competia con la foto que se esta mirando. */
.visor{position:fixed;inset:0;z-index:200;background:#0E0C09;display:none;
  flex-direction:column}
.visor.on{display:flex}
.vtop{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;
  flex:0 0 auto}
.vtop .cnt{font-family:var(--font-mono);font-size:12px;color:rgba(255,253,248,.72)}
.vtop .acc{display:flex;gap:8px;align-items:center}
.icb{width:38px;height:38px;border-radius:50%;background:rgba(255,253,248,.1);border:none;
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  text-decoration:none}
.icb:hover{background:rgba(255,253,248,.19)}
.vmid{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  padding:0 8px;min-height:0}
.vmid img{max-width:100%;max-height:100%;object-fit:contain}
.vmid iframe{width:100%;max-width:1000px;aspect-ratio:16/9;border:0;border-radius:8px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  background:rgba(255,253,248,.13);border:none;color:#fff;display:flex;align-items:center;
  justify-content:center;cursor:pointer;z-index:3}
.nav:hover{background:rgba(255,253,248,.24)}
.nav.izq{left:10px} .nav.der{right:10px}
.vname{font-family:var(--font-mono);font-size:11px;color:rgba(255,253,248,.5);
  text-align:center;padding:8px 16px 0}
.vbot{flex:0 0 auto;padding:10px 16px 20px;display:flex;justify-content:center}

#estado{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 28px;gap:14px;background:var(--paper-0)}
#estado h2{font-family:var(--font-display);font-weight:500;font-size:21px}
#estado p{font-size:13px;color:var(--ink-2);line-height:1.6;max-width:320px}
#estado .marca{font-family:var(--font-display);font-size:15px;color:var(--ink-1);margin-bottom:6px}
#estado .marca em{font-style:normal;color:var(--gold)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--onyx);color:#fff;padding:11px 18px;border-radius:999px;font-size:12.5px;
  font-weight:600;z-index:250;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="device">

  <div id="estado">
    <div class="marca">Inmuebles <em>Audiovisuales</em></div>
    <h2 id="eTitulo"></h2>
    <p id="eTexto"></p>
    <div id="eExtra"></div>
    <a class="wa" id="eWa" href="#" target="_blank" rel="noopener" style="max-width:280px">
      ¿Dudas? Escríbenos por WhatsApp</a>
  </div>

  <div id="contenido" style="display:none">
    <header><span class="logo">Inmuebles <em>Audiovisuales</em></span></header>
    <div class="hair"></div>

    <div class="hero" id="hero">
      <img id="heroImg" alt="">
      <div class="ov">
        <div class="ey" id="heroEy"></div>
        <div class="ti" id="heroTi"></div>
      </div>
    </div>

    <div class="body" id="cuerpo"></div>
  </div>

  <div class="visor" id="visor">
    <div class="vtop">
      <span class="cnt" id="vcnt"></span>
      <div class="acc">
        <a class="icb" id="vdl" title="Descargar" href="#" download>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
        </a>
        <button class="icb" onclick="cerrarVisor()" title="Cerrar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="vmid" id="vmid">
      <button class="nav izq" onclick="mover(-1)" aria-label="Anterior">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <img id="vimg" alt="">
      <button class="nav der" onclick="mover(1)" aria-label="Siguiente">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="vname" id="vname"></div>
    <div class="vbot" id="vbot"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
var D = null;
// El codigo es el ultimo segmento tras el ultimo guion. El folio que va delante es
// decorativo: si cambia (al reagendar), la liga vieja sigue funcionando.
var CODIGO = (function(){
  var p = location.pathname.replace(/^\/+|\/+$/g,'');
  if(p.indexOf('ver/') === 0) p = p.slice(4);
  var partes = p.split('-');
  return partes[partes.length - 1] || '';
})();

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
function peso(b){
  b = Number(b)||0;
  if(b >= 1073741824) return (b/1073741824).toFixed(1) + ' GB';
  if(b >= 1048576) return Math.round(b/1048576) + ' MB';
  return Math.max(1, Math.round(b/1024)) + ' KB';
}
var toastT;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='show';
  clearTimeout(toastT);toastT=setTimeout(function(){t.className='';},1800);}

// La foto la sirve el propio Worker desde R2. El mosaico lo dibuja el servidor
// segun el estado de la entrega, asi que aqui no hay nada que decidir ni ninguna
// URL que apunte al original limpio.
//
// El ancho de despliegue (d) va aparte del servido (w) porque la marca de agua se
// dibuja como fraccion del ancho SERVIDO: sin esto, la misma foto sale con el
// mosaico grande en el hero y diminuto en una miniatura.
function fotoUrl(f, display){
  if(!f || !f.id) return '';
  // Piso duro. Un ancho de 0 o negativo pide una foto imposible y el navegador se
  // queda con el hueco: pasó con la galería entera cuando window.innerWidth valía 0.
  // Vale más servir una foto de más que ninguna.
  var d = Math.round(Number(display));
  if(!isFinite(d) || d < 120) d = 375;
  return '/api/e/foto?a=' + encodeURIComponent(f.id) + '&w=' + Math.min(2400, d * 2) + '&d=' + d;
}
function vidThumb(v){
  return 'https://' + D.streamCustomer + '.cloudflarestream.com/' + v.uid +
    '/thumbnails/thumbnail.jpg?time=2s&width=800';
}

function estado(titulo, texto, extra){
  document.getElementById('contenido').style.display = 'none';
  document.getElementById('eTitulo').textContent = titulo;
  document.getElementById('eTexto').textContent = texto;
  document.getElementById('eExtra').innerHTML = extra || '';
  var wa = document.getElementById('eWa');
  if(D && D.waLink){ wa.href = D.waLink; } else { wa.style.display = 'none'; }
  document.getElementById('estado').style.display = 'flex';
}

async function cargar(){
  if(!CODIGO) return estado('Enlace inválido',
    'Este enlace no es válido. Pídele a Inmuebles Audiovisuales tu liga de entrega.');
  try {
    var r = await fetch('/api/e/publica?codigo=' + encodeURIComponent(CODIGO));
    D = await r.json();
    if(!r.ok) D = null;
  } catch(e){ D = null; }
  if(!D || !D.ok) return estado('No disponible',
    'No pudimos cargar tu entrega. Intenta de nuevo en un momento.');

  if(D.estado === 'borrador')
    return estado('Estamos preparando tu material',
      'Te avisamos en cuanto tu producción esté lista.');
  if(D.estado === 'pausada')
    return estado('Acceso en pausa',
      'El acceso a este material está en pausa. Escríbenos y con gusto te ayudamos.');
  if(D.estado === 'expirada'){
    var extra = D.tourUrl
      ? '<p style="font-size:13px;color:var(--ink-2);line-height:1.6;max-width:300px">' +
        'Tu recorrido 360° sigue disponible:</p>' +
        '<a class="wa" style="border-color:var(--line-2);color:var(--ink-1);max-width:280px" ' +
        'href="' + esc(D.tourUrl) + '" target="_blank" rel="noopener">Abrir recorrido 360°</a>'
      : '';
    return estado('El periodo de descarga terminó',
      'Las fotos y el video ya se retiraron. Si necesitas el material otra vez, escríbenos.',
      extra);
  }
  render();
}

function fotos(){ return D.fotos || []; }
function videos(){ return (D.videos && D.videos.length) ? D.videos : (D.video ? [D.video] : []); }

function render(){
  var liberada = !!D.liberada;
  var fs = fotos(), vs = videos();

  // Portada: la foto que Bruno eligio. Sin fotos cae al primer cuadro del video,
  // para que nunca quede un hueco gris.
  var portada = fs.filter(function(f){ return f.destacado; })[0] || fs[0];
  var hi = document.getElementById('heroImg');
  if(portada) hi.src = fotoUrl(portada, Math.min(1200, window.innerWidth || 375));
  else if(vs.length && D.streamCustomer) hi.src = vidThumb(vs[0]);
  document.getElementById('heroEy').textContent = liberada ? 'Listo para descargar' : 'Tu producción está lista';
  document.getElementById('heroTi').textContent = D.titulo || 'Tu propiedad';

  var h = '';

  // 1. La descarga primero: es a lo que vino.
  h += liberada ? bloqueDescarga(vs) : bloqueBloqueada();

  // 2. El video, siempre arriba de las fotos.
  if(vs.length && D.streamCustomer){
    h += '<div class="bloque"><h3 class="sect">' + (vs.length === 1 ? 'Video' : 'Videos') +
      (vs.length > 1 ? ' <span class="n">' + vs.length + '</span>' : '') + '</h3>' +
      '<div class="videos' + (vs.length > 1 ? ' multi' : '') + '">' +
      vs.map(function(v, i){
        return '<button class="vcard" onclick="verVideo(' + i + ')">' +
          '<img src="' + esc(vidThumb(v)) + '" alt="" loading="lazy">' +
          '<span class="pl"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1C1C1E"><path d="M8 5l12 7-12 7z"/></svg></span>' +
          '<span class="cap"><b>' + esc(v.nombre || 'Video') + '</b></span></button>';
      }).join('') + '</div></div>';
  }

  // 3. Fotos.
  if(fs.length){
    h += '<div class="bloque"><h3 class="sect">Fotografías <span class="n">' + fs.length + '</span></h3>' +
      '<div class="mosaico" id="mosaico"></div></div>';
  }

  // 4. El recorrido, que no expira y por eso se explica aparte.
  if(D.tourUrl){
    h += '<div class="bloque"><h3 class="sect">Recorrido 360°</h3><div class="tour">' +
      '<div class="fila"><div class="tx"><b>Tour virtual</b>' +
      '<p>Vive en línea y <b style="display:inline">no expira</b>. Úsalo en tus anuncios cuando quieras.</p></div>' +
      '<a class="btn btn-ghost" href="' + esc(D.tourUrl) + '" target="_blank" rel="noopener">Abrir</a></div>' +
      '<div class="copyrow"><span class="u">' + esc(D.tourUrl) + '</span>' +
      '<button class="mini" onclick="copiar360()">Copiar</button></div></div></div>';
  }

  h += '<a class="wa" href="' + esc(D.waLink || '#') + '" target="_blank" rel="noopener">' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
    '¿Dudas? Escríbenos por WhatsApp</a>' +
    '<div class="foot">Una producción de <b>Inmuebles Audiovisuales</b></div>';

  document.getElementById('cuerpo').innerHTML = h;
  if(fs.length) montarMosaico(fs);
  document.getElementById('contenido').style.display = '';
}

// Las fotos van en UN archivo; cada video va suelto. Meter un MP4 de 1 GB dentro
// de un ZIP es trabajo de mas y ademas le quita el poder retomarse si se corta.
function bloqueDescarga(vs){
  var vd = (D.descargas || []).filter(function(d){ return d.tipo === 'video'; });
  var h = '<div class="dbox"><div class="dhead">' +
    '<span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 11h16v10H4z"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg></span>' +
    '<div><b>Tu material está liberado</b><p>' +
    (D.fechaLimite ? 'Vence el <b style="display:inline">' + esc(D.fechaLimite) + '</b>' : '') +
    (D.diasRestantes != null ? ' · ' + (D.diasRestantes === 1 ? 'queda 1 día' : 'quedan ' + D.diasRestantes + ' días') : '') +
    '</p></div></div><div class="dgrid">';

  if(D.zip && D.zip.url){
    h += '<a class="dbtn pri" href="' + esc(D.zip.url) + '" download>' +
      '<span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 21h16"/></svg></span>' +
      '<span class="tx"><b>Descargar las fotografías</b>' +
      '<span>' + D.zip.archivos + ' fotos · ' + peso(D.zip.bytes) + ' · un solo archivo</span></span></a>';
  }
  vd.forEach(function(v){
    h += '<a class="dbtn" href="' + esc(v.url) + '" download>' +
      '<span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 10l6-3v10l-6-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg></span>' +
      '<span class="tx"><b>' + esc(v.nombre || 'Video') + '</b>' +
      '<span>' + peso(v.bytes) + '</span></span></a>';
  });
  h += '</div><p class="nota">Sin marca de agua y en calidad original. ' +
    'También puedes bajar una foto suelta desde el visor.</p></div>';
  return h;
}

function bloqueBloqueada(){
  return '<div class="banner lock"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>' +
    '<div><b>Descarga bloqueada</b><p>Puedes ver todo tu material aquí. Al liquidar se libera ' +
    'sin marca de agua y tienes 14 días para descargarlo.</p></div></div>';
}

// Carga diferida. No es un lujo: cada miniatura es una transformacion del Worker y
// pedir 45 de golpe es lo que lo tumba. Solo se piden las que van a entrar en
// pantalla.
function montarMosaico(fs){
  var cont = document.getElementById('mosaico');
  // El ancho se mide del CONTENEDOR, no de la ventana. window.innerWidth vale 0
  // cuando la pestaña abre en segundo plano o antes de que termine el layout, y
  // "innerWidth - 36" daba un ancho NEGATIVO: la galería entera se quedaba sin
  // cargar. Medido en producción. El piso de 200 px es la última red.
  var caja = cont.clientWidth || document.body.clientWidth || window.innerWidth || 375;
  var cols = caja >= 620 ? 3 : 2;
  var ancho = Math.max(200, Math.round(caja / cols));

  fs.forEach(function(f, i){
    var b = document.createElement('button');
    b.className = 'ph';
    b.setAttribute('aria-label', 'Ver ' + (f.nombre || 'foto'));
    b.onclick = function(){ abrirFoto(i); };
    var img = document.createElement('img');
    // Carga diferida NATIVA del navegador, en vez de un IntersectionObserver: el
    // observer no dispara si la pestaña nunca llega a pintarse, y entonces las
    // fotos se quedan sin src para siempre. Con loading="lazy" el navegador sigue
    // pidiendo solo lo que se acerca a la pantalla, que es lo que evita tumbar al
    // Worker con 45 transformaciones de golpe.
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = f.nombre || '';
    img.onload = function(){ img.className = 'ok'; };
    img.src = fotoUrl(f, ancho);
    b.appendChild(img);
    cont.appendChild(b);
  });

  // Red de seguridad. La carga diferida del navegador decide sola qué está "cerca
  // de la pantalla", y si la ventana reporta tamaño 0 concluye que nada lo está:
  // las fotos se quedan sin cargar aunque su URL sea correcta. Si a los 2.5 s no
  // cargó ninguna, se fuerzan — pero DE A POCAS, porque 45 de golpe es lo que
  // revienta al Worker.
  setTimeout(function(){
    var imgs = cont.querySelectorAll('img');
    var cargadas = 0;
    for(var i = 0; i < imgs.length; i++) if(imgs[i].complete && imgs[i].naturalWidth) cargadas++;
    if(cargadas) return;
    var n = 0;
    (function tanda(){
      var fin = Math.min(n + 6, imgs.length);
      for(; n < fin; n++) imgs[n].loading = 'eager';
      if(n < imgs.length) setTimeout(tanda, 700);
    })();
  }, 2500);
}

// ── Visor ───────────────────────────────────────────────────────────────────
var LISTA = [], IDX = 0, ES_VIDEO = false;

function abrirFoto(i){ ES_VIDEO = false; LISTA = fotos(); IDX = i; abrirVisor(); }
function verVideo(i){ ES_VIDEO = true; LISTA = videos(); IDX = i; abrirVisor(); }
function abrirVisor(){
  document.getElementById('visor').classList.add('on');
  document.body.style.overflow = 'hidden';
  pintarVisor();
}

function descargaDe(id){
  return (D.descargas || []).filter(function(d){ return d.id === id; })[0];
}

function pintarVisor(){
  var mid = document.getElementById('vmid');
  var vi = document.getElementById('vimg');
  var vieja = mid.querySelector('iframe'); if(vieja) vieja.remove();
  var actual = LISTA[IDX] || {};

  if(ES_VIDEO){
    vi.style.display = 'none';
    var f = document.createElement('iframe');
    f.src = 'https://' + D.streamCustomer + '.cloudflarestream.com/' + actual.uid + '/iframe';
    f.allow = 'accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;';
    f.setAttribute('allowfullscreen','');
    mid.appendChild(f);
  } else {
    vi.style.display = '';
    vi.src = fotoUrl(actual, Math.min(1600, Math.max(window.innerWidth || 0, window.innerHeight || 0, 900)));
  }
  document.getElementById('vname').textContent = actual.nombre || '';
  document.getElementById('vcnt').textContent = (IDX + 1) + ' / ' + LISTA.length;

  // La descarga suelta solo existe si la entrega esta liberada. Mismo criterio que
  // el resto: el gate vive en el servidor, aqui solo se refleja.
  var d = D.liberada ? descargaDe(actual.id) : null;
  var dl = document.getElementById('vdl');
  var bot = document.getElementById('vbot');
  if(d){
    dl.style.display = ''; dl.href = d.url; dl.setAttribute('download', d.nombre || '');
    bot.innerHTML = '<a class="btn btn-ghost" href="' + esc(d.url) + '" download>Descargar ' +
      (ES_VIDEO ? 'este video' : 'esta foto') + ' · ' + peso(d.bytes) + '</a>';
  } else {
    dl.style.display = 'none';
    bot.innerHTML = D.liberada ? '' :
      '<p style="font-size:12px;color:rgba(255,253,248,.45);text-align:center">' +
      'La descarga se habilita al liquidar.</p>';
  }
  var flechas = document.querySelectorAll('.nav');
  for(var i = 0; i < flechas.length; i++) flechas[i].style.display = LISTA.length > 1 ? '' : 'none';
}

function mover(paso){
  if(LISTA.length < 2) return;
  IDX = (IDX + paso + LISTA.length) % LISTA.length;
  pintarVisor();
}
function cerrarVisor(){
  document.getElementById('visor').classList.remove('on');
  document.body.style.overflow = '';
  var f = document.querySelector('#vmid iframe'); if(f) f.remove();
}

document.addEventListener('keydown', function(e){
  if(!document.getElementById('visor').classList.contains('on')) return;
  if(e.key === 'Escape') cerrarVisor();
  if(e.key === 'ArrowLeft') mover(-1);
  if(e.key === 'ArrowRight') mover(1);
});
// Deslizar en el celular, que es donde se va a ver casi siempre.
(function(){
  var x0 = null, y0 = null;
  var mid = document.getElementById('vmid');
  mid.addEventListener('touchstart', function(e){
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  mid.addEventListener('touchend', function(e){
    if(x0 == null) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    // Solo cuenta si el gesto fue mas horizontal que vertical: si no, al hacer
    // scroll dentro del visor cambiaria de foto sin querer.
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) mover(dx < 0 ? 1 : -1);
    x0 = y0 = null;
  }, { passive: true });
})();

function copiar360(){
  if(navigator.clipboard && D.tourUrl) navigator.clipboard.writeText(D.tourUrl);
  toast('Liga copiada');
}

document.addEventListener('DOMContentLoaded', cargar);
