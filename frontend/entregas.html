<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entregas — Inmuebles Audiovisuales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper-0:#F7F4EC; --paper-1:#FFFDF8; --paper-2:#EFEADF;
  --line:#E2DBCB; --line-2:#D2C9B3;
  --onyx:#1C1C1E; --onyx-soft:#2A2A2D;
  --gold:#B08D2E; --gold-leaf:#C9A84C; --gold-leaf-hi:#D4B65C;
  --gold-pale:#F3EAD0; --gold-glow:rgba(176,141,46,.14);
  --ink-1:#211E18; --ink-2:#5C564A; --ink-3:#918975; --ink-4:#B8B0A0;
  --ok:#2F7D55; --ok-bg:#E7F1EA;
  --warn:#B0560E; --warn-bg:#FBEEE2;
  --danger:#B23A2B; --danger-bg:#F8E7E4;
  --info:#3F6FA8; --info-bg:#E8EFF6;
  --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-sm:8px; --r:10px; --r-lg:14px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(33,30,24,.04),0 2px 8px rgba(33,30,24,.05);
  --shadow-2:0 2px 6px rgba(33,30,24,.06),0 12px 32px rgba(33,30,24,.10);
  --font-ui:'Inter',system-ui,sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --font-mono:'Spline Sans Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);font-size:14px;line-height:1.5;color:var(--ink-1);
  background:var(--paper-0);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

header{background:var(--paper-1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{max-width:1180px;margin:0 auto;padding:var(--s4) var(--s6);display:flex;
  align-items:center;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--s3)}
/* Logo real de la marca. Antes era un cuadrito con las iniciales "IA" dibujadas
   a mano; el logo de verdad ya vive en /assets. Variante oscura: el header de este
   portal va sobre fondo claro. */
.brand .mark{height:34px;width:auto;max-width:140px}
.brand b{font-family:var(--font-display);font-weight:500;font-size:19px}
.brand span{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.tabs{max-width:1180px;margin:0 auto;padding:0 var(--s6);display:flex;gap:var(--s5);overflow-x:auto}
.tab{padding:var(--s3) 0 11px;font-size:13.5px;font-weight:600;color:var(--ink-3);background:none;
  border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{color:var(--ink-1);border-bottom-color:var(--gold-leaf)}
.tab .n{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-left:5px}

main{max-width:1180px;margin:0 auto;padding:var(--s6)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:38px;
  padding:0 var(--s4);border:1.5px solid transparent;border-radius:var(--r);font-family:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .16s,border-color .16s}
.btn-primary{background:var(--gold-leaf);color:var(--onyx);box-shadow:0 1px 0 var(--gold)}
.btn-primary:hover{background:var(--gold-leaf-hi)}
.btn-onyx{background:var(--onyx);color:var(--paper-0)}
.btn-ghost{background:var(--paper-1);border-color:var(--line-2);color:var(--ink-1)}
.btn-ghost:hover{border-color:var(--gold);background:var(--paper-2)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-sm{height:32px;padding:0 var(--s3);font-size:12.5px;border-radius:var(--r-sm)}
/* Deshabilitado tiene que LEERSE deshabilitado: bajarle la opacidad al dorado
   dejaba un boton que seguia pareciendo activo. Se le quita el color. */
.btn:disabled{cursor:not-allowed;background:var(--paper-2);color:var(--ink-4);
  border-color:var(--line);box-shadow:none;filter:none}
.btn:disabled:hover{background:var(--paper-2)}
.btn-block{width:100%}
/* Accion destructiva y poco frecuente: no debe competir con la zona de subida.
   Aparece al pasar el cursor, y siempre visible con teclado. */
.quitar{opacity:0;transition:opacity .15s;background:none;border:none;cursor:pointer;
  color:var(--ink-4);font-size:12px;padding:4px 6px;font-family:inherit}
.item:hover .quitar,.quitar:focus-visible{opacity:1}
.quitar:hover{color:var(--danger)}

input[type=text],input[type=tel],input[type=email],input[type=url],input[type=number],input[type=password],select{
  width:100%;height:40px;padding:0 var(--s3);background:var(--paper-1);border:1.5px solid var(--line-2);
  border-radius:var(--r);color:var(--ink-1);outline:none;font-family:inherit;font-size:13.5px}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field{margin-bottom:var(--s4)}

/* ── Buscador y configuración ─────────────────────────────────────────────── */
.buscar{flex:1;max-width:400px;position:relative;margin:0 var(--s4)}
.buscar input{width:100%;height:36px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--paper-0);padding:0 12px 0 32px;font-family:inherit;font-size:13px;color:var(--ink-1)}
.buscar svg{position:absolute;left:10px;top:10px;color:var(--ink-3);pointer-events:none}
@media(max-width:720px){ .buscar{order:3;flex-basis:100%;max-width:none;margin:var(--s3) 0 0} }

.menu{position:relative}
.icb{width:36px;height:36px;border-radius:var(--r);border:1.5px solid var(--line-2);
  background:var(--paper-1);color:var(--ink-2);display:flex;align-items:center;justify-content:center;
  cursor:pointer}
.icb:hover{color:var(--ink-1);border-color:var(--ink-4)}
.mpanel{display:none;position:absolute;right:0;top:42px;background:var(--paper-1);
  border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 12px 32px rgba(33,30,24,.14);
  min-width:290px;padding:6px;z-index:60}
.mpanel.on{display:block}
.mpanel button{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:10px 11px;border-radius:7px;font-family:inherit;font-size:13px;color:var(--ink-1)}
.mpanel button:hover{background:var(--paper-2)}
.mpanel button.rojo{color:var(--danger)}
.mpanel button.rojo:hover{background:var(--danger-bg)}
.mpanel hr{border:none;border-top:1px solid var(--line);margin:5px 8px}

.group-label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);
  display:flex;align-items:center;gap:var(--s3);margin:0 0 var(--s4)}
.group-label.urge{color:var(--aviso, #8A6A1F)}
/* Lo que toca hacer, en palabras. Es el dato que Bruno viene a buscar. */
.toca{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.toca.accion{color:var(--gold)}
.toca.espera{color:var(--ink-3);font-weight:400}
.toca.urge{color:#8A6A1F}
.group-label::after{content:'';flex:1;height:1px;background:var(--line)}
.group-label + .rows{margin-bottom:var(--s8)}
.rows{display:flex;flex-direction:column;gap:var(--s2)}
.row{background:var(--paper-1);border:1px solid var(--line);border-radius:var(--r);
  padding:13px var(--s5);display:grid;gap:var(--s4) var(--s5);
  grid-template-columns:minmax(0,1fr) auto;align-items:center;
  cursor:pointer;transition:border-color .16s,box-shadow .16s}
.row:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
/* Solo se apila en celular: a 800px todavia cabe el "que toca" a la derecha, y
   apilarlo ahi hacia las filas el doble de altas sin ganar nada. */
@media(max-width:560px){.row{grid-template-columns:1fr;gap:var(--s2)}}
.row .who b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}
.row .who span{font-size:12.5px;color:var(--ink-2)}
.row .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:4px;
  font-variant-numeric:tabular-nums}
.deliv{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;
  border-radius:var(--r-pill);font-size:12px;font-weight:600;border:1px solid var(--line-2);
  background:var(--paper-1);color:var(--ink-3)}
.chip .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-4);flex:0 0 auto}
.chip.done{border-color:rgba(47,125,85,.35);background:var(--ok-bg);color:var(--ok)}
.chip.done .dot{background:var(--ok);border-color:var(--ok)}
.tail{display:flex;align-items:center;gap:var(--s3);justify-content:flex-end;flex-wrap:wrap}
/* La fila entera abre la entrega, pero nada lo insinuaba. El chevron lo dice. */
.tail .chev{color:var(--ink-4);flex:0 0 auto;transition:transform .16s,color .16s}
.row:hover .tail .chev{color:var(--gold);transform:translateX(2px)}
.count{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.count b{color:var(--ink-1);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--paper-2);color:var(--ink-3)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}

.card{background:var(--paper-1);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.card-hd{padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:var(--s3)}
.card-hd b{font-size:14px;font-weight:600}
.card-pad{padding:var(--s5)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s6);align-items:start}
@media(max-width:900px){.detail{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:var(--s4)}
.side .card-pad{display:flex;flex-direction:column;gap:var(--s3)}
/* Barra de acción pegada arriba: el siguiente paso siempre visible. */
.accionbar{position:sticky;top:var(--htop,0px);z-index:25;background:var(--paper-1);border:1px solid var(--line);
  border-radius:var(--r);padding:13px var(--s5);display:flex;align-items:center;
  gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap}
.accionbar .tit{min-width:0;flex:1}
.accionbar h2{font-family:var(--font-display);font-weight:500;font-size:21px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accionbar .sub{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.accionbar .sub em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.accionbar .acc{display:flex;gap:8px;align-items:center;flex:0 0 auto;flex-wrap:wrap}
.paso{font-size:12px;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;white-space:nowrap}
.paso b{color:var(--gold)}
/* En pantallas angostas los botones se llevan el nombre del cliente por delante. */
@media(max-width:860px){
  .accionbar{flex-direction:column;align-items:stretch}
  .accionbar .acc{justify-content:flex-start}
}

.dtitle{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);
  margin-bottom:var(--s6);flex-wrap:wrap}
.dtitle h2{font-family:var(--font-display);font-weight:500;font-size:25px;margin-bottom:5px}
.dtitle .sub{font-size:13px;color:var(--ink-2)}
.dtitle .sub em{font-style:normal;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.back{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);margin-bottom:var(--s4);
  background:none;border:none;cursor:pointer;padding:0;display:block}

.item{padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item-hd{display:flex;align-items:center;gap:var(--s4)}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-4);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;background:none;cursor:default;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok)}
.item .lab{flex:1;min-width:0}
.item .lab b{display:block;font-size:13.5px;font-weight:600}
.item .lab span{font-size:12px;color:var(--ink-3);font-family:var(--font-mono)}
.urlrow{display:flex;gap:var(--s2);margin-top:var(--s3);margin-left:38px}
.urlrow input{height:36px}

/* Subida */
.zona{margin:var(--s3) 0 0 38px;border:1.5px dashed var(--line-2);border-radius:var(--r);
  background:var(--paper-0);padding:var(--s4);text-align:center;color:var(--ink-3);
  font-size:12.5px;cursor:pointer;transition:border-color .16s,background .16s}
.zona:hover{border-color:var(--gold);color:var(--ink-2)}
.zona.over{border-color:var(--gold);background:var(--gold-glow);color:var(--ink-1)}
.zona b{display:block;color:var(--ink-2);font-size:13px;font-weight:600;margin-bottom:2px}
.prog{margin:var(--s3) 0 0 38px;background:var(--paper-2);border-radius:var(--r-pill);height:6px;
  overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold-leaf);width:0;transition:width .2s}
.progtxt{margin:6px 0 0 38px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
/* ── Cuadricula de archivos ───────────────────────────────────────────────── */
/* Antes median 62 px: un timbre postal donde no se distingue una foto de otra, y
   encima elegir portada era un clic invisible sobre esa miniatura. Aqui se toman
   dos decisiones —cual es la portada y cuales son las destacadas— y las dos piden
   ver la foto de verdad. 150 px es el minimo en el que se puede decidir. */
.tiras{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;
  margin:var(--s3) 0 0 38px}
.tira{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;
  border:1px solid var(--line);background:var(--paper-2) center/cover;padding:0;
  display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.tira.pick{cursor:pointer}
.tira.pick:hover{border-color:var(--gold-leaf)}
.tira img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* Los dos estados se distinguen a simple vista y sin leer nada: la destacada trae
   un anillo, la portada el anillo grueso y su cinta. */
.tira.dest{border:2px solid var(--gold-hi)}
.tira.port{border:3px solid var(--gold-leaf)}
.tira.vid{cursor:default;background:var(--paper-2)}
.tira .cinta{position:absolute;top:0;left:0;right:0;background:var(--gold-leaf);color:#1a1509;
  font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 0;text-align:center;line-height:1.2;z-index:2}

/* Las acciones, siempre a la vista. Escondidas tras el hover no existen: la portada
   llevaba meses sin poder cambiarse porque nadie sabia que se podia. En una foto son
   tres (destacada, portada, reemplazar) y en un video una sola (reemplazar). */
.accs{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;gap:6px;
  padding:7px;justify-content:flex-end;
  background:linear-gradient(to top,rgba(16,13,8,.62),rgba(16,13,8,0))}
/* Van scopeados a .accs y SIN clase propia a proposito. La primera version los llamo
   `.acc`, que ya era el contenedor de botones de la barra de accion (.accionbar .acc):
   como esa regla no fija tamaño, mi `width:31px;height:31px` se lo imponia a la barra
   y el boton "Publicar" se salia de la tarjeta, en todos los anchos. Lo encontro una
   captura de pantalla, no el codigo. */
.accs button{width:31px;height:31px;border-radius:50%;border:none;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,253,248,.9);color:var(--ink-2);line-height:0}
.accs button:hover{background:#fff;color:var(--ink-1)}
.accs button.on{background:var(--gold-leaf);color:#1a1509}
.accs button.on:hover{background:var(--gold-hi)}
/* El contador dice cuantas van y cuantas caben, para no tener que ir contando
   anillos dorados en una cuadricula de 50. */
/* R136 — Aviso de reemplazo en vuelo. Ambar y no verde: no es que algo este
   listo, es que algo esta a medias y todavia se puede cancelar. */
.reemp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0;
  padding:10px 12px;border:1px solid #E7D3A6;background:#FDF7E8;border-radius:9px}
.reemp b{font-size:12.5px;color:#7A5B12}
.reemp span{flex:1;min-width:180px;font-size:12px;color:var(--ink-2)}
.dcount{display:flex;align-items:center;gap:8px;margin:var(--s3) 0 0 38px;
  font-size:12px;color:var(--ink-2)}
.dcount b{font-family:var(--font-mono);font-weight:500;color:var(--ink-1)}
.dcount .lleno{color:var(--gold)}
.tira .marca{position:absolute;inset:0;background:rgba(158,58,47,.45);display:none;
  align-items:center;justify-content:center;color:#fff}
.tira.sel{border:2px solid var(--danger)}
.tira.sel .marca{display:flex}
.selbar{display:flex;align-items:center;gap:10px;background:var(--danger-bg);
  border:1px solid rgba(158,58,47,.28);border-radius:9px;padding:9px 12px;
  margin:var(--s3) 0 0 38px}
.selbar b{font-size:12.5px;color:var(--danger);flex:1}
.btn-borrar{background:var(--danger);color:#fff;border-color:var(--danger)}
.ayuda{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin:9px 0 0 38px;
  display:flex;align-items:center;gap:6px}
.ayuda svg{color:var(--gold-leaf);flex:0 0 auto}

.files{display:flex;flex-wrap:wrap;gap:7px;margin:var(--s3) 0 0 38px}
.f{position:relative;width:74px}
.f .im{width:74px;height:56px;border-radius:7px;background:var(--paper-2) center/cover;display:block;
  border:1px solid var(--line);cursor:pointer}
.f .im:hover{border-color:var(--gold-leaf)}
.f .nm{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--paper-1);border:1px solid var(--line-2);color:var(--danger);cursor:pointer;
  font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.f .x:hover{background:var(--danger-bg);border-color:var(--danger)}
.f.vid .im{display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.destacada{outline:2px solid var(--gold-leaf);outline-offset:1px}
/* La liga se muestra COMPLETA. Truncarla la volvia inservible: se mira justo para
   verificar que apunta a donde debe. */
.linkbox{background:var(--paper-0);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px var(--s3);font-family:var(--font-mono);font-size:11px;color:var(--ink-2);
  line-height:1.5;word-break:break-all}
.money{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.money .k{font-size:12.5px;color:var(--ink-2)}
.money .v{font-family:var(--font-display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.money .v.due{color:var(--warn)}
.hint{font-size:12px;color:var(--ink-3);line-height:1.55}
.log{display:flex;flex-direction:column;gap:9px}
.log div{display:flex;gap:var(--s3);font-size:12px;color:var(--ink-2);align-items:baseline}
.log time{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-4);flex:0 0 74px}

.vacio{text-align:center;padding:var(--s8) var(--s5);color:var(--ink-3);font-size:13px}
.vacio b{display:block;color:var(--ink-2);font-size:15px;font-weight:600;margin-bottom:6px;
  font-family:var(--font-display)}

#modal{position:fixed;inset:0;background:rgba(28,28,30,.45);z-index:60;display:none;
  align-items:center;justify-content:center;padding:var(--s5)}
#modal.on{display:flex}
.sheet{background:var(--paper-1);border-radius:var(--r-lg);box-shadow:var(--shadow-2);
  width:100%;max-width:460px;max-height:88vh;overflow:auto}
.sheet-hd{padding:var(--s5);border-bottom:1px solid var(--line);font-family:var(--font-display);
  font-weight:500;font-size:19px}
.sheet-bd{padding:var(--s5)}
.sheet-ft{padding:var(--s4) var(--s5);border-top:1px solid var(--line);display:flex;gap:var(--s2);
  justify-content:flex-end}
.sugg{border:1px solid var(--line);border-radius:var(--r-sm);margin-top:6px;max-height:180px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;padding:10px var(--s3);background:none;border:none;
  border-bottom:1px solid var(--line);cursor:pointer;font-family:inherit;font-size:13px}
.sugg button:last-child{border-bottom:none}
.sugg button:hover{background:var(--paper-2)}
.sugg b{display:block;font-weight:600}
.sugg span{font-size:11.5px;color:var(--ink-3);font-family:var(--font-mono)}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--onyx);color:var(--paper-0);padding:11px 18px;border-radius:var(--r-pill);
  font-size:12.5px;font-weight:600;z-index:95;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--danger)}

#login{max-width:360px;margin:14vh auto;padding:0 var(--s5)}
#login .card-pad{display:flex;flex-direction:column;gap:var(--s4)}
#login h1{font-family:var(--font-display);font-weight:500;font-size:26px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px var(--s4);border-bottom:1px solid var(--line)}
th{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em}
tr:last-child td{border-bottom:none}
.tablewrap{overflow-x:auto}
</style>
</head>
<body>

<div id="login" style="display:none">
  <h1 style="margin-bottom:20px">Entregas</h1>
  <div class="card"><div class="card-pad">
    <div class="field" style="margin:0">
      <label class="f" for="lk">Contraseña</label>
      <input type="password" id="lk" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" onclick="entrar()">Entrar</button>
    <p class="hint" id="lerr" style="color:var(--danger);display:none">Contraseña incorrecta.</p>
  </div></div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="hd">
      <div class="brand">
        <img class="mark" src="/assets/logo.svg" alt="Inmuebles Audiovisuales">
        <b>Entregas</b>
      </div>
      <div class="buscar" id="buscarBox">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" placeholder="Buscar cliente, folio o dirección…" oninput="filtrar()" autocomplete="off">
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="menu">
          <button class="icb" onclick="menu(event)" title="Configuración" aria-label="Configuración">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <!-- Lo que borra material vive aqui: se usa dos veces al año y no tiene por
               que estar junto al boton de todos los dias. -->
          <div class="mpanel" id="mpanel">
            <button onclick="verHuerfanos()">Buscar material sin dueño</button>
            <button onclick="salir()">Cambiar de contraseña</button>
            <hr>
            <button class="rojo" onclick="verLimpieza()">Limpiar material de entregas que nunca pagaron</button>
          </div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="abrirNueva()">Nueva entrega</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tab-activas" onclick="irLista()">Activas <span class="n" id="nAct"></span></button>
      <button class="tab" id="tab-hist" onclick="verHistorial()">Historial <span class="n" id="nHist"></span></button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="modal"><div class="sheet">
  <div class="sheet-hd" id="mTitulo"></div>
  <div class="sheet-bd" id="mCuerpo"></div>
  <div class="sheet-ft" id="mPie"></div>
</div></div>
<div id="toast"></div>

<script>
var KEY = '';
var D = null;          // datos de la lista
var VISTA = 'lista';

// ── Utilidades ───────────────────────────────────────────────────────────────
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function money(n){return '$' + (Number(n)||0).toLocaleString('es-MX');}
var toastT;
function toast(msg, malo){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = malo ? 'show bad' : 'show';
  clearTimeout(toastT); toastT = setTimeout(function(){ t.className = ''; }, 2600);
}
function fechaCorta(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d)) return '';
  var M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d.getDate() + ' ' + M[d.getMonth()];
}

async function api(accion, opts){
  opts = opts || {};
  var url = '/api/e/' + accion + (opts.qs ? '?' + opts.qs : '');
  var conf = { method: opts.body ? 'POST' : 'GET',
               headers: { 'X-Entregas-Key': KEY, 'Content-Type': 'application/json' } };
  if(opts.body) conf.body = JSON.stringify(opts.body);
  var r = await fetch(url, conf);
  var j = null;
  try { j = await r.json(); } catch(e){ j = null; }
  if(!r.ok){
    var m = (j && j.error) || ('Error ' + r.status);
    throw new Error(m);
  }
  return j;
}

// ── Login ────────────────────────────────────────────────────────────────────
async function entrar(){
  var k = document.getElementById('lk').value.trim();
  if(!k) return;
  KEY = k;
  try {
    await api('listar');
    try { localStorage.setItem('entregas-key', k); } catch(e){}
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = '';
    irLista();
  } catch(e){
    document.getElementById('lerr').style.display = 'block';
    KEY = '';
  }
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && document.getElementById('login').style.display !== 'none') entrar();
  if(e.key === 'Escape') cerrarModal();
});

// ── Lista ────────────────────────────────────────────────────────────────────
// El menú de configuración. Se cierra al hacer clic en cualquier otro lado.
function menu(ev){
  if(ev) ev.stopPropagation();
  document.getElementById('mpanel').classList.toggle('on');
}
document.addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('.menu')) return;
  var p = document.getElementById('mpanel');
  if(p) p.classList.remove('on');
});
function cerrarMenu(){ var p = document.getElementById('mpanel'); if(p) p.classList.remove('on'); }

// El buscador solo tiene sentido en la lista: dentro de una entrega estorba.
function verBuscador(v){
  // display, no visibility: en pantallas angostas el buscador ocupa su propia fila
  // y dejarla reservada abre un hueco enorme dentro del detalle.
  var b = document.getElementById('buscarBox');
  if(b) b.style.display = v ? '' : 'none';
}

async function irLista(){
  VISTA = 'lista';
  verBuscador(true);
  document.getElementById('tab-activas').className = 'tab on';
  document.getElementById('tab-hist').className = 'tab';
  var m = document.getElementById('main');
  m.innerHTML = '<div class="vacio">Cargando…</div>';
  try { D = await api('listar'); } catch(e){ return toast(e.message, true); }
  document.getElementById('nAct').textContent =
    D.pendientes.length + D.conCliente.length + D.liberadas.length;
  document.getElementById('nHist').textContent = D.historial.length;

  pintarLista();
}

// Lo que Bruno quiere saber al abrir el portal no es el estado interno de la
// entrega, es QUE LE TOCA HACER. Esto lo traduce, y de ahi salen los grupos.
function queToca(e){
  if(e.estado === 'borrador'){
    if(!e.completa){
      var falta = (e.faltan && e.faltan.length) ? e.faltan.join(', ') : 'material';
      return { txt: 'Falta subir ' + falta, clase: 'accion', grupo: 'hacer' };
    }
    return { txt: 'Listo para publicar', clase: 'accion', grupo: 'hacer' };
  }
  if(e.estado === 'publicada'){
    if(e.saldo != null && e.saldo > 0)
      return { txt: 'Esperando pago · ' + money(e.saldo), clase: 'espera', grupo: 'esperando' };
    return { txt: 'Ya pagó · falta liberar', clase: 'accion', grupo: 'hacer' };
  }
  if(e.estado === 'liberada'){
    var d = e.diasRestantes;
    if(d != null && d < 0) return { txt: 'Vencida', clase: 'espera', grupo: 'entregadas' };
    if(d != null && d <= 3)
      return { txt: 'Se borra en ' + d + (d === 1 ? ' día' : ' días'), clase: 'urge', grupo: 'urge' };
    return { txt: d == null ? 'Liberada' : 'Descargando · ' + d + ' días', clase: 'espera', grupo: 'entregadas' };
  }
  if(e.estado === 'pausada') return { txt: 'Acceso en pausa', clase: 'espera', grupo: 'entregadas' };
  return { txt: 'Expirada', clase: 'espera', grupo: 'entregadas' };
}

function filtrar(){ if(VISTA === 'lista') pintarLista(); }

function pintarLista(){
  var q = ((document.getElementById('q') || {}).value || '').trim().toLowerCase();
  var todas = D.pendientes.concat(D.conCliente, D.liberadas);
  var filas = todas.filter(function(e){
    if(!q) return true;
    return ((e.cliente || '') + ' ' + (e.folio || '') + ' ' + (e.titulo || '') + ' ' +
            (e.direccion || '')).toLowerCase().indexOf(q) >= 0;
  });

  var g = { urge: [], hacer: [], esperando: [], entregadas: [] };
  filas.forEach(function(e){ g[queToca(e).grupo].push(e); });

  var nombres = { urge: 'Se borran pronto', hacer: 'Por hacer',
                  esperando: 'Esperando pago', entregadas: 'Entregadas' };
  var h = '';
  ['urge','hacer','esperando','entregadas'].forEach(function(k){
    if(!g[k].length) return;
    h += '<p class="group-label' + (k === 'urge' ? ' urge' : '') + '">' + nombres[k] +
      ' <span style="font-family:var(--font-mono)">' + g[k].length + '</span></p>' +
      '<div class="rows">' + g[k].map(fila).join('') + '</div>';
  });

  if(!h){
    h = q
      ? '<div class="vacio"><b>Nada coincide con “' + esc(q) + '”</b>Prueba con el nombre del cliente o el folio.</div>'
      : '<div class="vacio"><b>Todavía no hay entregas</b>' +
        'Cada contrato nuevo crea las suyas solo. También puedes crear una a mano.</div>';
  }
  document.getElementById('main').innerHTML = h;
}

function fila(e){
  var t = queToca(e);
  // El cliente manda: es como Bruno piensa en sus entregas. La direccion queda de
  // apoyo, y el folio abajo en mono.
  return '<div class="row" onclick="abrir(\'' + e.id + '\')">' +
    '<div class="who"><b>' + esc(e.cliente || 'Sin cliente') + '</b>' +
      '<span>' + esc(e.titulo || 'Sin dirección') + '</span>' +
      '<div class="meta">' + esc(e.folio || 'sin folio') +
      (e.fechaSesion ? ' · sesión ' + esc(e.fechaSesion) : '') + '</div></div>' +
    '<div class="tail"><span class="toca ' + t.clase + '">' + esc(t.txt) + '</span>' +
      '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>' +
    '</div>' +
  '</div>';
}

async function verHistorial(){
  VISTA = 'hist';
  verBuscador(false);
  document.getElementById('tab-activas').className = 'tab';
  document.getElementById('tab-hist').className = 'tab on';
  if(!D) D = await api('listar');
  var m = document.getElementById('main');
  if(!D.historial.length){
    m.innerHTML = '<div class="vacio"><b>Historial vacío</b>' +
      'Aquí van las entregas que ya expiraron. El registro se queda aunque el material se borre.</div>';
    return;
  }
  m.innerHTML = '<p class="group-label">Expiradas</p><div class="rows">' +
    D.historial.map(fila).join('') + '</div>';
}

// ── Detalle ──────────────────────────────────────────────────────────────────
var ACT = null;
async function abrir(id){
  VISTA = 'detalle';
  verBuscador(false); cerrarMenu();
  var m = document.getElementById('main');
  m.innerHTML = '<div class="vacio">Cargando…</div>';
  try { ACT = await api('obtener', { qs: 'id=' + encodeURIComponent(id) }); }
  catch(e){ return toast(e.message, true); }
  pintarDetalle();
}

// La barra de accion se queda pegada arriba. Lo que hay que hacer no puede vivir
// al final de 50 miniaturas: antes habia que hacer scroll por toda la galeria para
// encontrar el boton de publicar.
function barraAccion(e, c, estadoPill){
  var pend = pendientesGaleria();
  var paso = '', botones = '';

  if(e.estado === 'borrador'){
    if(!ACT.completa){
      paso = '<span class="paso">Falta ' + esc((ACT.faltan || []).join(', ') || 'material') + '</span>';
    } else if(pend){
      paso = '<span class="paso">Galería sin preparar · <b>' + pend + '</b></span>';
      botones = '<button class="btn btn-ghost btn-sm" onclick="prepararGaleria()">Preparar galería</button>';
    } else {
      paso = '<span class="paso">Todo listo</span>';
    }
    botones += '<button class="btn btn-primary btn-sm" ' + (ACT.completa ? '' : 'disabled') +
      ' onclick="publicar()">Publicar</button>';
  } else if(e.estado === 'publicada'){
    paso = (e.saldo != null && e.saldo > 0)
      ? '<span class="paso">Saldo <b>' + money(e.saldo) + '</b></span>'
      : '<span class="paso">Ya pagó</span>';
    botones = '<button class="btn btn-ghost btn-sm" onclick="copiar(\'' + esc(e.rutaPublica || '') + '\')">Copiar liga</button>' +
      '<button class="btn btn-primary btn-sm" onclick="liberar()">Liberar ahora</button>';
  } else if(e.estado === 'liberada'){
    paso = '<span class="paso">' +
      (e.diasRestantes != null ? 'Vence en <b>' + e.diasRestantes + ' días</b>' : 'Liberada') + '</span>';
    botones = '<button class="btn btn-ghost btn-sm" onclick="extender()">Extender 14 días</button>' +
      '<button class="btn btn-primary btn-sm" onclick="copiar(\'' + esc(e.rutaPublica || '') + '\')">Copiar liga</button>';
  } else {
    botones = '<button class="btn btn-ghost btn-sm" onclick="copiar(\'' + esc(e.rutaPublica || '') + '\')">Copiar liga</button>';
  }

  return '<button class="back" onclick="irLista()">← Todas las entregas</button>' +
    '<div class="accionbar"><div class="tit"><h2>' + esc(c.nombre || 'Sin cliente') + '</h2>' +
      '<p class="sub">' + esc(e.titulo || 'Sin dirección') + ' · <em>' +
      esc(e.folio || 'sin folio') + (e.fecha_sesion ? ' · sesión ' + esc(e.fecha_sesion) : '') +
      '</em></p></div>' +
      '<div class="acc">' + estadoPill + paso + botones + '</div></div>';
}

// El encabezado tambien es pegajoso, asi que la barra de accion tiene que empezar
// justo debajo. Se MIDE en vez de adivinarse: su alto cambia con el ancho de la
// ventana, y un numero fijo la escondia detras del encabezado.
function ajustarTope(){
  var h = document.querySelector('header');
  if(h) document.documentElement.style.setProperty('--htop', h.getBoundingClientRect().height + 'px');
}
window.addEventListener('resize', ajustarTope);

function pintarDetalle(){
  var e = ACT.entrega, c = ACT.cliente;
  var estadoPill = {
    borrador:  '<span class="pill mute">Borrador</span>',
    publicada: '<span class="pill info">Con el cliente</span>',
    liberada:  '<span class="pill ok">Liberada</span>',
    pausada:   '<span class="pill mute">Pausada</span>',
    expirada:  '<span class="pill danger">Expirada</span>'
  }[e.estado] || '';

  var items = ACT.entregables.map(function(i){
    var todosArch = ACT.archivos.filter(function(a){ return a.e_entregable_id === i.id; });
    // R136 — Un reemplazo en vuelo NO es un archivo mas del entregable: es una
    // version esperando a entrar. Si contara en la cuadricula, reemplazar se veria
    // igual que subir un duplicado, que es justo lo que se quiso evitar.
    var pendientes = todosArch.filter(function(a){ return !!a.reemplaza_a; });
    var arch = todosArch.filter(function(a){ return !a.reemplaza_a; });
    var det = i.tipo === 'enlace'
      ? (i.valor ? esc(i.valor) : 'pega la liga')
      : (arch.length ? arch.length + ' archivo' + (arch.length===1?'':'s') : 'sin archivos');
    var h = '<div class="item"><div class="item-hd">' +
      '<span class="tick' + (i.completo ? ' on' : '') + '">' +
        (i.completo ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4"><polyline points="20 6 9 17 4 12"/></svg>' : '') +
      '</span>' +
      '<span class="lab"><b>' + esc(i.nombre) + '</b><span>' + det + '</span></span>' +
      (arch.length && QUITANDO !== i.id
        ? '<button class="btn btn-ghost btn-sm" onclick="modoQuitar(\'' + i.id + '\')">Quitar archivos</button>' : '') +
      '<button class="quitar" title="Quitar este entregable" onclick="borrarEntregable(\'' + i.id + '\')">Quitar</button>' +
      '</div>';
    pendientes.forEach(function(a){
      var viejo = archivoDe(a.reemplaza_a);
      h += '<div class="reemp">' +
        '<b>Reemplazando' + (viejo ? ' ' + esc(viejo.nombre) : '') + '</b>' +
        '<span>' + esc(a.nombre) + ' se está preparando. El cliente sigue viendo la ' +
          'versión anterior hasta que quede lista.</span>' +
        '<button class="btn btn-ghost btn-sm" onclick="cancelarReemplazo(\'' + a.id + '\')">' +
          'Cancelar</button></div>';
    });
    if(i.tipo === 'enlace'){
      h += '<div class="urlrow">' +
        '<input type="url" id="lk-' + i.id + '" value="' + esc(i.valor || '') + '" placeholder="https://…">' +
        '<button class="btn btn-ghost btn-sm" onclick="guardarEnlace(\'' + i.id + '\')">Guardar</button>' +
        '</div>';
    } else {
      // Archivos ya subidos. La miniatura la sirve el propio Worker desde R2; la
      // llave va en la URL porque una <img> no puede mandar cabeceras.
      if(arch.length){
        // Cuadricula densa y SIN nombres: "IAV-2607.17…" repetido 50 veces no
        // distingue nada y duplica el alto. El nombre va en el tooltip.
        if(QUITANDO === i.id){
          h += '<div class="selbar"><b>' +
            (SEL.length ? 'Vas a quitar ' + SEL.length + ' archivo' + (SEL.length === 1 ? '' : 's')
                        : 'Toca los archivos que quieras quitar') + '</b>' +
            '<button class="btn btn-ghost btn-sm" onclick="modoQuitar(null)">Cancelar</button>' +
            (SEL.length ? '<button class="btn btn-sm btn-borrar" onclick="quitarSeleccion()">Quitar ' +
                          SEL.length + '</button>' : '') + '</div>';
        }
        var quitando = QUITANDO === i.id;
        h += '<div class="tiras">' + arch.map(function(a){
          var esVid = /^video\//.test(a.mime || '');
          var sel = SEL.indexOf(a.id) >= 0;
          var tit = quitando ? esc(a.nombre) + ' — tócalo para quitarlo' : esc(a.nombre);
          // Va como <img loading="lazy"> y NO como background-image: el fondo CSS se
          // descarga siempre, todo de golpe. Con 50 fotos eso son 50 transformaciones
          // simultaneas que tumban al Worker — y mientras subes, tumban tambien las
          // subidas (503 en subirFoto). Medido en produccion el 12 ago.
          //
          // v= es la marca de version: sin ella el navegador se queda con la copia
          // marcada que guardo antes de liberar. Misma razon que en el portal del
          // cliente.
          var mini = esVid ? ''
            : '<img loading="lazy" decoding="async" alt="" src="/api/e/foto?a=' + a.id +
              '&w=360&d=180&v=' + verFoto() + '&k=' + encodeURIComponent(KEY) + '">';
          var icoVid = esVid
            ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 10l6-3v10l-6-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>' : '';

          // En modo quitar la tira entera vuelve a ser un solo boton: ahi la unica
          // decision es cual se va, y dos acciones mas encima invitan al accidente.
          if(quitando){
            return '<button class="tira pick' + (esVid ? ' vid' : '') + (sel ? ' sel' : '') +
              '" title="' + tit + '" onclick="marcar(\'' + a.id + '\')">' + mini + icoVid +
              '<span class="marca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>' +
              '</button>';
          }
          if(esVid){
            return '<div class="tira vid" title="' + tit + '">' + icoVid +
              '<span class="accs"><button onclick="reemplazar(\'' + a.id + '\')" ' +
                'title="Reemplazar por una versión nueva">' + ICO_REEMP + '</button></span>' +
              '</div>';
          }
          // La portada cuenta como destacada, asi que su palomita va prendida y
          // apagarla desde aqui no tendria a donde llevar la cabecera: el servidor
          // lo rechaza y aqui se dice por que en vez de dejar que falle.
          var esPort = !!a.portada, esDest = !!a.destacado || esPort;
          return '<div class="tira' + (esPort ? ' port' : (esDest ? ' dest' : '')) +
            '" title="' + tit + '">' + mini +
            (esPort ? '<span class="cinta">portada</span>' : '') +
            '<span class="accs">' +
              '<button class="' + (esDest ? 'on' : '') + '" onclick="alternarDestacada(\'' + a.id + '\')" ' +
                'title="' + (esDest ? 'Quitar de las destacadas' : 'Poner en las destacadas') + '">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg></button>' +
              '<button class="' + (esPort ? 'on' : '') + '" onclick="ponerPortada(\'' + a.id + '\')" ' +
                'title="' + (esPort ? 'Es la portada' : 'Usar como portada') + '">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="' + (esPort ? 'currentColor' : 'none') +
                '" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg></button>' +
              '<button onclick="reemplazar(\'' + a.id + '\')" title="Reemplazar por una versión nueva">' +
                ICO_REEMP + '</button>' +
            '</span></div>';
        }).join('') + '</div>';

        var fotos = arch.filter(function(a){ return !/^video\//.test(a.mime||''); });
        if(!quitando && fotos.length > 1){
          var nd = fotos.filter(function(a){ return a.destacado || a.portada; }).length;
          var meta = ACT.destacadasVisibles || 6;
          h += '<div class="dcount"><b class="' + (nd >= meta ? 'lleno' : '') + '">' +
            nd + ' de ' + meta + '</b> destacadas · el cliente ve estas en grande antes ' +
            'del botón “ver todas”.</div>' +
            '<p class="ayuda"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>' +
            'La estrella elige la portada (la foto grande de arriba). La palomita arma la selección.</p>';
        }
      }
      var acepta = i.tipo === 'video' ? 'video/*' : 'image/*';
      var multi = i.tipo === 'video' ? '' : ' multiple';
      h += '<input type="file" id="in-' + i.id + '" accept="' + acepta + '"' + multi +
           ' hidden onchange="elegidos(\'' + i.id + '\',\'' + i.tipo + '\',this.files)">' +
        '<div class="zona" id="z-' + i.id + '" onclick="document.getElementById(\'in-' + i.id + '\').click()">' +
          '<b>' + (i.tipo === 'video' ? 'Arrastra el video' : 'Arrastra las fotos') + '</b>' +
          'o haz clic para elegirlas' +
        '</div>' +
        '<div class="prog" id="p-' + i.id + '" style="display:none"><i></i></div>' +
        '<div class="progtxt" id="pt-' + i.id + '"></div>';
    }
    return h + '</div>';
  }).join('');

  // Publicar, liberar, extender y copiar la liga viven ARRIBA, en la barra pegajosa.
  // Aqui solo queda lo que no es el paso del momento, para no tener dos botones que
  // hacen lo mismo en la misma pantalla.
  var acciones = '';
  if(e.estado === 'borrador' && !ACT.completa){
    acciones = '<p class="hint">Sube el material que falta para poder publicar.</p>';
  } else if(e.estado === 'publicada'){
    acciones = '<p class="hint">Se libera sola cuando el saldo llegue a cero.</p>';
  } else if(e.estado === 'liberada'){
    acciones = '<div class="money"><span class="k">Vence</span><span class="v">' +
        esc(e.fechaLimite || '—') + '</span></div>';
  }
  if(e.estado !== 'borrador'){
    acciones += '<button class="btn btn-ghost btn-block" onclick="pausar(' +
      (e.estado === 'pausada' ? 'false' : 'true') + ')">' +
      (e.estado === 'pausada' ? 'Reanudar acceso' : 'Pausar acceso') + '</button>';
  }

  var pago = '';
  if(e.contrato_token){
    pago = '<div class="money"><span class="k">Total</span><span class="v">' + money(e.precioTotal) + '</span></div>' +
      '<div class="money"><span class="k">Saldo</span><span class="v' + (e.saldo > 0 ? ' due' : '') + '">' +
        money(e.saldo) + '</span></div>';
    // Liberar NO toca el contrato. Si se liberó a mano con saldo pendiente, decirlo
    // con todas sus letras: si no, "Liberada" arriba y "Saldo $4,500" aquí se leen
    // como una contradicción del sistema, cuando en realidad las dos son ciertas.
    pago += (e.estado === 'liberada' && e.saldo > 0)
      ? '<p class="hint" style="color:var(--aviso,#8A6A1F)">Liberada a mano. En el contrato siguen debiendo ' +
        money(e.saldo) + '.</p>'
      : '<p class="hint">Se lee del contrato en vivo. Al llegar a cero se libera sola.</p>';
  } else {
    // Fantasma a proposito: el boton dorado de la tarjeta de abajo es la accion del
    // momento. Dos primarios en la misma pantalla se compiten y ninguno guia.
    pago = '<label class="f">Entrega suelta, sin contrato</label>' +
      '<button class="btn btn-ghost btn-block" onclick="marcarPagada(' +
        (e.pagado_manual ? 'false' : 'true') + ')">' +
        (e.pagado_manual ? 'Quitar marca de pagada' : 'Marcar como pagada') + '</button>' +
      (e.pagado_manual ? '<p class="hint">Marcada como pagada.</p>' : '');
  }

  var bitacora = ACT.eventos.map(function(v){
    return '<div><time>' + fechaCorta(v.fecha) + '</time><span>' +
      esc(({creada:'Entrega creada',publicada:'Publicada',liberada:'Liberada',
            vista:'El cliente la abrió',pausada:'Acceso pausado',reanudada:'Acceso reanudado',
            extendida:'Vigencia extendida',pago:'Pago',descarga:'Descargó material',
            expirada:'Expirada'})[v.tipo] || v.tipo) +
      (v.detalle ? ' · ' + esc(v.detalle) : '') + '</span></div>';
  }).join('') || '<div class="hint">Sin movimientos.</div>';

  document.getElementById('main').innerHTML =
    
    barraAccion(e, c, estadoPill) +
    '<div class="detail"><div style="display:flex;flex-direction:column;gap:16px">' +
      '<div class="card"><div class="card-hd"><b>Entregables</b>' +
        '<button class="btn btn-ghost btn-sm" onclick="abrirAgregar()">Agregar</button></div>' +
        (items || '<div class="card-pad hint">Sin entregables. Agrega al menos uno.</div>') +
      '</div>' +
    '</div><aside class="side">' +
      '<div class="card"><div class="card-hd"><b>Pago</b></div><div class="card-pad">' + pago + '</div></div>' +
      // Liga y acciones son lo mismo —lo que haces con la entrega— asi que van en una
      // sola tarjeta: primero la accion del momento, luego como mandarla.
      '<div class="card"><div class="card-hd"><b>La entrega</b></div><div class="card-pad">' +
        bloqueGaleria() +
        acciones +
        '<div style="height:1px;background:var(--line);margin:2px 0"></div>' +
        '<div class="linkbox">' + esc(e.rutaPublica) + '</div>' +
        '<button class="btn btn-ghost btn-sm" onclick="copiar(\'' + esc(e.rutaPublica) + '\')">Copiar liga</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="copiarWa()">Copiar mensaje de WhatsApp</button>' +
        '<p class="hint">El mensaje ya va escrito con la liga adentro.</p>' +
        // Borrar va hasta el final y separado: es irreversible y no tiene por que
        // estar en el camino de lo que se hace a diario.
        '<div style="height:1px;background:var(--line);margin:6px 0"></div>' +
        '<button class="btn btn-danger btn-block btn-sm" onclick="borrarEntrega()">Borrar entrega</button>' +
      '</div></div>' +
      '<div class="card"><div class="card-hd"><b>Bitácora</b></div><div class="card-pad">' +
        '<div class="log">' + bitacora + '</div></div></div>' +
    '</aside></div>';

  ajustarTope();
  zonasArrastre();
}

// ── Subida ───────────────────────────────────────────────────────────────────
// Debe coincidir con TAMANO_PARTE del Worker: el cuerpo de una peticion topa en
// ~100 MB, asi que un video de 1 GB se manda en trozos que si caben.
var TAM_PARTE = 90 * 1024 * 1024;
var subiendo = false;
var preparando = false;

function zonasArrastre(){
  document.querySelectorAll('.zona').forEach(function(z){
    var id = z.id.slice(2);
    var inp = document.getElementById('in-' + id);
    if(!inp) return;
    var tipo = inp.accept.indexOf('video') === 0 ? 'video' : 'fotos';
    z.addEventListener('dragover', function(e){ e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function(){ z.classList.remove('over'); });
    z.addEventListener('drop', function(e){
      e.preventDefault(); z.classList.remove('over');
      if(e.dataTransfer.files.length) elegidos(id, tipo, e.dataTransfer.files);
    });
  });
}

function progreso(id, pct, txt){
  var p = document.getElementById('p-' + id), t = document.getElementById('pt-' + id);
  if(p){ p.style.display = pct == null ? 'none' : 'block'; if(pct != null) p.firstChild.style.width = pct + '%'; }
  if(t) t.textContent = txt || '';
}

function elegidos(entregableId, tipo, files){
  if(!files || !files.length) return;
  if(subiendo) return toast('Espera a que termine la subida en curso', true);
  if(tipo === 'video') subirVideo(entregableId, files[0]);
  else subirFotos(entregableId, files);
}

// Una foto, con reintentos. Cuando el Worker se queda sin recursos contesta 503 y
// deja de aceptar TODO por un rato: no es que el archivo tenga nada malo. Sin esto,
// un tropiezo momentaneo se lleva por delante las 40 fotos que faltaban.
// La espera crece (1s, 2s, 4s) para darle tiempo a recuperarse.
async function subirUnaFoto(entregableId, f, reemplazaA){
  var ultimo = '';
  for(var intento = 0; intento < 4; intento++){
    if(intento) await new Promise(function(r){ setTimeout(r, 1000 * Math.pow(2, intento - 1)); });
    var fd = new FormData();
    fd.append('entregableId', entregableId);
    fd.append('nombre', f.name);
    fd.append('original', f, f.name);
    if(reemplazaA) fd.append('reemplazaA', reemplazaA);
    var r;
    try {
      r = await fetch('/api/e/subirFoto', {
        method: 'POST', headers: { 'X-Entregas-Key': KEY }, body: fd });
    } catch(e){ ultimo = e.message; continue; }   // red caida: tambien se reintenta
    if(r.ok) return true;
    // El cuerpo puede no ser JSON: cuando revienta el isolate contesta HTML de
    // Cloudflare, y r.json() ahi lanza y esconde el codigo real.
    var txt = '';
    try { txt = await r.text(); } catch(e){}
    var msg = '';
    try { msg = (JSON.parse(txt) || {}).error || ''; } catch(e){}
    ultimo = msg || ('Error ' + r.status);
    if(r.status < 500) throw new Error(ultimo);   // 400/401/404: reintentar no arregla
  }
  throw new Error(ultimo || 'no se pudo subir');
}

// Los archivos que no lograron subir, para poder reintentarlos con un clic en vez
// de mandar a Bruno a buscarlos otra vez entre 50 en el disco.
var PENDIENTES = null;
function reintentarFallidas(){
  if(!PENDIENTES || !PENDIENTES.files.length) return cerrarModal();
  var p = PENDIENTES; PENDIENTES = null;
  cerrarModal();
  subirFotos(p.entregableId, p.files);
}

// Las fotos van de una en una, no en paralelo: 38 peticiones simultaneas de 15 MB
// saturan la subida y hacen que fallen a la mitad sin decir cual.
async function subirFotos(entregableId, files){
  subiendo = true;
  var lista = Array.prototype.slice.call(files);
  var ok = 0, fallos = [];
  for(var i = 0; i < lista.length; i++){
    var f = lista[i];
    progreso(entregableId, Math.round(i / lista.length * 100),
             'Subiendo ' + (i+1) + ' de ' + lista.length + ' · ' + f.name);
    try {
      await subirUnaFoto(entregableId, f);
      ok++;
    } catch(e){ fallos.push({ file: f, error: e.message }); }
  }
  progreso(entregableId, null);
  subiendo = false;
  if(fallos.length){
    // Decir "2 fallaron" y nada mas obliga a adivinar cuales de 50. Se listan por
    // nombre y se guardan los archivos para poder reintentar sin volver a buscarlos
    // en el disco.
    PENDIENTES = { entregableId: entregableId, files: fallos.map(function(f){ return f.file; }) };
    toast(ok + ' subidas, ' + fallos.length + ' fallaron', true);
    modal('No subieron ' + fallos.length + ' archivo' + (fallos.length === 1 ? '' : 's'),
      '<p class="hint" style="margin-bottom:12px">Las demás sí quedaron. Casi siempre es que el ' +
      'servidor se saturó un momento, no que el archivo tenga algo malo.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Archivo</th><th>Qué pasó</th></tr></thead><tbody>' +
      fallos.map(function(f){
        return '<tr><td><b>' + esc(f.file.name) + '</b></td><td>' + esc(f.error) + '</td></tr>';
      }).join('') + '</tbody></table></div>',
      '<button class="btn btn-ghost" onclick="cerrarModal()">Ahora no</button>' +
      '<button class="btn btn-primary" onclick="reintentarFallidas()">Reintentar ' + fallos.length + '</button>');
  } else {
    toast(ok + (ok === 1 ? ' foto subida' : ' fotos subidas'));
  }
  // Subir y preparar son dos pasos distintos a proposito: el material puede venir de
  // varias carpetas y en varias tandas. Preparar al terminar cada tanda seria
  // trabajo tirado, y peor, ataria a Bruno a la ventana entre carpeta y carpeta.
  await abrir(ACT.entrega.id);
}

// ── Paso 2: preparar la galeria ───────────────────────────────────────────────
// Cada foto necesita una copia reducida; sin ella, la primera visita del cliente
// transforma el original de 10 MB y la galeria se cae (1102). Se hace en peticiones
// separadas y de a una: hacerlo durante la subida tumba el Worker (ver el
// comentario en subirFoto del lado del servidor).
// Falta preparar si le falta la copia reducida (para la galeria) o el CRC (para
// poder meterlo en el ZIP sin reventar el Worker). El video solo necesita el CRC.
function pendientesGaleria(){
  return (ACT && ACT.archivos || []).filter(function(a){
    if(!a.r2_key) return false;
    // Solo imágenes: los videos no llevan copia reducida ni entran al ZIP, así que
    // nunca están "pendientes". Y -2 significa "ya se intentó y no se pudo": contarlo
    // dejaría el aviso encendido para siempre.
    if(!/^image\//.test(a.mime || '')) return false;
    return !a.r2_key_web || Number(a.crc32) === -1;
  }).length;
}

async function completarDerivados(onAvance){
  var vueltas = 0, secos = 0;
  while(vueltas++ < 500){
    var r = null;
    try {
      r = await api('derivados', { body: { entregaId: ACT.entrega.id, lote: 1 } });
    } catch(e){ r = null; }
    if(r && !r.pendientes) return true;
    if(r && onAvance) onAvance(r.pendientes);
    // Una vuelta sin avanzar casi siempre es un 503 pasajero: preparar una foto de
    // 10 MB consume mucho y el Worker rebota hasta recuperarse. Medido en una tanda
    // de 50 reales: hubo hasta 6 fallos seguidos y aun asi termino completa. Por eso
    // el umbral es alto y la espera crece — rendirse pronto abandona una preparacion
    // que iba bien.
    if(r && r.hechos){ secos = 0; continue; }
    if(++secos >= 12) return false;
    await new Promise(function(res){ setTimeout(res, Math.min(8000, 1200 * secos)); });
  }
  return false;
}

// Marca de version de las miniaturas. No la usa el servidor: hace que la URL cambie
// cuando la entrega se libera. Sin esto el navegador sigue mostrando la copia con
// marca de agua que guardo antes, aqui y en el portal del cliente.
function verFoto(){
  var e = ACT && ACT.entrega;
  if(!e || e.estado !== 'liberada') return 'm';
  return 'l' + String(e.fecha_liberada || 1).replace(/[^0-9a-zA-Z]/g, '');
}

// Elegir portada y destacadas NO pasa por accion(), aunque seria la via corta.
// accion() recarga la entrega entera, y recargar devuelve el scroll al principio:
// medido, marcar una foto a media cuadricula saltaba de 750 px a 0. Con 50 fotos,
// armar una seleccion de 6 serian 6 saltos y 6 veces buscar donde ibas — lo contrario
// de lo que este rediseño vino a hacer.
//
// Entonces se actualiza el archivo en memoria con lo que contesto el servidor, se
// repinta, y se devuelve el scroll a donde estaba. El alto no cambia (solo cambian
// clases), asi que la pagina no se mueve ni un pixel.
async function conScroll(fn){
  var y = window.scrollY;
  try { await fn(); } catch(e){ return toast(e.message, true); }
  pintarDetalle();
  window.scrollTo(0, y);
}
function archivoDe(id){
  return (ACT && ACT.archivos || []).filter(function(a){ return a.id === id; })[0];
}

// La portada es la foto grande que abre la galeria del cliente. Es una sola, y
// ademas entra al muestrario de destacadas.
function ponerPortada(id){
  return conScroll(async function(){
    await api('portada', { body: { archivoId: id } });
    (ACT.archivos || []).forEach(function(a){ a.portada = 0; });
    var a = archivoDe(id);
    if(a){ a.portada = 1; a.destacado = 1; }
    toast('Portada actualizada');
  });
}

// Las destacadas son las fotos que el cliente ve en grande antes del boton "ver
// todas". Es un interruptor: el mismo boton pone y quita.
function alternarDestacada(id){
  return conScroll(async function(){
    var r = await api('destacar', { body: { archivoId: id } });
    var a = archivoDe(id);
    if(a) a.destacado = r.destacado ? 1 : 0;
    toast(r.destacado ? 'Agregada a las destacadas' : 'Quitada de las destacadas');
  });
}

// ── Modo quitar ──────────────────────────────────────────────────────────────
// Borrar deja de ser algo que pasa por acercar el mouse a una miniatura: hay que
// entrar a proposito, elegir, y confirmar cuantos. Con 50 archivos de 10 MB, un
// clic accidental cuesta volver a subirlos.
var QUITANDO = null, SEL = [];

function modoQuitar(entregableId){
  if(subiendo) return toast('Espera a que termine la subida', true);
  QUITANDO = entregableId; SEL = [];
  pintarDetalle();
}
function marcar(id){
  var p = SEL.indexOf(id);
  if(p >= 0) SEL.splice(p, 1); else SEL.push(id);
  pintarDetalle();
}
async function quitarSeleccion(){
  var ids = SEL.slice();
  if(!ids.length) return;
  if(!confirm('Se van a quitar ' + ids.length + ' archivo' + (ids.length === 1 ? '' : 's') +
              '. Esto no se puede deshacer.')) return;
  var ok = 0, fallos = 0;
  for(var i = 0; i < ids.length; i++){
    try { await api('borrarArchivo', { body: { archivoId: ids[i] } }); ok++; }
    catch(e){ fallos++; console.error('borrarArchivo', ids[i], e.message); }
  }
  QUITANDO = null; SEL = [];
  toast(fallos ? (ok + ' quitados, ' + fallos + ' fallaron') : (ok + ' archivos quitados'), !!fallos);
  await abrir(ACT.entrega.id);
}

// Bruno tambien baja el ZIP: es su material y lo va a querer para respaldar.
function bajarZip(){
  window.location.href = '/api/e/zip?e=' + ACT.entrega.id + '&k=' + encodeURIComponent(KEY);
}

function pintarGaleria(html){
  var n = document.getElementById('gal');
  if(n) n.innerHTML = html;
}

async function prepararGaleria(){
  if(subiendo) return toast('Espera a que termine la subida', true);
  var id = ACT.entrega.id;
  if(await prepararGaleria2()) toast('Galería lista');
  await abrir(id);
}

function barraGaleria(faltan, total){
  var hechas = Math.max(0, total - faltan);
  return '<div class="prog" style="margin-left:0"><i style="width:' +
      (total ? Math.round(hechas / total * 100) : 0) + '%"></i></div>' +
    '<div class="progtxt" style="margin-left:0">Preparando · faltan ' + faltan + ' de ' + total + '</div>' +
    '<p class="hint">Puedes cerrar la ventana: el servidor sigue preparándolas solo. ' +
    'Esto solo lo hace más rápido.</p>';
}

// Bloque del paso 2 en el panel lateral. Es lo unico que le dice a Bruno cuando
// puede irse: sin esto, "ya subio todo" y "ya quedo listo" se ven igual.
function bloqueGaleria(){
  var pend = pendientesGaleria();
  var fotos = (ACT.archivos || []).filter(function(a){ return /^image\//.test(a.mime || ''); }).length;
  if(!fotos && !pend) return '';
  if(!pend){
    return '<div id="gal"><p class="hint">Galería lista · ' + fotos +
      ' foto' + (fotos === 1 ? '' : 's') + '. Puedes cerrar la ventana.</p>' +
      '<button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="bajarZip()">Descargar las fotos (ZIP)</button></div>';
  }
  // La preparacion la hace un cron cada minuto, de dos en dos. El boton solo la
  // acelera: sirve cuando quieres publicar ya y no esperar media hora.
  return '<div id="gal">' +
    '<p class="hint">Faltan <b>' + pend + '</b> por preparar. Se están haciendo solas, ' +
    'aunque cierres la ventana (unas 2 por minuto).</p>' +
    '<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="prepararGaleria()">Prepararlas ya</button>' +
    '</div>';
}

// Stream elige perfil de marca de agua segun la orientacion, asi que hay que
// medir el video antes de subirlo. Si no se puede, va 0 y cae al perfil horizontal.
function medirVideo(file){
  return new Promise(function(res){
    try {
      var v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = function(){
        var d = { ancho: v.videoWidth || 0, alto: v.videoHeight || 0 };
        URL.revokeObjectURL(v.src); res(d);
      };
      v.onerror = function(){ res({ ancho: 0, alto: 0 }); };
      v.src = URL.createObjectURL(file);
    } catch(e){ res({ ancho: 0, alto: 0 }); }
  });
}

async function subirVideo(entregableId, file, reemplazaA){
  subiendo = true;
  try {
    progreso(entregableId, 0, 'Preparando ' + file.name + '…');
    var dim = await medirVideo(file);
    var ini = await api('videoIniciar', { body: {
      entregableId: entregableId, nombre: file.name,
      mime: file.type || 'video/mp4', bytes: file.size,
      reemplazaA: reemplazaA || '' } });

    var partes = [], n = 1, subido = 0;
    for(var off = 0; off < file.size; off += TAM_PARTE){
      var trozo = file.slice(off, Math.min(off + TAM_PARTE, file.size));
      var qs = 'key=' + encodeURIComponent(ini.key) +
               '&uploadId=' + encodeURIComponent(ini.uploadId) + '&parte=' + n;
      var r = await fetch('/api/e/videoParte?' + qs, {
        method: 'POST', headers: { 'X-Entregas-Key': KEY }, body: trozo });
      var j = await r.json();
      if(!r.ok) throw new Error((j && j.error) || ('Falló la parte ' + n));
      partes.push({ parte: j.parte, etag: j.etag });
      subido += trozo.size; n++;
      progreso(entregableId, Math.round(subido / file.size * 92),
               'Subiendo · ' + Math.round(subido/1048576) + ' de ' + Math.round(file.size/1048576) + ' MB');
    }

    progreso(entregableId, 96, 'Mandando a Stream para ponerle la marca…');
    var fin = await api('videoTerminar', { body: {
      archivoId: ini.archivoId, key: ini.key, uploadId: ini.uploadId,
      partes: partes, ancho: dim.ancho, alto: dim.alto } });
    progreso(entregableId, null);
    if(reemplazaA){
      // El cambio no es inmediato: Stream tarda en codificar y hasta entonces el
      // cliente sigue viendo la version anterior. Se dice explicitamente para que
      // nadie crea que fallo al ver la vieja todavia en la galeria.
      try { await api('revisarReemplazos', { body: {} }); } catch(e){}
      toast('Version nueva subida. Entra en cuanto Stream la codifique; mientras tanto ' +
            'el cliente sigue viendo la anterior.');
    } else {
      toast(fin.conMarca ? 'Video subido y marcándose' : 'Video subido (Stream no respondió)',
            !fin.conMarca);
    }
  } catch(e){
    progreso(entregableId, null);
    toast('Falló la subida: ' + e.message, true);
  }
  subiendo = false;
  await abrir(ACT.entrega.id);
}

// R136 — Reemplazar una version por otra sin dejar dos subidas.
// El archivo nuevo entra apuntando al viejo y NO se le muestra al cliente hasta
// que esta listo; recien ahi se hace el cambio y el viejo se borra con su material.
// Asi nunca hay dos versiones a la vista ni un hueco sin video.
var ICO_REEMP = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2.2"><path d="M4 9h11l-3-3M20 15H9l3 3"/></svg>';

function reemplazar(archivoId){
  var a = archivoDe(archivoId);
  if(!a) return;
  var esVid = /^video\//.test(a.mime || '');
  // Si la entrega ya esta liberada, el cliente pudo haber bajado la version vieja.
  // Reemplazar no se la quita, pero su liga empieza a dar la nueva sin avisarle.
  if(ACT && ACT.entrega && ACT.entrega.estado === 'liberada'){
    if(!confirm('Esta entrega ya está liberada.\n\nSi el cliente ya descargó ' +
       'este archivo, se queda con la versión anterior, y de aquí en adelante su ' +
       'liga le va a dar la nueva sin avisarle.\n\n¿Reemplazar de todos modos?')) return;
  }
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = esVid ? 'video/*' : 'image/*';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    if(subiendo) return toast('Espera a que termine la subida en curso', true);
    if(esVid) subirVideo(a.e_entregable_id, f, archivoId);
    else      reemplazarFoto(a.e_entregable_id, f, archivoId);
  };
  inp.click();
}

async function reemplazarFoto(entregableId, f, archivoId){
  subiendo = true;
  progreso(entregableId, 40, 'Subiendo ' + f.name + '…');
  try {
    await subirUnaFoto(entregableId, f, archivoId);
    // Una foto no pasa por Stream, pero si necesita su CRC antes de entrar (lo
    // exige el ZIP). Se pide la revision por si ya lo tiene; si no, entra sola.
    try { await api('revisarReemplazos', { body: {} }); } catch(e){}
    toast('Versión nueva subida');
  } catch(e){
    toast('Falló el reemplazo: ' + e.message, true);
  }
  progreso(entregableId, null);
  subiendo = false;
  await abrir(ACT.entrega.id);
}

function cancelarReemplazo(archivoId){
  if(!confirm('¿Descartar esta versión nueva? La anterior se queda como está.')) return;
  accion('cancelarReemplazo', { archivoId: archivoId }, 'Reemplazo descartado');
}

function borrarArchivo(archivoId){

}

// ── Acciones ─────────────────────────────────────────────────────────────────
async function accion(nombre, body, msg){
  try {
    var r = await api(nombre, { body: body });
    if(msg) toast(msg);
    await abrir(ACT.entrega.id);
    return r;
  } catch(e){ toast(e.message, true); }
}
// Red de seguridad: nadie publica una entrega cuya galeria todavia no esta preparada.
// Es el ultimo momento en que se puede evitar que el cliente sea quien descubra el 1102.
// No lo hace por su cuenta: preparar tarda minutos y quien aprieta Publicar no espera
// eso. Lo dice y manda al paso 2.
async function publicar(){
  var pend = pendientesGaleria();
  if(pend){
    if(!confirm('Faltan ' + pend + ' fotos por preparar. Si publicas y le mandas la liga de inmediato, las primeras vistas del cliente pueden salir en blanco.\n\nSe preparan solas en unos minutos, pero puedes adelantarlas.\n\nAceptar = prepararlas ahora.\nCancelar = publicar de todos modos.')){
      return accion('publicar', { id: ACT.entrega.id }, 'Publicada');
    }
    if(!await prepararGaleria2()) return;
  }
  accion('publicar', { id: ACT.entrega.id }, 'Publicada');
}

// Igual que prepararGaleria pero sin refrescar la vista al final: quien la llama
// va a seguir trabajando sobre ACT y un re-render a media accion la deja coja.
async function prepararGaleria2(){
  if(preparando) return false;
  preparando = true;
  var total = pendientesGaleria();
  pintarGaleria(barraGaleria(total, total));
  var listo = await completarDerivados(function(f){ pintarGaleria(barraGaleria(f, total)); });
  preparando = false;
  if(!listo) toast('No se pudieron preparar todas las fotos', true);
  return listo;
}
function liberar(){ accion('liberar', { id: ACT.entrega.id }, 'Liberada'); }
function extender(){ accion('extender', { id: ACT.entrega.id, dias: 14 }, 'Vigencia extendida'); }
function pausar(v){ accion('pausar', { id: ACT.entrega.id, pausar: v }, v ? 'Acceso pausado' : 'Acceso reanudado'); }
function marcarPagada(v){ accion('marcarPagada', { id: ACT.entrega.id, pagada: v }, v ? 'Marcada como pagada' : 'Marca retirada'); }
function guardarEnlace(id){

  accion('guardarEnlace', { entregableId: id, valor: v }, 'Liga guardada');
}
function borrarEntregable(id){

  accion('borrarEntregable', { entregableId: id }, 'Entregable quitado');
}
async function borrarEntrega(){
  if(!confirm('¿Borrar la entrega completa? Esto no se puede deshacer.')) return;
  try { await api('borrar', { body: { id: ACT.entrega.id } }); toast('Entrega borrada'); irLista(); }
  catch(e){ toast(e.message, true); }

function copiar(txt){
  if(navigator.clipboard) navigator.clipboard.writeText(txt);
  toast('Copiado');
}
function copiarWa(){
  var e = ACT.entrega;
  var msg = e.estado === 'liberada'
    ? 'Hola ' + (ACT.cliente.nombre || '') + ', tu material ya está liberado. Puedes descargarlo aquí:\n' +
      e.rutaPublica + '\n\nTienes hasta el ' + (e.fechaLimite || '') + ' para bajarlo todo.'
    : 'Hola ' + (ACT.cliente.nombre || '') + ', tu producción ya está lista. Puedes verla aquí:\n' +
      e.rutaPublica + '\n\nEn cuanto liquidemos se libera la descarga en alta y sin marca de agua.';
  copiar(msg);
}

// ── Modales ──────────────────────────────────────────────────────────────────
function cerrarModal(){ document.getElementById('modal').className = ''; }
function modal(titulo, cuerpo, pie){
  document.getElementById('mTitulo').textContent = titulo;
  document.getElementById('mCuerpo').innerHTML = cuerpo;
  document.getElementById('mPie').innerHTML = pie;
  document.getElementById('modal').className = 'on';
}
function abrirAgregar(){
  modal('Agregar entregable',
    '<div class="field"><label class="f" for="agTipo">Tipo</label>' +
    '<select id="agTipo"><option value="fotos">Fotografías</option>' +
    '<option value="video">Video</option><option value="enlace">Enlace</option></select></div>' +
    '<div class="field" style="margin:0"><label class="f" for="agNombre">Nombre</label>' +
    '<input type="text" id="agNombre" placeholder="Video cómo llegar"></div>',
    '<button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>' +
    '<button class="btn btn-primary" onclick="confirmarAgregar()">Agregar</button>');
}
async function confirmarAgregar(){
  var tipo = document.getElementById('agTipo').value;
  var nombre = document.getElementById('agNombre').value.trim();
  if(!nombre) return toast('Ponle nombre', true);
  cerrarModal();
  accion('agregarEntregable', { entregaId: ACT.entrega.id, tipo: tipo, nombre: nombre }, 'Entregable agregado');
}

function abrirNueva(){
  modal('Nueva entrega',
    '<div class="field"><label class="f" for="nvCliente">Cliente</label>' +
    '<input type="text" id="nvCliente" placeholder="Escribe para buscar…" oninput="buscarCli()" autocomplete="off">' +
    '<div class="sugg" id="nvSugg" style="display:none"></div>' +
    '<p class="hint" id="nvElegido" style="margin-top:6px"></p></div>' +
    '<div class="field"><label class="f" for="nvTel">Teléfono (si es cliente nuevo)</label>' +
    '<input type="tel" id="nvTel"></div>' +
    '<div class="field"><label class="f" for="nvTitulo">Propiedad</label>' +
    '<input type="text" id="nvTitulo" placeholder="Casa Valle Alto"></div>' +
    '<div class="field" style="margin:0"><label class="f" for="nvDir">Dirección</label>' +
    '<input type="text" id="nvDir"></div>',
    '<button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>' +
    '<button class="btn btn-primary" onclick="crearEntrega()">Crear</button>');
  window._cli = null;
}
var buscarT;
function buscarCli(){
  clearTimeout(buscarT);
  buscarT = setTimeout(async function(){
    var q = document.getElementById('nvCliente').value.trim();
    var caja = document.getElementById('nvSugg');
    if(q.length < 2){ caja.style.display = 'none'; return; }
    try {
      var r = await api('buscarClientes', { qs: 'q=' + encodeURIComponent(q) });
      if(!r.resultados.length){ caja.style.display = 'none'; return; }
      caja.innerHTML = r.resultados.map(function(c, i){
        return '<button onclick="elegirCli(' + i + ')"><b>' + esc(c.nombre) + '</b>' +
          '<span>' + esc(c.telefono || '') + ' · ' + (c.origen === 'admin' ? 'del admin' : 'de entregas') +
          '</span></button>';
      }).join('');
      window._sugg = r.resultados;
      caja.style.display = 'block';
    } catch(e){ caja.style.display = 'none'; }
  }, 250);
}
function elegirCli(i){
  var c = window._sugg[i];
  window._cli = c;
  document.getElementById('nvCliente').value = c.nombre;
  document.getElementById('nvSugg').style.display = 'none';
  document.getElementById('nvElegido').textContent =
    'Se usará el cliente ' + (c.origen === 'admin' ? 'del admin' : 'ya registrado') + '.';
}
async function crearEntrega(){
  var titulo = document.getElementById('nvTitulo').value.trim();
  if(!titulo) return toast('Ponle nombre a la propiedad', true);
  var body = { titulo: titulo, direccion: document.getElementById('nvDir').value.trim() };
  var c = window._cli;
  if(c && c.clienteId) body.clienteId = c.clienteId;
  else if(c && c.eClienteId) body.eClienteId = c.eClienteId;
  else {
    var n = document.getElementById('nvCliente').value.trim();
    if(!n) return toast('Falta el cliente', true);
    body.nombreCliente = n;
    body.telefono = document.getElementById('nvTel').value.trim();
  }
  try {
    var r = await api('crear', { body: body });
    cerrarModal(); toast('Entrega creada'); abrir(r.id);
  } catch(e){ toast(e.message, true); }
}

async function verLimpieza(){
  var r;
  try { r = await api('sinPagar'); } catch(e){ return toast(e.message, true); }
  if(!r.entregas.length){
    return modal('Publicadas sin pagar',
      '<p class="hint">No hay nada publicado sin pagar. Todo al corriente.</p>',
      '<button class="btn btn-ghost" onclick="cerrarModal()">Cerrar</button>');
  }
  var mb = r.entregas.reduce(function(s,e){ return s + e.bytes; }, 0) / 1048576;
  modal('Publicadas sin pagar',
    '<p class="hint" style="margin-bottom:12px">' + r.entregas.length + ' entregas · ' +
      mb.toFixed(0) + ' MB ocupados. De más vieja a más nueva.</p>' +
    '<div class="tablewrap"><table><thead><tr><th>Propiedad</th><th>Cliente</th><th>Días</th><th>Saldo</th></tr></thead><tbody>' +
    r.entregas.map(function(e){
      return '<tr><td><b>' + esc(e.titulo) + '</b></td><td>' + esc(e.cliente) + '</td>' +
        '<td class="mono">' + e.diasPublicada + '</td><td class="mono">' + money(e.saldo) + '</td></tr>';
    }).join('') + '</tbody></table></div>',
    '<button class="btn btn-ghost" onclick="cerrarModal()">Cerrar</button>');
}

// Material que quedó en R2 o en Stream sin ningún registro que lo referencie.
// Cualquier subida que falle a la mitad deja restos, y esos restos se siguen
// pagando en silencio: nadie más los va a encontrar.
async function verHuerfanos(){
  cerrarMenu();
  var r;
  try { r = await api('huerfanos'); } catch(e){ return toast(e.message, true); }
  var total = r.r2.n + r.stream.n;
  if(!total){
    return modal('Material sin dueño',
      '<p class="hint">Nada suelto. Todo lo que está guardado pertenece a una entrega.</p>',
      '<button class="btn btn-ghost" onclick="cerrarModal()">Cerrar</button>');
  }
  modal('Material sin dueño',
    '<p class="hint" style="margin-bottom:12px">' +
      r.r2.n + ' archivos (' + r.r2.mb + ' MB) y ' + r.stream.n + ' videos no pertenecen a ninguna ' +
      'entrega. Se siguen cobrando. Borrarlos no afecta a ninguna entrega viva.</p>',
    '<button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>' +
    '<button class="btn btn-borrar" onclick="limpiarHuerfanos()">Borrar los ' + total + '</button>');
}
async function limpiarHuerfanos(){
  cerrarModal();
  toast('Borrando…');
  try {
    var r = await api('huerfanos', { qs: 'borrar=1' });
    toast(r.borrados.r2 + ' archivos y ' + r.borrados.stream + ' videos borrados' +
          (r.borrados.fallos ? ' · ' + r.borrados.fallos + ' fallaron' : ''), !!r.borrados.fallos);
  } catch(e){ toast(e.message, true); }
}

  cerrarMenu();
  try { localStorage.removeItem('iav_entregas_key'); } catch(e){}
  location.reload();
}
