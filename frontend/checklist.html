<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bitacora de Produccion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <link rel="icon" href="data:,">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { touch-action: manipulation; }

    :root {
      --black: #101010;
      --page: #F7F6F1;
      --card: #FFFFFF;
      --line: #E1DED6;
      --muted: #F0EEE8;
      --ink-1: #151515;
      --ink-2: #5F5A50;
      --ink-3: #948D80;
      --gold: #C9A84C;
      --gold-soft: #F8F0D2;
      --green: #147A3A;
      --green-soft: #E8F5EC;
      --red: #B83227;
      --red-soft: #FCEAE7;
      --blue: #2457A6;
      --blue-soft: #E7EEF9;
      --purple: #6E489C;
      --purple-soft: #EFE8F7;
      --radius: 8px;
      --shadow: 0 10px 28px rgba(16,16,16,.12);
    }

    html, body { min-height: 100%; background: var(--page); }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink-1);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .app { max-width: 960px; margin: 0 auto; padding-bottom: 92px; }

    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: rgba(247,246,241,.97);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: max(12px, env(safe-area-inset-top)) 14px 10px;
    }
    .top-row { display: flex; align-items: center; gap: 12px; }
    .job { min-width: 0; flex: 1; }
    .eyebrow {
      color: var(--gold); font-size: 10px; font-weight: 900;
      letter-spacing: 0; text-transform: uppercase;
    }
    .job h1 { font-size: 18px; line-height: 1.12; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .folio { color: var(--ink-3); font-size: 11px; font-weight: 800; margin-top: 2px; }
    .sync {
      display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3);
      font-size: 10px; font-weight: 900; text-transform: uppercase;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .dot.syncing { background: #D99021; animation: pulse 1s infinite; }
    .dot.error { background: var(--red); }
    @keyframes pulse { 50% { opacity: .35; } }

    .topbar.compact { padding-bottom: 8px; }
    .topbar.compact .eyebrow { display: none; }
    .topbar.compact .job h1 { font-size: 15px; }
    .topbar.compact .name-row { margin-top: 6px; }
    .topbar.compact .field, .topbar.compact .btn { min-height: 38px; height: 38px; font-size: 11px; }
    .name-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
    .field {
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--card); min-height: 42px; padding: 0 12px;
      outline: none; font-size: 13px; font-weight: 800;
    }
    .field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }

    .btn, .icon-btn, .primary {
      border-radius: var(--radius); min-height: 42px; padding: 0 13px;
      font-size: 13px; font-weight: 900; border: 1px solid var(--line);
      background: var(--card); color: var(--ink-1);
    }
    .icon-btn { width: 42px; padding: 0; }
    .primary { border-color: var(--black); background: var(--black); color: #fff; }
    .danger { border-color: #EDC2BC; background: var(--red-soft); color: var(--red); }
    .ghost { background: transparent; }

    .mode-area { padding: 9px 14px 0; }
    .mode-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 3px; background: var(--muted); border-radius: var(--radius); }
    .mode-btn {
      border: 0; background: transparent; border-radius: 6px;
      min-height: 42px; text-align: center; padding: 0 4px; color: var(--ink-2);
    }
    .mode-btn strong { display: block; font-size: 11px; font-weight: 900; }
    .mode-btn.active { background: var(--black); color: #fff; box-shadow: 0 2px 7px rgba(16,16,16,.16); }
    .active-band {
      margin-top: 6px; border-left: 3px solid var(--gold); background: var(--card);
      padding: 7px 9px; display: flex; align-items: baseline; gap: 7px;
    }
    .active-band strong { flex: none; font-size: 11px; font-weight: 900; }
    .active-band span { color: var(--ink-2); font-size: 10px; font-weight: 700; line-height: 1.35; }
    .camera-strip {
      margin-top: 6px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card);
      padding: 8px 9px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .camera-copy { min-width: 0; }
    .camera-copy strong { display: block; font-size: 11px; font-weight: 900; }
    .camera-copy span { display: block; margin-top: 2px; color: var(--ink-3); font-size: 9px; font-weight: 800; }
    .camera-actions { display: flex; gap: 5px; flex: none; }
    .mini-btn { min-height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); padding: 0 8px; color: var(--ink-2); font-size: 9px; font-weight: 900; }

    .tabs { padding: 8px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .tab {
      border: 1px solid transparent; border-radius: var(--radius); background: transparent;
      min-height: 38px; font-size: 11px; font-weight: 900; color: var(--ink-3);
    }
    .tab.active { border-color: var(--line); background: var(--card); color: var(--ink-1); }

    .content { padding: 0 14px; }
    .summary-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 11px 12px; margin-bottom: 9px;
    }
    .summary-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .summary-title { font-size: 16px; font-weight: 900; line-height: 1.15; }
    .summary-risk { margin-top: 3px; color: var(--red); font-size: 11px; font-weight: 800; line-height: 1.35; }
    .summary-risk.ok { color: var(--green); }
    .progress-block { flex: none; width: 78px; text-align: right; }
    .track { width: 100%; height: 5px; margin-top: 5px; background: var(--muted); border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; background: var(--gold); border-radius: 99px; }
    .progress-num { color: var(--ink-3); font-size: 10px; font-weight: 900; }
    .summary-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .tag { border-radius: 999px; padding: 4px 7px; background: var(--muted); color: var(--ink-2); font-size: 9px; font-weight: 900; }
    .tag.ok { background: var(--green-soft); color: var(--green); }
    .tag.warn { background: var(--gold-soft); color: #8B6A13; }
    .tag.bad { background: var(--red-soft); color: var(--red); }

    .prepare { padding: 18px 0; display: grid; gap: 14px; }
    .prepare h2 { font-size: 23px; line-height: 1.15; }
    .prepare p { color: var(--ink-2); font-size: 13px; line-height: 1.5; }
    .template-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .template-card {
      width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
      padding: 12px; text-align: left; display: grid; gap: 4px; min-height: 88px;
    }
    .template-card strong { font-size: 13px; font-weight: 900; }
    .template-card span { color: var(--ink-2); font-size: 10px; line-height: 1.35; font-weight: 700; }
    .template-card.featured { grid-column: 1 / -1; min-height: 76px; border-color: var(--gold); background: var(--gold-soft); }
    .template-card.selected { border-color: var(--black); box-shadow: inset 0 0 0 1px var(--black); }

    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 10px; }
    .zone { margin-bottom: 15px; }
    .zone-title {
      display: flex; justify-content: space-between; align-items: center;
      margin: 2px 2px 8px; color: var(--ink-3);
      font-size: 11px; font-weight: 900; letter-spacing: 0; text-transform: uppercase;
    }
    .cards { display: grid; gap: 8px; }
    .capture-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 10px; display: grid; gap: 8px; position: relative; overflow: hidden;
    }
    .capture-card.key { border-left: 4px solid var(--gold); padding-left: 9px; }
    .capture-card.amenity { background: #FBF8EE; }
    .capture-card.amenity::after { content: ""; position: absolute; top: 0; right: 0; width: 22px; height: 3px; background: var(--gold); }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card-name { min-width: 0; }
    .card-name strong { display: block; font-size: 15px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-name span { display: block; margin-top: 3px; color: var(--ink-3); font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0; line-height: 1.35; }
    .child .card-name strong::before { content: "- "; color: var(--ink-3); }
    .state-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .state {
      border-radius: 999px; padding: 4px 7px; font-size: 9px; font-weight: 900;
      color: var(--ink-2); background: var(--muted);
    }
    .state.done { color: var(--green); background: var(--green-soft); }
    .state.video { color: var(--blue); background: var(--blue-soft); }
    .state.drone { color: var(--purple); background: var(--purple-soft); }
    .state.na { color: var(--red); background: var(--red-soft); }
    .primary-action {
      width: 100%; border: 0; border-radius: var(--radius); background: var(--black); color: #fff;
      min-height: 44px; font-size: 12px; font-weight: 900;
    }
    .primary-action.manage { background: var(--gold-soft); color: var(--black); border: 1px solid var(--gold); }
    .file-actions { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .discard-action { min-height: 44px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); padding: 0 10px; color: var(--ink-2); font-size: 10px; font-weight: 900; }
    .file-summary { color: var(--ink-3); font-size: 9px; font-weight: 900; text-transform: uppercase; }
    .recent-files { display: grid; border-top: 1px solid var(--muted); }
    .file-row { display: grid; grid-template-columns: minmax(58px, auto) 1fr auto; gap: 7px; align-items: center; min-height: 42px; border-bottom: 1px solid var(--muted); }
    .file-token { border: 0; background: transparent; padding: 0; text-align: left; color: var(--ink-1); font-size: 10px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .file-kind { color: var(--ink-3); font-size: 9px; font-weight: 800; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .file-good { min-height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); padding: 0 7px; color: var(--ink-2); font-size: 8px; font-weight: 900; }
    .file-good.active { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .all-files-btn { min-height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); color: var(--ink-2); font-size: 9px; font-weight: 900; }
    .sequence-alert { border: 1px dashed var(--gold); border-radius: var(--radius); background: var(--gold-soft); padding: 10px; color: #71530A; font-size: 10px; font-weight: 800; line-height: 1.45; }

    .empty { border: 1px dashed var(--line); background: var(--card); border-radius: var(--radius); padding: 22px 16px; text-align: center; }
    .empty h2 { font-size: 16px; margin-bottom: 6px; }
    .empty p { color: var(--ink-2); font-size: 13px; line-height: 1.5; }

    .close-list, .edit-list { display: grid; gap: 9px; }

    /* F10 — vista Edicion: bitacora editable agrupada servicio > piso > cuarto */
    .edit-svc { margin-top: 4px; }
    .edit-svc-head { font-family: inherit; font-size: 11px; font-weight: 900; letter-spacing: .04em;
      text-transform: uppercase; color: var(--gold); margin: 14px 2px 8px; }
    .edit-svc:first-of-type .edit-svc-head { margin-top: 4px; }
    .edit-grp { margin-bottom: 11px; }
    .edit-grp-head { font-size: 12px; font-weight: 600; color: var(--ink-1); margin-bottom: 7px;
      display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .edit-grp-head .crumb { color: var(--ink-3); font-weight: 700; font-size: 11px; }
    .edit-grp-head .gcount { margin-left: auto; color: var(--ink-3); font-size: 10px; font-weight: 800; }
    .erow { display: grid; grid-template-columns: auto 1fr auto; gap: 9px 10px; align-items: center;
      padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--card); margin-bottom: 7px; }
    .erow.is-discard { background: var(--page); opacity: .82; }
    .erow .etk { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; font-weight: 700;
      color: var(--ink-1); white-space: nowrap; }
    .erow .emeta { font-size: 10px; color: var(--ink-3); font-weight: 700; margin-top: 2px; }
    .erow .ekind { display: inline-block; font-size: 9px; font-weight: 900; color: var(--red);
      text-transform: uppercase; letter-spacing: .03em; }
    .erow .emid { min-width: 0; }
    .erow .edesc { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 6px;
      background: var(--page); color: var(--ink-1); font-size: 11.5px; font-family: inherit;
      padding: 6px 8px; min-height: 34px; line-height: 1.35; }
    .erow .edesc:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); outline: none; background: var(--card); }
    .erow .eacts { display: flex; align-items: center; gap: 5px; justify-self: end; }
    .eic { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line);
      display: inline-flex; align-items: center; justify-content: center; background: var(--card);
      color: var(--ink-3); cursor: pointer; padding: 0; }
    .eic i { font-size: 16px; }
    .eic.on.good { color: var(--green); background: var(--green-soft); border-color: #BFE0CD; }
    .eic.on.fav { color: #7A5A12; background: var(--gold-soft); border-color: #E4D39A; }
    .eic.more { color: var(--ink-2); }
    @media (min-width: 1024px) {
      .edit-svc-rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px 16px; align-items: start; }
      .edit-grp { margin-bottom: 0; }
    }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 13px;
    }
    .panel h3 { font-size: 14px; font-weight: 900; margin-bottom: 8px; }
    .line { color: var(--ink-2); font-size: 12px; line-height: 1.48; margin-top: 5px; }
    .traffic { border-left: 4px solid var(--line); }
    .traffic.red { border-left-color: var(--red); }
    .traffic.yellow { border-left-color: var(--gold); }
    .traffic.green { border-left-color: var(--green); }
    .traffic-title { display: flex; align-items: center; gap: 7px; }
    .traffic-title span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
    .traffic.red .traffic-title span { background: var(--red); }
    .traffic.yellow .traffic-title span { background: var(--gold); }
    .traffic.green .traffic-title span { background: var(--green); }
    .review-item { display: flex; gap: 8px; padding: 7px 0; border-top: 1px solid var(--muted); color: var(--ink-2); font-size: 11px; font-weight: 700; line-height: 1.4; }
    .review-item strong { color: var(--ink-1); }
    .sequence { display: grid; }
    .sequence-row { display: grid; grid-template-columns: 34px 1fr; gap: 9px; padding: 8px 0; border-top: 1px solid var(--muted); }
    .sequence-row:first-child { border-top: 0; }
    .sequence-num { color: var(--gold); font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .sequence-name { color: var(--ink-1); font-size: 12px; font-weight: 900; }
    .sequence-meta { margin-top: 2px; color: var(--ink-3); font-size: 9px; font-weight: 700; }

    .overlay {
      position: fixed; inset: 0; z-index: 100; background: rgba(16,16,16,.38);
      display: none; align-items: flex-end;
    }
    .overlay.visible { display: flex; }
    .sheet {
      width: 100%; max-height: 88dvh; overflow: auto; background: var(--card);
      border-radius: 16px 16px 0 0; padding: 16px; box-shadow: var(--shadow);
    }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .sheet-head h2 { font-size: 18px; font-weight: 900; }
    .sheet-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .sheet-tab { border: 1px solid var(--line); background: var(--page); border-radius: var(--radius); min-height: 40px; font-size: 12px; font-weight: 900; }
    .sheet-tab.active { background: var(--black); color: #fff; border-color: var(--black); }
    .sheet-body { display: grid; gap: 10px; }
    .preview { background: var(--page); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; max-height: 250px; overflow: auto; }
    .preview h3 { font-size: 13px; margin: 12px 0 6px; }
    .preview h3:first-child { margin-top: 0; }
    .preview div { color: var(--ink-2); font-size: 12px; line-height: 1.45; }
    .textarea {
      width: 100%; min-height: 170px; resize: vertical; border: 1px solid var(--line);
      border-radius: var(--radius); padding: 12px; font-size: 13px; line-height: 1.5; outline: none;
    }
    .action-stack { display: grid; gap: 8px; }
    .toast {
      position: fixed; left: 14px; right: 14px; bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 130; transform: translateY(120%); transition: transform .2s;
      background: var(--black); color: #fff; border-radius: var(--radius);
      padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
      font-size: 12px; font-weight: 900; box-shadow: var(--shadow);
    }
    .toast.visible { transform: translateY(0); }
    .toast button { border: 1px solid rgba(255,255,255,.28); color: #fff; background: transparent; border-radius: 7px; padding: 7px 9px; font-weight: 900; }

    .state-screen { min-height: 70dvh; display: grid; place-items: center; padding: 28px; text-align: center; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 14px; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (min-width: 760px) {
      .app { padding-top: 16px; }
      .topbar { top: 14px; margin: 0 14px 12px; border: 1px solid var(--line); border-radius: 12px; }
      .template-grid { grid-template-columns: repeat(2, 1fr); }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sheet { max-width: 620px; margin: 0 auto; }
      .toast { left: 50%; right: auto; min-width: 360px; transform: translate(-50%, 120%); }
      .toast.visible { transform: translate(-50%, 0); }
    }
    @media (max-width: 479px) {
      .toolbar { grid-template-columns: 1fr; }
    }

    /* ===== Dossier restyle — remapea tokens, tipografía y pesos ===== */
    :root {
      --black: #1C1C1E;
      --page: #F7F4EC; --card: #FFFDF8; --line: #E2DBCB; --muted: #EFEADF;
      --ink-1: #211E18; --ink-2: #5C564A; --ink-3: #918975;
      --gold: #B08D2E; --gold-leaf: #C9A84C; --gold-soft: #F3EAD0;
      --green: #2F7D55; --green-soft: #E7F1EA;
      --red: #B23A2B; --red-soft: #F8E7E4;
      --blue: #3F6FA8; --blue-soft: #E8EFF6;
      --purple: #6B4FA0; --purple-soft: #EFE9F6;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(33,30,24,.04), 0 4px 16px rgba(33,30,24,.06);
      --font-ui: 'Inter', system-ui, sans-serif;
      --font-display: 'Fraunces', Georgia, serif;
      --font-mono: 'Spline Sans Mono', ui-monospace, monospace;

      /* ===== R1 — Sistema de tokens (referencia visual, aditivo) ===== */
      /* Espaciado: ritmo de 4px */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
      /* Tipografía: escala definida (12/14/16/20/28). El display serif solo en títulos */
      --ts-cap: 12px; --ts-body: 14px; --ts-base: 16px; --ts-lg: 20px; --ts-display: 28px;
      /* Elevación: 3 niveles de superficie */
      --el-0: none;
      --el-1: 0 1px 2px rgba(20,16,12,.04);
      --el-2: 0 1px 2px rgba(20,16,12,.05), 0 6px 18px rgba(20,16,12,.07);
      /* Tinte neutro para estados activos (NO dorado): el dorado se reserva a la acción primaria */
      --tint: var(--muted);
      --tint-line: #CFC6B2;
    }

    /* ===== R1 — Patrón de superficie/elevación reutilizable ===== */
    .surface { background: transparent; box-shadow: var(--el-0); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--el-1); }
    .card-raised { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--el-2); }
    body { font-family: var(--font-ui); }
    /* sin MAYÚSCULAS en labels */
    .eyebrow, .sync, .zone-title, .card-name span, .file-summary, .state, .progress-num,
    .file-kind, .camera-copy span, .mini-btn, .tag, .file-good, .all-files-btn {
      text-transform: none !important; letter-spacing: 0 !important;
    }
    /* display serif en títulos clave; mono en cifras/tokens */
    .job h1, .summary-title, .prepare h2, .empty h2, .sheet-head h2 {
      font-family: var(--font-display); font-weight: 500;
    }
    .folio, .progress-num, .file-token, .sequence-num, .file-good { font-family: var(--font-mono); }
    /* pesos calmados (adiós 900) */
    .job h1 { font-weight: 500; }
    .card-name strong, .summary-title, .panel h3, .sheet-head h2 { font-weight: 600; }
    .eyebrow { color: var(--gold); font-weight: 600; }
    .btn, .icon-btn, .primary, .danger, .mode-btn strong, .tab, .state, .tag,
    .file-summary, .zone-title, .sync, .mini-btn, .primary-action, .template-card strong { font-weight: 600; }
    /* topbar: papel + canto dorado de marca */
    .topbar { background: rgba(255,253,248,.96); border-bottom: 1.5px solid var(--gold-leaf); }
    .dot { background: var(--green); }
    /* primario y acción = dorado de marca (no negro de relleno) */
    .primary { background: var(--gold-leaf); border-color: var(--gold-leaf); color: var(--black); }
    .primary-action { background: var(--gold-leaf); color: var(--black); }
    .mode-btn.active { background: var(--black); color: #fff; }
    .tab.active { border-color: var(--line); }
    /* inputs: foco dorado */
    .field:focus, .textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(176,141,46,.14); }
    /* tarjetas: hairline + sombra sutil */
    .summary-card, .capture-card, .panel, .template-card, .camera-strip { box-shadow: var(--shadow); }

    /* ===== Captura "app de cámara" (video/drone) — R1 referencia visual ===== */
    /* Header: un solo foco. Nombre del cuarto (serif display) manda; piso = caption
       quieto en tinta (no dorado, no compite). Opciones discreto. */
    .cap-focus { padding: var(--sp-5) 0 var(--sp-1); }
    .cap-floor { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: var(--ts-cap); font-weight: 600; color: var(--ink-2); margin-top: var(--sp-1); }
    .cap-floor i { font-size: 15px; color: var(--ink-3); }
    .cap-room { font-family: var(--font-display); font-size: var(--ts-display); font-weight: 500; letter-spacing: -.01em; line-height: 1.08; color: var(--ink-1); }
    .cap-parent { display: block; font-family: var(--font-ui); font-size: var(--ts-cap); font-weight: 600; color: var(--ink-2); letter-spacing: 0; margin-bottom: 1px; }
    .cap-cam { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 12px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
    .cap-cam-ic { width: 38px; height: 38px; border-radius: 8px; background: var(--gold-soft); display: flex; align-items: center; justify-content: center; flex: none; }
    .cap-cam-ic i { font-size: 21px; color: var(--gold); }
    .cap-cam-copy { min-width: 0; flex: 1; }
    .cap-cam-lbl { font-size: 13px; font-weight: 600; color: var(--ink-1); }
    .cap-cam-next { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
    .cap-cam-next b { font-family: var(--font-mono); font-weight: 600; color: var(--gold); }
    .cap-swap { width: 36px; height: 36px; flex: none; border-radius: 8px; border: 1px solid var(--line-2, #D2C9B3); background: var(--card); color: var(--ink-2); display: flex; align-items: center; justify-content: center; }
    .cap-swap i { font-size: 18px; }
    .cap-change { margin-top: 12px; width: 100%; min-height: 46px; border: 1.5px solid var(--line-2, #D2C9B3); background: var(--card); border-radius: var(--radius); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; color: var(--ink-1); font-size: 14px; font-weight: 600; }
    .cap-change-l { display: inline-flex; align-items: center; gap: 9px; }
    .cap-change-l i, .cap-change-chev { font-size: 19px; color: var(--ink-3); }
    /* Tomas: bloque coherente. Las filas comparten una superficie tintada con
       divisiones sutiles (menos cajas blancas borde-1px). La última toma (primera
       fila) va destacada DENTRO de la lista, no como tarjeta separada. */
    .cap-takes { padding: var(--sp-5) 0 var(--sp-2); }
    .cap-takes-hd { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--sp-3); }
    .cap-takes-hd > span:first-child { font-size: var(--ts-body); font-weight: 600; color: var(--ink-2); }
    .cap-takes-n { font-family: var(--font-mono); font-size: var(--ts-cap); color: var(--ink-2); }
    .cap-empty { color: var(--ink-2); font-size: var(--ts-body); padding: var(--sp-2) var(--sp-1); }
    .cap-take { display: flex; align-items: center; gap: var(--sp-3); width: 100%; padding: var(--sp-3); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: var(--sp-2); box-shadow: var(--el-1); text-align: left; min-height: 48px; }
    /* última toma (primera de la lista invertida) destacada dentro del bloque */
    .cap-take:first-child { box-shadow: var(--el-2); border-color: var(--tint-line); }
    .cap-take.fail .cap-tok { color: var(--ink-3); text-decoration: line-through; }
    .cap-take.fail .cap-take-meta { color: var(--ink-3); }
    .cap-take-main { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0; text-align: left; }
    .cap-tok { font-family: var(--font-mono); font-size: var(--ts-body); font-weight: 600; color: var(--ink-1); flex: none; }
    .cap-take-meta { flex: 1; min-width: 0; font-size: var(--ts-cap); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cap-badge { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .cap-badge i { font-size: 14px; }
    .cap-badge.good { background: var(--green-soft); color: var(--green); }
    .cap-badge.fav { background: #fbf6e6; color: #7a5a12; }
    .cap-badge.fail { background: var(--red-soft); color: var(--red); }
    .cap-badge { flex: none; }
    .cap-mark { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; border: 1.5px solid var(--line-2, #D2C9B3); background: var(--card); color: var(--ink-2); font-size: 12px; font-weight: 600; }
    .cap-mark i { font-size: 16px; color: var(--gold); }
    .cap-mark.active { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .cap-mark.active i { color: var(--green); }
    .cap-reintentar { display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 10px; border-radius: 8px; border: 1.5px solid var(--line-2, #D2C9B3); background: var(--card); color: var(--ink-3); font-size: 12px; font-weight: 600; margin-left: 4px; }
    .cap-reintentar i { font-size: 14px; }
    /* Barra de acción: Toma = ÚNICA acción dominante (dorado de marca, tinta OSCURA
       —nunca blanco sobre dorado— con su token +1·PIBxxxx). No sirve = secundario,
       contorno rojo. El dorado vive aquí y solo aquí. */
    .cap-thumb { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-width: 960px; margin: 0 auto; padding: var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1.7fr 1fr; gap: var(--sp-3); background: linear-gradient(to top, var(--page) 74%, rgba(247,244,236,0)); }
    .cap-btn-toma { min-height: 64px; border: 0; border-radius: 14px; background: var(--gold-leaf); color: var(--ink-1); box-shadow: 0 1px 0 var(--gold), 0 6px 16px rgba(176,141,46,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
    .cap-toma-lbl { font-size: var(--ts-lg); font-weight: 700; }
    .cap-toma-sub { font-family: var(--font-mono); font-size: var(--ts-cap); font-weight: 600; color: rgba(33,30,24,.72); }
    .cap-btn-no { min-height: 64px; border: 1.5px solid var(--red); border-radius: 14px; background: var(--card); color: var(--red); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: var(--ts-body); font-weight: 600; }
    .cap-btn-no i { font-size: 21px; }
    /* selector de cuarto por piso */
    .cuarto-list { display: flex; flex-direction: column; gap: 2px; }
    .cuarto-piso { font-size: 12px; font-weight: 600; color: var(--gold); margin: 12px 2px 4px; }
    .cuarto-piso:first-child { margin-top: 0; }
    .cuarto-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); color: var(--ink-1); font-size: 15px; font-weight: 500; }
    .cuarto-row.child { margin-left: 16px; }
    .cuarto-row.child .cuarto-name::before { content: "– "; color: var(--ink-3); }
    .cuarto-row.active { border-color: var(--gold-leaf); box-shadow: inset 0 0 0 1px var(--gold-leaf); }
    .cuarto-done { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--green); }
    .cuarto-done i { font-size: 14px; }

    /* ===== Topbar onyx + chip de lane ===== */
    .topbar-onyx { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px;
      background: var(--black); border-bottom: 1.5px solid var(--gold-leaf);
      padding: max(12px, env(safe-area-inset-top)) 14px 11px; }
    .ob-brand { display: inline-flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto; }
    .ob-logo { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .02em;
      color: var(--black); background: var(--gold-leaf); border-radius: 6px; padding: 3px 7px; line-height: 1; flex: none; }
    .ob-prop { display: flex; flex-direction: column; min-width: 0; }
    .ob-name { font-family: var(--font-display); font-weight: 500; font-size: 15px; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; display: block; }
    .ob-folio { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,.5);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .ob-spacer { flex: 0 1 8px; min-width: 0; }
    .ob-lane { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; flex: none;
      border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      color: #fff; font-size: 13px; font-weight: 600; }
    .ob-lane > i:first-child { font-size: 16px; color: var(--gold-leaf); }
    .ob-chev { font-size: 15px; color: rgba(255,255,255,.5); }
    .ob-sync { display: inline-flex; align-items: center; gap: 5px; color: rgba(255,255,255,.55); font-size: 10px; font-weight: 600; flex: none; }
    .ob-sync .dot { width: 7px; height: 7px; }
    .demo-reset-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 28px; width: 28px; padding: 0; border: 1px solid rgba(255,255,255,.25); border-radius: 8px;
      background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); font-size: 11px; font-weight: 600; flex: none; cursor: pointer; }
    .demo-reset-btn i { font-size: 15px; }
    .demo-reset-txt { display: none; }
    @media (min-width: 560px) {
      .demo-reset-btn { width: auto; padding: 0 10px; }
      .demo-reset-txt { display: inline; }
    }

    /* ===== Chip de rol (F5) ===== */
    .rolechip { display: inline-flex; align-items: center; gap: 7px; flex: 0 1 auto; min-width: 0; cursor: pointer;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px; padding: 4px 9px 4px 4px; }
    .rc-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--gold-leaf); color: var(--black);
      font-family: var(--font-display); font-weight: 600; font-size: 10px; display: flex; align-items: center; justify-content: center; flex: none; }
    .rc-avatar.lg { width: 44px; height: 44px; font-size: 15px; }
    .rc-avatar.sm { width: 22px; height: 22px; font-size: 9px; }
    .rc-text { display: flex; flex-direction: column; line-height: 1.1; text-align: left; min-width: 0; }
    .rc-text b { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
    .rc-text span { font-size: 9.5px; color: rgba(255,255,255,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
    .rc-caret { font-size: 14px; color: rgba(255,255,255,.5); }

    /* ===== Selector de rol (F5) ===== */
    .role-select { padding: 28px 16px 40px; max-width: 520px; margin: 0 auto; }
    .role-hd h1 { font-family: var(--font-display); font-weight: 500; font-size: 28px; line-height: 1.1; margin-top: 14px; }
    .role-hd p { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
    .role-hd .role-hint { color: var(--ink-3); font-size: 12.5px; margin-top: 10px; }
    .role-opts { display: grid; gap: 10px; margin-top: 22px; }
    .role-opt { display: flex; align-items: center; gap: 13px; width: 100%; padding: 13px 14px; text-align: left;
      border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer; }
    .role-opt-copy { flex: 1; min-width: 0; }
    .role-opt-copy strong { display: block; font-size: 16px; font-weight: 600; }
    .role-opt-copy span { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    .role-opt-chev { font-size: 20px; color: var(--ink-3); flex: none; }

    /* ===== Landing en la propiedad: lista de cuartos por piso (F5) ===== */
    .landing { padding: 8px 0 16px; }
    .floor { margin-top: 14px; }
    .floor-h { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px;
      color: var(--gold); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
    .floor-cnt { color: var(--ink-3); font-weight: 500; font-family: var(--font-mono); font-size: 10.5px; }
    .room { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; margin-top: 8px; cursor: pointer; text-align: left; }
    .room:active { transform: scale(.995); }
    .room.sub { margin-left: 16px; }
    .room-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .room-name { font-family: var(--font-display); font-size: 16px; font-weight: 500; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .rpill { font-size: 10.5px; font-family: var(--font-mono); padding: 2px 7px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--ink-3); background: var(--page); }
    .rpill.good { color: var(--ok); border-color: #bfe0cd; background: #eef7f1; }
    .rpill.fav { color: #7a5a12; border-color: #e4d39a; background: #f7efd8; }
    .rpill.pend { color: var(--warn); border-color: #e7cdb0; background: #f8efe4; }
    .room-chev { color: var(--line); font-size: 20px; flex: none; }
    .addroom { width: 100%; margin-top: 14px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 13px;
      text-align: center; color: var(--ink-3); font-size: 13px; font-weight: 600; background: transparent; cursor: pointer; }
    .back-prop { display: inline-flex; align-items: center; gap: 4px; margin: 4px 0 2px; border: none; background: transparent;
      color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 2px; }
    .back-prop i { font-size: 18px; }

    /* ===== Barra inferior (F5) ===== */
    .botnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; max-width: 960px; margin: 0 auto;
      display: flex; background: var(--card); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom); }
    .botnav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 9px 0 11px; border: none; background: transparent; color: var(--ink-3); font-size: 11px; font-weight: 600; cursor: pointer; position: relative; }
    .botnav-tab.active { color: var(--ink-1); }
    .botnav-tab.active .botnav-ic { color: var(--gold); }
    .botnav-tab.active::after { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 2px; background: var(--gold); border-radius: 2px; }
    .botnav-ic { display: flex; color: var(--ink-3); }
    .botnav-ic svg { width: 22px; height: 22px; }
    .app.has-botnav .content { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    .app.has-thumb .content { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
    .app.has-botnav.has-thumb .content { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
    .app.has-thumb.has-latest .content { padding-bottom: calc(230px + env(safe-area-inset-bottom)); }
    .app.has-botnav.has-thumb.has-latest .content { padding-bottom: calc(290px + env(safe-area-inset-bottom)); }
    .app.has-botnav.has-thumb .cap-thumb { bottom: calc(60px + env(safe-area-inset-bottom)); }

    /* ===== Pantalla de entrada / selector de lane ===== */
    .lane-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 13px; font-weight: 500; }
    .lane-name { margin: 20px 0; }
    .lane-name label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
    .ob-lane i, .action-stack .btn i, .action-stack .primary i { font-size: 17px; }
    .action-stack .btn, .action-stack .primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

    /* ===== Armar cuartos (setup) ===== */
    .setup { padding: 18px 0 28px; max-width: 620px; margin: 0 auto; }
    .setup-hd h2 { font-family: var(--font-display); font-weight: 500; font-size: 24px; }
    .setup-hd p { color: var(--ink-2); font-size: 13px; margin-top: 4px; line-height: 1.45; }
    .setup-block { margin-top: 20px; }
    .setup-lbl { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
    .setup-lbl b { color: var(--gold); font-weight: 600; }
    .setup-hint { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
    .seg { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    /* Chip de cámara: área táctil ≥44px. Cámara seleccionada = estado activo →
       tinte neutro + borde marcado + tinta fuerte, NO dorado (reservado a Toma). */
    .seg-btn { min-height: 44px; padding: 0 var(--sp-4); border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink-2); font-weight: 600; font-size: var(--ts-body); }
    .seg-btn.active { border-color: var(--tint-line); background: var(--tint); color: var(--ink-1); box-shadow: inset 0 0 0 1px var(--tint-line); }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .chip { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 11px; border: 1px solid var(--line-2, #D2C9B3); border-radius: 999px; background: var(--card); color: var(--ink-1); font-size: 13px; font-weight: 600; }
    .chip i { font-size: 15px; color: var(--ink-3); }
    .chip.active { border-color: var(--gold-leaf); background: var(--gold-soft); }
    .chip.active .chip-x { color: var(--gold); }
    .chip.add { border-style: dashed; color: var(--ink-2); }
    .chip.suggest, .chips.suggest .chip { font-weight: 500; }
    .chips.suggest { margin-top: 10px; }
    .chips.suggest .chip i { color: var(--gold); }
    .chip.added { color: var(--green); background: var(--green-soft); border-color: #BFE0CC; cursor: default; }
    .chip.added i { color: var(--green); }
    .setup-addhint { font-size: 12.5px; color: var(--ink-2); margin: 4px 0 9px; }
    .setup-addhint b { color: var(--ink-1); font-weight: 600; }
    .setup-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .setup-add .field { width: 100%; height: 44px; padding: 0 12px; border: 1.5px solid var(--line-2, #D2C9B3); border-radius: var(--radius); background: var(--card); font-size: 14px; }
    .setup-add .btn { height: 44px; }
    .setup-piso-group { margin-top: 12px; }
    .setup-piso-name { font-size: 12px; font-weight: 600; color: var(--gold); margin-bottom: 5px; }
    .setup-room { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 8px 0 12px; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); margin-bottom: 6px; box-shadow: var(--shadow); }
    .setup-room.sub { margin-left: 18px; border-left: 2px solid var(--line-2, #D2C9B3); }
    .setup-room-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
    .setup-room-sub { font-size: 12px; font-weight: 600; color: var(--gold); flex: none; background: transparent; border: 0; padding: 6px 8px; white-space: nowrap; }
    .setup-room-x { width: 30px; height: 30px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--line-2, #D2C9B3); background: var(--page); color: var(--red); }
    .setup-room-x i { font-size: 16px; }
    .setup-mini { display: inline-flex; align-items: center; gap: 3px; height: 30px; padding: 0 9px; border: 1px solid var(--line-2, #D2C9B3); border-radius: 8px; background: var(--page); color: var(--ink-2); font-size: 12px; font-weight: 600; flex: none; }
    .setup-mini i { font-size: 14px; }
    .setup-mini.del { color: var(--red); border-color: #E8C9C3; }
    .primary.block { width: 100%; margin-top: 18px; min-height: 50px; border-radius: var(--radius); font-size: 15px; }
    .mono { font-family: var(--font-mono); }
    .sheet-note { color: var(--ink-2); font-size: 13px; margin-bottom: 12px; line-height: 1.45; }
    .cuarto-meta { font-size: 11px; color: var(--ink-3); }

    /* ===== Modo Cuartos v2 (F20): buscador + drone + terreno ===== */
    /* Piso Drone: estilo azul distinto del resto de los pisos. */
    .chip.drone { border-color: #BCD0E6; color: var(--blue); background: var(--blue-soft); }
    .chip.drone.active { border-color: var(--blue); box-shadow: 0 0 0 1.5px #9CC0E6; background: #E3EDF7; }
    .chip.drone i { color: var(--blue); }
    /* Chips aereos (sujetos de drone y tomas del terreno). */
    .chips.suggest.sky .chip { border-color: #BCD0E6; background: var(--blue-soft); }
    .chips.suggest.sky .chip i { color: var(--blue); }
    .chips.suggest.sky .chip.added { color: var(--blue); background: #E3EDF7; border-color: #9CC0E6; }
    .setup-lbl.sky { color: var(--blue); }
    .setup-piso-name.sky { color: var(--blue); }
    /* Buscador de toda la biblioteca. */
    .setup-search { position: relative; }
    .setup-search-box { display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 13px; border: 1.5px solid var(--gold-leaf, #C9A84C); border-radius: var(--radius); background: var(--card); }
    .setup-search-box.sky { border-color: #BCD0E6; }
    .setup-search-box i { font-size: 19px; color: var(--gold); flex: none; }
    .setup-search-box.sky i { color: var(--blue); }
    .setup-search-box input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 14px; color: var(--ink-1); outline: none; }
    .setup-search-box input::placeholder { color: var(--ink-3); }
    .setup-drop { margin-top: 8px; border: 1px solid var(--line-2, #D2C9B3); border-radius: var(--radius); background: var(--card); overflow: hidden; box-shadow: var(--shadow); }
    .setup-drop-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 12px 13px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; font-size: 14px; color: var(--ink-1); }
    .setup-drop-item:last-child { border-bottom: 0; }
    .setup-drop-item:disabled { color: var(--green); }
    .setup-drop-item .di-add { font-size: 12px; font-weight: 600; color: var(--gold); white-space: nowrap; flex: none; }
    .setup-drop-item:disabled .di-add { color: var(--green); }
    .setup-drop-item.create { color: var(--ink-2); }
    .setup-drop-item.create .di-add { color: var(--ink-3); font-weight: 500; }
    .setup-drop-empty { padding: 12px 13px; font-size: 13px; color: var(--ink-3); }
    /* Sub-cuarto rapido: Closet / Bano / Otro. */
    .setup-subpick { margin: -2px 0 10px 18px; border-left: 2px solid var(--gold-leaf, #C9A84C); padding: 9px 0 9px 12px; }
    .setup-subpick .subpick-lbl { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
    .setup-subpick .subpick-lbl b { color: var(--ink-1); font-weight: 600; }
    /* Terreno: sujeto unico. */
    .setup-single { border: 1px solid #BCD0E6; background: var(--blue-soft); border-radius: var(--radius); padding: 16px; text-align: center; }
    .setup-single .single-name { font-family: var(--font-display); font-size: 20px; font-weight: 500; }
    .setup-single .single-desc { font-size: 12px; color: var(--ink-2); margin-top: 4px; }

    /* ===== Cobertura foto/360 ===== */
    .cov-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 0 8px; }
    .cov-title { font-family: var(--font-display); font-weight: 500; font-size: 24px; }
    .cov-sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
    .cov-edit { width: 42px; height: 42px; flex: none; border-radius: var(--radius); border: 1px solid var(--line-2, #D2C9B3); background: var(--card); color: var(--ink-2); display: flex; align-items: center; justify-content: center; }
    .cov-edit i { font-size: 20px; }
    .cov-sumbar { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; margin: 4px 0 4px; padding: 11px 13px; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); font-size: 13px; color: var(--ink-2); text-align: left; transition: border-color .15s, box-shadow .15s; }
    .cov-sumbar .cov-sum-pend { color: #8B6A13; font-weight: 700; }
    .cov-sumbar.on { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
    .cov-group { margin-top: 14px; }
    .cov-piso { font-size: 12px; font-weight: 600; color: var(--gold); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 8px; }
    .cov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cov-tile { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; justify-content: space-between; min-height: 74px; padding: 13px 12px; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); text-align: left; transition: box-shadow .15s, opacity .15s; }
    .cov-tile.sub { grid-column: auto; }
    .cov-name { font-family: var(--font-display); font-size: 15px; font-weight: 500; line-height: 1.2; }
    .cov-state { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: #8B6A13; }
    .cov-check { display: inline-flex; }
    .cov-check svg { width: 14px; height: 14px; }
    .cov-tile.hecho { border-color: #BFE0CC; background: var(--green-soft); }
    .cov-tile.hecho .cov-state { color: var(--green); }
    .cov-tile.no_aplica { background: var(--muted); opacity: .6; }
    .cov-tile.no_aplica .cov-name { color: var(--ink-3); }
    .cov-tile.no_aplica .cov-state { color: var(--ink-3); }
    .cov-body.hl-pend .cov-tile.hecho, .cov-body.hl-pend .cov-tile.no_aplica { opacity: .4; }
    .cov-body.hl-pend .cov-tile.pendiente { box-shadow: 0 0 0 2px var(--gold); }

    /* ===== Cierre: línea de tiempo cronológica ===== */
    .cron { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }
    .cron-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 7px 4px; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--muted); }
    .cron-row:first-child { border-top: 0; }
    .cron-tok { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--ink-1); flex: none; min-width: 64px; }
    .cron-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .cron-scene { font-size: 13px; font-weight: 500; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cron-kind { font-size: 11px; color: var(--ink-3); }
    .cron-chev { font-size: 18px; color: var(--ink-3); flex: none; }

    /* ===== Cierre: semáforo + faltantes + conciliación + gate ===== */
    .close-sem { border-left: 4px solid var(--line); }
    .close-sem.red { border-left-color: var(--red); background: var(--red-soft); }
    .close-sem.amber { border-left-color: var(--gold); background: var(--gold-soft); }
    .close-sem.green { border-left-color: var(--green); background: var(--green-soft); }
    .close-lvl { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; color: var(--ink-1); }
    .close-lvl i { font-size: 19px; flex: none; }
    .close-sem.red .close-lvl i { color: var(--red); }
    .close-sem.amber .close-lvl i { color: var(--gold); }
    .close-sem.green .close-lvl i { color: var(--green); }
    .close-semtext { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.45; }
    .close-lst { margin-top: 8px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .close-li { display: flex; align-items: center; gap: 9px; padding: 10px 11px; border-top: 1px solid var(--muted); font-size: 13px; color: var(--ink-1); }
    .close-li:first-child { border-top: 0; }
    .close-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: none; }
    .close-rt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .close-sub { color: var(--ink-3); font-size: 11px; margin-top: 1px; }
    .close-conc { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 11px; border-top: 1px solid var(--muted); font-size: 12.5px; color: var(--ink-1); }
    .close-conc:first-child { border-top: 0; }
    .close-conctxt { flex: 1; min-width: 0; }
    .close-tok { font-family: var(--font-mono); font-weight: 700; color: var(--ink-1); }
    .close-chk { display: flex; gap: 6px; flex: none; }
    .close-micro { font-size: 11px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); font-weight: 700; cursor: pointer; }
    .close-micro.ok { color: var(--green); border-color: var(--green); background: var(--green-soft); }
    .close-gate { width: 100%; min-height: 50px; border-radius: var(--radius); border: none; background: var(--gold); color: #322806; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 2px; }

    /* el toast oculto NO debe asomar al fondo ni interceptar toques */
    .toast { transform: translateY(calc(100% + 32px)); visibility: hidden; pointer-events: none; }
    .toast.visible { transform: translateY(0); visibility: visible; pointer-events: auto; }
    /* en captura, el aviso flota ARRIBA de los botones Toma/No sirve, no encima */
    .app.has-thumb ~ .toast { bottom: calc(100px + env(safe-area-inset-bottom)); }
    @media (min-width: 760px) { .app.has-thumb ~ .toast { bottom: calc(104px + env(safe-area-inset-bottom)); } }

    /* ===== Asesores (par de cámaras) ===== */
    .cap-cam.asesor-cam { flex-direction: column; align-items: stretch; gap: 0; padding: 4px 12px; }
    .asesor-cam-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--muted); }
    .asesor-cam-row:first-child { border-top: 0; }
    .asesor-cam-role { width: 34px; height: 34px; flex: none; border-radius: 8px; background: var(--gold-soft); display: flex; align-items: center; justify-content: center; }
    .asesor-cam-role i { font-size: 18px; color: var(--gold); }
    .asesor-cam-copy { flex: 1; min-width: 0; }
    .asesor-cam-lbl { font-size: 13px; font-weight: 600; }
    .asesor-tok .pair-plus { color: var(--ink-3); font-weight: 400; margin: 0 3px; }
    .punto-voz { font-size: 10px; font-weight: 600; color: var(--gold); background: var(--gold-soft); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
    .setup-row-actions { display: flex; gap: 4px; flex: none; }
    .cuarto-row-wrap { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
    .cuarto-row-wrap .cuarto-row { flex: 1; min-width: 0; margin-bottom: 0; }
    .cap-focus-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); }
    .cap-focus-copy { min-width: 0; flex: 1; text-align: right; }
    .cap-back { display: inline-flex; align-items: center; gap: 3px; flex: none; border: 0; background: transparent; color: var(--ink-2); font-size: var(--ts-body); font-weight: 600; padding: 4px 2px; }
    .cap-back i { font-size: 18px; }
    /* Opciones: superficie discreta, área táctil ≥44px, sin competir con el nombre */
    .cap-focus-opts { width: 44px; height: 44px; flex: none; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); color: var(--ink-2); display: flex; align-items: center; justify-content: center; box-shadow: var(--el-1); }
    .cap-focus-opts i { font-size: 20px; }
    /* ===== F7 — Loop de captura (3 capas) ===== */
    /* Tarjeta de cámara: switch + consecutivo del siguiente archivo (DATO SECUNDARIO).
       El token ya no compite con el nombre del cuarto: --ts-lg mono, su etiqueta
       "siguiente archivo" como caption ≥12px en tinta. Sin dorado de relleno. */
    .cap-cam2 { margin-top: var(--sp-4); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--sp-3); box-shadow: var(--el-1); }
    .cap-cam-seg { width: 100%; }
    .cap-next-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-3); margin-top: var(--sp-3); }
    .cap-next { min-width: 0; }
    .cap-next-lbl { display: block; font-size: var(--ts-cap); color: var(--ink-2); }
    .cap-token { display: block; font-family: var(--font-mono); font-size: var(--ts-lg); font-weight: 600; color: var(--ink-1); letter-spacing: -.01em; margin-top: 1px; }
    .cap-next-init { border: 0; background: transparent; color: var(--ink-2); font-size: var(--ts-body); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; min-height: 44px; }
    .cap-next-init i { color: var(--gold); }
    /* + foto (drone): secundario, sin relleno dorado; el icono lleva el acento */
    .cap-foto-btn { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 0 var(--sp-4); border-radius: 999px; border: 1px solid var(--tint-line); background: var(--card); color: var(--ink-1); font-size: var(--ts-body); font-weight: 600; }
    .cap-foto-btn i { font-size: 17px; color: var(--ink-2); }
    /* Sugeridas: tira plegable, claramente SECUNDARIA → superficie tintada (no card
       blanca de cuerpo completo), sin sombra, para que ceda jerarquía a Toma/tomas. */
    .cap-sug { margin-top: var(--sp-3); background: var(--tint); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--sp-3); box-shadow: var(--el-0); }
    .cap-sug-h { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); border: 0; background: transparent; padding: var(--sp-1) 0; min-height: 44px; }
    .cap-sug-t { display: inline-flex; align-items: center; gap: 6px; font-size: var(--ts-cap); font-weight: 600; color: var(--ink-2); }
    .cap-sug-t i { font-size: 16px; color: var(--gold); }
    .cap-sug-c { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: var(--ts-cap); color: var(--ink-2); }
    .cap-sug-body { margin-top: var(--sp-3); }
    /* F16 — la lista de sugerencias envuelve (wrap), sin scroll horizontal */
    .cap-sug-chips { flex-wrap: wrap; gap: 8px; }
    .cap-sug-chip.done { color: var(--green); background: var(--green-soft); border-color: #BFE0CC; }
    .cap-sug-chip.done i { color: var(--green); }
    .cap-sug-chip.sel { border-color: var(--ink-2); box-shadow: 0 0 0 1px var(--ink-2); background: var(--tint); font-weight: 600; }
    .cap-libre-chip { border-style: dashed; color: var(--ink-2); }
    .cap-libre-chip i { font-size: 13px; }
    .cap-libre-chip.sel { border-style: solid; border-color: var(--ink-2); box-shadow: 0 0 0 1px var(--ink-2); background: var(--tint); color: var(--ink-1); font-weight: 600; }
    .cap-sug-guide { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin-bottom: 11px; }
    .cap-sug-detail { margin-top: 11px; border-top: 1px dashed var(--line); padding-top: 11px; }
    .cap-mini-lbl { font-size: var(--ts-cap); font-weight: 700; color: var(--ink-2); letter-spacing: .01em; margin-bottom: 6px; }
    .cap-qg { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin-bottom: 11px; }
    .cap-mov-chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; }
    .cap-mov-chips::-webkit-scrollbar { height: 0; }
    .cap-mov-chip { white-space: nowrap; flex: none; }
    .cap-mov-chip.mv-on { border-color: var(--gold-leaf); box-shadow: 0 0 0 1.5px var(--gold-leaf); background: var(--gold-soft); }
    .cap-plan { font-size: 11.5px; color: var(--ink-3); margin-top: 10px; }
    .cap-plan b { color: var(--ink-1); font-weight: 600; }
    /* F15 — panel "Etiquetar toma" (plano + movimiento para cualquier toma) */
    .cap-tag-sel { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: var(--ts-cap); color: var(--ink-2); }
    .cap-tag-sel b { color: var(--ink-1); font-weight: 600; font-family: var(--font-sans, inherit); }
    .cap-mvgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
    .cap-mv { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .cap-mv svg { width: 26px; height: 26px; color: var(--ink-2); }
    .cap-mv span { font-size: 11px; color: var(--ink-2); font-weight: 500; text-align: center; line-height: 1.1; }
    .cap-mv.mv-on { border-color: var(--ink-2); box-shadow: 0 0 0 1px var(--ink-2); background: var(--tint); }
    .cap-mv.mv-on svg, .cap-mv.mv-on span { color: var(--ink-1); }
    .cap-plano-chips { margin-top: 8px; flex-wrap: wrap; }
    .cap-plano-chip.sel { border-color: var(--ink-2); box-shadow: 0 0 0 1px var(--ink-2); background: var(--tint); font-weight: 600; }
    .cap-plano-chip.done { color: var(--green); background: var(--green-soft); border-color: #BFE0CC; }
    .cap-plano-chip.done i { color: var(--green); }
    /* "recién grabada": fundida con el flujo de tomas — strip contextual de acciones
       (favorita/buena/describir) sobre la última toma, anclado encima de la barra de
       acción. Superficie tintada continua (no card blanca de cuerpo completo) con un
       canto superior sutil; lee como prolongación de la lista, no como caja aparte. */
    .cap-latest { position: fixed; left: 0; right: 0; z-index: 41; max-width: 960px; margin: 0 auto; bottom: calc(88px + env(safe-area-inset-bottom)); padding: var(--sp-3) var(--sp-4) var(--sp-3); background: var(--tint); border-top: 1px solid var(--line); box-shadow: 0 -6px 16px rgba(20,16,12,.05); }
    .app.has-botnav .cap-latest { bottom: calc(148px + env(safe-area-inset-bottom)); }
    .cap-latest-h { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-2); }
    .cap-latest-who { font-size: var(--ts-cap); font-weight: 600; color: var(--ink-2); }
    .cap-latest-tk { font-family: var(--font-mono); font-size: var(--ts-cap); font-weight: 600; color: var(--ink-1); min-width: 0; text-align: right; }
    .cap-qa { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-2); }
    .cap-qbtn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: var(--radius); border: 1px solid var(--tint-line); background: var(--card); color: var(--ink-2); font-size: var(--ts-body); font-weight: 600; }
    .cap-qbtn i { font-size: 17px; }
    .cap-qbtn.fav.on { color: #7a5a12; border-color: #e4d39a; background: #fbf6e6; }
    .cap-qbtn.good.on { color: var(--green); border-color: #BFE0CC; background: var(--green-soft); }
    .cap-notef { width: 100%; display: flex; align-items: center; gap: 7px; min-height: 44px; border: 1px dashed var(--tint-line); border-radius: var(--radius); padding: 0 var(--sp-3); color: var(--ink-2); font-size: var(--ts-cap); background: var(--card); text-align: left; }
    .cap-notef i { font-size: 15px; flex: none; }
    .cap-notef.has { color: var(--ink-1); border-style: solid; }
    /* ===== Navegación de recorrido — ÚNICA zona de navegación, neutra (sin dorado) =====
       anterior · Cambiar cuarto · Siguiente; todo en tinta, áreas táctiles ≥44px.
       "Siguiente" NO es acción primaria: es estado/navegación → tinte neutro marcado,
       no dorado (el dorado se reserva al botón Toma). */
    .cap-nav { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); }
    .cap-nav-prev { width: 48px; min-height: 48px; flex: none; border: 1px solid var(--tint-line); background: var(--card); border-radius: var(--radius); color: var(--ink-2); display: flex; align-items: center; justify-content: center; box-shadow: var(--el-1); }
    .cap-nav-prev i { font-size: 20px; }
    .cap-nav-change { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); color: var(--ink-1); font-size: var(--ts-body); font-weight: 600; white-space: nowrap; box-shadow: var(--el-1); }
    .cap-nav-change i { font-size: 18px; color: var(--ink-3); }

</head>
<body>
  <div id="app" class="app">
    <div class="state-screen"><div><div class="spinner"></div><p>Cargando bitacora...</p></div></div>
  </div>

  <div id="overlay" class="overlay" onclick="cerrarModal(event)">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Opciones" onclick="event.stopPropagation()"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="./checklist-logic.js"></script>
  <script>
const API = 'https://contratos.inmueblesaudiovisuales.com/api';
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const CONFIG = new URLSearchParams(location.search).get('config') === '1';
const logic = window.IAVChecklistLogic;

let meta = { folio: '', nombreCliente: '' };
let state = logic.createDefaultState();
let activeView = 'captura';
let modalTab = 'plantillas';
let selectedTemplate = 'casa';
let selectedAction = null;
let activeRoomId = null;
let setupOpen = false;
let setupTipo = 'casa';
let setupPiso = null;
// F20 — Modo Cuartos v2: texto del buscador (toda la biblioteca) y el id del
// cuarto con el selector rapido de sub-cuarto (Closet / Bano / Otro) abierto.
let setupQuery = '';
let setupSubFor = null;
let searchTerm = '';
let saveTimer = null;
let retryTimer = null;
let pollingId = null;
let saving = false;
let dirty = false;
let retryCount = 0;
let toastTimer = null;
let syncStatus = 'ok';
let guideMode = localStorage.getItem('checklist_guide_' + (TOKEN || 'demo')) === '1';
let activeSugId = null;
// F7 — etiqueta de la proxima toma (no se auto-avanza)
let pendingShotType = null;   // id de SHOT_TYPES seleccionado en la tira de sugerencias
let pendingMovement = null;   // id de MOVEMENTS seleccionado
let sugStripOpen = false;     // panel "Sugeridas" plegable (colapsado por defecto, F15/F16)
let tagLibre = false;         // F16 — modo libre: detalle plano/movimiento sin sugerencia activa
let configGuiaOpen = false;
let guideConfigDraft = null;
let currentGuideConfig = null;
let propuestaIAText = '';
let propuestaIAParsed = null;
let capturaScreen = 'lista';

// ===== Rol por celular (F5) =====
// Cada celular recuerda su rol. El rol define la vista y la herramienta.
const ROLE_DEF = {
  fernanda: { service: 'foto', label: 'Fernanda', sub: 'Foto', initials: 'FE' },
  danna: { service: 't360', label: 'Danna', sub: 'Recorrido 360', initials: 'DA' },
  bruno: { service: 'video', label: 'Bruno', sub: 'Video + Drone', initials: 'BG' },
};
const ROLE_ORDER = ['fernanda', 'danna', 'bruno'];
// Modos que cada rol opera en el loop de captura.
// Bruno es dueno de video + drone (alterna ambos en el mismo cuarto).
// Fernanda (foto) y Danna (t360) no entran a este loop.
const ROLE_LOOP_MODES = {
  bruno: ['video', 'drone'],
  fernanda: ['foto'],
  danna: ['t360'],
};
function loopModesForRole() {
  return ROLE_LOOP_MODES[getRole()] || [state.modoActual];
}
function roleKey() { return 'checklist_role_' + (TOKEN || 'demo'); }
function getRole() {
  const r = localStorage.getItem(roleKey());
  return ROLE_DEF[r] ? r : null;
}
function roleReady() {
  if (new URLSearchParams(location.search).get('screen') === 'entry') return false;
  return !!getRole();
}
function isBruno() { return getRole() === 'bruno'; }
// Aplica el servicio del rol activo a un estado (preserva el plumbing por servicio).
// Bruno opera video + drone: si ya eligio una camara/modo en la sesion (carril guardado
// dentro de sus modos), se respeta y no se pisa con 'video'. Fer (foto) y Danna (t360)
// tienen un solo servicio, asi que su modo no cambia.
function applyRoleServiceOn(target) {
  const role = getRole();
  if (!role || !target) return;
  const modes = ROLE_LOOP_MODES[role];
  if (modes && modes.length > 1) {
    const savedLane = localStorage.getItem(laneKey());
    if (savedLane && modes.includes(savedLane) && target.servicios && target.servicios[savedLane]) {
      target.modoActual = savedLane;
      return;
    }
  }
  target.modoActual = ROLE_DEF[role].service;
}
function applyRoleService() { applyRoleServiceOn(state); }
function setRole(role) {
  if (!ROLE_DEF[role]) return;
  localStorage.setItem(roleKey(), role);
  applyRoleService();
  capturaScreen = 'lista';
  activeView = 'captura';
  cerrarModal();
  render();
}

const SERVICE_UI = {
  foto: { label: 'Foto normal', short: 'Foto', verb: 'foto', help: 'Marca cobertura fotografica.' },
  t360: { label: 'Recorrido 360', short: '360', verb: 'recorrido 360', help: 'Marca recorridos por espacio.' },
  video: { label: 'Video', short: 'Video', verb: 'video', help: 'Registra el orden real de tomas.' },
  drone: { label: 'Drone', short: 'Drone', verb: 'toma drone', help: 'Registra secuencia aerea.' },
  asesor: { label: 'Asesores', short: 'Asesores', verb: 'toma', help: 'Graba puntos del asesor con par de cámaras.' },
};
const ZONE_LABELS = { interior: 'Interior', exterior: 'Exterior', amenidades: 'Amenidades', drone: 'Drone' };

function esc(value) {
  return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function miNombre() {
  const input = document.getElementById('mi-nombre');
  if (input && input.value.trim()) return input.value.trim();
  return (localStorage.getItem('checklist_nombre') || '').trim() || 'Anonimo';
}

function laneKey() { return 'checklist_lane_' + (TOKEN || 'demo'); }
function roomKey() { return 'checklist_room_' + (TOKEN || 'demo'); }
function stateKey() { return 'checklist_state_' + (TOKEN || 'demo'); }
function hasLane() { return !!localStorage.getItem(laneKey()); }
function laneReady() {
  if (new URLSearchParams(location.search).get('screen') === 'entry') return false;
  // El demo arranca en primer arranque: pasa por la pantalla de lane y
  // Armar cuartos igual que un contrato real recién creado.
  return hasLane();
}
function chooseLane(lane) {
  state.modoActual = lane;
  localStorage.setItem(laneKey(), lane);
  ensureActiveMode();
  const inicio = primerEnRecorrido(true) || primerEnRecorrido(false);
  if (inicio) { activeRoomId = inicio; localStorage.setItem(roomKey(), inicio); }
  cerrarModal();
  render();
  scheduleSave();
}
const LANE_ICON = { foto: 'camera', t360: 'rotate-360', video: 'video', drone: 'drone', asesor: 'microphone-2' };
function laneIcon(lane) { return LANE_ICON[lane] || 'video'; }

function activeServices() {
  return ['foto', 't360', 'video', 'drone', 'asesor'].filter((key) => state.servicios[key]);
}

function ensureActiveMode() {
  if (!state.servicios[state.modoActual]) state.modoActual = activeServices()[0] || 'video';
}

function setSync(status) {
  syncStatus = status;
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if (!dot || !label) return;
  const cls = status === 'syncing' ? ' syncing' : (status === 'error' || status === 'offline') ? ' error' : '';
  dot.className = 'dot' + cls;
  label.textContent = status === 'syncing' ? 'Guardando'
    : status === 'offline' ? 'Sin conexión, se guardará'
    : status === 'error' ? 'Error'
    : 'En vivo';
}

// Espejo completo del estado en localStorage para arranque sin señal.
// Debe escribirse SIEMPRE que tengamos un estado bueno (al cargar y al guardar),
// no solo al editar; de lo contrario, abrir sin editar y luego perder señal deja
// la app sin copia para arrancar.
function mirrorState() {
  if (DEMO) return;
  try { localStorage.setItem(stateKey(), JSON.stringify({ meta, state })); } catch (_) {}
}

async function apiGet(payload) {
  const action = payload.action;
  const rest = Object.assign({}, payload, { token: TOKEN });
  delete rest.action;
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(API + '/' + action + '?' + new URLSearchParams(rest).toString(), { signal: ctrl.signal });
    clearTimeout(tid);
    return res.json();
  } catch (err) {
    clearTimeout(tid);
    throw err;
  }
}

async function apiPost(payload) {
  const action = payload.action;
  const rest = Object.assign({}, payload, { token: TOKEN });
  delete rest.action;
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(API + '/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(rest),
      signal: ctrl.signal,
    });
    clearTimeout(tid);
    return res.json();
  } catch (err) {
    clearTimeout(tid);
    throw err;
  }
}

function scheduleSave() {
  if (DEMO) return;
  dirty = true;
  mirrorState();
  retryCount = 0;
  clearTimeout(saveTimer);
  clearTimeout(retryTimer);
  saveTimer = setTimeout(saveNow, 550);
}

async function saveNow() {
  if (!dirty || saving) return;
  dirty = false;
  saving = true;
  setSync('syncing');
  try {
    const data = await apiPost({ action: 'guardarChecklist', cuartos: state, columnas: state.servicios });
    saving = false;
    if (data.error) {
      dirty = true;
      setSync('error');
      retryCount++;
      retryTimer = setTimeout(saveNow, Math.min(30000, 3000 * retryCount));
      return;
    }
    setSync('ok');
    mirrorState();
    if (dirty) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 0);
    }
  } catch (_) {
    // Fallo de red: NO nos rendimos. Reintento con backoff acotado y, al volver
    // la señal, el listener 'online' dispara saveNow de inmediato para vaciar la cola.
    saving = false;
    setSync('offline');
    dirty = true;
    retryCount++;
    if (retryCount === 1 || retryCount % 4 === 0) showToast('Sin conexión. Se guardará al volver la señal.');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(saveNow, Math.min(30000, 3000 * retryCount));
  }
}

function restaurarPrefsDispositivo() {
  // Estado por-dispositivo: rol, carril/cámara activa y cuarto en foco.
  const savedLane = localStorage.getItem(laneKey());
  if (savedLane && state.servicios[savedLane]) state.modoActual = savedLane;
  activeRoomId = localStorage.getItem(roomKey()) || null;
  ensureActiveMode();
  if (getRole()) applyRoleService();
}

// Intenta arrancar desde el espejo local. Devuelve true si lo logró.
function bootDesdeEspejo() {
  const local = localStorage.getItem(stateKey());
  if (!local) return false;
  try {
    const saved = JSON.parse(local);
    meta = saved.meta || meta;
    state = logic.normalizeChecklistData(saved.state || saved);
    restaurarPrefsDispositivo();
    return true;
  } catch (e) {
    return false;
  }
}

async function cargar() {
  try {
    const data = await apiGet({ action: 'obtenerChecklist' });
    if (data.error) return mostrarError(data.error);
    meta = { folio: data.folio || '', nombreCliente: data.nombreCliente || '' };
    const payload = data.cuartos && data.cuartos.version >= 2 ? data.cuartos : { cuartos: data.cuartos || [], columnas: data.columnas || {} };
    state = logic.normalizeChecklistData(payload);
    restaurarPrefsDispositivo();
    mirrorState(); // espejo fresco SIEMPRE al cargar, aunque el usuario no edite nada.
    setSync('ok');
    render();
    iniciarPolling();
  } catch (_) {
    // Fallo de red en el boot: NO dejar la app en blanco. Arrancamos desde el
    // espejo si existe; si no, con estado vacío usable para empezar a trabajar.
    const tieneEspejo = bootDesdeEspejo();
    dirty = tieneEspejo; // si veníamos de un espejo, hay que re-sincronizar al volver señal.
    render();
    setSync('offline');
    iniciarPolling();
    showToast(tieneEspejo
      ? 'Sin conexión: trabajando con la copia local. Se sincroniza al volver la señal.'
      : 'Sin conexión: puedes empezar a trabajar. Se guardará al volver la señal.');
  }
}

function inputEnfoco() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}

async function poll() {
  // Nunca pisar cambios locales pendientes ni romper si la red está caída.
  if (dirty || saving) return;
  try {
    const data = await apiGet({ action: 'obtenerChecklist' });
    if (dirty || saving) return;
    if (!data || data.error) return;
    const payload = data.cuartos && data.cuartos.version >= 2 ? data.cuartos : { cuartos: data.cuartos || [], columnas: data.columnas || {} };
    const next = logic.normalizeChecklistData(payload);
    next.modoActual = state.modoActual;
    next.activeCameraByMode = state.activeCameraByMode;
    if (getRole()) { applyRoleServiceOn(next); }
    if (JSON.stringify(next) !== JSON.stringify(state)) {
      // No re-renderizar encima de un input enfocado: perderíamos el cursor.
      // Diferimos: el siguiente poll aplicará el cambio cuando ya no haya foco.
      if (inputEnfoco()) return;
      state = next;
      ensureActiveMode();
      mirrorState();
      render();
    }
    if (syncStatus === 'offline' || syncStatus === 'error') setSync('ok');
  } catch (_) {
    // Red caída durante el poll: silencioso, solo reflejamos el estado.
    if (!saving && !dirty) setSync('offline');
  }
}

function iniciarPolling() {
  if (DEMO) return;
  clearInterval(pollingId);
  pollingId = setInterval(poll, 5000);
}

function cargarDemo() {
  const s = document.createElement('script');
  s.src = './checklist-demo.js';
  s.onload = () => {
    meta = window.IAVChecklistDemo.meta;
    state = window.IAVChecklistDemo.build(logic);
    ensureActiveMode();
    if (getRole()) applyRoleService();
    const screen = new URLSearchParams(location.search).get('screen');
    if (['captura', 'cierre', 'edicion'].includes(screen)) activeView = screen;
    render();
  };
  document.body.appendChild(s);
}

function render() {
  const app = document.getElementById('app');
  if (CONFIG) {
    if (!configGuiaOpen) return;
    app.innerHTML = `<main class="content">${renderConfigGuia()}</main>`;
    return;
  }
  // Sin rol: selector discreto una sola vez (reemplaza la pantalla de servicios).
  if (!roleReady()) {
    app.innerHTML = renderRoleSelect();
    app.classList.remove('has-thumb');
    app.classList.remove('has-botnav');
    bindNameInput();
    return;
  }
  const showSetup = setupOpen || !state.espacios.length;
  const showConfig = configGuiaOpen;
  const bruno = isBruno();
  // La app abre EN LA PROPIEDAD. Para Bruno: landing = lista de cuartos por piso
  // (capturaScreen 'lista') o el loop del cuarto ('cuarto'). Cierre/Edicion via barra.
  const enLanding = bruno && activeView === 'captura' && capturaScreen === 'lista' && !showSetup && !showConfig;
  let bodyHtml;
  if (showConfig) bodyHtml = renderConfigGuia();
  else if (showSetup) bodyHtml = renderSetup();
  else if (enLanding) bodyHtml = renderPropertyLanding();
  else if (bruno) bodyHtml = renderActiveView();
  else bodyHtml = renderCoverageForRole();
  const showBotnav = bruno && !showSetup && !showConfig;
  app.innerHTML = `
    ${renderShellHeader()}
    <main class="content">${bodyHtml}</main>
    ${showBotnav ? renderBottomNav() : ''}
  `;
  app.classList.toggle('has-thumb', !!app.querySelector('.cap-thumb'));
  app.classList.toggle('has-botnav', showBotnav);
  app.classList.toggle('has-latest', !!app.querySelector('.cap-latest'));
  bindNameInput();
  const search = document.getElementById('space-search');
  if (search) {
    search.value = searchTerm;
    search.addEventListener('input', (event) => { searchTerm = event.target.value; render(); });
    if (searchTerm) { search.focus(); const v = search.value; search.setSelectionRange(v.length, v.length); }
  }
  setSync(syncStatus);
}
