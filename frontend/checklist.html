<body>
  <div id="app" class="app">
    <div class="state-screen"><div><div class="spinner"></div><p>Cargando bitacora...</p></div></div>
  </div>

  <div id="overlay" class="overlay" onclick="cerrarModal(event)">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Opciones" onclick="event.stopPropagation()"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="./checklist-logic.js"></script>
  <script>
const API = 'https://contratos.inmueblesaudiovisuales.com/api';
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const logic = window.IAVChecklistLogic;

let meta = { folio: '', nombreCliente: '' };
let state = logic.createDefaultState();
let activeView = 'captura';
let modalTab = 'plantillas';
let selectedTemplate = 'casa';
let selectedAction = null;
let activeRoomId = null;
let setupOpen = false;
let setupTipo = 'casa';
let setupPiso = null;
let searchTerm = '';
let saveTimer = null;
let retryTimer = null;
let pollingId = null;
let saving = false;
let dirty = false;
let retryCount = 0;
let toastTimer = null;
let syncStatus = 'ok';

const SERVICE_UI = {
  foto: { label: 'Foto normal', short: 'Foto', verb: 'foto', help: 'Marca cobertura fotografica.' },
  t360: { label: 'Recorrido 360', short: '360', verb: 'recorrido 360', help: 'Marca recorridos por espacio.' },
  video: { label: 'Video', short: 'Video', verb: 'video', help: 'Registra el orden real de tomas.' },
  drone: { label: 'Drone', short: 'Drone', verb: 'toma drone', help: 'Registra secuencia aerea.' },
};
const ZONE_LABELS = { interior: 'Interior', exterior: 'Exterior', amenidades: 'Amenidades', drone: 'Drone' };

function esc(value) {
  return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function miNombre() {
  const input = document.getElementById('mi-nombre');
  if (input && input.value.trim()) return input.value.trim();
  return (localStorage.getItem('checklist_nombre') || '').trim() || 'Anonimo';
}

function laneKey() { return 'checklist_lane_' + (TOKEN || 'demo'); }
function roomKey() { return 'checklist_room_' + (TOKEN || 'demo'); }
function hasLane() { return !!localStorage.getItem(laneKey()); }
function laneReady() {
  if (new URLSearchParams(location.search).get('screen') === 'entry') return false;
  return DEMO || hasLane();
}
function chooseLane(lane) {
  state.modoActual = lane;
  localStorage.setItem(laneKey(), lane);
  ensureActiveMode();
  cerrarModal();
  render();
  scheduleSave();
}
const LANE_ICON = { foto: 'camera', t360: 'rotate-360', video: 'video', drone: 'drone' };
function laneIcon(lane) { return LANE_ICON[lane] || 'video'; }

function activeServices() {
  return ['foto', 't360', 'video', 'drone'].filter((key) => state.servicios[key]);
}

function ensureActiveMode() {
  if (!state.servicios[state.modoActual]) state.modoActual = activeServices()[0] || 'video';
}

function setSync(status) {
  syncStatus = status;
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if (!dot || !label) return;
  dot.className = 'dot' + (status === 'syncing' ? ' syncing' : status === 'error' ? ' error' : '');
  label.textContent = status === 'syncing' ? 'Guardando' : status === 'error' ? 'Error' : 'En vivo';
}

async function apiGet(payload) {
  const action = payload.action;
  const rest = Object.assign({}, payload, { token: TOKEN });
  delete rest.action;
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(API + '/' + action + '?' + new URLSearchParams(rest).toString(), { signal: ctrl.signal });
    clearTimeout(tid);
    return res.json();
  } catch (err) {
    clearTimeout(tid);
    throw err;
  }
}

async function apiPost(payload) {
  const action = payload.action;
  const rest = Object.assign({}, payload, { token: TOKEN });
  delete rest.action;
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(API + '/' + action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(rest),
      signal: ctrl.signal,
    });
    clearTimeout(tid);
    return res.json();
  } catch (err) {
    clearTimeout(tid);
    throw err;
  }
}

function scheduleSave() {
  if (DEMO) return;
  dirty = true;
  retryCount = 0;
  clearTimeout(saveTimer);
  clearTimeout(retryTimer);
  saveTimer = setTimeout(saveNow, 550);
}

async function saveNow() {
  if (!dirty || saving) return;
  dirty = false;
  saving = true;
  setSync('syncing');
  try {
    const data = await apiPost({ action: 'guardarChecklist', cuartos: state, columnas: state.servicios });
    saving = false;
    if (data.error) {
      dirty = true;
      setSync('error');
      if (retryCount < 4) {
        retryCount++;
        showToast('Error al guardar. Reintentando...');
        retryTimer = setTimeout(saveNow, 7000);
      } else {
        showToast('No se pudo guardar.');
      }
      return;
    }
    setSync('ok');
    if (dirty) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 0);
    }
  } catch (_) {
    saving = false;
    setSync('error');
    if (retryCount < 4) {
      retryCount++;
      dirty = true;
      showToast('Sin conexion. Reintentando...');
      retryTimer = setTimeout(saveNow, 7000);
    } else {
      showToast('No se pudo guardar.');
    }
  }
}

async function cargar() {
  try {
    const data = await apiGet({ action: 'obtenerChecklist' });
    if (data.error) return mostrarError(data.error);
    meta = { folio: data.folio || '', nombreCliente: data.nombreCliente || '' };
    const payload = data.cuartos && data.cuartos.version === 2 ? data.cuartos : { cuartos: data.cuartos || [], columnas: data.columnas || {} };
    state = logic.normalizeChecklistData(payload);
    const savedLane = localStorage.getItem(laneKey());
    if (savedLane && state.servicios[savedLane]) state.modoActual = savedLane;
    activeRoomId = localStorage.getItem(roomKey()) || null;
    ensureActiveMode();
    render();
    iniciarPolling();
  } catch (_) {
    mostrarError('No se pudo cargar la bitacora.');
  }
}

async function poll() {
  if (dirty || saving) return;
  try {
    const data = await apiGet({ action: 'obtenerChecklist' });
    if (dirty || saving) return;
    if (data.error) return;
    const payload = data.cuartos && data.cuartos.version === 2 ? data.cuartos : { cuartos: data.cuartos || [], columnas: data.columnas || {} };
    const next = logic.normalizeChecklistData(payload);
    next.modoActual = state.modoActual;
    next.activeCameraByMode = state.activeCameraByMode;
    if (JSON.stringify(next) !== JSON.stringify(state)) {
      state = next;
      ensureActiveMode();
      render();
    }
  } catch (_) {}
}

function iniciarPolling() {
  if (DEMO) return;
  clearInterval(pollingId);
  pollingId = setInterval(poll, 5000);
}

function cargarDemo() {
  const s = document.createElement('script');
  s.src = './checklist-demo.js';
  s.onload = () => {
    meta = window.IAVChecklistDemo.meta;
    state = window.IAVChecklistDemo.build(logic);
    ensureActiveMode();
    const screen = new URLSearchParams(location.search).get('screen');
    if (['captura', 'cierre', 'edicion'].includes(screen)) activeView = screen;
    render();
  };
  document.body.appendChild(s);
}

function render() {
  const app = document.getElementById('app');
  if (!laneReady()) {
    app.innerHTML = renderLaneEntry();
    bindNameInput();
    return;
  }
  const showSetup = setupOpen || !state.espacios.length;
  app.innerHTML = `
    ${renderHeader()}
    ${state.espacios.length && !showSetup ? renderTabs() : ''}
    <main class="content">${showSetup ? renderSetup() : renderActiveView()}</main>
  `;
  bindNameInput();
  const search = document.getElementById('space-search');
  if (search) {
    search.value = searchTerm;
    search.addEventListener('input', (event) => { searchTerm = event.target.value; render(); });
    if (searchTerm) { search.focus(); const v = search.value; search.setSelectionRange(v.length, v.length); }
  }
  setSync(syncStatus);
}

function bindNameInput() {
  const name = document.getElementById('mi-nombre');
  if (!name) return;
  if (!name.value) name.value = localStorage.getItem('checklist_nombre') || '';
  name.oninput = () => localStorage.setItem('checklist_nombre', name.value.trim());
}

function renderHeader() {
  const lane = SERVICE_UI[state.modoActual] ? SERVICE_UI[state.modoActual].short : 'Video';
  return `<header class="topbar-onyx">
    <span class="ob-brand"><span class="ob-logo">IAV</span>
      <span class="ob-prop"><span class="ob-name">${esc(meta.nombreCliente || 'Sesión')}</span><span class="ob-folio">${esc(meta.folio || '')}</span></span>
    </span>
    <span class="ob-spacer"></span>
    <button class="ob-lane" onclick="abrirLane()"><i class="ti ti-${laneIcon(state.modoActual)}"></i>${esc(lane)}<i class="ti ti-chevron-down ob-chev"></i></button>
    <span class="ob-sync"><span class="dot" id="sync-dot"></span><span id="sync-label">en vivo</span></span>
  </header>`;
}

function renderLaneEntry() {
  const lanes = [
    ['foto', 'Foto', 'camera', 'Marca la cobertura de fotos por cuarto.'],
    ['t360', '360', 'rotate-360', 'Marca los recorridos 360 por cuarto.'],
    ['video', 'Video', 'video', 'Registra cada archivo con su cuarto y calidad.'],
    ['drone', 'Drone', 'drone', 'Registra la secuencia de tomas aéreas.'],
    ['asesor', 'Asesores', 'microphone-2', 'Grabación de asesores. Pronto.'],
  ];
  return `<div class="lane-entry">
    <div class="lane-entry-hd">
      <span class="lane-brand"><span class="ob-logo">IAV</span>bitácora</span>
      <h1>¿Qué vas a hacer?</h1>
      ${meta.nombreCliente ? `<p>${esc(meta.nombreCliente)}</p>` : ''}
    </div>
    <div class="lane-name">
      <label for="mi-nombre">Tu nombre</label>
      <input class="field" id="mi-nombre" type="text" placeholder="Tu nombre" maxlength="30" autocomplete="off">
    </div>
    <div class="lane-opts">${lanes.map((l) => `
      <button class="lane-opt${l[0] === 'asesor' ? ' soon' : ''}" ${l[0] === 'asesor' ? 'disabled' : ''} onclick="chooseLane('${l[0]}')">
        <span class="lane-opt-ic"><i class="ti ti-${l[2]}"></i></span>
        <span class="lane-opt-copy"><strong>${l[1]}</strong><span>${l[3]}</span></span>
        ${l[0] === 'asesor' ? '<span class="lane-soon">pronto</span>' : '<i class="ti ti-chevron-right lane-opt-chev"></i>'}
      </button>`).join('')}</div>
  </div>`;
}

function abrirLane() {
  const lanes = [['foto', 'Foto'], ['t360', '360'], ['video', 'Video'], ['drone', 'Drone']];
  abrirModal(`<div class="sheet-head"><h2>Cambiar de servicio</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="lane-name" style="margin-bottom:12px"><label for="mi-nombre">Tu nombre</label>
      <input class="field" id="mi-nombre" type="text" placeholder="Tu nombre" maxlength="30" value="${esc(localStorage.getItem('checklist_nombre') || '')}" oninput="localStorage.setItem('checklist_nombre', this.value.trim())"></div>
    <div class="action-stack">${lanes.map(([key, label]) => `
      <button class="${state.modoActual === key ? 'primary' : 'btn'}" onclick="chooseLane('${key}')"><i class="ti ti-${laneIcon(key)}"></i> ${label}</button>`).join('')}
      <button class="btn ghost" onclick="abrirSetup()"><i class="ti ti-home-cog"></i> Armar cuartos</button>
      <button class="btn ghost" onclick="cerrarModal();abrirServicios()">Servicios contratados</button>
    </div>`);
}

function renderModeArea() {
  return `<section class="mode-area">
    <div class="mode-grid">${activeServices().map((key) => `
      <button class="mode-btn ${state.modoActual === key ? 'active' : ''}" aria-pressed="${state.modoActual === key}" onclick="setMode('${key}')">
        <strong>${SERVICE_UI[key].short}</strong>
      </button>
    `).join('')}</div>
  </section>`;
}

function isMediaMode() {
  return state.modoActual === 'video' || state.modoActual === 'drone';
}

function activeCamera() {
  const id = state.activeCameraByMode && state.activeCameraByMode[state.modoActual];
  return (state.cameras || []).find((camera) => camera.id === id);
}

function renderCameraStrip() {
  const camera = activeCamera();
  const sequence = camera && logic.getCameraSequence(state, camera.id);
  return `<div class="camera-strip">
    <div class="camera-copy"><strong>${esc(camera ? camera.label : 'Sin camara')}</strong><span>${sequence && sequence.nextToken ? `Siguiente ${esc(sequence.nextToken)}` : 'Inicia la secuencia antes de grabar'}</span></div>
    <div class="camera-actions">
      ${state.modoActual === 'video' ? '<button class="mini-btn" onclick="abrirCamaras()">Cambiar</button>' : ''}
      <button class="mini-btn" onclick="abrirSecuencia()">${sequence && sequence.nextToken ? 'Nuevo tramo' : 'Iniciar'}</button>
    </div>
  </div>`;
}

function renderTabs() {
  const tabs = [['captura', 'Capturar'], ['cierre', 'Cierre'], ['edicion', 'Edicion']];
  return `<nav class="tabs" aria-label="Vista de bitacora">${tabs.map(([key, label]) => `<button class="tab ${activeView === key ? 'active' : ''}" aria-pressed="${activeView === key}" onclick="setView('${key}')">${label}</button>`).join('')}</nav>`;
}

function renderActiveView() {
  if (activeView === 'cierre') return renderCloseView();
  if (activeView === 'edicion') return renderEditView();
  return renderCaptureView();
}

const TIPO_LABEL = { casa: 'Casa', departamento: 'Departamento', terreno: 'Terreno', quinta: 'Quinta' };

function getFocusPiso() {
  const pisos = state.pisos && state.pisos.length ? state.pisos : ['Piso 1'];
  return setupPiso && pisos.includes(setupPiso) ? setupPiso : pisos[0];
}

function renderSetup() {
  const pisos = state.pisos && state.pisos.length ? state.pisos : ['Piso 1'];
  const focusP = getFocusPiso();
  const added = new Set(state.espacios.map((e) => e.nombre.toLowerCase()));
  const sugg = (logic.SPACE_SUGGESTIONS[setupTipo] || []).filter((row) => !added.has(row[0].toLowerCase()) && !row[3]);
  return `<section class="setup">
    <div class="setup-hd"><h2>Armar cuartos</h2><p>Agrega solo lo que aplica. Puedes volver a entrar cuando quieras.</p></div>
    <div class="setup-block">
      <label class="setup-lbl">Tipo de propiedad</label>
      <div class="seg">${['casa', 'departamento', 'terreno', 'quinta'].map((t) => `<button class="seg-btn${setupTipo === t ? ' active' : ''}" onclick="setSetupTipo('${t}')">${TIPO_LABEL[t]}</button>`).join('')}</div>
    </div>
    <div class="setup-block">
      <label class="setup-lbl">Pisos</label>
      <div class="chips">${pisos.map((p) => `<button class="chip${p === focusP ? ' active' : ''}" onclick="setSetupPiso('${esc(p)}')">${esc(p)}<i class="ti ti-x chip-x" onclick="event.stopPropagation();quitarPiso('${esc(p)}')"></i></button>`).join('')}<button class="chip add" onclick="agregarPiso()"><i class="ti ti-plus"></i>piso</button></div>
    </div>
    <div class="setup-block">
      <label class="setup-lbl">Agregar a <b>${esc(focusP)}</b></label>
      <div class="setup-add"><input class="field" id="setup-input" type="text" placeholder="Escribe un cuarto y Enter" autocomplete="off" onkeydown="if(event.key==='Enter')agregarCuartoEscrito()"><button class="btn" onclick="agregarCuartoEscrito()">Agregar</button></div>
      <div class="chips suggest">${sugg.length ? sugg.slice(0, 18).map((row) => `<button class="chip" onclick="agregarCuartoSugerido('${esc(row[0])}','${row[1]}')"><i class="ti ti-plus"></i>${esc(row[0])}</button>`).join('') : '<span class="muted">Sin más sugerencias para este tipo.</span>'}</div>
    </div>
    ${state.espacios.length ? `<div class="setup-block"><label class="setup-lbl">Cuartos · ${state.espacios.length}</label>${renderSetupList()}</div>
      <button class="primary block" onclick="cerrarSetup()">Listo, a capturar</button>` : ''}
  </section>`;
}

function renderSetupList() {
  const pisos = state.pisos && state.pisos.length ? state.pisos : [...new Set(state.espacios.map((e) => e.piso || 'Sin piso'))];
  return pisos.map((p) => {
    const rooms = state.espacios.filter((e) => (e.piso || 'Sin piso') === p && !e.parentId).sort((a, b) => (a.orden || 0) - (b.orden || 0));
    if (!rooms.length) return '';
    return `<div class="setup-piso-group"><div class="setup-piso-name">${esc(p)}</div>${rooms.map(setupRoomRow).join('')}</div>`;
  }).join('');
}

function setupRoomRow(room) {
  const subs = state.espacios.filter((e) => e.parentId === room.id);
  return `<div class="setup-room"><span class="setup-room-name">${esc(room.nombre)}</span>
    <button class="setup-mini" onclick="addSubSetup('${room.id}')"><i class="ti ti-plus"></i>sub</button>
    <button class="setup-mini del" onclick="delSetup('${room.id}')" aria-label="Borrar"><i class="ti ti-trash"></i></button></div>
    ${subs.map((s) => `<div class="setup-room sub"><span class="setup-room-name">${esc(s.nombre)}</span><button class="setup-mini del" onclick="delSetup('${s.id}')" aria-label="Borrar"><i class="ti ti-trash"></i></button></div>`).join('')}`;
}

function nuevoEspacio(nombre, piso, zona, parentId) {
  state.espacios.push({
    id: 'esp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    nombre: nombre.trim(), piso, zona: zona || 'interior', parentId: parentId || null,
    clave: false, orden: state.espacios.length + 1,
    estados: { foto: { estado: 'pendiente' }, t360: { estado: 'pendiente' }, video: { estado: 'pendiente' } },
  });
}

function setSetupTipo(t) { setupTipo = t; render(); }
function setSetupPiso(p) { setupPiso = p; render(); }
function abrirSetup() { setupOpen = true; cerrarModal(); render(); }
function cerrarSetup() { setupOpen = false; render(); }

function agregarCuartoEscrito() {
  const input = document.getElementById('setup-input');
  const value = input && input.value.trim();
  if (!value) return;
  nuevoEspacio(value, getFocusPiso(), 'interior');
  scheduleSave();
  render();
  const again = document.getElementById('setup-input');
  if (again) again.focus();
}

function agregarCuartoSugerido(nombre, zona) {
  nuevoEspacio(nombre, getFocusPiso(), zona);
  scheduleSave();
  render();
}

function agregarPiso() {
  const sug = ['Sótano', 'Piso 1', 'Piso 2', 'Piso 3', 'Roof', 'Exterior', 'Amenidades', 'Casa principal'].filter((p) => !(state.pisos || []).includes(p));
  abrirModal(`<div class="sheet-head"><h2>Agregar piso</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="chips" style="margin-bottom:12px">${sug.map((p) => `<button class="chip" onclick="confirmarPiso('${esc(p)}')"><i class="ti ti-plus"></i>${esc(p)}</button>`).join('')}</div>
    <div class="setup-add"><input class="field" id="piso-input" type="text" placeholder="Otro piso" autocomplete="off" onkeydown="if(event.key==='Enter')confirmarPisoInput()"><button class="btn" onclick="confirmarPisoInput()">Agregar</button></div>`);
}

function confirmarPiso(p) {
  if (!state.pisos) state.pisos = [];
  if (!state.pisos.includes(p)) state.pisos.push(p);
  setupPiso = p;
  cerrarModal(); scheduleSave(); render();
}

function confirmarPisoInput() {
  const value = document.getElementById('piso-input').value.trim();
  if (value) confirmarPiso(value);
}

function quitarPiso(p) {
  if (state.espacios.some((e) => (e.piso || '') === p)) return showToast('Ese piso tiene cuartos');
  state.pisos = (state.pisos || []).filter((x) => x !== p);
  if (setupPiso === p) setupPiso = null;
  scheduleSave(); render();
}

function addSubSetup(parentId) {
  const parent = state.espacios.find((e) => e.id === parentId);
  if (!parent) return;
  abrirModal(`<div class="sheet-head"><h2>Sub-cuarto de ${esc(parent.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="setup-add"><input class="field" id="sub-input" type="text" placeholder="Baño, clóset…" autocomplete="off" onkeydown="if(event.key==='Enter')confirmarSub('${parentId}')"><button class="btn" onclick="confirmarSub('${parentId}')">Agregar</button></div>`);
}

function confirmarSub(parentId) {
  const value = document.getElementById('sub-input').value.trim();
  if (!value) return;
  const parent = state.espacios.find((e) => e.id === parentId);
  if (!parent) return;
  nuevoEspacio(value, parent.piso, parent.zona, parentId);
  cerrarModal(); scheduleSave(); render();
}

function delSetup(id) {
  const ids = new Set(logic.getDescendantIds(state, id));
  if ((state.mediaFiles || []).some((f) => ids.has(f.targetId)) || state.bitacora.some((b) => ids.has(b.targetId))) return showToast('Tiene tomas registradas');
  state.espacios = state.espacios.filter((e) => !ids.has(e.id));
  scheduleSave(); render();
}

function renderTemplateCard(key) {
  const template = logic.TEMPLATE_DEFS[key];
  return `<button class="template-card ${key === 'amenidades' ? 'featured' : ''}" onclick="abrirTemplate('${key}')">
    <strong>${esc(template.label)}</strong>
    <span>${esc(template.description)}</span>
  </button>`;
}

function renderSummary() {
  const summary = logic.getPendingSummary(state);
  const pct = summary.totalRequired ? Math.round(summary.totalDone / summary.totalRequired * 100) : 0;
  const risk = getPrimaryRisk(summary);
  return `<section class="summary-card">
    <div class="summary-top">
      <div><div class="summary-title">${summary.keyPending.length ? `Faltan ${summary.keyPending.length} claves` : 'Claves listas'}</div><div class="summary-risk ${risk.ok ? 'ok' : ''}">${esc(risk.text)}</div></div>
      <div class="progress-block"><div class="progress-num">${summary.totalDone}/${summary.totalRequired} listo</div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>
    </div>
    <div class="summary-tags">
      ${Object.entries(summary.byService).map(([key, item]) => `<span class="tag ${item.pending.length ? '' : 'ok'}">${SERVICE_UI[key].short} ${item.done}/${item.required}</span>`).join('')}
    </div>
  </section>`;
}

function getPrimaryRisk(summary) {
  const amenities = summary.byZone.amenidades || {};
  const amenityRisk = ['video', 't360', 'foto'].find((key) => amenities[key] && amenities[key].pending.length);
  if (amenityRisk) return { text: `Riesgo principal: Amenidades sin ${SERVICE_UI[amenityRisk].short}`, ok: false };
  if (summary.keyPending.length) return { text: `Riesgo principal: ${summary.keyPending[0].nombre} sin ${SERVICE_UI[summary.keyPending[0].service].short}`, ok: false };
  if (summary.byService.drone && summary.byService.drone.pending.length) return { text: 'Riesgo principal: Drone incompleto', ok: false };
  if (summary.totalPending) return { text: `${summary.totalPending} registros normales pendientes`, ok: false };
  return { text: 'Sin riesgos pendientes', ok: true };
}

function renderCaptureView() {
  if (isMediaMode()) return renderMediaCapture();
  return renderCoverage();
}

function renderCoverage() {
  const svc = state.modoActual;
  const pisos = state.pisos && state.pisos.length ? state.pisos : [...new Set(state.espacios.map((e) => e.piso || 'Sin piso'))];
  const groups = pisos.map((p) => {
    const rooms = state.espacios.filter((e) => (e.piso || 'Sin piso') === p).sort((a, b) => (a.orden || 0) - (b.orden || 0));
    if (!rooms.length) return '';
    const done = rooms.filter((r) => (r.estados[svc] || {}).estado === 'hecho').length;
    const na = rooms.filter((r) => (r.estados[svc] || {}).estado === 'no_aplica').length;
    return `<section class="cov-group"><div class="cov-piso"><span>${esc(p)}</span><span class="cov-count">${done}/${rooms.length - na} listo</span></div>
      <div class="cov-grid">${rooms.map((r) => covTile(r, svc)).join('')}</div></section>`;
  }).join('');
  return `<div class="cov-hd">
      <div><h2 class="cov-title">${esc(SERVICE_UI[svc].label)}</h2><p class="cov-sub">Toca un cuarto para marcar su cobertura.</p></div>
      <button class="cov-edit" onclick="abrirSetup()" aria-label="Armar cuartos"><i class="ti ti-home-cog"></i></button>
    </div>
    ${groups || '<div class="empty"><h2>Sin cuartos</h2><p>Arma la lista de cuartos para empezar.</p></div>'}`;
}

function covTile(room, svc) {
  const st = (room.estados[svc] || {}).estado || 'pendiente';
  const icon = st === 'hecho' ? 'circle-check-filled' : st === 'no_aplica' ? 'circle-minus' : 'circle';
  const label = st === 'hecho' ? 'listo' : st === 'no_aplica' ? 'no aplica' : 'pendiente';
  return `<button class="cov-tile ${st}${room.parentId ? ' sub' : ''}" onclick="cycleCobertura('${room.id}')">
    <span class="cov-name">${esc(room.nombre)}</span>
    <span class="cov-state"><i class="ti ti-${icon}"></i>${label}</span>
  </button>`;
}

function cycleCobertura(id) {
  const svc = state.modoActual;
  const sp = state.espacios.find((e) => e.id === id);
  if (!sp) return;
  const cur = (sp.estados[svc] || {}).estado || 'pendiente';
  const nextSt = cur === 'pendiente' ? 'hecho' : cur === 'hecho' ? 'no_aplica' : 'pendiente';
  sp.estados[svc] = nextSt === 'hecho' ? { estado: 'hecho', autor: miNombre() } : { estado: nextSt };
  scheduleSave();
  render();
}

function activeTarget() {
  const list = state.modoActual === 'drone' ? state.droneItems : state.espacios;
  if (!list.length) return null;
  if (activeRoomId) {
    const found = list.find((item) => item.id === activeRoomId);
    if (found) return found;
  }
  const camera = activeCamera();
  if (camera) {
    const cameraIds = new Set((state.cameras || []).filter((c) => c.mode === camera.mode).map((c) => c.id));
    const files = (state.mediaFiles || []).filter((f) => cameraIds.has(f.cameraId) && f.targetId);
    if (files.length) {
      const last = list.find((item) => item.id === files[files.length - 1].targetId);
      if (last) return last;
    }
  }
  return list[0];
}

function discardShort(file) {
  return { empty: 'vacío', failed: 'fallida', unrelated: 'no relacionado' }[file.discardReason] || 'descarte';
}

function renderMediaCapture() {
  const target = activeTarget();
  if (!target) {
    return `<div class="empty"><h2>Sin espacios todavía</h2><p>Agrega cuartos para empezar a registrar.</p><button class="primary" onclick="abrirSetup()" style="margin-top:12px">Armar cuartos</button></div>`;
  }
  const isDrone = state.modoActual === 'drone';
  const camera = activeCamera();
  const seq = camera && logic.getCameraSequence(state, camera.id);
  const nextTok = seq && seq.nextToken;
  const files = mediaFilesForTarget(target.id);
  const good = files.filter((f) => f.kind === 'take' && f.good);
  const piso = isDrone ? 'Drone' : (target.piso || 'Sin piso');
  const parentName = !isDrone && target.parentId ? (state.espacios.find((e) => e.id === target.parentId) || {}).nombre : '';
  return `
  <section class="cap-focus">
    <span class="cap-floor"><i class="ti ti-stairs-up"></i>${esc(piso)}</span>
    <h2 class="cap-room">${parentName ? `<span class="cap-parent">${esc(parentName)}</span>` : ''}${esc(target.nombre)}</h2>
  </section>
  <div class="cap-cam">
    <span class="cap-cam-ic"><i class="ti ti-camera"></i></span>
    <div class="cap-cam-copy">
      <div class="cap-cam-lbl">${esc(camera ? camera.label : 'Sin cámara')}</div>
      <div class="cap-cam-next">${nextTok ? `siguiente archivo · <b>${esc(nextTok)}</b>` : 'inicia la secuencia antes de grabar'}</div>
    </div>
    <button class="cap-swap" aria-label="Cambiar o iniciar cámara" onclick="${state.modoActual === 'video' ? 'abrirCamaras()' : 'abrirSecuencia()'}"><i class="ti ti-switch-horizontal"></i></button>
  </div>
  <button class="cap-change" onclick="abrirCambiarCuarto()">
    <span class="cap-change-l"><i class="ti ti-arrows-exchange"></i>Cambiar ${isDrone ? 'toma' : 'cuarto'}</span>
    <i class="ti ti-chevron-right cap-change-chev"></i>
  </button>
  <section class="cap-takes">
    <div class="cap-takes-hd"><span>Tomas en ${isDrone ? 'esta toma' : 'este cuarto'}</span><span class="cap-takes-n">${files.length} · ${good.length} buena${good.length === 1 ? '' : 's'}</span></div>
    ${files.length ? renderCapTakes(files) : `<p class="cap-empty">Aún no registras nada aquí. Da Toma cuando grabes.</p>`}
  </section>
  <div class="cap-thumb">
    <button class="cap-btn-toma" onclick="registrarArchivo('${target.id}','take')"><span class="cap-toma-lbl">Toma</span>${nextTok ? `<span class="cap-toma-sub">+1 · ${esc(nextTok)}</span>` : ''}</button>
    <button class="cap-btn-no" onclick="noSirve('${target.id}')"><i class="ti ti-circle-x"></i><span>No sirve</span></button>
  </div>`;
}

function renderCapTakes(files) {
  return files.slice().reverse().map((file, index) => {
    const latest = index === 0;
    const right = file.kind === 'take'
      ? (file.good
        ? `<span class="cap-badge good"><i class="ti ti-star-filled"></i>buena</span>`
        : `<button class="cap-mark" onclick="toggleBuena('${file.id}')"><i class="ti ti-star"></i>Marcar buena</button>`)
      : `<span class="cap-badge fail"><i class="ti ti-x"></i>${esc(discardShort(file))}</span>`;
    return `<div class="cap-take${latest ? ' latest' : ''}">
      <button class="cap-take-main" onclick="abrirArchivo('${file.id}')">
        <span class="cap-tok">${esc(file.fileToken)}</span>
        <span class="cap-take-meta">${esc(mediaKindLabel(file))} · ${esc(file.author || '')}</span>
      </button>
      ${right}
    </div>`;
  }).join('');
}

function noSirve(targetId) {
  registrarArchivo(targetId, 'discard', 'failed');
}

function abrirCambiarCuarto() {
  if (state.modoActual === 'drone') {
    abrirModal(`<div class="sheet-head"><h2>Cambiar toma</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
      <div class="cuarto-list">${state.droneItems.map((item) => cuartoRow(item, 'drone')).join('')}</div>`);
    return;
  }
  const pisos = state.pisos && state.pisos.length ? state.pisos : [...new Set(state.espacios.map((e) => e.piso || 'Sin piso'))];
  const body = pisos.map((piso) => {
    const rooms = state.espacios.filter((e) => (e.piso || 'Sin piso') === piso).sort((a, b) => (a.orden || 0) - (b.orden || 0));
    if (!rooms.length) return '';
    return `<div class="cuarto-piso">${esc(piso)}</div>${rooms.map((r) => cuartoRow(r, 'space')).join('')}`;
  }).join('');
  abrirModal(`<div class="sheet-head"><h2>Cambiar cuarto</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="cuarto-list">${body}</div>`);
}

function cuartoRow(item, type) {
  const done = type === 'drone' ? item.estado === 'hecho' : mediaFilesForTarget(item.id).some((f) => f.kind === 'take');
  const child = type === 'space' && item.parentId;
  const active = item.id === (activeTarget() || {}).id;
  return `<button class="cuarto-row${child ? ' child' : ''}${active ? ' active' : ''}" onclick="setActiveRoom('${item.id}')">
    <span class="cuarto-name">${esc(item.nombre)}</span>
    ${done ? `<span class="cuarto-done"><i class="ti ti-check"></i>grabado</span>` : ''}
  </button>`;
}

function setActiveRoom(id) {
  const prev = activeTarget();
  activeRoomId = id;
  localStorage.setItem(roomKey(), id);
  cerrarModal();
  render();
  if (prev && prev.id !== id) promptBuena(prev);
}

function promptBuena(target) {
  if (!target || !isMediaMode()) return;
  const files = mediaFilesForTarget(target.id).filter((f) => f.kind === 'take');
  if (!files.length || files.some((f) => f.good)) return;
  abrirPromptBuena(target.id);
}

function abrirPromptBuena(targetId) {
  const target = state.espacios.find((e) => e.id === targetId) || state.droneItems.find((d) => d.id === targetId);
  if (!target) return;
  const files = mediaFilesForTarget(targetId).filter((f) => f.kind === 'take');
  abrirModal(`<div class="sheet-head"><h2>¿Cuál fue la buena en ${esc(target.nombre)}?</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <p class="sheet-note">Marca una o dos. O cierra y la decides luego.</p>
    <div class="cuarto-list">${files.map((f) => `<button class="cuarto-row${f.good ? ' active' : ''}" onclick="togglePromptBuena('${f.id}','${targetId}')"><span class="cuarto-name mono">${esc(f.fileToken)}</span>${f.good ? '<span class="cuarto-done"><i class="ti ti-star-filled"></i>buena</span>' : '<span class="cuarto-meta">tocar para marcar</span>'}</button>`).join('')}</div>
    <button class="primary block" onclick="cerrarModal()" style="width:100%">Listo</button>`);
}

function togglePromptBuena(mediaId, targetId) {
  state = logic.toggleMediaGood(state, mediaId);
  scheduleSave();
  render();
  abrirPromptBuena(targetId);
}

function visibleSpaces() {
  const term = searchTerm.trim().toLowerCase();
  return state.espacios
    .filter((space) => !term || space.nombre.toLowerCase().includes(term))
    .sort((a, b) => (a.orden || 0) - (b.orden || 0));
}

function renderSpaceGroups() {
  const groups = {};
  visibleSpaces().forEach((space) => {
    const zone = space.zona || 'interior';
    if (!groups[zone]) groups[zone] = [];
    groups[zone].push(space);
  });
  const order = ['interior', 'exterior', 'amenidades'];
  return order.filter((zone) => groups[zone] && groups[zone].length).map((zone) => `
    <section class="zone">
      <div class="zone-title"><span>${ZONE_LABELS[zone]}</span><span>${groups[zone].length}</span></div>
      <div class="cards">${groups[zone].map(renderSpaceCard).join('')}</div>
    </section>
  `).join('') || '<div class="empty"><h2>Sin resultados</h2><p>No hay espacios con esa busqueda.</p></div>';
}

function renderDroneCards() {
  return `<section class="zone">
    <div class="zone-title"><span>Tomas Drone</span><span>${state.droneItems.length}</span></div>
    <div class="cards">${state.droneItems.map(renderDroneCard).join('')}</div>
  </section>`;
}

function renderSpaceCard(space) {
  if (state.modoActual === 'video') return renderMediaTargetCard(space, 'space');
  const current = (space.estados[state.modoActual] || {}).estado || 'pendiente';
  const noAplica = current === 'no_aplica';
  const managing = current === 'hecho';
  const parentPath = space.parentId ? logic.getScenePath(state, space.id, 'video').split(' > ').slice(0, -1).join(' > ') : '';
  const label = parentPath || (space.zona === 'amenidades' ? `Amenidad${space.clave ? ' clave' : ''}` : space.clave ? 'Clave' : ZONE_LABELS[space.zona || 'interior']);
  return `<article class="capture-card ${space.parentId ? 'child' : ''} ${space.clave ? 'key' : ''} ${space.zona === 'amenidades' ? 'amenity' : ''}">
    <div class="card-head">
      <div class="card-name"><strong>${esc(space.nombre)}</strong><span>${label}</span></div>
      <button class="icon-btn" aria-label="Opciones de ${esc(space.nombre)}" onclick="abrirAcciones('space','${space.id}')">...</button>
    </div>
    <div class="state-list">${['foto', 't360', 'video'].filter((key) => state.servicios[key]).map((key) => renderStateToken(key, space.estados[key])).join('')}</div>
    <button class="primary-action ${managing || noAplica ? 'manage' : ''}" onclick="${noAplica ? `reactivarTarget('space','${space.id}','${state.modoActual}')` : `capturar('${space.id}')`}">${noAplica ? `Reactivar ${SERVICE_UI[state.modoActual].short}` : captureActionLabel(state.modoActual, space.id, managing)}</button>
  </article>`;
}

function renderDroneCard(item) {
  if (state.modoActual === 'drone') return renderMediaTargetCard(item, 'drone');
  const managing = item.estado === 'hecho';
  return `<article class="capture-card">
    <div class="card-head">
      <div class="card-name"><strong>${esc(item.nombre)}</strong><span>Drone${item.noAplica ? ' - No aplica' : ''}</span></div>
      <button class="icon-btn" aria-label="Opciones de ${esc(item.nombre)}" onclick="abrirAcciones('drone','${item.id}')">...</button>
    </div>
    <div class="state-list"><span class="state ${item.estado === 'hecho' ? 'done drone' : item.noAplica ? 'na' : ''}">${item.estado === 'hecho' ? 'Drone ' + String(item.ultimoOrden || '').padStart(2, '0') : item.noAplica ? 'No aplica' : 'Drone pendiente'}</span></div>
    <button class="primary-action ${managing ? 'manage' : ''}" onclick="capturar('${item.id}')">${captureActionLabel('drone', item.id, managing)}</button>
  </article>`;
}

function mediaFilesForTarget(targetId) {
  const camera = activeCamera();
  if (!camera) return [];
  const cameraIds = new Set((state.cameras || []).filter((item) => item.mode === camera.mode).map((item) => item.id));
  return (state.mediaFiles || []).filter((file) => cameraIds.has(file.cameraId) && file.targetId === targetId);
}

function renderMediaTargetCard(target, type) {
  const files = mediaFilesForTarget(target.id);
  const takes = files.filter((file) => file.kind === 'take');
  const good = takes.filter((file) => file.good);
  const noAplica = type === 'drone' ? target.noAplica : (target.estados.video || {}).estado === 'no_aplica';
  const parentPath = type === 'space' && target.parentId ? logic.getScenePath(state, target.id, 'video').split(' > ').slice(0, -1).join(' > ') : '';
  const label = parentPath || (type === 'drone' ? 'Drone' : target.zona === 'amenidades' ? `Amenidad${target.clave ? ' clave' : ''}` : target.clave ? 'Clave' : ZONE_LABELS[target.zona || 'interior']);
  return `<article class="capture-card ${target.parentId ? 'child' : ''} ${target.clave ? 'key' : ''} ${target.zona === 'amenidades' ? 'amenity' : ''}">
    <div class="card-head">
      <div class="card-name"><strong>${esc(target.nombre)}</strong><span>${label}</span></div>
      <button class="icon-btn" aria-label="Opciones de ${esc(target.nombre)}" onclick="abrirAcciones('${type}','${target.id}')">...</button>
    </div>
    ${noAplica ? `<div class="file-summary">Este elemento no aplica</div>
      <button class="primary-action manage" onclick="reactivarTarget('${type}','${target.id}','${type === 'drone' ? 'drone' : 'video'}')">Reactivar ${type === 'drone' ? 'Drone' : 'Video'}</button>` : `
      <div class="file-summary">${files.length} ${files.length === 1 ? 'archivo' : 'archivos'} · ${good.length} ${good.length === 1 ? 'buena' : 'buenas'}</div>
      ${renderRecentFiles(files, target.id)}
      <div class="file-actions">
        <button class="primary-action" onclick="registrarArchivo('${target.id}','take')">Registrar toma</button>
        <button class="discard-action" onclick="abrirDescarte('${target.id}')">Descarte</button>
      </div>`}
  </article>`;
}

function reactivarTarget(type, targetId, service) {
  if (type === 'drone') {
    const item = state.droneItems.find((entry) => entry.id === targetId);
    if (item) item.noAplica = false;
  } else {
    const space = state.espacios.find((entry) => entry.id === targetId);
    if (space) space.estados[service] = { estado: 'pendiente' };
  }
  cerrarModal();
  render();
  scheduleSave();
}

function renderRecentFiles(files, targetId) {
  if (!files.length) return '';
  return `<div class="recent-files">${files.slice(-3).reverse().map((file) => `<div class="file-row">
    <button class="file-token" onclick="abrirArchivo('${file.id}')">${esc(file.fileToken)}</button>
    <span class="file-kind">${esc(mediaKindLabel(file))} · ${esc(cameraLabel(file.cameraId))}</span>
    ${file.kind === 'take' ? `<button class="file-good ${file.good ? 'active' : ''}" onclick="toggleBuena('${file.id}')">${file.good ? 'BUENA' : 'Marcar buena'}</button>` : `<button class="file-good" onclick="abrirArchivo('${file.id}')">Opciones</button>`}
  </div>`).join('')}${files.length > 3 ? `<button class="all-files-btn" onclick="abrirArchivosEscena('${targetId}')">Ver los ${files.length} archivos</button>` : ''}</div>`;
}

function cameraLabel(cameraId) {
  return ((state.cameras || []).find((camera) => camera.id === cameraId) || {}).label || 'Camara';
}

function mediaKindLabel(file) {
  if (file.kind === 'take') return `Toma ${file.shotNumber || ''}`;
  if (file.kind === 'omitted') return 'Sin identificar';
  return { empty: 'Vacio / accidental', failed: 'Toma fallida', unrelated: 'No relacionado' }[file.discardReason] || 'Descarte';
}

function captureActionLabel(tipo, targetId, managing) {
  if (!managing) return `Registrar ${SERVICE_UI[tipo].verb}`;
  const count = state.bitacora.filter((entry) => entry.tipo === tipo && entry.targetId === targetId && entry.intencion !== 'nota').length;
  if ((tipo === 'video' || tipo === 'drone') && count > 1) return `${count} tomas de ${SERVICE_UI[tipo].short.toLowerCase()} · revisar`;
  if (tipo === 'foto') return 'Foto registrada · opciones';
  if (tipo === 'drone') return 'Drone registrado · opciones';
  return `${SERVICE_UI[tipo].label} registrado · opciones`;
}

function renderStateToken(key, stateValue) {
  const status = (stateValue || {}).estado || 'pendiente';
  if (status === 'no_aplica') return `<span class="state na">${SERVICE_UI[key].short} no aplica</span>`;
  if (status !== 'hecho') return `<span class="state">${SERVICE_UI[key].short} falta</span>`;
  const order = stateValue.ultimoOrden ? ' ' + String(stateValue.ultimoOrden).padStart(2, '0') : '';
  return `<span class="state done ${key === 'video' ? 'video' : ''}">${SERVICE_UI[key].short}${order} listo</span>`;
}

function setMode(mode) { state.modoActual = mode; searchTerm = ''; render(); scheduleSave(); }
function setView(view) { activeView = view; render(); }

function abrirCamaras() {
  const cameras = (state.cameras || []).filter((camera) => camera.mode === state.modoActual);
  abrirModal(`<div class="sheet-head"><h2>Camara de ${SERVICE_UI[state.modoActual].short}</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="action-stack">${cameras.map((camera) => `<button class="${activeCamera() && activeCamera().id === camera.id ? 'primary' : 'btn'}" onclick="setCamera('${camera.id}')">${esc(camera.label)}</button>`).join('')}</div>`);
}

function setCamera(cameraId) {
  state.activeCameraByMode[state.modoActual] = cameraId;
  cerrarModal(); render(); scheduleSave();
}

function abrirSecuencia() {
  const camera = activeCamera();
  if (!camera) return;
  abrirModal(`<div class="sheet-head"><h2>${esc(camera.label)}</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="sheet-body">
      <div class="sequence-alert">Escribe el ultimo archivo que ya existe en la camara. Checklist comenzara con el siguiente consecutivo.</div>
      <input class="field" id="last-filename" type="text" placeholder="${camera.kind === 'dji' ? 'DJI_20260517111742_0245_D' : '20260520_PIB2818'}" autocomplete="off" autofocus>
      <button class="primary" onclick="iniciarSecuencia()">Iniciar nuevo tramo</button>
    </div>`);
}

function iniciarSecuencia() {
  const camera = activeCamera();
  const input = document.getElementById('last-filename');
  if (!camera || !input || !input.value.trim()) return;
  if (!logic.parseFilenameSequence(input.value.trim(), camera.kind)) return showToast('No encontramos un consecutivo en ese nombre');
  const current = logic.getCameraSequence(state, camera.id);
  if (current.nextToken && !confirm(`Iniciar un nuevo tramo para ${camera.label}? El tramo actual termina antes de ${current.nextToken}.`)) return;
  const next = logic.initializeCameraSequence(state, { cameraId: camera.id, lastFilename: input.value.trim() });
  const nextToken = logic.getCameraSequence(next, camera.id).nextToken;
  if ((state.mediaFiles || []).some((file) => file.cameraId === camera.id && file.fileToken === nextToken)) return showToast(`El siguiente archivo ${nextToken} ya esta registrado`);
  state = next;
  cerrarModal(); render(); scheduleSave();
}

function registrarArchivo(targetId, kind, discardReason) {
  const camera = activeCamera();
  if (!camera || !logic.getCameraSequence(state, camera.id).nextToken) return abrirSecuencia();
  const previous = state;
  state = logic.registerMediaFile(state, { cameraId: camera.id, targetId, kind, discardReason, autor: miNombre(), now: new Date() });
  if (state === previous) return showToast('Reactiva este elemento antes de registrar');
  render(); scheduleSave();
  const file = state.mediaFiles[state.mediaFiles.length - 1];
  showToast(`${file.fileToken} registrado`);
}

function abrirDescarte(targetId) {
  const camera = activeCamera();
  if (!camera || !logic.getCameraSequence(state, camera.id).nextToken) return abrirSecuencia();
  abrirModal(`<div class="sheet-head"><h2>Registrar descarte</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="action-stack">
      <button class="btn" onclick="confirmarDescarte('${targetId}','empty')">Vacio / accidental</button>
      <button class="btn" onclick="confirmarDescarte('${targetId}','failed')">Toma fallida</button>
      <button class="btn" onclick="confirmarDescarte('${targetId}','unrelated')">No relacionado</button>
      <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}

function confirmarDescarte(targetId, reason) {
  cerrarModal();
  registrarArchivo(targetId, 'discard', reason);
}

function toggleBuena(mediaId) {
  state = logic.toggleMediaGood(state, mediaId);
  render(); scheduleSave();
}

function abrirArchivo(mediaId) {
  const file = (state.mediaFiles || []).find((item) => item.id === mediaId);
  if (!file) return;
  abrirModal(`<div class="sheet-head"><h2>${esc(file.fileToken)}</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="action-stack">
      <button class="btn" onclick="insertarOmitido('${file.id}')">Insertar archivo olvidado antes</button>
      <button class="btn" onclick="abrirAsignacionArchivo('${file.id}')">${file.kind === 'omitted' ? 'Identificar archivo' : 'Cambiar escena'}</button>
      ${file.kind !== 'take' ? `<button class="btn" onclick="convertirArchivoToma('${file.id}')">Convertir en toma</button>` : ''}
      ${file.kind === 'take' ? `<button class="btn" onclick="abrirCambioDescarte('${file.id}')">Convertir en descarte</button>` : ''}
      ${file.kind === 'discard' ? `<button class="btn" onclick="abrirCambioDescarte('${file.id}')">Cambiar motivo de descarte</button>` : ''}
      <button class="btn" onclick="agregarNotaArchivo('${file.id}')">Agregar nota</button>
      <button class="danger btn" onclick="eliminarRegistroArchivo('${file.id}')">Eliminar registro: no se creo archivo</button>
      <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}

function abrirArchivosEscena(targetId) {
  const files = mediaFilesForTarget(targetId).slice().reverse();
  const target = state.espacios.find((item) => item.id === targetId) || state.droneItems.find((item) => item.id === targetId);
  abrirModal(`<div class="sheet-head"><h2>${esc(target ? target.nombre : 'Archivos')}</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="sheet-body"><div class="recent-files">${files.map((file) => `<div class="file-row">
      <button class="file-token" onclick="abrirArchivo('${file.id}')">${esc(file.fileToken)}</button>
      <span class="file-kind">${esc(mediaKindLabel(file))} · ${esc(cameraLabel(file.cameraId))}</span>
      ${file.kind === 'take' ? `<button class="file-good ${file.good ? 'active' : ''}" onclick="toggleBuenaDesdeModal('${file.id}','${targetId}')">${file.good ? 'BUENA' : 'Marcar buena'}</button>` : `<button class="file-good" onclick="abrirArchivo('${file.id}')">Opciones</button>`}
    </div>`).join('')}</div></div>`);
}

function toggleBuenaDesdeModal(mediaId, targetId) {
  state = logic.toggleMediaGood(state, mediaId);
  scheduleSave();
  abrirArchivosEscena(targetId);
}

function insertarOmitido(mediaId) {
  if (!confirm('Insertar un archivo antes y recorrer los consecutivos posteriores de esta camara?')) return;
  state = logic.insertOmittedMediaFile(state, mediaId);
  const inserted = state.mediaFiles.find((file, index) => state.mediaFiles[index + 1] && state.mediaFiles[index + 1].id === mediaId);
  if (inserted) inserted.author = miNombre();
  cerrarModal(); render(); scheduleSave();
}

function eliminarRegistroArchivo(mediaId) {
  if (!confirm('Usa esto solamente si la camara NO creo un archivo. Se recorreran los consecutivos posteriores. Continuar?')) return;
  state = logic.removeMediaFile(state, mediaId);
  cerrarModal(); render(); scheduleSave();
}

function agregarNotaArchivo(mediaId) {
  const file = state.mediaFiles.find((item) => item.id === mediaId);
  if (!file) return;
  const note = prompt('Nota para edicion', file.note || '');
  if (note === null) return;
  state = logic.updateMediaFile(state, mediaId, { note: note.trim() });
  cerrarModal(); render(); scheduleSave();
}

function abrirAsignacionArchivo(mediaId) {
  const file = state.mediaFiles.find((item) => item.id === mediaId);
  const camera = file && state.cameras.find((item) => item.id === file.cameraId);
  if (!file || !camera) return;
  const targets = camera.mode === 'drone' ? state.droneItems : state.espacios;
  abrirModal(`<div class="sheet-head"><h2>Asignar ${esc(file.fileToken)}</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="action-stack">${targets.map((target) => `<button class="btn" onclick="asignarArchivo('${file.id}','${target.id}')">${esc(target.nombre)}</button>`).join('')}</div>`);
}

function asignarArchivo(mediaId, targetId) {
  const wasOmitted = (state.mediaFiles.find((item) => item.id === mediaId) || {}).kind === 'omitted';
  state = logic.updateMediaFile(state, mediaId, { targetId });
  render(); scheduleSave();
  if (wasOmitted) return abrirArchivo(mediaId);
  cerrarModal();
}

function convertirArchivoToma(mediaId) {
  const file = state.mediaFiles.find((item) => item.id === mediaId);
  if (!file || !file.targetId) return abrirAsignacionArchivo(mediaId);
  state = logic.updateMediaFile(state, mediaId, { kind: 'take' });
  cerrarModal(); render(); scheduleSave();
}

function abrirCambioDescarte(mediaId) {
  abrirModal(`<div class="sheet-head"><h2>Convertir en descarte</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="action-stack">
      <button class="btn" onclick="convertirArchivoDescarte('${mediaId}','empty')">Vacio / accidental</button>
      <button class="btn" onclick="convertirArchivoDescarte('${mediaId}','failed')">Toma fallida</button>
      <button class="btn" onclick="convertirArchivoDescarte('${mediaId}','unrelated')">No relacionado</button>
    </div>`);
}

function convertirArchivoDescarte(mediaId, reason) {
  state = logic.updateMediaFile(state, mediaId, { kind: 'discard', discardReason: reason });
  cerrarModal(); render(); scheduleSave();
}

function capturar(targetId) {
  if (isMediaMode()) return registrarArchivo(targetId, 'take');
  if (state.modoActual === 'drone') {
    const item = state.droneItems.find((entry) => entry.id === targetId);
    if (item && item.estado === 'hecho') return abrirGestionCaptura('drone', targetId);
  } else {
    const space = state.espacios.find((entry) => entry.id === targetId);
    const current = space && space.estados[state.modoActual];
    if (current && current.estado === 'hecho') return abrirGestionCaptura(state.modoActual, targetId);
  }
  registrarCaptura(targetId, 'principal');
}

function registrarCaptura(targetId, intencion) {
  const previous = state;
  state = logic.registerCapture(state, { tipo: state.modoActual, targetId, autor: miNombre(), intencion, now: new Date() });
  render();
  scheduleSave();
  const latest = state.bitacora[state.bitacora.length - 1];
  if (latest && previous !== state) {
    showToast(`${SERVICE_UI[latest.tipo].short}${latest.orden ? ' ' + String(latest.orden).padStart(2, '0') : ''} registrado`, () => {
      state = previous;
      render();
      scheduleSave();
    });
  }
}

function abrirGestionCaptura(tipo, targetId) {
  selectedAction = { type: tipo === 'drone' ? 'drone' : 'space', id: targetId, service: tipo };
  const target = tipo === 'drone' ? state.droneItems.find((entry) => entry.id === targetId) : state.espacios.find((entry) => entry.id === targetId);
  if (!target) return;
  if (tipo === 'video' || tipo === 'drone') {
    abrirModal(`<div class="sheet-head"><h2>${esc(target.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
      <div class="action-stack">
        <button class="primary" onclick="registrarIntencion('repetida')">Repetir toma</button>
        <button class="btn" onclick="registrarIntencion('extra')">Toma extra</button>
        <button class="btn" onclick="registrarIntencion('reemplazo')">Esta reemplaza la anterior</button>
        <button class="btn" onclick="addTargetNote()">Agregar nota</button>
        <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>
      </div>`);
    return;
  }
  abrirModal(`<div class="sheet-head"><h2>${esc(target.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="action-stack">
      <button class="btn" onclick="clearEstado('${tipo}')">Marcar pendiente</button>
      <button class="btn" onclick="markNoAplica('${tipo}')">Marcar no aplica</button>
      <button class="btn" onclick="addTargetNote()">Agregar nota</button>
      <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}

function registrarIntencion(intencion) {
  const id = selectedAction.id;
  state.modoActual = selectedAction.service;
  cerrarModal();
  registrarCaptura(id, intencion);
}

function renderCloseView() {
  const summary = logic.getPendingSummary(state);
  const repeated = state.bitacora.filter((entry) => ['repetida', 'extra', 'reemplazo', 'problema'].includes(entry.intencion) || entry.bandera);
  const noAplica = getNoAplicaItems();
  const disabled = Object.entries(state.servicios).filter(([, active]) => !active).map(([key]) => SERVICE_UI[key].label);
  const urgent = closeUrgentItems(summary);
  const review = [
    ...repeated.map((entry) => `<strong>${esc(entry.nombre)}</strong>: ${SERVICE_UI[entry.tipo].short} ${entry.orden || ''} marcada como ${esc(entry.intencion || entry.bandera)}`),
    ...noAplica.map((item) => `<strong>No aplica:</strong> ${esc(item)}`),
    ...disabled.map((item) => `<strong>Servicio apagado:</strong> ${esc(item)}`),
  ];
  const ready = closeReadyItems(summary);
  return `<div class="close-list">
    ${renderMediaClosePanels()}
    <section class="panel traffic red"><h3 class="traffic-title"><span></span>Falta antes de irnos</h3>${urgent.length ? urgent.slice(0, 12).map(renderReviewItem).join('') : '<p class="line">No hay faltantes prioritarios.</p>'}</section>
    <section class="panel traffic yellow"><h3 class="traffic-title"><span></span>Revisar</h3>${review.length ? review.slice(0, 12).map(renderReviewItem).join('') : '<p class="line">No hay excepciones que revisar.</p>'}</section>
    <section class="panel traffic green"><h3 class="traffic-title"><span></span>Listo</h3>${ready.map(renderReviewItem).join('') || '<p class="line">Completa los puntos prioritarios para cerrar.</p>'}</section>
    <section class="panel"><h3>Detalle normal pendiente</h3>${renderNormalPending(summary)}</section>
  </div>`;
}

function renderMediaClosePanels() {
  const files = state.mediaFiles || [];
  const unidentified = files.filter((file) => file.kind === 'omitted' || file.scene === 'Sin identificar');
  const sceneGroups = logic.getMediaSceneGroups(state).filter((group) => group.hasTake);
  const groupLabel = (group) => `${SERVICE_UI[group.mode]?.short || 'Archivo'} · ${group.scenePath}`;
  const withoutGood = sceneGroups.filter((group) => !group.hasGood);
  const tooManyGood = sceneGroups.filter((group) => group.goodCount >= 3);
  const discardCounts = files.filter((file) => file.kind === 'discard').reduce((counts, file) => {
    counts[file.discardReason] = (counts[file.discardReason] || 0) + 1;
    return counts;
  }, {});
  const cameras = (state.cameras || []).map((camera) => {
    const seq = logic.getCameraSequence(state, camera.id);
    const cameraFiles = files.filter((file) => file.cameraId === camera.id);
    if (!state.servicios[camera.mode]) return '';
    if (camera.optional && !seq.segment && !cameraFiles.length) return '';
    if (!seq.segment && !cameraFiles.length) return `<div class="review-item"><strong>${esc(camera.label)}</strong><div>Sin secuencia iniciada</div></div>`;
    const last = cameraFiles[cameraFiles.length - 1];
    return `<div class="review-item"><strong>${esc(camera.label)}</strong><div>${last ? `Checklist termina en ${esc(last.fileToken)} · confirma en camara` : 'Secuencia iniciada sin archivos'}</div></div>`;
  }).join('');
  return `<section class="panel traffic yellow"><h3 class="traffic-title"><span></span>Reconciliar archivos</h3>${cameras || '<p class="line">Aun no hay secuencias iniciadas.</p>'}</section>
    <section class="panel"><h3>Seleccion para edicion</h3>
      ${withoutGood.length ? withoutGood.map((group) => renderReviewItem(`<strong>${esc(groupLabel(group))}</strong>: ninguna toma buena`)).join('') : sceneGroups.length ? '<p class="line">Todas las escenas grabadas tienen una buena.</p>' : '<p class="line">Aun no hay tomas registradas.</p>'}
      ${tooManyGood.map((group) => renderReviewItem(`<strong>${esc(groupLabel(group))}</strong>: tres o mas buenas`)).join('')}
      ${unidentified.map((file) => `<div class="review-item"><strong>${esc(file.fileToken)}</strong><div>Sin identificar</div><button class="mini-btn" onclick="abrirArchivo('${file.id}')">Resolver</button></div>`).join('')}
      ${Object.keys(discardCounts).length ? `<p class="line">Descartes: ${Object.entries(discardCounts).map(([reason, count]) => `${mediaKindLabel({ kind: 'discard', discardReason: reason })} ${count}`).join(' · ')}</p>` : ''}
    </section>`;
}

function renderReviewItem(item) {
  return `<div class="review-item"><span>—</span><div>${item}</div></div>`;
}

function closeUrgentItems(summary) {
  const seen = new Set();
  const items = [];
  summary.keyPending.forEach((item) => {
    const key = `${item.service}:${item.nombre}`;
    if (!seen.has(key)) items.push(`<strong>${esc(item.nombre)}</strong>: falta ${SERVICE_UI[item.service].short}`);
    seen.add(key);
  });
  Object.entries(summary.byZone.amenidades || {}).forEach(([service, data]) => data.pending.forEach((name) => {
    const key = `${service}:${name}`;
    if (!seen.has(key)) items.push(`<strong>${esc(name)}</strong>: falta ${SERVICE_UI[service].short} en amenidad`);
    seen.add(key);
  }));
  if (summary.byService.drone) summary.byService.drone.pending.forEach((name) => items.push(`<strong>${esc(name)}</strong>: falta Drone`));
  return items;
}

function closeReadyItems(summary) {
  const items = [];
  ['interior', 'exterior', 'amenidades'].forEach((zone) => {
    const services = Object.values(summary.byZone[zone] || {});
    if (services.length && services.every((item) => !item.pending.length)) items.push(`<strong>${ZONE_LABELS[zone]}</strong> completo`);
  });
  if (summary.byService.drone && !summary.byService.drone.pending.length) items.push('<strong>Drone</strong> completo');
  if (!summary.keyPending.length) items.unshift('<strong>Espacios clave</strong> completos');
  return items;
}

function renderNormalPending(summary) {
  const keyNames = new Set(summary.keyPending.map((item) => `${item.service}:${item.nombre}`));
  const lines = ['interior', 'exterior'].flatMap((zone) => Object.entries(summary.byZone[zone] || {}).flatMap(([service, item]) =>
    item.pending.filter((name) => !keyNames.has(`${service}:${name}`)).map((name) => `${SERVICE_UI[service].short}: ${name}`)
  ));
  return lines.length ? lines.slice(0, 14).map((line) => `<p class="line">${esc(line)}</p>`).join('') : '<p class="line">Sin faltantes normales.</p>';
}

function renderEditView() {
  if ((state.mediaFiles || []).length) return renderMediaEditView();
  const video = primarySequence('video');
  const drone = primarySequence('drone');
  const repeated = state.bitacora.filter((entry) => ['repetida', 'extra', 'reemplazo'].includes(entry.intencion));
  const notes = state.bitacora.filter((entry) => entry.nota || entry.bandera);
  const amenities = state.espacios.filter((space) => space.zona === 'amenidades');
  return `<div class="edit-list">
    <section class="panel"><h3>Video principal</h3>${renderSequence(video, 'Sin video registrado.')}</section>
    <section class="panel"><h3>Drone principal</h3>${renderSequence(drone, 'Sin drone registrado.')}</section>
    <section class="panel"><h3>Repetidas / extras</h3>${repeated.length ? repeated.map((entry) => `<div class="review-item"><strong>${SERVICE_UI[entry.tipo].short} ${String(entry.orden || '').padStart(2, '0')}</strong><div>${esc(entry.nombre)} · ${esc(entry.intencion)}</div></div>`).join('') : '<p class="line">Sin repetidas ni extras.</p>'}</section>
    <section class="panel"><h3>Notas para edicion</h3>${notes.length ? notes.map((entry) => `<div class="review-item"><strong>${esc(entry.nombre)}</strong><div>${esc(entry.nota || entry.bandera)}</div></div>`).join('') : '<p class="line">Sin notas.</p>'}</section>
    <section class="panel"><h3>Amenidades capturadas</h3>${amenities.length ? amenities.map((space) => `<div class="review-item"><strong>${esc(space.nombre)}</strong><div>${amenityDone(space)}</div></div>`).join('') : '<p class="line">Sin amenidades cargadas.</p>'}</section>
  </div>`;
}

function renderMediaEditView() {
  const files = state.mediaFiles || [];
  const groups = logic.getMediaSceneGroups(state);
  const cameraLabel = (id) => ((state.cameras || []).find((camera) => camera.id === id) || {}).label || id;
  const legacy = state.bitacora.filter((entry) => entry.tipo === 'video' || entry.tipo === 'drone');
  return `<div class="edit-list">${groups.map((group) => {
    const items = group.files;
    const good = items.filter((file) => file.kind === 'take' && file.good);
    const other = items.filter((file) => file.kind === 'take' && !file.good);
    const discards = items.filter((file) => file.kind === 'discard');
    const omitted = items.filter((file) => file.kind === 'omitted');
    return `<section class="panel">
      <h3>${esc(SERVICE_UI[group.mode]?.short || 'Archivo')} · ${esc(group.scenePath)}</h3>
      ${good.length ? `<p class="line"><strong>Buenas:</strong> ${good.map((file) => esc(file.fileToken)).join(', ')}</p>` : '<p class="line"><strong>Buenas:</strong> ninguna</p>'}
      ${other.length ? `<p class="line"><strong>Otras:</strong> ${other.map((file) => esc(file.fileToken)).join(', ')}</p>` : ''}
      ${discards.length ? `<p class="line"><strong>Descartes:</strong> ${discards.map((file) => `${esc(file.fileToken)} (${esc(mediaKindLabel(file))})`).join(', ')}</p>` : ''}
      ${omitted.length ? `<p class="line"><strong>Sin identificar:</strong> ${omitted.map((file) => esc(file.fileToken)).join(', ')}</p>` : ''}
      <p class="sequence-meta">${[...new Set(items.map((file) => cameraLabel(file.cameraId)))].map(esc).join(' · ')}</p>
      ${items.filter((file) => file.note).map((file) => `<p class="line">${esc(file.fileToken)} · ${esc(file.note)}</p>`).join('')}
    </section>`;
  }).join('')}
    ${legacy.length ? `<section class="panel"><h3>Historial anterior</h3>${legacy.map((entry) => `<div class="review-item"><strong>${SERVICE_UI[entry.tipo].short} ${entry.orden || ''}</strong><div>${esc(entry.nombre)}${entry.intencion ? ' · ' + esc(entry.intencion) : ''}</div></div>`).join('')}</section>` : ''}
  </div>`;
}

function primarySequence(tipo) {
  const entries = state.bitacora.filter((entry) => entry.tipo === tipo && (!entry.intencion || entry.intencion === 'principal' || entry.intencion === 'reemplazo'));
  const replacements = new Set(state.bitacora.filter((entry) => entry.tipo === tipo && entry.intencion === 'reemplazo').map((entry) => entry.targetId));
  return entries.filter((entry) => entry.intencion === 'reemplazo' || !replacements.has(entry.targetId));
}

function renderSequence(items, emptyText) {
  if (!items.length) return `<p class="line">${emptyText}</p>`;
  return `<div class="sequence">${items.map((entry) => `<div class="sequence-row"><div class="sequence-num">${String(entry.orden || '').padStart(2, '0')}</div><div><div class="sequence-name">${esc(entry.nombre)}</div><div class="sequence-meta">${esc(entry.autor)}${entry.hora ? ' · ' + esc(entry.hora) : ''}</div></div></div>`).join('')}</div>`;
}

function amenityDone(space) {
  return ['foto', 't360', 'video'].filter((service) => (space.estados[service] || {}).estado === 'hecho').map((service) => SERVICE_UI[service].short).join(', ') || 'pendiente';
}

function getNoAplicaItems() {
  const items = [];
  state.espacios.forEach((space) => {
    ['foto', 't360', 'video'].forEach((service) => {
      if ((space.estados[service] || {}).estado === 'no_aplica') items.push(`${SERVICE_UI[service].label}: ${space.nombre}`);
    });
  });
  state.droneItems.forEach((item) => { if (item.noAplica) items.push(`Drone: ${item.nombre}`); });
  return items;
}

function abrirTemplate(key) {
  selectedTemplate = key;
  modalTab = 'plantillas';
  renderTemplateSheet();
}

function abrirEspacios(tab) {
  modalTab = tab || 'plantillas';
  renderTemplateSheet();
}

function renderTemplateSheet() {
  const template = logic.TEMPLATE_DEFS[selectedTemplate] || logic.TEMPLATE_DEFS.casa;
  const html = `<div class="sheet-head"><h2>Agregar espacios</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="sheet-tabs">
      <button class="sheet-tab ${modalTab === 'plantillas' ? 'active' : ''}" onclick="modalTab='plantillas';renderTemplateSheet()">Plantillas</button>
      <button class="sheet-tab ${modalTab === 'lista' ? 'active' : ''}" onclick="modalTab='lista';renderTemplateSheet()">Lista propia</button>
    </div>
    ${modalTab === 'plantillas' ? renderTemplateTab(template) : renderListTab()}`;
  abrirModal(html);
}

function renderTemplateTab(template) {
  return `<div class="sheet-body">
    <div class="template-grid">${Object.keys(logic.TEMPLATE_DEFS).map((key) => `<button class="template-card ${selectedTemplate === key ? 'selected' : ''}" onclick="selectedTemplate='${key}';renderTemplateSheet()"><strong>${esc(logic.TEMPLATE_DEFS[key].label)}</strong><span>${esc(logic.TEMPLATE_DEFS[key].description)}</span></button>`).join('')}</div>
    <div class="preview">${renderTemplatePreview(template)}</div>
    <button class="primary" onclick="usarTemplate('replace')">${state.espacios.length ? 'Reemplazar todo' : 'Usar plantilla'}</button>
    ${state.espacios.length ? '<button class="btn" onclick="usarTemplate(&quot;append&quot;)">Agregar a existente</button>' : ''}
  </div>`;
}

function renderTemplatePreview(template) {
  const groups = {};
  template.spaces.forEach((row) => {
    if (!groups[row[1]]) groups[row[1]] = [];
    groups[row[1]].push(row);
  });
  return Object.entries(groups).map(([zone, rows]) => `<h3>${ZONE_LABELS[zone]}</h3>${rows.map((row) => `<div>${row[3] ? '&nbsp;&nbsp;- ' : '- '}${esc(row[0])}${row[2] ? ' (clave)' : ''}</div>`).join('')}`).join('');
}

function renderListTab() {
  return `<div class="sheet-body">
    <textarea class="textarea" id="batch-text" placeholder="Sala&#10;Cocina&#10;Recamara principal&#10;  Bano principal&#10;  Closet"></textarea>
    <div class="preview" id="batch-preview"><h3>Ejemplo</h3><div>Recamara principal</div><div>&nbsp;&nbsp;- Bano principal</div><div>&nbsp;&nbsp;- Closet</div></div>
    <button class="primary" onclick="confirmarLista()">Agregar espacios</button>
  </div>`;
}

function usarTemplate(mode) {
  if (mode === 'replace' && (state.bitacora.length || (state.mediaFiles || []).length || (state.sequenceSegments || []).length) && !confirm('Reemplazar todo eliminara la bitacora, secuencias y archivos registrados. Continuar?')) return;
  state = logic.applyTemplate(state, selectedTemplate, { mode });
  cerrarModal();
  render();
  scheduleSave();
}

function confirmarLista() {
  const text = document.getElementById('batch-text').value;
  if (!text.trim()) return;
  state = logic.addSpacesFromText(state, text);
  cerrarModal();
  render();
  scheduleSave();
}

function abrirServicios() {
  abrirModal(`<div class="sheet-head"><h2>Servicios activos</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="action-stack">${Object.keys(SERVICE_UI).map((key) => `<button class="btn" onclick="toggleServicio('${key}')">${state.servicios[key] ? 'Apagar' : 'Activar'} ${SERVICE_UI[key].label}</button>`).join('')}</div>`);
}

function toggleServicio(key) {
  state = logic.setServiceActive(state, key, !state.servicios[key]);
  ensureActiveMode();
  abrirServicios();
  render();
  scheduleSave();
}

function abrirAcciones(type, id) {
  selectedAction = { type, id };
  const item = type === 'drone' ? state.droneItems.find((entry) => entry.id === id) : state.espacios.find((entry) => entry.id === id);
  if (!item) return;
  const hasMedia = (state.mediaFiles || []).some((file) => file.targetId === id);
  const serviceActions = type === 'space'
    ? ['foto', 't360', 'video'].filter((key) => state.servicios[key] && !(key === 'video' && hasMedia)).map((key) => {
      const noAplica = (item.estados[key] || {}).estado === 'no_aplica';
      return `<button class="btn" onclick="${noAplica ? `reactivarTarget('space','${item.id}','${key}')` : `markNoAplica('${key}')`}">${noAplica ? 'Reactivar' : 'No aplica:'} ${SERVICE_UI[key].label}</button>`;
    }).join('')
    : hasMedia ? '' : `<button class="btn" onclick="${item.noAplica ? `reactivarTarget('drone','${item.id}','drone')` : 'markDroneNoAplica()'}">${item.noAplica ? 'Reactivar Drone' : 'Drone no aplica'}</button>`;
  abrirModal(`<div class="sheet-head"><h2>${esc(item.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()">X</button></div>
    <div class="action-stack">
      ${serviceActions}
      ${type === 'space' ? '<button class="btn" onclick="addSubspace()">Agregar subespacio</button>' : ''}
      <button class="btn" onclick="renameTarget()">Editar nombre</button>
      <button class="danger btn" onclick="deleteTarget()">Borrar</button>
    </div>`);
}

function markNoAplica(service) {
  const space = state.espacios.find((entry) => entry.id === selectedAction.id);
  if (!space || (space.clave && !confirm(`Marcar ${space.nombre} como no aplica para ${SERVICE_UI[service].label}?`))) return;
  space.estados[service] = { estado: 'no_aplica' };
  cerrarModal(); render(); scheduleSave();
}

function clearEstado(service) {
  const space = state.espacios.find((entry) => entry.id === selectedAction.id);
  if (space) space.estados[service] = { estado: 'pendiente' };
  cerrarModal(); render(); scheduleSave();
}

function markDroneNoAplica() {
  const item = state.droneItems.find((entry) => entry.id === selectedAction.id);
  if (item) { item.noAplica = true; item.estado = 'pendiente'; }
  cerrarModal(); render(); scheduleSave();
}

function addSubspace() {
  const nombre = prompt('Nombre del subespacio');
  if (!nombre) return;
  const parent = state.espacios.find((entry) => entry.id === selectedAction.id);
  state.espacios.push({ id: 'esp-' + Date.now().toString(36), nombre: nombre.trim(), parentId: selectedAction.id, orden: state.espacios.length + 1, zona: parent ? parent.zona : 'interior', clave: false, estados: { foto: { estado: 'pendiente' }, t360: { estado: 'pendiente' }, video: { estado: 'pendiente' } } });
  cerrarModal(); render(); scheduleSave();
}

function renameTarget() {
  const list = selectedAction.type === 'drone' ? state.droneItems : state.espacios;
  const item = list.find((entry) => entry.id === selectedAction.id);
  if (!item) return;
  const nombre = prompt('Nuevo nombre', item.nombre);
  if (!nombre) return;
  item.nombre = nombre.trim();
  state.bitacora.forEach((entry) => { if (entry.targetId === item.id) entry.nombre = item.nombre; });
  syncMediaSceneNames();
  cerrarModal(); render(); scheduleSave();
}

function syncMediaSceneNames() {
  (state.mediaFiles || []).forEach((file) => {
    if (!file.targetId || file.scene === 'Sin escena' || file.scene === 'Sin identificar') return;
    const camera = state.cameras.find((item) => item.id === file.cameraId);
    const targets = camera && camera.mode === 'drone' ? state.droneItems : state.espacios;
    const target = targets.find((item) => item.id === file.targetId);
    if (!target) return;
    file.scene = target.nombre;
    file.scenePath = logic.getScenePath(state, target.id, camera && camera.mode);
  });
}

function deleteTarget() {
  const ids = new Set(selectedAction.type === 'drone' ? [selectedAction.id] : logic.getDescendantIds(state, selectedAction.id));
  if ((state.mediaFiles || []).some((file) => ids.has(file.targetId)) || state.bitacora.some((entry) => ids.has(entry.targetId))) {
    showToast('No se puede borrar: tiene capturas registradas');
    cerrarModal();
    return;
  }
  if (!confirm('Borrar este elemento?')) return;
  if (selectedAction.type === 'drone') {
    state.droneItems = state.droneItems.filter((entry) => entry.id !== selectedAction.id);
  } else {
    state.espacios = state.espacios.filter((entry) => !ids.has(entry.id));
  }
  cerrarModal(); render(); scheduleSave();
}

function addTargetNote() {
  const note = prompt('Nota para edicion');
  if (!note || !note.trim()) return;
  const targetId = selectedAction.id;
  const tipo = selectedAction.service || state.modoActual;
  const name = tipo === 'drone' ? (state.droneItems.find((entry) => entry.id === targetId) || {}).nombre : (state.espacios.find((entry) => entry.id === targetId) || {}).nombre;
  state.bitacora.push({ id: 'log-note-' + Date.now().toString(36), tipo, targetId, nombre: name || '', autor: miNombre(), hora: new Date().getHours().toString().padStart(2, '0') + ':' + new Date().getMinutes().toString().padStart(2, '0'), nota: note.trim(), bandera: 'nota', intencion: 'nota' });
  cerrarModal(); render(); scheduleSave();
}

function abrirModal(html) {
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = html;
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('app').inert = true;
  requestAnimationFrame(() => (sheet.querySelector('[autofocus], button, input, textarea') || {}).focus?.());
}

function cerrarModal(event) {
  if (event && event.target && event.target.id !== 'overlay') return;
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('app').inert = false;
  selectedAction = null;
}

function showToast(message, undoHandler) {
  const toast = document.getElementById('toast');
  toast.innerHTML = `<span>${esc(message)}</span>${undoHandler ? '<button id="undo-btn">Deshacer</button>' : ''}`;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  if (undoHandler) document.getElementById('undo-btn').onclick = () => { undoHandler(); toast.classList.remove('visible'); };
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 3400);
}

function mostrarError(message) {
  document.getElementById('app').innerHTML = `<div class="state-screen"><div><h2>Algo salio mal</h2><p>${esc(message)}</p></div></div>`;
}

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && document.getElementById('overlay').classList.contains('visible')) cerrarModal();
});

if (DEMO) {
  cargarDemo();
} else if (!TOKEN) {
  mostrarError('Este enlace no tiene un token de contrato. Usa el boton Checklist desde el panel de administracion.');
} else {
  cargar();
}
  </script>
</body>
</html>
