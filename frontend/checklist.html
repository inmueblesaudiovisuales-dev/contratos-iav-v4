function renderConfigShot(section, key, shot, shotTypes, movements) {
  const isCustom = shot.id.startsWith('custom.');
  const sid = esc(shot.id);
  const sec = esc(section);
  const k = esc(key);
  const stOpts = Object.entries(shotTypes)
    .map(([kk, v]) => `<option value="${esc(kk)}"${shot.shotType === kk ? ' selected' : ''}>${esc(v.label)}</option>`)
    .join('');
  const movOpts = Object.entries(movements)
    .map(([kk, v]) => `<option value="${esc(kk)}"${shot.movement === kk ? ' selected' : ''}>${esc(v.label)}</option>`)
    .join('');
  return `<div class="cg-shot-card">
    <div class="cg-shot-row">
      <div class="cg-shot-fields">
        <input class="field cg-shot-nombre" value="${esc(shot.nombre)}" placeholder="Nombre" onchange="editarShotConfig('${sec}','${k}','${sid}','nombre',this.value)">
        <select class="field" onchange="editarShotConfig('${sec}','${k}','${sid}','shotType',this.value)">${stOpts}</select>
        <select class="field" onchange="editarShotConfig('${sec}','${k}','${sid}','movement',this.value)">${movOpts}</select>
        <input class="field" value="${esc(shot.enfoque)}" placeholder="En que enfocarse" onchange="editarShotConfig('${sec}','${k}','${sid}','enfoque',this.value)">
        <div class="chips cg-priority">
          <button class="chip${shot.priority === 'must' ? ' active' : ''}" onclick="editarShotConfig('${sec}','${k}','${sid}','priority','must')">clave</button>
          <button class="chip${shot.priority === 'nice' ? ' active' : ''}" onclick="editarShotConfig('${sec}','${k}','${sid}','priority','nice')">opcional</button>
        </div>
      </div>
      <div class="cg-shot-actions">
        ${isCustom
          ? `<button class="setup-mini del" onclick="eliminarShotConfig('${sec}','${k}','${sid}')" title="Eliminar"><i class="ti ti-trash"></i></button>`
          : `<button class="setup-mini" onclick="ocultarShotConfig('${sec}','${k}','${sid}')" title="Ocultar"><i class="ti ti-eye-off"></i></button>`}
      </div>
    </div>
  </div>`;
}

const CAMARA_MODES = [
  { value: 'video', label: 'Video' },
  { value: 'drone', label: 'Drone' },
  { value: 'audio', label: 'Audio' },
];
const CAMARA_KINDS = [
  { value: 'sony', label: 'Sony (prefijo + numero)' },
  { value: 'dji', label: 'DJI (numero + sufijo)' },
  { value: 'otro', label: 'Otro' },
];

function camaraPreviewToken(cam) {
  const width = Number(cam.counterWidth) > 0 ? Number(cam.counterWidth) : 0;
  if (!width) return '';
  const base = Number.isFinite(Number(cam.counterExampleNum)) ? Number(cam.counterExampleNum) : 0;
  // Mismo formato que logic.formatFileToken: prefijo + numero (ancho) + sufijo
  const next = (cam.prefixHint || '') + String(base + 1).padStart(width, '0');
  return next + (cam.suffixHint || '');
}

function renderConfigCamaras() {
  const cams = (guideConfigDraft && Array.isArray(guideConfigDraft.cameras))
    ? guideConfigDraft.cameras
    : logic.getCameras({});
  const hasOverride = !!(guideConfigDraft && Array.isArray(guideConfigDraft.cameras));
  const cards = cams.map((cam, idx) => {
    const cid = esc(cam.id || '');
    const modeOpts = CAMARA_MODES
      .map((m) => `<option value="${m.value}"${cam.mode === m.value ? ' selected' : ''}>${m.label}</option>`)
      .join('');
    const kindOpts = CAMARA_KINDS
      .map((k) => `<option value="${k.value}"${(cam.kind || 'otro') === k.value ? ' selected' : ''}>${esc(k.label)}</option>`)
      .join('');
    const preview = camaraPreviewToken(cam);
    const previewHtml = preview
      ? `<div class="cg-cam-preview">Siguiente: <span class="cg-cam-token">${esc(preview)}</span></div>`
      : `<div class="cg-cam-preview cg-cam-preview-empty">Pega un nombre de archivo de ejemplo para ver el siguiente.</div>`;
    return `<div class="cg-shot-card">
      <div class="cg-shot-row">
        <div class="cg-shot-fields">
          <input class="field cg-shot-nombre" value="${esc(cam.label || '')}" placeholder="Nombre" onchange="editarCamaraConfig(${idx},'label',this.value)">
          <input class="field" value="${cid}" placeholder="id" onchange="editarCamaraConfig(${idx},'id',this.value)">
          <select class="field" onchange="editarCamaraConfig(${idx},'mode',this.value)">${modeOpts}</select>
          <select class="field" onchange="editarCamaraConfig(${idx},'kind',this.value)">${kindOpts}</select>
          <input class="field" value="${esc(cam.counterExample || '')}" placeholder="Ejemplo de archivo (p. ej. PIB2818)" onchange="editarCamaraEjemplo(${idx},this.value)">
          ${previewHtml}
        </div>
        <div class="cg-shot-actions">
          <button class="setup-mini del" onclick="eliminarCamaraConfig(${idx})" title="Eliminar"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    </div>`;
  }).join('');
  return `<div class="cg-section-head">
      <h3>Camaras</h3>
      ${hasOverride ? `<button class="setup-mini" onclick="restaurarCamarasConfig()"><i class="ti ti-rotate-clockwise"></i> restaurar</button>` : ''}
    </div>
    <div class="setup-block cg-section">
      ${cards}
      <button class="chip add" style="margin-top:8px" onclick="agregarCamaraConfig()"><i class="ti ti-plus"></i>agregar camara</button>
    </div>`;
}

function ensureCamarasDraft() {
  if (!guideConfigDraft) guideConfigDraft = {};
  if (!Array.isArray(guideConfigDraft.cameras)) {
    guideConfigDraft.cameras = logic.getCameras({}).map((c) => Object.assign({}, c));
  }
  return guideConfigDraft.cameras;
}

function editarCamaraConfig(idx, field, value) {
  const cams = ensureCamarasDraft();
  if (!cams[idx]) return;
  cams[idx][field] = value;
  if (field === 'kind' && cams[idx].counterExample) {
    aplicarEjemploCamara(cams[idx], cams[idx].counterExample);
  }
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function aplicarEjemploCamara(cam, ejemplo) {
  const parsed = logic.parseFilenameSequence(ejemplo, cam.kind);
  cam.counterExample = ejemplo;
  if (parsed) {
    cam.prefixHint = parsed.prefixHint;
    cam.suffixHint = parsed.suffixHint;
    cam.counterWidth = parsed.counterWidth;
    cam.counterExampleNum = parsed.counter;
  } else {
    cam.prefixHint = '';
    cam.suffixHint = '';
    cam.counterWidth = 0;
    cam.counterExampleNum = null;
  }
}

function editarCamaraEjemplo(idx, value) {
  const cams = ensureCamarasDraft();
  if (!cams[idx]) return;
  aplicarEjemploCamara(cams[idx], value);
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function agregarCamaraConfig() {
  const cams = ensureCamarasDraft();
  const rand = Math.random().toString(36).slice(2, 7);
  cams.push({ id: 'cam-' + rand, label: 'Nueva camara', mode: 'video', kind: 'otro' });
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function eliminarCamaraConfig(idx) {
  const cams = ensureCamarasDraft();
  if (idx < 0 || idx >= cams.length) return;
  cams.splice(idx, 1);
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function restaurarCamarasConfig() {
  if (guideConfigDraft) delete guideConfigDraft.cameras;
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function editarShotConfig(section, key, shotId, field, value) {
  if (!guideConfigDraft[section]) guideConfigDraft[section] = {};
  if (!guideConfigDraft[section][key]) guideConfigDraft[section][key] = {};
  const over = guideConfigDraft[section][key];
  if (!over.shots) over.shots = [];
  let s = over.shots.find((x) => x.id === shotId);
  if (!s) { s = { id: shotId }; over.shots.push(s); }
  s[field] = value;
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function ocultarShotConfig(section, key, shotId) {
  if (!guideConfigDraft[section]) guideConfigDraft[section] = {};
  if (!guideConfigDraft[section][key]) guideConfigDraft[section][key] = {};
  const over = guideConfigDraft[section][key];
  if (!over.shots) over.shots = [];
  let s = over.shots.find((x) => x.id === shotId);
  if (!s) { s = { id: shotId }; over.shots.push(s); }
  s.removed = true;
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function eliminarShotConfig(section, key, shotId) {
  const over = guideConfigDraft[section] && guideConfigDraft[section][key];
  if (!over || !over.shots) return;
  over.shots = over.shots.filter((s) => s.id !== shotId);
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function agregarShotConfig(section, key) {
  if (!guideConfigDraft[section]) guideConfigDraft[section] = {};
  if (!guideConfigDraft[section][key]) guideConfigDraft[section][key] = {};
  const over = guideConfigDraft[section][key];
  if (!over.shots) over.shots = [];
  const rand = Math.random().toString(36).slice(2, 7);
  over.shots.push({ id: 'custom.' + key + '-' + rand, nombre: 'Nueva toma', shotType: 'wide', movement: 'static', enfoque: '', priority: 'nice' });
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function editarGlosario(glosario, id, field, value) {
  if (!guideConfigDraft[glosario]) guideConfigDraft[glosario] = {};
  if (!guideConfigDraft[glosario][id]) guideConfigDraft[glosario][id] = {};
  guideConfigDraft[glosario][id][field] = value;
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function agregarGlosario(glosario) {
  if (!guideConfigDraft[glosario]) guideConfigDraft[glosario] = {};
  const rand = Math.random().toString(36).slice(2, 7);
  guideConfigDraft[glosario]['custom.' + rand] = { label: 'Nuevo', hint: '' };
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function editarLabelCategoria(catId, value) {
  if (!guideConfigDraft.categorias) guideConfigDraft.categorias = {};
  if (!guideConfigDraft.categorias[catId]) guideConfigDraft.categorias[catId] = {};
  guideConfigDraft.categorias[catId].label = value;
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function editarKeywordsCategoria(catId, csv) {
  if (!guideConfigDraft.roomCategories) {
    guideConfigDraft.roomCategories = logic.getRoomCategories().map((c) => Object.assign({}, c, { keywords: c.keywords.slice() }));
  }
  const cat = guideConfigDraft.roomCategories.find((c) => c.id === catId);
  if (cat) cat.keywords = csv.split(',').map((s) => s.trim()).filter(Boolean);
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function restaurarSeccionGuia(section, key) {
  if (key !== undefined) {
    if (guideConfigDraft[section]) delete guideConfigDraft[section][key];
  } else {
    delete guideConfigDraft[section];
  }
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

function restaurarTodoGuia() {
  guideConfigDraft = {};
  logic.applyGuideConfig(guideConfigDraft);
  render();
}

async function guardarConfigGuia() {
  const key = await ensureAdminKey();
  if (!key) return;
  try {
    const r = await fetch('/api/guardarConfig', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: JSON.stringify({ clave: 'guia_config', valor: JSON.stringify(guideConfigDraft) }),
    });
    if (r.ok) {
      currentGuideConfig = JSON.parse(JSON.stringify(guideConfigDraft));
      logic.applyGuideConfig(guideConfigDraft);
      showToast('Guardado');
      render();
    } else {
      showToast('Error al guardar');
    }
  } catch (_) {
    showToast('Error de red');
  }
}

function abrirAccionesFoco() {
  const target = activeTarget();
  if (!target) return;
  const tipo = state.modoActual;
  const noAplica = tipo === 'video' && (target.estados.video || {}).estado === 'no_aplica';
  abrirModal(`<div class="sheet-head"><h2>${esc(target.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">
      <button class="btn" onclick="renombrarFoco()"><i class="ti ti-pencil"></i> Cambiar nombre</button>
      ${tipo === 'video' ? `<button class="btn" onclick="toggleNoAplicaVideo()"><i class="ti ti-${noAplica ? 'video' : 'video-off'}"></i> ${noAplica ? 'Reactivar video aquí' : 'Este cuarto no lleva video'}</button>` : ''}
    </div>`);
}

function renombrarFoco() {
  const target = activeTarget();
  if (!target) return;
  cerrarModal();
  if (state.modoActual === 'drone') renombrarLista('drone', target.id);
  else if (state.modoActual === 'asesor') renombrarLista('asesor', target.id);
  else renombrarEspacio(target.id);
}

function toggleNoAplicaVideo() {
  const sp = activeTarget();
  if (!sp || state.modoActual !== 'video') return;
  const cur = (sp.estados.video || {}).estado;
  sp.estados.video = cur === 'no_aplica' ? { estado: 'pendiente' } : { estado: 'no_aplica' };
  cerrarModal(); scheduleSave(); render();
}

function reactivarVideoFoco() {
  const sp = activeTarget();
  if (sp) sp.estados.video = { estado: 'pendiente' };
  scheduleSave(); render();
}

// F7 — toda la fila abre acciones (tocar la toma para corregir cualquier toma, incl. fallida).
function renderCapTakes(files) {
  const shotTypes = logic.getShotTypes();
  const movements = logic.getMovements();
  return files.slice().reverse().map((file) => {
    const isFail = file.kind !== 'take';
    let badge = '';
    if (isFail) badge = `<span class="cap-badge fail"><i class="ti ti-x"></i>${esc(discardShort(file))}</span>`;
    else if (file.favorite) badge = `<span class="cap-badge fav"><i class="ti ti-star-filled"></i>favorita</span>`;
    else if (file.good) badge = `<span class="cap-badge good"><i class="ti ti-check"></i>buena</span>`;
    const parts = [];
    if (file.shotType) parts.push((shotTypes[file.shotType] || {}).label || file.shotType);
    if (file.movement) parts.push((movements[file.movement] || {}).label || file.movement);
    const meta = parts.length ? parts.join(' · ') : (isFail ? mediaKindLabel(file) : (file.note || mediaKindLabel(file)));
    return `<button class="cap-take${isFail ? ' fail' : ''}" onclick="abrirArchivo('${esc(file.id)}')">
      <span class="cap-tok">${esc(file.fileToken)}</span>
      <span class="cap-take-meta">${esc(meta)}</span>
      ${badge}
    </button>`;
  }).join('');
}

function noSirve(targetId) {
  registrarArchivo(targetId, 'discard', 'failed');
}

function abrirCambiarCuarto() {
  // Drone comparte espacios tras F2: lista los mismos cuartos que video.
  const pisos = state.pisos && state.pisos.length ? state.pisos : [...new Set(state.espacios.map((e) => e.piso || 'Sin piso'))];
  const covMap = guideMode ? new Map(logic.guideCoverage(state, state.modoActual).map((c) => [c.target.id, c])) : null;
  const body = pisos.map((piso) => {
    const rooms = state.espacios.filter((e) => (e.piso || 'Sin piso') === piso).sort((a, b) => (a.orden || 0) - (b.orden || 0));
    if (!rooms.length) return '';
    return `<div class="cuarto-piso">${esc(piso)}</div>${rooms.map((r) => cuartoRow(r, 'space', covMap)).join('')}`;
  }).join('');
  abrirModal(`<div class="sheet-head"><h2>Cambiar cuarto</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="cuarto-list">${body}</div>
    <div class="action-stack" style="margin-top:12px">
      <button class="btn ghost" onclick="abrirOrdenarRecorrido()"><i class="ti ti-list-numbers"></i> Ordenar recorrido</button>
      <div class="setup-add"><input class="field" id="cuarto-rapido-input" placeholder="Cuarto nuevo y Enter" onkeydown="if(event.key==='Enter')agregarCuartoRapido()"><button class="btn" onclick="agregarCuartoRapido()">Agregar</button></div>
    </div>`);
}

function cuartoRow(item, type, covMap) {
  const done = type === 'drone' ? item.estado === 'hecho' : (item.estados[state.modoActual] || {}).estado === 'hecho';
  const child = type === 'space' && item.parentId;
  const active = item.id === (activeTarget() || {}).id;
  let faltanBadge = '';
  if (guideMode && type === 'space') {
    const cov = covMap ? covMap.get(item.id) : logic.guideCoverage(state, state.modoActual).find((c) => c.target.id === item.id);
    const n = cov ? cov.must.faltan.length : 0;
    if (n > 0) faltanBadge = `<span class="cuarto-faltan">faltan ${n}</span>`;
  }
  return `<button class="cuarto-row${child ? ' child' : ''}${active ? ' active' : ''}" onclick="setActiveRoom('${item.id}')">
    <span class="cuarto-name">${esc(item.nombre)}</span>
    ${done ? `<span class="cuarto-done"><i class="ti ti-check"></i>grabado</span>` : faltanBadge}
  </button>`;
}

function irACuartoVideo(id) {
  state.modoActual = 'video';
  localStorage.setItem(laneKey(), 'video');
  setActiveRoom(id);
}

function setActiveRoom(id) {
  activeRoomId = id;
  localStorage.setItem(roomKey(), id);
  // F7 — al cambiar de cuarto se limpia la etiqueta de la proxima toma; sin cuestionario "cual quedo".
  pendingShotType = null; pendingMovement = null; activeSugId = null; tagLibre = false;
  cerrarModal();
  render();
}

function agregarCuartoRapido() {
  const el = document.getElementById('cuarto-rapido-input');
  const v = el && el.value.trim();
  if (!v) return;
  const piso = (activeTarget() || {}).piso || (state.pisos && state.pisos[0]) || 'Piso 1';
  const nuevo = nuevoEspacio(v, piso, 'interior');
  activeRoomId = nuevo.id; localStorage.setItem(roomKey(), nuevo.id);
  scheduleSave(); abrirCambiarCuarto();
}

function setTipoPropiedadDrone(tipo) {
  if (!state.guide) state.guide = {};
  state.guide.tipoPropiedad = tipo;
  scheduleSave();
  render();
}

function visibleSpaces() {
  const term = searchTerm.trim().toLowerCase();
  return state.espacios
    .filter((space) => !term || space.nombre.toLowerCase().includes(term))
    .sort((a, b) => (a.orden || 0) - (b.orden || 0));
}

function renderSpaceGroups() {
  const groups = {};
  visibleSpaces().forEach((space) => {
    const zone = space.zona || 'interior';
    if (!groups[zone]) groups[zone] = [];
    groups[zone].push(space);
  });
  const order = ['interior', 'exterior', 'amenidades'];
  return order.filter((zone) => groups[zone] && groups[zone].length).map((zone) => `
    <section class="zone">
      <div class="zone-title"><span>${ZONE_LABELS[zone]}</span><span>${groups[zone].length}</span></div>
      <div class="cards">${groups[zone].map(renderSpaceCard).join('')}</div>
    </section>
  `).join('') || '<div class="empty"><h2>Sin resultados</h2><p>No hay espacios con esa busqueda.</p></div>';
}

function renderDroneCards() {
  return `<section class="zone">
    <div class="zone-title"><span>Tomas Drone</span><span>${state.droneItems.length}</span></div>
    <div class="cards">${state.droneItems.map(renderDroneCard).join('')}</div>
  </section>`;
}

function renderSpaceCard(space) {
  if (state.modoActual === 'video') return renderMediaTargetCard(space, 'space');
  const current = (space.estados[state.modoActual] || {}).estado || 'pendiente';
  const noAplica = current === 'no_aplica';
  const managing = current === 'hecho';
  const parentPath = space.parentId ? logic.getScenePath(state, space.id, 'video').split(' > ').slice(0, -1).join(' > ') : '';
  const label = parentPath || (space.zona === 'amenidades' ? `Amenidad${space.clave ? ' clave' : ''}` : space.clave ? 'Clave' : ZONE_LABELS[space.zona || 'interior']);
  return `<article class="capture-card ${space.parentId ? 'child' : ''} ${space.clave ? 'key' : ''} ${space.zona === 'amenidades' ? 'amenity' : ''}">
    <div class="card-head">
      <div class="card-name"><strong>${esc(space.nombre)}</strong><span>${label}</span></div>
      <button class="icon-btn" aria-label="Opciones de ${esc(space.nombre)}" onclick="abrirAcciones('space','${space.id}')">...</button>
    </div>
    <div class="state-list">${['foto', 't360', 'video'].filter((key) => state.servicios[key]).map((key) => renderStateToken(key, space.estados[key])).join('')}</div>
    <button class="primary-action ${managing || noAplica ? 'manage' : ''}" onclick="${noAplica ? `reactivarTarget('space','${space.id}','${state.modoActual}')` : `capturar('${space.id}')`}">${noAplica ? `Reactivar ${SERVICE_UI[state.modoActual].short}` : captureActionLabel(state.modoActual, space.id, managing)}</button>
  </article>`;
}

function renderDroneCard(item) {
  if (state.modoActual === 'drone') return renderMediaTargetCard(item, 'drone');
  const managing = item.estado === 'hecho';
  return `<article class="capture-card">
    <div class="card-head">
      <div class="card-name"><strong>${esc(item.nombre)}</strong><span>Drone${item.noAplica ? ' - No aplica' : ''}</span></div>
      <button class="icon-btn" aria-label="Opciones de ${esc(item.nombre)}" onclick="abrirAcciones('drone','${item.id}')">...</button>
    </div>
    <div class="state-list"><span class="state ${item.estado === 'hecho' ? 'done drone' : item.noAplica ? 'na' : ''}">${item.estado === 'hecho' ? 'Drone ' + String(item.ultimoOrden || '').padStart(2, '0') : item.noAplica ? 'No aplica' : 'Drone pendiente'}</span></div>
    <button class="primary-action ${managing ? 'manage' : ''}" onclick="capturar('${item.id}')">${captureActionLabel('drone', item.id, managing)}</button>
  </article>`;
}

function mediaFilesForTarget(targetId) {
  const camera = activeCamera();
  if (!camera) return [];
  const cameraIds = new Set((state.cameras || []).filter((item) => item.mode === camera.mode).map((item) => item.id));
  return (state.mediaFiles || []).filter((file) => cameraIds.has(file.cameraId) && file.targetId === targetId);
}

function renderMediaTargetCard(target, type) {
  const files = mediaFilesForTarget(target.id);
  const takes = files.filter((file) => file.kind === 'take');
  const good = takes.filter((file) => file.good);
  const noAplica = type === 'drone' ? target.noAplica : (target.estados.video || {}).estado === 'no_aplica';
  const parentPath = type === 'space' && target.parentId ? logic.getScenePath(state, target.id, 'video').split(' > ').slice(0, -1).join(' > ') : '';
  const label = parentPath || (type === 'drone' ? 'Drone' : target.zona === 'amenidades' ? `Amenidad${target.clave ? ' clave' : ''}` : target.clave ? 'Clave' : ZONE_LABELS[target.zona || 'interior']);
  return `<article class="capture-card ${target.parentId ? 'child' : ''} ${target.clave ? 'key' : ''} ${target.zona === 'amenidades' ? 'amenity' : ''}">
    <div class="card-head">
      <div class="card-name"><strong>${esc(target.nombre)}</strong><span>${label}</span></div>
      <button class="icon-btn" aria-label="Opciones de ${esc(target.nombre)}" onclick="abrirAcciones('${type}','${target.id}')">...</button>
    </div>
    ${noAplica ? `<div class="file-summary">Este elemento no aplica</div>
      <button class="primary-action manage" onclick="reactivarTarget('${type}','${target.id}','${type === 'drone' ? 'drone' : 'video'}')">Reactivar ${type === 'drone' ? 'Drone' : 'Video'}</button>` : `
      <div class="file-summary">${files.length} ${files.length === 1 ? 'archivo' : 'archivos'} · ${good.length} ${good.length === 1 ? 'buena' : 'buenas'}</div>
      ${renderRecentFiles(files, target.id)}
      <div class="file-actions">
        <button class="primary-action" onclick="registrarArchivo('${target.id}','take')">Registrar toma</button>
        <button class="discard-action" onclick="abrirDescarte('${target.id}')">Descarte</button>
      </div>`}
  </article>`;
}

function reactivarTarget(type, targetId, service) {
  if (type === 'drone') {
    const item = state.droneItems.find((entry) => entry.id === targetId);
    if (item) item.noAplica = false;
  } else {
    const space = state.espacios.find((entry) => entry.id === targetId);
    if (space) space.estados[service] = { estado: 'pendiente' };
  }
  cerrarModal();
  render();
  scheduleSave();
}

function renderRecentFiles(files, targetId) {
  if (!files.length) return '';
  return `<div class="recent-files">${files.slice(-3).reverse().map((file) => `<div class="file-row">
    <button class="file-token" onclick="abrirArchivo('${file.id}')">${esc(file.fileToken)}</button>
    <span class="file-kind">${esc(mediaKindLabel(file))} · ${esc(cameraLabel(file.cameraId))}</span>
    ${file.kind === 'take' ? `<button class="file-good ${file.good ? 'active' : ''}" onclick="toggleBuena('${file.id}')">${file.good ? 'BUENA' : 'Marcar buena'}</button>` : `<button class="file-good" onclick="abrirArchivo('${file.id}')">Opciones</button>`}
  </div>`).join('')}${files.length > 3 ? `<button class="all-files-btn" onclick="abrirArchivosEscena('${targetId}')">Ver los ${files.length} archivos</button>` : ''}</div>`;
}

function cameraLabel(cameraId) {
  return ((state.cameras || []).find((camera) => camera.id === cameraId) || {}).label || 'Camara';
}

function mediaKindLabel(file) {
  if (file.kind === 'take') return `Toma ${file.shotNumber || ''}`;
  if (file.kind === 'omitted') return 'Sin identificar';
  return { empty: 'Vacio / accidental', failed: 'Toma fallida', unrelated: 'No relacionado' }[file.discardReason] || 'Descarte';
}

function captureActionLabel(tipo, targetId, managing) {
  if (!managing) return `Registrar ${SERVICE_UI[tipo].verb}`;
  const count = state.bitacora.filter((entry) => entry.tipo === tipo && entry.targetId === targetId && entry.intencion !== 'nota').length;
  if ((tipo === 'video' || tipo === 'drone') && count > 1) return `${count} tomas de ${SERVICE_UI[tipo].short.toLowerCase()} · revisar`;
  if (tipo === 'foto') return 'Foto registrada · opciones';
  if (tipo === 'drone') return 'Drone registrado · opciones';
  return `${SERVICE_UI[tipo].label} registrado · opciones`;
}

function renderStateToken(key, stateValue) {
  const status = (stateValue || {}).estado || 'pendiente';
  if (status === 'no_aplica') return `<span class="state na">${SERVICE_UI[key].short} no aplica</span>`;
  if (status !== 'hecho') return `<span class="state">${SERVICE_UI[key].short} falta</span>`;
  const order = stateValue.ultimoOrden ? ' ' + String(stateValue.ultimoOrden).padStart(2, '0') : '';
  return `<span class="state done ${key === 'video' ? 'video' : ''}">${SERVICE_UI[key].short}${order} listo</span>`;
}

function setMode(mode) { state.modoActual = mode; searchTerm = ''; render(); scheduleSave(); }
function setView(view) { activeView = view; render(); }

function abrirCamaras() {
  const cameras = (state.cameras || []).filter((camera) => camera.mode === state.modoActual);
  abrirModal(`<div class="sheet-head"><h2>Camara de ${SERVICE_UI[state.modoActual].short}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">${cameras.map((camera) => `<button class="${activeCamera() && activeCamera().id === camera.id ? 'primary' : 'btn'}" onclick="setCamera('${camera.id}')">${esc(camera.label)}</button>`).join('')}</div>`);
}

function setCamera(cameraId) {
  // Elegir una camara fija el modo activo segun el modo de esa camara
  // (Drone DJI → modoActual='drone'; Sony/Osmo → 'video'). Asi el loop
  // (token "siguiente video", "+ foto", sugerencias) reacciona al nuevo modo.
  const cam = logic.getCameras(state).find((c) => c.id === cameraId);
  if (!state.activeCameraByMode) state.activeCameraByMode = {};
  if (cam && cam.mode) {
    state.modoActual = cam.mode;
    state.activeCameraByMode[cam.mode] = cameraId;
    // Recordar la ultima camara elegida para no pisar el modo por el rol.
    localStorage.setItem(laneKey(), cam.mode);
  } else {
    state.activeCameraByMode[state.modoActual] = cameraId;
  }
  cerrarModal(); render(); scheduleSave();
}

function abrirSecuencia() {
  const camera = activeCamera();
  if (!camera) return;
  abrirModal(`<div class="sheet-head"><h2>${esc(camera.label)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="sheet-body">
      <div class="sequence-alert">Escribe el ultimo archivo que ya existe en la camara. Checklist comenzara con el siguiente consecutivo.</div>
      <input class="field" id="last-filename" type="text" placeholder="${camera.kind === 'dji' ? 'DJI_20260517111742_0245_D' : '20260520_PIB2818'}" autocomplete="off" autofocus>
      <button class="primary" onclick="iniciarSecuencia()">Iniciar nuevo tramo</button>
    </div>`);
}

function iniciarSecuencia() {
  const camera = activeCamera();
  const input = document.getElementById('last-filename');
  if (!camera || !input || !input.value.trim()) return;
  const filename = input.value.trim();
  if (!logic.parseFilenameSequence(filename, camera.kind)) return showToast('No encontramos un consecutivo en ese nombre');
  const current = logic.getCameraSequence(state, camera.id);
  if (current.nextToken) {
    confirmSheet('Nuevo tramo', `El tramo actual de ${camera.label} termina antes de ${current.nextToken}. ¿Iniciar uno nuevo?`, 'Iniciar nuevo tramo', () => aplicarSecuencia(camera.id, filename));
  } else {
    aplicarSecuencia(camera.id, filename);
  }
}

function aplicarSecuencia(cameraId, filename) {
  const next = logic.initializeCameraSequence(state, { cameraId, lastFilename: filename });
  const nextToken = logic.getCameraSequence(next, cameraId).nextToken;
  if ((state.mediaFiles || []).some((file) => file.cameraId === cameraId && file.fileToken === nextToken)) return showToast(`El siguiente archivo ${nextToken} ya está registrado`);
  state = next;
  cerrarModal(); render(); scheduleSave();
}

// F7 — registra con la camara activa, el cuarto, y tipo/movimiento etiquetados (si hay).
// "No sirve" (discard 'failed') registra directo, sin preguntar y sin banner.
function registrarArchivo(targetId, kind, discardReason, ctx) {
  const camera = activeCamera();
  if (!camera || !logic.getCameraSequence(state, camera.id).nextToken) return abrirSecuencia();
  const previous = state;
  let suggFields = {};
  if (ctx && (ctx.shotType || ctx.movement || ctx.suggestionId)) {
    suggFields = { shotType: ctx.shotType || null, movement: ctx.movement || null, suggestionId: ctx.suggestionId || null };
  }
  state = logic.registerMediaFile(state, { cameraId: camera.id, targetId, kind, discardReason, autor: miNombre(), now: new Date(), ...suggFields });
  if (state === previous) return showToast('Reactiva este elemento antes de registrar');
  activeRoomId = targetId; localStorage.setItem(roomKey(), targetId);
  // No auto-avance: la etiqueta de la proxima toma se limpia tras grabar.
  if (kind === 'take') { pendingShotType = null; pendingMovement = null; activeSugId = null; tagLibre = false; }
  render(); scheduleSave();
}

function abrirDescarte(targetId) {
  const camera = activeCamera();
  if (!camera || !logic.getCameraSequence(state, camera.id).nextToken) return abrirSecuencia();
  abrirModal(`<div class="sheet-head"><h2>Registrar descarte</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">
      <button class="btn" onclick="confirmarDescarte('${targetId}','empty')">Vacio / accidental</button>
      <button class="btn" onclick="confirmarDescarte('${targetId}','failed')">Toma fallida</button>
      <button class="btn" onclick="confirmarDescarte('${targetId}','unrelated')">No relacionado</button>
      <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}

function confirmarDescarte(targetId, reason) {
  cerrarModal();
  registrarArchivo(targetId, 'discard', reason);
}

function toggleBuena(mediaId) {
  state = logic.toggleMediaGood(state, mediaId);
  render(); scheduleSave();
}

// F7 — tocar una toma abre estas acciones (corregir buena/favorita/fallida, reasignar, nota).
function abrirArchivo(mediaId) {
  const file = (state.mediaFiles || []).find((item) => item.id === mediaId);
  if (!file) return;
  const markRow = file.kind === 'take'
    ? `<div class="cap-qa" style="margin-bottom:10px">
        <button class="cap-qbtn fav${file.favorite ? ' on' : ''}" onclick="toggleFavoritaDesdeModal('${esc(file.id)}')"><i class="ti ti-star${file.favorite ? '-filled' : ''}"></i>Favorita</button>
        <button class="cap-qbtn good${file.good ? ' on' : ''}" onclick="toggleBuenaDesdeArchivo('${esc(file.id)}')"><i class="ti ti-check"></i>Buena</button>
      </div>`
    : '';
  abrirModal(`<div class="sheet-head"><h2>${esc(file.fileToken)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    ${markRow}
    <div class="action-stack">
      <button class="btn" onclick="insertarOmitido('${file.id}')">Insertar archivo olvidado antes</button>
      <button class="btn" onclick="abrirAsignacionArchivo('${file.id}')">${file.kind === 'omitted' ? 'Identificar archivo' : 'Reasignar cuarto'}</button>
      ${file.kind !== 'take' ? `<button class="btn" onclick="convertirArchivoToma('${file.id}')">Convertir en toma</button>` : ''}
      ${file.kind === 'take' ? `<button class="btn" onclick="abrirCambioDescarte('${file.id}')">Marcar como fallida</button>` : ''}
      ${file.kind === 'discard' ? `<button class="btn" onclick="abrirCambioDescarte('${file.id}')">Cambiar motivo de descarte</button>` : ''}

function toggleFavoritaDesdeModal(mediaId) {

  abrirArchivo(mediaId);
}

function toggleBuenaDesdeArchivo(mediaId) {

  abrirArchivo(mediaId);
}

function abrirArchivosEscena(targetId) {
  const files = mediaFilesForTarget(targetId).slice().reverse();
  const target = state.espacios.find((item) => item.id === targetId) || state.droneItems.find((item) => item.id === targetId);
  abrirModal(`<div class="sheet-head"><h2>${esc(target ? target.nombre : 'Archivos')}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>

function toggleBuenaDesdeModal(mediaId, targetId) {

  scheduleSave();
  abrirArchivosEscena(targetId);
}

function insertarOmitido(mediaId) {
  confirmSheet('Insertar archivo olvidado', 'Se insertará un archivo antes de este y se recorrerán los consecutivos posteriores de esta cámara. ¿Continuar?', 'Insertar olvidado', () => {
    state = logic.insertOmittedMediaFile(state, mediaId);

    if (inserted) inserted.author = miNombre();
    render(); scheduleSave();
  });
}

function eliminarRegistroArchivo(mediaId) {
  confirmSheet('Eliminar registro', 'Usa esto solo si la cámara NO creó un archivo. Se recorrerán de vuelta los consecutivos posteriores. ¿Continuar?', 'Eliminar registro', () => {
    state = logic.removeMediaFile(state, mediaId);
    render(); scheduleSave();
  }, true);
}

function agregarNotaArchivo(mediaId) {
  const file = state.mediaFiles.find((item) => item.id === mediaId);
  if (!file) return;
  abrirModal(`<div class="sheet-head"><h2>Nota · ${esc(file.fileToken)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <textarea class="textarea" id="nota-input" placeholder="Nota para edición (se trabó, usar el inicio, etc.)">${esc(file.note || '')}</textarea>
    <button class="primary block" style="width:100%;margin-top:10px" onclick="guardarNotaArchivo('${mediaId}')">Guardar nota</button>`);
  setTimeout(() => { const t = document.getElementById('nota-input'); if (t) t.focus(); }, 50);
}

function guardarNotaArchivo(mediaId) {
  const input = document.getElementById('nota-input');
  state = logic.updateMediaFile(state, mediaId, { note: (input ? input.value : '').trim() });
  cerrarModal(); render(); scheduleSave();
}

function abrirAsignacionArchivo(mediaId) {
  const file = state.mediaFiles.find((item) => item.id === mediaId);
  const camera = file && state.cameras.find((item) => item.id === file.cameraId);
  if (!file || !camera) return;
  const targets = camera.mode === 'drone' ? state.droneItems : state.espacios;
  abrirModal(`<div class="sheet-head"><h2>Asignar ${esc(file.fileToken)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">${targets.map((target) => `<button class="btn" onclick="asignarArchivo('${file.id}','${target.id}')">${esc(target.nombre)}</button>`).join('')}</div>`);
}

function asignarArchivo(mediaId, targetId) {
  const wasOmitted = (state.mediaFiles.find((item) => item.id === mediaId) || {}).kind === 'omitted';
  state = logic.updateMediaFile(state, mediaId, { targetId });
  render(); scheduleSave();
  if (wasOmitted) return abrirArchivo(mediaId);
  cerrarModal();
}

function convertirArchivoToma(mediaId) {
  const file = state.mediaFiles.find((item) => item.id === mediaId);
  if (!file || !file.targetId) return abrirAsignacionArchivo(mediaId);
  state = logic.updateMediaFile(state, mediaId, { kind: 'take' });
  cerrarModal(); render(); scheduleSave();
}

function abrirCambioDescarte(mediaId) {
  abrirModal(`<div class="sheet-head"><h2>Convertir en descarte</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">
      <button class="btn" onclick="convertirArchivoDescarte('${mediaId}','empty')">Vacio / accidental</button>
      <button class="btn" onclick="convertirArchivoDescarte('${mediaId}','failed')">Toma fallida</button>
      <button class="btn" onclick="convertirArchivoDescarte('${mediaId}','unrelated')">No relacionado</button>
    </div>`);
}

function convertirArchivoDescarte(mediaId, reason) {
  state = logic.updateMediaFile(state, mediaId, { kind: 'discard', discardReason: reason });
  cerrarModal(); render(); scheduleSave();
}

function capturar(targetId) {
  if (isMediaMode()) return registrarArchivo(targetId, 'take');
  if (state.modoActual === 'drone') {
    const item = state.droneItems.find((entry) => entry.id === targetId);
    if (item && item.estado === 'hecho') return abrirGestionCaptura('drone', targetId);
  } else {
    const space = state.espacios.find((entry) => entry.id === targetId);
    const current = space && space.estados[state.modoActual];
    if (current && current.estado === 'hecho') return abrirGestionCaptura(state.modoActual, targetId);
  }
  registrarCaptura(targetId, 'principal');
}

function registrarCaptura(targetId, intencion) {
  const previous = state;
  state = logic.registerCapture(state, { tipo: state.modoActual, targetId, autor: miNombre(), intencion, now: new Date() });
  render();
  scheduleSave();
  const latest = state.bitacora[state.bitacora.length - 1];
  if (latest && previous !== state) {
    showToast(`${SERVICE_UI[latest.tipo].short}${latest.orden ? ' ' + String(latest.orden).padStart(2, '0') : ''} registrado`, () => {
      state = previous;
      render();
      scheduleSave();
    });
  }
}

function abrirGestionCaptura(tipo, targetId) {
  selectedAction = { type: tipo === 'drone' ? 'drone' : 'space', id: targetId, service: tipo };
  const target = tipo === 'drone' ? state.droneItems.find((entry) => entry.id === targetId) : state.espacios.find((entry) => entry.id === targetId);
  if (!target) return;
  if (tipo === 'video' || tipo === 'drone') {
    abrirModal(`<div class="sheet-head"><h2>${esc(target.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
      <div class="action-stack">
        <button class="primary" onclick="registrarIntencion('repetida')">Repetir toma</button>
        <button class="btn" onclick="registrarIntencion('extra')">Toma extra</button>
        <button class="btn" onclick="registrarIntencion('reemplazo')">Esta reemplaza la anterior</button>
        <button class="btn" onclick="addTargetNote()">Agregar nota</button>
        <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>
      </div>`);
    return;
  }
  abrirModal(`<div class="sheet-head"><h2>${esc(target.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">
      <button class="btn" onclick="clearEstado('${tipo}')">Marcar pendiente</button>
      <button class="btn" onclick="markNoAplica('${tipo}')">Marcar no aplica</button>
      <button class="btn" onclick="addTargetNote()">Agregar nota</button>
      <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}

function registrarIntencion(intencion) {
  const id = selectedAction.id;
  state.modoActual = selectedAction.service;
  cerrarModal();
  registrarCaptura(id, intencion);
}

// ===== F9 — Cierre: "¿ya nos vamos?" =====
// Semáforo + faltantes (cuartos sin tomas, escenas sin buena) + conciliación
// del consecutivo con la cámara física + línea de tiempo + gate de salida.

// Cuartos sin tomas en los servicios de cámara activos (video/drone).
function closeRoomsMissing() {
  const result = [];
  const files = state.mediaFiles || [];
  ['video', 'drone'].forEach((service) => {
    if (!state.servicios[service]) return;
    (state.espacios || []).forEach((space) => {
      const estado = (space.estados[service] || {}).estado;
      if (estado === 'no_aplica' || estado === 'hecho') return;
      const cameraIds = new Set((state.cameras || []).filter((c) => c.mode === service).map((c) => c.id));
      const hasTake = files.some((f) => f.kind === 'take' && f.targetId === space.id && cameraIds.has(f.cameraId));
      if (!hasTake) result.push({ nombre: space.nombre, service, targetId: space.id, reason: 'sin tomas' });
    });
  });
  return result;
}

// Escenas grabadas (video/drone) sin una toma buena marcada.
function closeScenesWithoutGood() {
  return logic.getMediaSceneGroups(state)
    .filter((group) => group.hasTake && !group.hasGood && (group.mode === 'video' || group.mode === 'drone'))
    .map((group) => ({ nombre: group.scenePath, service: group.mode, reason: 'sin una toma buena marcada' }));
}

// Cámaras con secuencia activa o archivos, dentro de un servicio activo.
function closeActiveCameras() {
  const files = state.mediaFiles || [];
  return (state.cameras || []).filter((camera) => {
    if (!state.servicios[camera.mode]) return false;
    const seq = logic.getCameraSequence(state, camera.id);
    const hasFiles = files.some((f) => f.cameraId === camera.id);
    return !!seq.segment || hasFiles;
  });
}

function renderCloseView() {
  const rooms = closeRoomsMissing();
  const scenes = closeScenesWithoutGood();
  const faltantes = [...rooms, ...scenes];
  const cameras = closeActiveCameras();

  // Semáforo: verde sin faltantes; rojo si hay cuartos sin toma; amarillo si solo
  // faltan buenas marcadas.
  let level, lvlLabel, lvlText, icon;
  if (!faltantes.length) {
    level = 'green'; lvlLabel = 'Todo listo';
    lvlText = 'No hay faltantes. Pueden salir de la propiedad.';
    icon = '<i class="ti ti-circle-check"></i>';
  } else if (rooms.length) {
    level = 'red'; lvlLabel = 'Aún no nos vamos';
    lvlText = `Faltan tomas en ${rooms.length} cuarto${rooms.length === 1 ? '' : 's'}${scenes.length ? ` y ${scenes.length} escena${scenes.length === 1 ? '' : 's'} sin buena` : ''}.`;
    icon = '<i class="ti ti-alert-triangle"></i>';
  } else {
    level = 'amber'; lvlLabel = 'Casi listos';
    lvlText = `Revisa ${scenes.length} cosa${scenes.length === 1 ? '' : 's'} antes de salir.`;
    icon = '<i class="ti ti-alert-triangle"></i>';
  }

  const faltantesHtml = faltantes.length
    ? `<div class="close-lst">${faltantes.map((item) => `<div class="close-li"><span class="close-dot"></span><span class="close-rt">${esc(item.nombre)}<span class="close-sub">${esc(item.reason)}${item.service ? ` · ${SERVICE_UI[item.service].short}` : ''}</span></span></div>`).join('')}</div>`
    : '<p class="line">No hay cuartos ni escenas pendientes.</p>';

  const concHtml = cameras.length
    ? `<div class="close-lst">${cameras.map(renderConcCamera).join('')}</div>`
    : '<p class="line">Aún no hay secuencias iniciadas.</p>';

  return `<div class="close-list">
    <section class="panel close-sem ${level}">
      <div class="close-lvl">${icon}${esc(lvlLabel)}</div>
      <p class="close-semtext">${esc(lvlText)}</p>
    </section>
    <section class="panel"><h3>Faltantes</h3>${faltantesHtml}</section>
    <section class="panel"><h3>Conciliar con tu cámara</h3>
      <p class="line">Confirma que el consecutivo de la app coincide con tu tarjeta, mientras aún puedes regrabar.</p>
      ${concHtml}
    </section>
    ${renderCloseTimelines(cameras)}
    <button class="close-gate" onclick="abrirGateSalida()">Salir de la propiedad</button>
  </div>`;
}

// Una fila de conciliación por cámara: "app va en <token>" + igual / hay hueco.
function renderConcCamera(camera) {
  const seq = logic.getCameraSequence(state, camera.id);
  const cameraFiles = (state.mediaFiles || []).filter((f) => f.cameraId === camera.id).sort((a, b) => a.fileCounter - b.fileCounter);
  const last = cameraFiles[cameraFiles.length - 1];
  let tokenHtml;
  if (last) tokenHtml = `app va en <span class="close-tok">${esc(last.fileToken)}</span>`;
  else if (seq.nextToken) tokenHtml = `siguiente <span class="close-tok">${esc(seq.nextToken)}</span>`;
  else tokenHtml = 'sin archivos aún';
  const huecoBtn = last
    ? `<button class="close-micro" onclick="conciliarHueco('${camera.id}')">hay hueco</button>`
    : '';
  return `<div class="close-conc">
    <span class="close-conctxt">${esc(camera.label)} · ${tokenHtml}</span>
    <span class="close-chk"><span class="close-micro ok">igual</span>${huecoBtn}</span>
  </div>`;
}

// Línea de tiempo por cámara: orden cronológico del consecutivo con su cuarto.
function renderCloseTimelines(cameras) {
  const blocks = cameras.map((cam) => {
    const files = (state.mediaFiles || []).filter((f) => f.cameraId === cam.id).sort((a, b) => a.fileCounter - b.fileCounter);
    if (!files.length) return '';
    return `<section class="panel"><h3>Línea de tiempo · ${esc(cam.label)}</h3>
      <p class="line">En el orden real de la tarjeta. Toca un archivo para insertar uno olvidado, reasignar o quitar un registro.</p>
      <div class="cron">${files.map((f) => `<button class="cron-row" onclick="abrirArchivo('${f.id}')">
        <span class="cron-tok">${esc(f.fileToken)}</span>
        <span class="cron-info"><span class="cron-scene">${esc(f.scenePath || 'Sin identificar')}</span><span class="cron-kind">${esc(mediaKindLabel(f))}${f.good ? ' · buena' : ''}</span></span>
        <i class="ti ti-dots cron-chev"></i>
      </button>`).join('')}</div></section>`;
  }).filter(Boolean).join('');
  return blocks;
}

// "Hay hueco": inserta el archivo olvidado antes del último consecutivo y abre su
// detalle para identificarlo / reasignarlo (reusa insertOmittedMediaFile).
function conciliarHueco(cameraId) {
  const cameraFiles = (state.mediaFiles || []).filter((f) => f.cameraId === cameraId).sort((a, b) => a.fileCounter - b.fileCounter);
  const last = cameraFiles[cameraFiles.length - 1];
  if (!last) return showToast('Esta cámara aún no tiene archivos');
  confirmSheet('Hay un hueco', 'Se insertará un archivo olvidado en la secuencia de esta cámara y se recorrerán los consecutivos posteriores. Lo identificas en el detalle.', 'Insertar olvidado', () => {
    state = logic.insertOmittedMediaFile(state, last.id);
    const inserted = state.mediaFiles.find((file, index) => state.mediaFiles[index + 1] && state.mediaFiles[index + 1].id === last.id);
    if (inserted) inserted.author = miNombre();
    scheduleSave();
    render();
    if (inserted) abrirArchivo(inserted.id);
  });
}

}

  const n = (state.mediaFiles || []).length;

function exportarBitacora() {
  const data = logic.buildExport(state, meta);
  if (!data.totalArchivos) return showToast('Aún no hay archivos para exportar');
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bitacora-' + ((meta.folio || 'checklist').replace(/[^\w.-]+/g, '_')) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Exportados ' + data.totalArchivos + ' archivos');
}

function imprimirGuionEdicion() {
  const data = logic.buildExport(state, meta);
  if (!data.totalArchivos) return showToast('Aún no hay archivos para exportar');
  const guion = data.guionEdicion || {};
  const clips = guion.clips || [];
  const folio = meta.folio || '';
  const cliente = meta.nombreCliente || '';

  function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // Group clips by escena preserving order
  const groups = [];
  const seen = new Map();
  clips.forEach((c) => {
    const key = c.escena || '';
    if (!seen.has(key)) { seen.set(key, []); groups.push({ escena: key, items: seen.get(key) }); }
    seen.get(key).push(c);
  });

  const groupsHtml = groups.map((g) => {
    const rows = g.items.map((c) => {
      const buenaMark = c.buena ? '<strong>[buena]</strong> ' : '';
      const tipo = [c.tipo, c.movimiento].filter(Boolean).join(' / ');
      const orden = c.ordenEdicion != null ? `<span class="orden">[E${c.ordenEdicion}]</span> ` : '';
      return `<tr><td>${orden}${escHtml(c.archivo)}</td><td>${escHtml(tipo)}</td><td>${buenaMark ? buenaMark : ''}</td></tr>`;
    }).join('');
    return `<div class="scene"><h3>${escHtml(g.escena || '(sin escena)')}</h3><table><thead><tr><th>Archivo</th><th>Tipo / Movimiento</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');

  const html = [
    '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">',
    `<title>Guion de edicion${folio ? ' \xb7 ' + folio : ''}</title>`,
    '<style>',
    'body{font-family:system-ui,sans-serif;font-size:13px;color:#111;margin:24px}',
    'h1{font-size:16px;margin:0 0 4px}',
    '.sub{font-size:12px;color:#666;margin-bottom:4px}',
    '.ctx{font-size:12px;color:#444;font-style:italic;margin-bottom:20px;border-left:3px solid #ccc;padding-left:8px}',
    'h3{font-size:13px;margin:16px 0 6px;border-bottom:1px solid #ddd;padding-bottom:3px}',
    'table{width:100%;border-collapse:collapse;margin-bottom:6px}',
    'th{text-align:left;font-size:11px;color:#555;border-bottom:1px solid #ccc;padding-bottom:3px}',
    'td{vertical-align:top;padding:3px 6px 3px 0;font-size:12px;border-bottom:1px solid #f0f0f0}',
    'td:first-child{width:35%}td:nth-child(2){width:35%;color:#444}',
    '.orden{color:#888;font-size:11px}',
    'strong{font-weight:700}',
    '@media print{body{margin:12px}}',
    '</style></head><body>',
    `<h1>Guion de edicion${folio ? ' \xb7 ' + escHtml(folio) : ''}</h1>`,
    cliente ? `<div class="sub">${escHtml(cliente)}</div>` : '',
    guion.contexto ? `<div class="ctx">${escHtml(guion.contexto)}</div>` : '',
    groupsHtml || '<p>Sin clips registrados.</p>',
    '<script>window.onload=function(){window.print();}<\/script>',
    '</body></html>',
  ].join('');

  const w = window.open('', '_blank');
  if (!w) return;
  w.document.write(html);
  w.document.close();
}

    <section class="panel"><h3>Notas para edicion</h3>${notes.length ? notes.map((entry) => `<div class="review-item"><strong>${esc(entry.nombre)}</strong><div>${esc(entry.nota || entry.bandera)}</div></div>`).join('') : '<p class="line">Sin notas.</p>'}</section>

  </div>`;
}

function renderMediaEditView() {
  const groups = logic.getMediaSceneGroups(state);
  const legacy = state.bitacora.filter((entry) => entry.tipo === 'video' || entry.tipo === 'drone');

  // Agrupar servicio (mode) > piso > cuarto (scenePath). Preserva orden de aparicion.
  const spaceById = {};
  (state.espacios || []).forEach((e) => { spaceById[e.id] = e; });
  const pisoDeFile = (file) => {
    const sp = spaceById[file.targetId];
    if (sp) return sp.piso || 'Sin piso';
    const mode = (state.cameras || []).find((c) => c.id === file.cameraId);
    return mode && mode.mode === 'drone' ? 'Drone' : 'Sin piso';
  };

  const services = [];
  const svcMap = new Map();
  groups.forEach((group) => {
    const mode = group.mode;
    if (!svcMap.has(mode)) { const s = { mode, pisos: [], pmap: new Map() }; svcMap.set(mode, s); services.push(s); }
    const svc = svcMap.get(mode);
    const piso = pisoDeFile(group.files[0]) || 'Sin piso';
    if (!svc.pmap.has(piso)) { const p = { piso, groups: [] }; svc.pmap.set(piso, p); svc.pisos.push(p); }
    svc.pmap.get(piso).groups.push(group);
  });

  const svcHtml = services.map((svc) => {
    const svcLabel = SERVICE_UI[svc.mode] ? SERVICE_UI[svc.mode].label : 'Archivos';
    const pisosHtml = svc.pisos.map((p) => {
      const roomsHtml = p.groups.map((group) => renderEditRoomGroup(group)).join('');
      return `<div class="mini-lbl" style="font-size:10px;font-weight:900;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin:2px 2px 6px">${esc(p.piso)}</div>
        <div class="edit-svc-rooms">${roomsHtml}</div>`;
    }).join('');
    return `<section class="edit-svc"><div class="edit-svc-head">${esc(svcLabel)}</div>${pisosHtml}</section>`;
  }).join('');

  return `<div class="edit-list">${renderExportBar()}
    ${svcHtml || '<section class="panel"><p class="line">Aún no hay archivos registrados.</p></section>'}
    ${legacy.length ? `<section class="panel"><h3>Historial anterior</h3>${legacy.map((entry) => `<div class="review-item"><strong>${SERVICE_UI[entry.tipo].short} ${entry.orden || ''}</strong><div>${esc(entry.nombre)}${entry.intencion ? ' · ' + esc(entry.intencion) : ''}</div></div>`).join('')}</section>` : ''}
  </div>`;
}

function renderEditRoomGroup(group) {
  // Tomas primero, luego descartes/omitidos; cada fila editable.
  const order = { take: 0, omitted: 1, discard: 2 };
  const items = group.files.slice().sort((a, b) => (order[a.kind] || 0) - (order[b.kind] || 0) || (a.fileCounter || 0) - (b.fileCounter || 0));
  const goodCount = items.filter((f) => f.kind === 'take' && f.good).length;
  const takeCount = items.filter((f) => f.kind === 'take').length;
  return `<div class="edit-grp">
    <div class="edit-grp-head">${esc(group.scenePath)}<span class="gcount">${goodCount}/${takeCount} buenas</span></div>
    ${items.map((file) => renderEditRow(file)).join('')}
  </div>`;
}

function renderEditRow(file) {
  const isTake = file.kind === 'take';
  const tipo = [
    file.shotType ? (logic.getShotTypes()[file.shotType] || {}).label : null,
    file.movement ? (logic.getMovements()[file.movement] || {}).label : null,
  ].filter(Boolean).join(' · ');
  const meta = isTake
    ? (tipo || cameraLabel(file.cameraId))
    : `<span class="ekind">${esc(mediaKindLabel(file))}</span>`;
  const acts = isTake
    ? `<button class="eic fav${file.favorite ? ' on' : ''}" title="Favorita" onclick="toggleFavoritaEdit('${file.id}')"><i class="ti ti-star${file.favorite ? '-filled' : ''}"></i></button>
       <button class="eic good${file.good ? ' on' : ''}" title="Buena" onclick="toggleBuenaEdit('${file.id}')"><i class="ti ti-check"></i></button>
       <button class="eic more" title="Más" onclick="abrirArchivo('${file.id}')"><i class="ti ti-dots"></i></button>`
    : `<button class="eic more" title="Reasignar / opciones" onclick="abrirArchivo('${file.id}')"><i class="ti ti-dots"></i></button>`;
  return `<div class="erow${isTake ? '' : ' is-discard'}">
    <div><span class="etk">${esc(file.fileToken)}</span><div class="emeta">${meta}</div></div>
    <div class="emid"><textarea class="edesc" rows="1" placeholder="Descripción para edición…" onchange="guardarDescEdit('${file.id}', this.value)">${esc(file.note || '')}</textarea></div>
    <div class="eacts">${acts}</div>
  </div>`;
}

function toggleBuenaEdit(mediaId) {
  state = logic.toggleMediaGood(state, mediaId);
  render(); scheduleSave();
}

function toggleFavoritaEdit(mediaId) {
  state = logic.toggleMediaFavorite(state, mediaId);
  render(); scheduleSave();
}

function guardarDescEdit(mediaId, value) {
  state = logic.updateMediaFile(state, mediaId, { note: (value || '').trim() });
  scheduleSave();
}

function primarySequence(tipo) {
  const entries = state.bitacora.filter((entry) => entry.tipo === tipo && (!entry.intencion || entry.intencion === 'principal' || entry.intencion === 'reemplazo'));
  const replacements = new Set(state.bitacora.filter((entry) => entry.tipo === tipo && entry.intencion === 'reemplazo').map((entry) => entry.targetId));
  return entries.filter((entry) => entry.intencion === 'reemplazo' || !replacements.has(entry.targetId));
}

function renderSequence(items, emptyText) {
  if (!items.length) return `<p class="line">${emptyText}</p>`;
  return `<div class="sequence">${items.map((entry) => `<div class="sequence-row"><div class="sequence-num">${String(entry.orden || '').padStart(2, '0')}</div><div><div class="sequence-name">${esc(entry.nombre)}</div><div class="sequence-meta">${esc(entry.autor)}${entry.hora ? ' · ' + esc(entry.hora) : ''}</div></div></div>`).join('')}</div>`;
}

function amenityDone(space) {
  return ['foto', 't360', 'video'].filter((service) => (space.estados[service] || {}).estado === 'hecho').map((service) => SERVICE_UI[service].short).join(', ') || 'pendiente';
}

function abrirTemplate(key) {
  selectedTemplate = key;
  modalTab = 'plantillas';
  renderTemplateSheet();
}

function abrirEspacios(tab) {
  modalTab = tab || 'plantillas';
  renderTemplateSheet();
}

function renderTemplateSheet() {
  const template = logic.TEMPLATE_DEFS[selectedTemplate] || logic.TEMPLATE_DEFS.casa;
  const html = `<div class="sheet-head"><h2>Agregar espacios</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="sheet-tabs">
      <button class="sheet-tab ${modalTab === 'plantillas' ? 'active' : ''}" onclick="modalTab='plantillas';renderTemplateSheet()">Plantillas</button>
      <button class="sheet-tab ${modalTab === 'lista' ? 'active' : ''}" onclick="modalTab='lista';renderTemplateSheet()">Lista propia</button>
    </div>
    ${modalTab === 'plantillas' ? renderTemplateTab(template) : renderListTab()}`;
  abrirModal(html);
}

function renderTemplateTab(template) {
  return `<div class="sheet-body">
    <div class="template-grid">${Object.keys(logic.TEMPLATE_DEFS).map((key) => `<button class="template-card ${selectedTemplate === key ? 'selected' : ''}" onclick="selectedTemplate='${key}';renderTemplateSheet()"><strong>${esc(logic.TEMPLATE_DEFS[key].label)}</strong><span>${esc(logic.TEMPLATE_DEFS[key].description)}</span></button>`).join('')}</div>
    <div class="preview">${renderTemplatePreview(template)}</div>
    <button class="primary" onclick="usarTemplate('replace')">${state.espacios.length ? 'Reemplazar todo' : 'Usar plantilla'}</button>
    ${state.espacios.length ? '<button class="btn" onclick="usarTemplate(&quot;append&quot;)">Agregar a existente</button>' : ''}
  </div>`;
}

function renderTemplatePreview(template) {
  const groups = {};
  template.spaces.forEach((row) => {
    if (!groups[row[1]]) groups[row[1]] = [];
    groups[row[1]].push(row);
  });
  return Object.entries(groups).map(([zone, rows]) => `<h3>${ZONE_LABELS[zone]}</h3>${rows.map((row) => `<div>${row[3] ? '&nbsp;&nbsp;- ' : '- '}${esc(row[0])}${row[2] ? ' (clave)' : ''}</div>`).join('')}`).join('');
}

function renderListTab() {
  return `<div class="sheet-body">
    <textarea class="textarea" id="batch-text" placeholder="Sala&#10;Cocina&#10;Recamara principal&#10;  Bano principal&#10;  Closet"></textarea>
    <div class="preview" id="batch-preview"><h3>Ejemplo</h3><div>Recamara principal</div><div>&nbsp;&nbsp;- Bano principal</div><div>&nbsp;&nbsp;- Closet</div></div>
    <button class="primary" onclick="confirmarLista()">Agregar espacios</button>
  </div>`;
}

function usarTemplate(mode) {
  if (mode === 'replace' && (state.bitacora.length || (state.mediaFiles || []).length || (state.sequenceSegments || []).length) && !confirm('Reemplazar todo eliminara la bitacora, secuencias y archivos registrados. Continuar?')) return;
  state = logic.applyTemplate(state, selectedTemplate, { mode });
  cerrarModal();
  render();
  scheduleSave();
}

function confirmarLista() {
  const text = document.getElementById('batch-text').value;
  if (!text.trim()) return;
  state = logic.addSpacesFromText(state, text);
  cerrarModal();
  render();
  scheduleSave();
}

function abrirServicios() {
  abrirModal(`<div class="sheet-head"><h2>Servicios activos</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">${Object.keys(SERVICE_UI).map((key) => `<button class="btn" onclick="toggleServicio('${key}')">${state.servicios[key] ? 'Apagar' : 'Activar'} ${SERVICE_UI[key].label}</button>`).join('')}</div>`);
}

function toggleServicio(key) {
  state = logic.setServiceActive(state, key, !state.servicios[key]);
  ensureActiveMode();
  abrirServicios();
  render();
  scheduleSave();
}

function abrirAcciones(type, id) {
  selectedAction = { type, id };
  const item = type === 'drone' ? state.droneItems.find((entry) => entry.id === id) : state.espacios.find((entry) => entry.id === id);
  if (!item) return;
  const hasMedia = (state.mediaFiles || []).some((file) => file.targetId === id);
  const serviceActions = type === 'space'
    ? ['foto', 't360', 'video'].filter((key) => state.servicios[key] && !(key === 'video' && hasMedia)).map((key) => {
      const noAplica = (item.estados[key] || {}).estado === 'no_aplica';
      return `<button class="btn" onclick="${noAplica ? `reactivarTarget('space','${item.id}','${key}')` : `markNoAplica('${key}')`}">${noAplica ? 'Reactivar' : 'No aplica:'} ${SERVICE_UI[key].label}</button>`;
    }).join('')
    : hasMedia ? '' : `<button class="btn" onclick="${item.noAplica ? `reactivarTarget('drone','${item.id}','drone')` : 'markDroneNoAplica()'}">${item.noAplica ? 'Reactivar Drone' : 'Drone no aplica'}</button>`;
  abrirModal(`<div class="sheet-head"><h2>${esc(item.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">
      ${serviceActions}
      ${type === 'space' ? '<button class="btn" onclick="addSubspace()">Agregar subespacio</button>' : ''}
      <button class="btn" onclick="renameTarget()">Editar nombre</button>
      <button class="danger btn" onclick="deleteTarget()">Borrar</button>
    </div>`);
}

function markNoAplica(service) {
  const space = state.espacios.find((entry) => entry.id === selectedAction.id);
  if (!space || (space.clave && !confirm(`Marcar ${space.nombre} como no aplica para ${SERVICE_UI[service].label}?`))) return;
  space.estados[service] = { estado: 'no_aplica' };
  cerrarModal(); render(); scheduleSave();
}

function clearEstado(service) {
  const space = state.espacios.find((entry) => entry.id === selectedAction.id);
  if (space) space.estados[service] = { estado: 'pendiente' };
  cerrarModal(); render(); scheduleSave();
}

function markDroneNoAplica() {
  const item = state.droneItems.find((entry) => entry.id === selectedAction.id);
  if (item) { item.noAplica = true; item.estado = 'pendiente'; }
  cerrarModal(); render(); scheduleSave();
}

function addSubspace() {
  const nombre = prompt('Nombre del subespacio');
  if (!nombre) return;
  const parent = state.espacios.find((entry) => entry.id === selectedAction.id);
  state.espacios.push({ id: 'esp-' + Date.now().toString(36), nombre: nombre.trim(), parentId: selectedAction.id, orden: state.espacios.length + 1, zona: parent ? parent.zona : 'interior', clave: false, estados: { foto: { estado: 'pendiente' }, t360: { estado: 'pendiente' }, video: { estado: 'pendiente' } } });
  cerrarModal(); render(); scheduleSave();
}

function renameTarget() {
  const list = selectedAction.type === 'drone' ? state.droneItems : state.espacios;
  const item = list.find((entry) => entry.id === selectedAction.id);
  if (!item) return;
  const nombre = prompt('Nuevo nombre', item.nombre);
  if (!nombre) return;
  item.nombre = nombre.trim();
  state.bitacora.forEach((entry) => { if (entry.targetId === item.id) entry.nombre = item.nombre; });
  syncMediaSceneNames();
  cerrarModal(); render(); scheduleSave();
}

function syncMediaSceneNames() {
  (state.mediaFiles || []).forEach((file) => {
    if (!file.targetId || file.scene === 'Sin escena' || file.scene === 'Sin identificar') return;
    const camera = state.cameras.find((item) => item.id === file.cameraId);
    const targets = camera && camera.mode === 'drone' ? state.droneItems : state.espacios;
    const target = targets.find((item) => item.id === file.targetId);
    if (!target) return;
    file.scene = target.nombre;
    file.scenePath = logic.getScenePath(state, target.id, camera && camera.mode);
  });
}

function deleteTarget() {
  const ids = new Set(selectedAction.type === 'drone' ? [selectedAction.id] : logic.getDescendantIds(state, selectedAction.id));
  if ((state.mediaFiles || []).some((file) => ids.has(file.targetId)) || state.bitacora.some((entry) => ids.has(entry.targetId))) {
    showToast('No se puede borrar: tiene capturas registradas');
    cerrarModal();
    return;
  }
  if (!confirm('Borrar este elemento?')) return;
  if (selectedAction.type === 'drone') {
    state.droneItems = state.droneItems.filter((entry) => entry.id !== selectedAction.id);
  } else {
    state.espacios = state.espacios.filter((entry) => !ids.has(entry.id));
  }
  cerrarModal(); render(); scheduleSave();
}

function addTargetNote() {
  const note = prompt('Nota para edicion');
  if (!note || !note.trim()) return;
  const targetId = selectedAction.id;
  const tipo = selectedAction.service || state.modoActual;
  const name = tipo === 'drone' ? (state.droneItems.find((entry) => entry.id === targetId) || {}).nombre : (state.espacios.find((entry) => entry.id === targetId) || {}).nombre;
  state.bitacora.push({ id: 'log-note-' + Date.now().toString(36), tipo, targetId, nombre: name || '', autor: miNombre(), hora: new Date().getHours().toString().padStart(2, '0') + ':' + new Date().getMinutes().toString().padStart(2, '0'), nota: note.trim(), bandera: 'nota', intencion: 'nota' });
  cerrarModal(); render(); scheduleSave();
}

function abrirModal(html) {
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = html;
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('app').inert = true;
  requestAnimationFrame(() => (sheet.querySelector('[autofocus], button, input, textarea') || {}).focus?.());
}

function cerrarModal(event) {
  if (event && event.target && event.target.id !== 'overlay') return;
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('app').inert = false;
  selectedAction = null;
}

function confirmSheet(titulo, mensaje, etiquetaSi, onSi, danger) {
  abrirModal(`<div class="sheet-head"><h2>${esc(titulo)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <p class="sheet-note">${esc(mensaje)}</p>
    <div class="action-stack">
      <button class="${danger ? 'danger btn' : 'primary'} block" id="confirm-si" style="width:100%">${esc(etiquetaSi)}</button>
      <button class="btn ghost" onclick="cerrarModal()" style="width:100%">Cancelar</button>
    </div>`);
  const btn = document.getElementById('confirm-si');
  if (btn) btn.onclick = () => { cerrarModal(); onSi(); };
}

function showToast(message, actionHandler, actionLabel) {
  const toast = document.getElementById('toast');
  toast.innerHTML = `<span>${esc(message)}</span>${actionHandler ? `<button id="undo-btn">${esc(actionLabel || 'Deshacer')}</button>` : ''}`;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  if (actionHandler) document.getElementById('undo-btn').onclick = () => { actionHandler(); toast.classList.remove('visible'); };
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 4200);
}

function abrirMotivoDescarte(fileId) {
  abrirModal(`<div class="sheet-head"><h2>¿Qué fue?</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <p class="sheet-note">Para que el conteo cuadre con la tarjeta.</p>
    <div class="action-stack">
      <button class="btn" onclick="cambiarMotivo('${fileId}','failed')"><i class="ti ti-player-stop"></i> Toma fallida</button>
      <button class="btn" onclick="cambiarMotivo('${fileId}','unrelated')"><i class="ti ti-paw"></i> No relacionado (perrito, persona)</button>
      <button class="btn" onclick="cambiarMotivo('${fileId}','empty')"><i class="ti ti-circle-dashed"></i> Vacío / accidental</button>
      <button class="danger btn" onclick="quitarRegistro('${fileId}')"><i class="ti ti-trash"></i> No se grabó (quitar)</button>
    </div>`);
}

function paresDe(fileId) {
  const file = (state.mediaFiles || []).find((f) => f.id === fileId);
  return file && file.pairId ? state.mediaFiles.filter((f) => f.pairId === file.pairId).map((f) => f.id) : [fileId];
}

function cambiarMotivo(fileId, reason) {
  paresDe(fileId).forEach((id) => { state = logic.updateMediaFile(state, id, { kind: 'discard', discardReason: reason }); });
  cerrarModal(); render(); scheduleSave();
}

function quitarRegistro(fileId) {
  paresDe(fileId).forEach((id) => { state = logic.removeMediaFile(state, id); });
  cerrarModal(); render(); scheduleSave();
}

function mostrarError(message) {
  document.getElementById('app').innerHTML = `<div class="state-screen"><div><h2>Algo salio mal</h2><p>${esc(message)}</p></div></div>`;
}

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && document.getElementById('overlay').classList.contains('visible')) cerrarModal();
});

// Al volver la señal: vaciar la cola pendiente de inmediato (no esperar al backoff).
window.addEventListener('online', () => {
  if (DEMO) return;
  if (dirty) {
    retryCount = 0;
    clearTimeout(retryTimer);
    saveNow();
  } else if (syncStatus === 'offline' || syncStatus === 'error') {
    setSync('ok');
  }
  poll();
});
window.addEventListener('offline', () => {
  if (DEMO) return;
  setSync('offline');
});

if (CONFIG) {
  iniciarConfigMode();
} else if (DEMO) {
  cargarDemo();
} else if (!TOKEN) {
  mostrarError('Este enlace no tiene un token de contrato. Usa el boton Checklist desde el panel de administracion.');
} else {
  cargar();
  fetch('/api/obtenerConfigGuia?token=' + encodeURIComponent(TOKEN))
    .then((r) => r.ok ? r.json() : null)
    .then((data) => { if (data && data.guia) { currentGuideConfig = data.guia; logic.applyGuideConfig(data.guia); render(); } })
    .catch(() => {});
}
  </script>
</body>
</html>
