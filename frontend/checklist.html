function roomPills(room) {
  const files = (state.mediaFiles || []).filter((f) => f.targetId === room.id && f.kind === 'take');
  if (!files.length) return '<span class="rpill pend">sin tomas</span>';
  const good = files.filter((f) => f.good).length;
  const fav = files.filter((f) => f.favorite).length;
  let html = `<span class="rpill">${files.length} toma${files.length === 1 ? '' : 's'}</span>`;
  if (good) html += `<span class="rpill good">${good} buena${good === 1 ? '' : 's'}</span>`;
  if (fav) html += `<span class="rpill fav">${fav} favorita${fav === 1 ? '' : 's'}</span>`;
  return html;
}

function renderPropertyLanding() {
  if (!state.espacios.length) {
    return `<div class="empty"><h2>Sin cuartos todavía</h2><p>Arma la lista de cuartos para empezar a capturar.</p><button class="primary" onclick="abrirSetup()" style="margin-top:12px">Armar cuartos</button></div>`;
  }
  const pisos = state.pisos && state.pisos.length ? state.pisos : [...new Set(state.espacios.map((e) => e.piso || 'Sin piso'))];
  const groups = pisos.map((p) => {
    const rooms = state.espacios.filter((e) => (e.piso || 'Sin piso') === p && !e.parentId).sort((a, b) => (a.orden || 0) - (b.orden || 0));
    if (!rooms.length) return '';
    return `<section class="floor">
      <div class="floor-h"><span>${esc(p)}</span><span class="floor-cnt">${rooms.length} cuarto${rooms.length === 1 ? '' : 's'}</span></div>
      ${rooms.map(landingRoomRow).join('')}
    </section>`;
  }).join('');
  return `<div class="landing">
    ${groups}
    <button class="addroom" onclick="abrirSetup()"><i class="ti ti-plus"></i> Agregar cuarto · Modo cuartos</button>
  </div>`;
}

function landingRoomRow(room) {
  const subs = state.espacios.filter((e) => e.parentId === room.id).sort((a, b) => (a.orden || 0) - (b.orden || 0));
  return `<button class="room" onclick="entrarCuarto('${room.id}')">
    <span class="room-info"><span class="room-name">${esc(room.nombre)}</span><span class="pills">${roomPills(room)}</span></span>
    <i class="ti ti-chevron-right room-chev"></i>

    <i class="ti ti-chevron-right room-chev"></i>

}

const TIPO_LABEL = { casa: 'Casa', departamento: 'Departamento', terreno: 'Terreno', quinta: 'Quinta' };

function getFocusPiso() {
  // F24 — Sin pisos no hay foco posible: devolvemos null y el render muestra
  // los chips de "añadir primer piso" en vez de sugeridos de un piso inexistente.
  const pisos = state.pisos && state.pisos.length ? state.pisos : [];
  if (!pisos.length) return null;
  return setupPiso && pisos.includes(setupPiso) ? setupPiso : pisos[0];
}

function renderSetup() {
  const tipoSeg = `<div class="setup-block">
      <label class="setup-lbl">Tipo de propiedad</label>
      <div class="seg">${['casa', 'departamento', 'terreno', 'quinta'].map((t) => `<button class="seg-btn${setupTipo === t ? ' active' : ''}" onclick="setSetupTipo('${t}')">${TIPO_LABEL[t]}</button>`).join('')}</div>
    </div>`;
  // F20 — Terreno: un solo sujeto, no se arman cuartos. Vive en su propia vista.
  if (setupTipo === 'terreno') return renderSetupTerreno(tipoSeg);

  const pisos = state.pisos && state.pisos.length ? state.pisos : [];
  const focusP = getFocusPiso();
  // F24 — Sin pisos: arrancar vacío. La fila "Pisos" muestra un texto guía y
  // chips de un toque para añadir el primer piso (cada uno toma foco al instante).
  if (!pisos.length) {
    return `<section class="setup">
      <div class="setup-hd"><h2>Armar cuartos</h2><p>Arrancas de cero. Agrega tu primer piso para empezar a sumar cuartos.</p></div>

        ${renderPisoAddChips()}
      </div>
    </section>`;
  }
  const drone = logic.isDronePiso(focusP);
  // Cuartos raiz en el piso en foco (para el conteo del encabezado).
  const enFoco = state.espacios.filter((e) => (e.piso || 'Sin piso') === focusP && !e.parentId).length;
  return `<section class="setup">
    <div class="setup-hd"><h2>Armar cuartos</h2><p>Arrancas de cero. Toca un chip para agregar al piso en foco; busca cualquier cuarto o crea uno nuevo.</p></div>
    ${tipoSeg}
    <div class="setup-block">
      <label class="setup-lbl">Pisos</label>
      <div class="chips">${pisos.map((p) => {
        const dr = logic.isDronePiso(p);
        return `<button class="chip${dr ? ' drone' : ''}${p === focusP ? ' active' : ''}" onclick="setSetupPiso('${esc(p)}')">${dr ? '<i class="ti ti-drone"></i>' : ''}${esc(p)}<i class="ti ti-x chip-x" onclick="event.stopPropagation();quitarPiso('${esc(p)}')"></i></button>`;
      }).join('')}<button class="chip add" onclick="agregarPiso()"><i class="ti ti-plus"></i>piso</button></div>
    </div>
    <div class="setup-block setup-search">
      <div class="setup-search-box${drone ? ' sky' : ''}"><i class="ti ti-search"></i><input id="setup-input" type="text" value="${esc(setupQuery)}" placeholder="${drone ? 'Busca un sujeto aéreo…' : 'Busca cualquier cuarto (sala, alberca, palapa…)'}" autocomplete="off" oninput="onSetupSearch(this.value)" onkeydown="if(event.key==='Enter')agregarCuartoEscrito()"></div>
      ${setupQuery.trim() ? renderSetupSearchDrop(focusP) : ''}

      <label class="setup-lbl${drone ? ' sky' : ''}">${drone ? 'Sugeridos para Drone' : `Sugeridos para ${esc(focusP)} · ${TIPO_LABEL[setupTipo]}`}</label>
      ${renderSetupSuggest(focusP, drone)}
    </div>`}
    ${state.espacios.length ? `<div class="setup-block"><label class="setup-lbl${drone ? ' sky' : ''}">En ${esc(focusP)} · ${enFoco} ${enFoco === 1 ? 'cuarto' : 'cuartos'}</label>${renderSetupList()}</div>
      <button class="primary block" onclick="cerrarSetup()">Listo, a capturar</button>` : ''}
  </section>`;
}

// F20 — Chips auto-sugeridos: en el piso Drone son sujetos aereos
// (suggestedAerialSubjects); en cualquier otro piso, espacios por piso+tipo
// (suggestedSpacesFor). Un toque agrega (patron del Modo Cuartos existente).
function renderSetupSuggest(focusP, drone) {
  if (drone) {
    const subjects = logic.suggestedAerialSubjects(state, setupTipo) || [];
    if (!subjects.length) return '<span class="muted">Sin sujetos aéreos para este tipo.</span>';
    return `<div class="chips suggest sky">${subjects.map((s) => {
      const ya = chipYaEnFoco(s.label);
      return `<button class="chip${ya ? ' added' : ''}" ${ya ? 'disabled' : `onclick="agregarSujetoAereo('${esc(s.label)}')"`}>${ya ? '<i class="ti ti-check"></i>' : '<i class="ti ti-plus"></i>'}${esc(s.label)}</button>`;
    }).join('')}</div>`;
  }
  const chips = logic.suggestedSpacesFor(state, focusP, setupTipo) || [];
  if (!chips.length) return '<span class="muted">Sin sugerencias para este piso. Usa el buscador.</span>';
  return `<div class="chips suggest">${chips.map((c) => {
    const ya = chipYaEnFoco(c.nombre);
    return `<button class="chip${ya ? ' added' : ''}" ${ya ? 'disabled' : `onclick="agregarCuartoSugerido('${esc(c.nombre)}','${c.zona}','${c.categoria || ''}')"`}>${ya ? '<i class="ti ti-check"></i>' : '<i class="ti ti-plus"></i>'}${esc(c.nombre)}</button>`;
  }).join('')}</div>`;
}

// F20 — Dropdown del buscador (searchSpaces): coincidencias de toda la
// biblioteca + opcion "crear nuevo" al final con el texto literal.
function renderSetupSearchDrop(focusP) {
  const results = logic.searchSpaces(setupQuery) || [];
  if (!results.length) return '<div class="setup-drop"><div class="setup-drop-empty">Sin coincidencias.</div></div>';
  return `<div class="setup-drop">${results.map((r) => {
    if (r.kind === 'create') {
      return `<button class="setup-drop-item create" onclick="agregarDesdeBusqueda('create','${esc(r.nombre)}','${r.zona || 'interior'}','')"><span>Crear "${esc(r.nombre)}" como cuarto nuevo</span><span class="di-add">personalizado</span></button>`;
    }
    const ya = chipYaEnFoco(r.nombre);
    return `<button class="setup-drop-item" ${ya ? 'disabled' : `onclick="agregarDesdeBusqueda('match','${esc(r.nombre)}','${r.zona || 'interior'}','${r.categoria || ''}')"`}><span>${esc(r.nombre)}</span><span class="di-add">${ya ? 'ya agregado' : `+ agregar a ${esc(focusP)}`}</span></button>`;
  }).join('')}</div>`;
}

// F20 — Vista Terreno: sujeto unico "El terreno" con sus tomas sugeridas.
function renderSetupTerreno(tipoSeg) {
  const t = logic.terrenoSingleSubject(state);
  // Tomas sugeridas del terreno = los sujetos aereos sesgados a terreno
  // (Terreno completo, Perímetro/colindancias, Acceso/calle, Vista que vende,
  // Cercanía a vialidades, Entorno y colonia), como en el mockup 06-B.
  const shots = (logic.suggestedAerialSubjects(state, 'terreno') || []).map((s) => s.label).filter(Boolean);
  return `<section class="setup">
    <div class="setup-hd"><h2>Armar cuartos</h2><p>Para un terreno no se arman cuartos: es un solo sujeto y los puntos son tomas sugeridas.</p></div>
    ${tipoSeg}
    <div class="setup-block">
      <div class="setup-single"><div class="single-name">${esc(t.subject.nombre)}</div><div class="single-desc">Un solo sujeto · cámara drone + piso</div></div>
    </div>
    <div class="setup-block">
      <label class="setup-lbl sky">Tomas sugeridas del terreno</label>
      <div class="chips suggest sky">${shots.length ? shots.map((s) => `<span class="chip">${esc(s)}</span>`).join('') : '<span class="muted">Sin tomas sugeridas.</span>'}</div>
    </div>
    <button class="primary block" onclick="cerrarSetup()">Listo, a capturar</button>
  </section>`;
}

function chipYaEnFoco(nombre) {
  const focusP = getFocusPiso();
  const n = nombre.toLowerCase();
  return state.espacios.some((e) => !e.parentId && (e.piso || 'Sin piso') === focusP && e.nombre.toLowerCase() === n);
}

function renderSetupList() {
  const pisos = state.pisos && state.pisos.length ? state.pisos : [...new Set(state.espacios.map((e) => e.piso || 'Sin piso'))];
  return pisos.map((p) => {
    const rooms = state.espacios.filter((e) => (e.piso || 'Sin piso') === p && !e.parentId).sort((a, b) => (a.orden || 0) - (b.orden || 0));
    if (!rooms.length) return '';
    return `<div class="setup-piso-group"><div class="setup-piso-name">${esc(p)}</div>${rooms.map(setupRoomRow).join('')}</div>`;
  }).join('');
}

function setupRoomRow(room) {
  // En el piso Drone los sujetos aereos no tienen sub-cuartos (sin closet/bano).
  const drone = logic.isDronePiso(room.piso);
  const subs = state.espacios.filter((e) => e.parentId === room.id).sort((a, b) => (a.orden || 0) - (b.orden || 0));
  return `<div class="setup-room"><span class="setup-room-name">${esc(room.nombre)}</span>
    ${drone ? '' : `<button class="setup-room-sub" onclick="toggleSubPick('${room.id}')">+ sub-cuarto</button>`}
    <button class="setup-room-x" onclick="quitarEspacio('${room.id}')" aria-label="Quitar ${esc(room.nombre)}"><i class="ti ti-x"></i></button></div>
    ${!drone && setupSubFor === room.id ? renderSubPick(room) : ''}
    ${subs.map((s) => `<div class="setup-room sub"><span class="setup-room-name">${esc(s.nombre)}</span>
      <button class="setup-room-x" onclick="quitarEspacio('${s.id}')" aria-label="Quitar ${esc(s.nombre)}"><i class="ti ti-x"></i></button></div>`).join('')}`;
}

// F20 — Selector rapido de sub-cuarto: Closet / Bano de un toque + Otro (texto libre).
function renderSubPick(room) {
  return `<div class="setup-subpick">
    <span class="subpick-lbl">Sub-cuarto de <b>${esc(room.nombre)}</b>:</span>
    <div class="chips">
      <button class="chip" onclick="addSubRapido('${room.id}','Clóset')"><i class="ti ti-plus"></i>Clóset</button>
      <button class="chip" onclick="addSubRapido('${room.id}','Baño')"><i class="ti ti-plus"></i>Baño</button>
      <button class="chip add" onclick="addSubSetup('${room.id}')">Otro…</button>
    </div>
  </div>`;
}

function toggleSubPick(roomId) {
  setupSubFor = setupSubFor === roomId ? null : roomId;
  render();
}

// Agrega un sub-cuarto Closet/Bano de un toque (hereda piso/zona del padre).
function addSubRapido(parentId, nombre) {
  const parent = state.espacios.find((e) => e.id === parentId);
  if (!parent) return;
  nuevoEspacio(nombre, parent.piso, parent.zona, parentId, logic.detectCategoria(nombre));
  setupSubFor = null;
  scheduleSave(); render();
}

function accionesEspacio(id) {
  const sp = state.espacios.find((e) => e.id === id);
  if (!sp) return;
  const esSub = !!sp.parentId;
  abrirModal(`<div class="sheet-head"><h2>${esc(sp.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">
      <button class="btn" onclick="renombrarEspacio('${id}')"><i class="ti ti-pencil"></i> Cambiar nombre</button>
      ${esSub ? '' : `<button class="btn" onclick="addSubSetup('${id}')"><i class="ti ti-plus"></i> Agregar sub-cuarto</button>`}
      ${esSub ? '' : `<button class="btn" onclick="cambiarPisoEspacio('${id}')"><i class="ti ti-stairs"></i> Cambiar de piso</button>`}
      <button class="danger btn" onclick="cerrarModal();quitarEspacio('${id}')"><i class="ti ti-trash"></i> Quitar</button>
    </div>`);
}

function renombrarEspacio(id) {
  const sp = state.espacios.find((e) => e.id === id);
  if (!sp) return;
  abrirModal(`<div class="sheet-head"><h2>Cambiar nombre</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="setup-add"><input class="field" id="rename-input" type="text" value="${esc(sp.nombre)}" autocomplete="off" onkeydown="if(event.key==='Enter')guardarNombreEspacio('${id}')"><button class="btn" onclick="guardarNombreEspacio('${id}')">Guardar</button></div>`);
  setTimeout(() => { const i = document.getElementById('rename-input'); if (i) { i.focus(); i.select(); } }, 50);
}

function guardarNombreEspacio(id) {
  const input = document.getElementById('rename-input');
  const value = input && input.value.trim();
  if (!value) return;
  const sp = state.espacios.find((e) => e.id === id);
  if (!sp) return;
  sp.nombre = value;
  (state.mediaFiles || []).forEach((f) => { if (f.targetId === id) { f.scene = value; f.scenePath = logic.getScenePath(state, id, 'video'); } });
  cerrarModal(); scheduleSave(); render();
}

function cambiarPisoEspacio(id) {
  const sp = state.espacios.find((e) => e.id === id);
  if (!sp) return;
  const pisos = state.pisos && state.pisos.length ? state.pisos : ['Piso 1'];
  abrirModal(`<div class="sheet-head"><h2>Cambiar de piso</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="action-stack">${pisos.map((p) => `<button class="${sp.piso === p ? 'primary' : 'btn'}" onclick="aplicarPisoEspacio('${id}','${esc(p)}')">${esc(p)}</button>`).join('')}</div>`);
}

function aplicarPisoEspacio(id, piso) {
  const sp = state.espacios.find((e) => e.id === id);
  if (sp) {
    sp.piso = piso;
    state.espacios.filter((e) => e.parentId === id).forEach((s) => { s.piso = piso; });
  }
  cerrarModal(); scheduleSave(); render();
}

function nuevoEspacio(nombre, piso, zona, parentId, categoria) {
  const espacio = {
    id: 'esp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    nombre: nombre.trim(), piso, zona: zona || 'interior', parentId: parentId || null,
    clave: false, orden: state.espacios.length + 1,
    categoria: categoria || logic.detectCategoria(nombre),
    estados: { foto: { estado: 'pendiente' }, t360: { estado: 'pendiente' }, video: { estado: 'pendiente' }, drone: { estado: 'pendiente' } },
  };
  state.espacios.push(espacio);
  return espacio;
}

function setSetupTipo(t) {
  setupTipo = t;
  if (state.guide) state.guide.tipoPropiedad = t;
  setupQuery = ''; setupSubFor = null;
  scheduleSave();
  render();
}
function setSetupPiso(p) { setupPiso = p; setupQuery = ''; setupSubFor = null; render(); }
function abrirSetup() {
  setupOpen = true;
  // Re-entrable: arranca con el tipo ya elegido si lo hay.
  if (state.guide && state.guide.tipoPropiedad && TIPO_LABEL[state.guide.tipoPropiedad]) setupTipo = state.guide.tipoPropiedad;
  setupQuery = ''; setupSubFor = null;
  cerrarModal(); render();
}
function cerrarSetup() { setupOpen = false; render(); }

// F20 — Buscador: refresca el dropdown sin perder el foco del input. Como el
// dropdown se re-renderiza dentro del bloque del buscador, guardamos el foco
// y la posicion del cursor para que escribir sea fluido.
function onSetupSearch(value) {
  setupQuery = value;
  render();
  const again = document.getElementById('setup-input');
  if (again) { again.focus(); const n = again.value.length; again.setSelectionRange(n, n); }
}

function agregarCuartoEscrito() {
  const value = setupQuery.trim();
  if (!value) return;
  setupOpen = true;
  // Texto libre: la categoria se detecta (corregible despues con renombrar/acciones).
  nuevoEspacio(value, getFocusPiso(), 'interior', null, logic.detectCategoria(value));
  setupQuery = '';
  scheduleSave();
  render();
  const again = document.getElementById('setup-input');
  if (again) again.focus();
}

// F20 — Agregar desde el dropdown del buscador (searchSpaces). 'match' usa la
// zona/categoria de la biblioteca; 'create' es texto libre. Limpia la busqueda.
function agregarDesdeBusqueda(kind, nombre, zona, categoria) {
  if (kind === 'match' && chipYaEnFoco(nombre)) return;
  setupOpen = true;
  nuevoEspacio(nombre, getFocusPiso(), zona || 'interior', null, categoria || logic.detectCategoria(nombre));
  setupQuery = '';
  scheduleSave();
  render();
}

function agregarCuartoSugerido(nombre, zona, categoria) {
  if (chipYaEnFoco(nombre)) return;
  setupOpen = true;
  // Chip: la categoria queda fijada desde la biblioteca (o se detecta del nombre).
  nuevoEspacio(nombre, getFocusPiso(), zona, null, categoria || logic.detectCategoria(nombre));
  scheduleSave();
  render();
}

// F20 — Sujeto aereo (piso Drone): se agrega como espacio del piso Drone con
// kind:'drone' y zona exterior, para que el motor lo trate como aereo.
function agregarSujetoAereo(nombre) {
  if (chipYaEnFoco(nombre)) return;
  setupOpen = true;
  const espacio = nuevoEspacio(nombre, getFocusPiso(), 'exterior', null, undefined);
  espacio.kind = 'drone';
  scheduleSave();
  render();
}

// F24 — Chips de un toque para añadir el primer piso cuando el estado arranca
// sin pisos. Cada chip llama a confirmarPiso(p), que agrega el piso y lo pone en
// foco. El chip "+ otro…" abre el sheet de agregarPiso() para un nombre libre.
function renderPisoAddChips() {
  const sug = ['Exterior', 'Piso 1', 'Piso 2', 'Amenidades', 'Drone'].filter((p) => !(state.pisos || []).includes(p));
  return `<div class="chips">${sug.map((p) => {
    const dr = logic.isDronePiso(p);
    return `<button class="chip${dr ? ' drone' : ''}" onclick="confirmarPiso('${esc(p)}')">${dr ? '<i class="ti ti-drone"></i>' : '<i class="ti ti-plus"></i>'}${esc(p)}</button>`;
  }).join('')}<button class="chip add" onclick="agregarPiso()"><i class="ti ti-plus"></i>otro…</button></div>`;
}

function agregarPiso() {
  const sug = ['Sótano', 'Piso 1', 'Piso 2', 'Piso 3', 'Roof', 'Exterior', 'Amenidades', 'Casa principal', 'Drone'].filter((p) => !(state.pisos || []).includes(p));
  abrirModal(`<div class="sheet-head"><h2>Agregar piso</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <div class="chips" style="margin-bottom:12px">${sug.map((p) => {
      const dr = logic.isDronePiso(p);
      return `<button class="chip${dr ? ' drone' : ''}" onclick="confirmarPiso('${esc(p)}')">${dr ? '<i class="ti ti-drone"></i>' : '<i class="ti ti-plus"></i>'}${esc(p)}</button>`;
    }).join('')}</div>
    <div class="setup-add"><input class="field" id="piso-input" type="text" placeholder="Otro piso" autocomplete="off" onkeydown="if(event.key==='Enter')confirmarPisoInput()"><button class="btn" onclick="confirmarPisoInput()">Agregar</button></div>`);
}

function confirmarPiso(p) {
  if (!state.pisos) state.pisos = [];
  if (!state.pisos.includes(p)) state.pisos.push(p);
  setupPiso = p;
  cerrarModal(); scheduleSave(); render();
}

function confirmarPisoInput() {
  const value = document.getElementById('piso-input').value.trim();
  if (value) confirmarPiso(value);
}

function quitarPiso(p) {
  if (state.espacios.some((e) => (e.piso || '') === p)) return showToast('Ese piso tiene cuartos');
  state.pisos = (state.pisos || []).filter((x) => x !== p);
  if (setupPiso === p) setupPiso = null;
  scheduleSave(); render();
}

function addSubSetup(parentId) {
  const parent = state.espacios.find((e) => e.id === parentId);
  if (!parent) return;
  abrirModal(`<div class="sheet-head"><h2>Sub-cuarto de ${esc(parent.nombre)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <p class="sheet-note">Cuelga un nivel de ${esc(parent.nombre)} y hereda el piso (${esc(parent.piso || 'Sin piso')}).</p>
    <div class="setup-add"><input class="field" id="sub-input" type="text" placeholder="Baño, clóset, alacena…" autocomplete="off" onkeydown="if(event.key==='Enter')confirmarSub('${parentId}')"><button class="btn" onclick="confirmarSub('${parentId}')">Agregar</button></div>`);
  setTimeout(() => { const i = document.getElementById('sub-input'); if (i) i.focus(); }, 50);
}

function confirmarSub(parentId) {
  const value = document.getElementById('sub-input').value.trim();
  if (!value) return;
  const parent = state.espacios.find((e) => e.id === parentId);
  if (!parent) return;
  // Sub-cuarto: hereda el piso del padre; la categoria se detecta del nombre.
  nuevoEspacio(value, parent.piso, parent.zona, parentId, logic.detectCategoria(value));
  cerrarModal(); scheduleSave(); render();
}

// Quitar con un toque, sin confirmacion; el toast permite deshacer (regresa el
// cuarto y sus sub-cuartos tal cual estaban). Las tomas no se borran del estado.
function quitarEspacio(id) {
  const ids = new Set(logic.getDescendantIds(state, id));
  const sp = state.espacios.find((e) => e.id === id);
  if (!sp) return;
  const removidos = state.espacios.filter((e) => ids.has(e.id));
  state.espacios = state.espacios.filter((e) => !ids.has(e.id));
  if (activeRoomId && ids.has(activeRoomId)) activeRoomId = null;
  scheduleSave(); render();
  showToast(`Quitaste "${sp.nombre}"`, () => {
    removidos.forEach((r) => { if (!state.espacios.some((e) => e.id === r.id)) state.espacios.push(r); });
    scheduleSave(); render();
  }, 'Deshacer');
}

function renderTemplateCard(key) {
  const template = logic.TEMPLATE_DEFS[key];
  return `<button class="template-card ${key === 'amenidades' ? 'featured' : ''}" onclick="abrirTemplate('${key}')">
    <strong>${esc(template.label)}</strong>
    <span>${esc(template.description)}</span>
  </button>`;
}

function renderSummary() {
  const summary = logic.getPendingSummary(state);
  const pct = summary.totalRequired ? Math.round(summary.totalDone / summary.totalRequired * 100) : 0;
  const risk = getPrimaryRisk(summary);
  return `<section class="summary-card">
    <div class="summary-top">
      <div><div class="summary-title">${summary.keyPending.length ? `Faltan ${summary.keyPending.length} claves` : 'Claves listas'}</div><div class="summary-risk ${risk.ok ? 'ok' : ''}">${esc(risk.text)}</div></div>
      <div class="progress-block"><div class="progress-num">${summary.totalDone}/${summary.totalRequired} listo</div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>
    </div>
    <div class="summary-tags">
      ${Object.entries(summary.byService).map(([key, item]) => `<span class="tag ${item.pending.length ? '' : 'ok'}">${SERVICE_UI[key].short} ${item.done}/${item.required}</span>`).join('')}
    </div>
  </section>`;
}

function getPrimaryRisk(summary) {
  const amenities = summary.byZone.amenidades || {};
  const amenityRisk = ['video', 't360', 'foto'].find((key) => amenities[key] && amenities[key].pending.length);
  if (amenityRisk) return { text: `Riesgo principal: Amenidades sin ${SERVICE_UI[amenityRisk].short}`, ok: false };
  if (summary.keyPending.length) return { text: `Riesgo principal: ${summary.keyPending[0].nombre} sin ${SERVICE_UI[summary.keyPending[0].service].short}`, ok: false };
  if (summary.byService.drone && summary.byService.drone.pending.length) return { text: 'Riesgo principal: Drone incompleto', ok: false };
  if (summary.totalPending) return { text: `${summary.totalPending} registros normales pendientes`, ok: false };
  return { text: 'Sin riesgos pendientes', ok: true };
}

function renderCaptureView() {
  if (state.modoActual === 'asesor') return renderAsesorCapture();
  if (isMediaMode()) return renderMediaCapture();
  return coberturaVista() === 'rejilla' ? renderCoverage() : renderCoberturaFoco();
}

function coberturaVista() { return localStorage.getItem('checklist_cov_' + (TOKEN || 'demo')) || 'foco'; }
function setCoberturaVista(v) { localStorage.setItem('checklist_cov_' + (TOKEN || 'demo'), v); render(); }

function renderCoberturaFoco() {
  const target = activeTarget();
  if (!target) {
    return `<div class="empty"><h2>Sin cuartos todavía</h2><p>Agrega cuartos para marcar cobertura.</p><button class="primary" onclick="abrirSetup()" style="margin-top:12px">Armar cuartos</button></div>`;
  }
  const svc = state.modoActual;
  const st = (target.estados[svc] || {}).estado || 'pendiente';
  const piso = target.piso || 'Sin piso';
  const parentName = target.parentId ? (state.espacios.find((e) => e.id === target.parentId) || {}).nombre : '';
  const ord = recorridoEspacios(svc);
  const total = ord.length;
  const hechos = ord.filter((id) => { const e = state.espacios.find((x) => x.id === id); return e && (e.estados[svc] || {}).estado === 'hecho'; }).length;
  return `
  <section class="cap-focus">
    <div class="cap-focus-head">
      <div class="cap-focus-copy">
        <span class="cap-floor"><i class="ti ti-stairs-up"></i>${esc(piso)}</span>
        <h2 class="cap-room">${parentName ? `<span class="cap-parent">${esc(parentName)}</span>` : ''}${esc(target.nombre)}</h2>
      </div>
      <button class="cap-focus-opts" onclick="abrirAccionesFoco()" aria-label="Opciones del cuarto"><i class="ti ti-dots-vertical"></i></button>
    </div>
  </section>
  <div class="cov-foco-state ${st}"><i class="ti ti-${st === 'hecho' ? 'circle-check-filled' : st === 'no_aplica' ? 'circle-minus' : 'circle'}"></i>${st === 'hecho' ? 'Listo' : st === 'no_aplica' ? 'No aplica' : 'Pendiente'}</div>
  ${renderCapNav('cuarto', 'abrirCambiarCuarto()')}
  <div class="cov-foco-prog">${hechos}/${total} cuartos listos · <button class="cov-vertodos" onclick="setCoberturaVista('rejilla')">ver todos</button></div>
  <div class="cap-thumb">
    <button class="cap-btn-toma" onclick="coberturaListo('${target.id}')"><span class="cap-toma-lbl">Listo</span></button>
    <button class="cap-btn-no" onclick="coberturaNoAplica('${target.id}')"><i class="ti ti-circle-minus"></i><span>No aplica</span></button>
  </div>`;
}

function coberturaListo(id) {
  const sp = state.espacios.find((e) => e.id === id);
  if (!sp) return;
  sp.estados[state.modoActual] = { estado: 'hecho', autor: miNombre() };
  activeRoomId = id; localStorage.setItem(roomKey(), id);
  scheduleSave(); render();
  siguienteCuarto(1);
}

function coberturaNoAplica(id) {
  const sp = state.espacios.find((e) => e.id === id);
  if (!sp) return;
  sp.estados[state.modoActual] = { estado: 'no_aplica' };
  activeRoomId = id; localStorage.setItem(roomKey(), id);
  scheduleSave(); render();
  siguienteCuarto(1);
}

function asesorFilesForPunto(puntoId) {
  return (state.mediaFiles || []).filter((f) => (f.cameraId === 'sony-asesor' || f.cameraId === 'osmo-asesor') && f.targetId === puntoId);
}

function renderAsesorCapture() {
  const puntos = state.asesorPuntos || [];
  if (!puntos.length) {
    return `<div class="empty"><h2>Sin puntos todavía</h2><p>Agrega los puntos del asesor para empezar.</p><button class="primary" style="margin-top:12px" onclick="agregarPunto(false)">Agregar punto</button></div>`;
  }
  const punto = activeTarget();
  const esVoz = punto.tipo === 'voz';
  const sony = logic.getCameraSequence(state, 'sony-asesor');
  const osmo = logic.getCameraSequence(state, 'osmo-asesor');
  const files = asesorFilesForPunto(punto.id);
  const pairsMap = {};
  files.forEach((f) => { (pairsMap[f.pairId] = pairsMap[f.pairId] || []).push(f); });
  const pairList = Object.values(pairsMap);
  const goodCount = pairList.filter((p) => p[0].kind !== 'discard' && p.some((f) => f.good)).length;
  const nextLabel = esVoz ? (osmo.nextToken || '—') : `${sony.nextToken || '—'} + ${osmo.nextToken || '—'}`;
  return `
  <section class="cap-focus">
    <div class="cap-focus-head">
      <div class="cap-focus-copy">
        <span class="cap-floor"><i class="ti ti-microphone-2"></i>${esVoz ? 'Voz en off · solo audio' : 'Punto · Sony + Osmo'}</span>
        <h2 class="cap-room">${esc(punto.nombre)}</h2>
      </div>
      <button class="cap-focus-opts" onclick="abrirAccionesFoco()" aria-label="Opciones del punto"><i class="ti ti-dots-vertical"></i></button>
    </div>
  </section>
  <div class="cap-cam asesor-cam">
    ${esVoz ? '' : asesorCamRow('Sony FX30', 'video', sony, 'sony-asesor')}
    ${asesorCamRow('Osmo + DJI Mic', 'audio', osmo, 'osmo-asesor')}
  </div>
  ${renderCapNav('punto', 'abrirCambiarPunto()')}
  <section class="cap-takes">
    <div class="cap-takes-hd"><span>Tomas de este punto</span><span class="cap-takes-n">${pairList.length} · ${goodCount} buena${goodCount === 1 ? '' : 's'}</span></div>
    ${pairList.length ? renderAsesorPairs(pairList) : `<p class="cap-empty">Aún no registras nada aquí. Da Toma cuando graben.</p>`}
  </section>
  <div class="cap-thumb">
    <button class="cap-btn-toma" onclick="registrarAsesor('${punto.id}','take')"><span class="cap-toma-lbl">Toma</span><span class="cap-toma-sub">${esc(nextLabel)}</span></button>
    <button class="cap-btn-no" onclick="registrarAsesor('${punto.id}','discard')"><i class="ti ti-circle-x"></i><span>No sirve</span></button>
  </div>`;
}

function asesorCamRow(label, role, seq, cameraId) {
  return `<div class="asesor-cam-row">
    <span class="asesor-cam-role"><i class="ti ti-${role === 'audio' ? 'microphone' : 'video'}"></i></span>
    <div class="asesor-cam-copy"><div class="asesor-cam-lbl">${esc(label)}</div>
      <div class="cap-cam-next">${seq.nextToken ? `siguiente · <b>${esc(seq.nextToken)}</b>` : 'inicia la secuencia'}</div></div>
    <button class="cap-swap" onclick="abrirSecuenciaAsesor('${cameraId}')" aria-label="Secuencia"><i class="ti ti-${seq.nextToken ? 'refresh' : 'player-play'}"></i></button>
  </div>`;
}

function renderAsesorPairs(pairList) {
  return pairList.slice().reverse().map((pair, i) => {
    const sony = pair.find((f) => f.cameraId === 'sony-asesor');
    const osmo = pair.find((f) => f.cameraId === 'osmo-asesor');
    const isDiscard = pair[0].kind === 'discard';
    const good = pair.some((f) => f.good);
    const target = sony || osmo;
    const tokens = sony ? `${esc(sony.fileToken)} <span class="pair-plus">+</span> ${esc(osmo.fileToken)}` : esc(osmo.fileToken);
    const right = isDiscard
      ? `<span class="cap-badge fail"><i class="ti ti-x"></i>${esc(discardShort(pair[0]))}</span>`
      : good ? `<span class="cap-badge good"><i class="ti ti-star-filled"></i>buena</span>`
             : `<button class="cap-mark" onclick="toggleBuena('${target.id}')"><i class="ti ti-star"></i>Marcar buena</button>`;
    const note = pair.map((f) => f.note).filter(Boolean)[0];
    return `<div class="cap-take${i === 0 ? ' latest' : ''}">
      <button class="cap-take-main" onclick="agregarNotaArchivo('${target.id}')"><span class="cap-tok asesor-tok">${tokens}</span><span class="cap-take-meta">${sony ? 'Sony + Osmo' : 'Solo audio'}${pair[0].author ? ' · ' + esc(pair[0].author) : ''}${note ? ' · ' + esc(note) : ''}</span></button>
      ${right}</div>`;
  }).join('');
}

function registrarAsesor(puntoId, kind) {
  const punto = (state.asesorPuntos || []).find((p) => p.id === puntoId);
  if (!punto) return;
  const cams = punto.tipo === 'voz' ? ['osmo-asesor'] : ['sony-asesor', 'osmo-asesor'];
  for (let i = 0; i < cams.length; i++) {
    if (!logic.getCameraSequence(state, cams[i]).segment) return abrirSecuenciaAsesor(cams[i]);
  }
  const prev = state;
  state = logic.registerAsesorFile(state, { puntoId, kind, discardReason: kind === 'discard' ? 'failed' : null, autor: miNombre(), now: new Date() });
  if (state === prev) return showToast('Inicia las secuencias primero');
  activeRoomId = puntoId; localStorage.setItem(roomKey(), puntoId);
  render(); scheduleSave();
  const last = state.mediaFiles[state.mediaFiles.length - 1];
  if (kind === 'discard') {
    showToast('Fallida registrada', () => abrirMotivoDescarte(last.id), '¿qué fue?');
  } else {
    showToast('Toma registrada', () => { state = prev; render(); scheduleSave(); }, 'Deshacer');
  }
}

function puntoRow(punto) {

function listaDe(tipo) { return tipo === 'drone' ? state.droneItems : state.asesorPuntos; }

function listaRow(tipo, item) {

  return `<div class="cuarto-row-wrap">

function moverLista(tipo, id, dir) {
  const list = listaDe(tipo) || [];
  const sorted = list.slice().sort((a, b) => (a.ordenLista || 0) - (b.ordenLista || 0));
  sorted.forEach((e, idx) => { e.ordenLista = idx + 1; });
  const i = sorted.findIndex((e) => e.id === id);
  const j = i + dir;
  if (j < 0 || j >= sorted.length) return;
  const t = sorted[i].ordenLista; sorted[i].ordenLista = sorted[j].ordenLista; sorted[j].ordenLista = t;
  scheduleSave();
  tipo === 'drone' ? abrirCambiarCuarto() : abrirCambiarPunto();
}

function accionesLista(tipo, id) {
  const item = (listaDe(tipo) || []).find((e) => e.id === id);

function renombrarLista(tipo, id) {

function delLista(tipo, id) {

let covHighlightPend = false;

function renderCoverage() {

      <div><h2 class="cov-title">${esc(SERVICE_UI[svc].label)}</h2><p class="cov-sub">Toca un cuarto para marcar su cobertura.</p></div>
      <button class="cov-edit" onclick="abrirSetup()" aria-label="Armar cuartos"><i class="ti ti-home-cog"></i></button>
    </div>
    <button class="cov-sumbar${covHighlightPend ? ' on' : ''}" onclick="toggleCovHighlight()" aria-pressed="${covHighlightPend}">
      <span>${total} cuarto${total === 1 ? '' : 's'}</span>
      <span>${pendTxt}${naTxt}</span>
    </button>
    <div class="cov-body${covHighlightPend ? ' hl-pend' : ''}">

const COV_CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 6"/></svg>';

function covTile(room, svc) {
  const st = (room.estados[svc] || {}).estado || 'pendiente';
  const label = st === 'hecho' ? 'listo' : st === 'no_aplica' ? 'no aplica' : 'pendiente';
  const mark = st === 'hecho' ? `<span class="cov-check">${COV_CHECK_SVG}</span>` : '';
  return `<button class="cov-tile ${st}${room.parentId ? ' sub' : ''}" onclick="cycleCobertura('${room.id}')">
    <span class="cov-name">${esc(room.nombre)}</span>
    <span class="cov-state">${mark}${label}</span>
  </button>`;
}

function cycleCobertura(id) {
  const svc = state.modoActual;
  const sp = state.espacios.find((e) => e.id === id);
  if (!sp) return;
  const cur = (sp.estados[svc] || {}).estado || 'pendiente';
  const nextSt = cur === 'pendiente' ? 'hecho' : cur === 'hecho' ? 'no_aplica' : 'pendiente';
  sp.estados[svc] = nextSt === 'hecho' ? { estado: 'hecho', autor: miNombre() } : { estado: nextSt };
  scheduleSave();
  render();
}

function activeTarget() {
  // Tras F2 el drone comparte espacios; ya no usa state.droneItems.
  const list = state.modoActual === 'asesor' ? (state.asesorPuntos || [])
    : state.espacios;
  if (!list.length) return null;
  if (activeRoomId) {
    const found = list.find((item) => item.id === activeRoomId);
    if (found) return found;
  }
  const camera = activeCamera();
  if (camera) {
    const cameraIds = new Set((state.cameras || []).filter((c) => c.mode === camera.mode).map((c) => c.id));
    const files = (state.mediaFiles || []).filter((f) => cameraIds.has(f.cameraId) && f.targetId);
    if (files.length) {
      const last = list.find((item) => item.id === files[files.length - 1].targetId);
      if (last) return last;
    }
  }
  return list[0];
}

// ===== Recorrido (orden de cuartos por servicio) + Siguiente cuarto =====
function pisoIndex(piso) {
  const pisos = state.pisos || [];
  const i = pisos.indexOf(piso || '');
  return i < 0 ? 999 : i;
}

function recorridoEspacios(servicio) {
  const def = state.espacios.slice().sort((a, b) => {
    const pa = pisoIndex(a.piso), pb = pisoIndex(b.piso);
    return pa !== pb ? pa - pb : (a.orden || 0) - (b.orden || 0);
  });
  const stored = (state.recorrido && state.recorrido[servicio]) || [];
  const ids = state.espacios.map((e) => e.id);
  const valid = stored.filter((id) => ids.includes(id));
  const missing = def.filter((e) => !valid.includes(e.id)).map((e) => e.id);
  return [...valid, ...missing];
}

function recorridoTargets(servicio) {
  // Drone comparte espacios tras F2: usa el mismo recorrido que video.
  if (servicio === 'asesor') return (state.asesorPuntos || []).slice().sort((a, b) => (a.ordenLista || 0) - (b.ordenLista || 0)).map((t) => t.id);
  return recorridoEspacios(servicio);
}

function esPendiente(id, servicio) {
  // Drone comparte espacios tras F2: su pendiente se lee del estado por servicio.
  if (servicio === 'asesor') { const it = (state.asesorPuntos || []).find((x) => x.id === id); return !!it && it.estado !== 'hecho'; }
  const sp = state.espacios.find((x) => x.id === id);
  if (!sp) return false;
  const st = (sp.estados[servicio] || {}).estado;
  return st !== 'hecho' && st !== 'no_aplica';
}

function primerEnRecorrido(soloPendiente) {
  const servicio = state.modoActual;
  const orden = recorridoTargets(servicio);
  for (let i = 0; i < orden.length; i++) { if (!soloPendiente || esPendiente(orden[i], servicio)) return orden[i]; }
  return null;
}

function siguienteCuarto(dir) {
  const servicio = state.modoActual;
  const orden = recorridoTargets(servicio);
  if (!orden.length) return;
  const cur = (activeTarget() || {}).id;
  let i = orden.indexOf(cur);
  if (i < 0) i = dir > 0 ? -1 : orden.length;
  for (let k = 1; k <= orden.length; k++) {
    const idx = i + dir * k;
    if (idx < 0 || idx >= orden.length) break;
    if (esPendiente(orden[idx], servicio)) return setActiveRoom(orden[idx]);
  }
  showToast(dir > 0 ? 'No hay más cuartos pendientes adelante' : 'No hay anteriores pendientes');
}

function abrirOrdenarRecorrido() {
  const servicio = state.modoActual;
  const esEspacio = servicio !== 'drone' && servicio !== 'asesor';
  const orden = recorridoTargets(servicio);
  const lista = esEspacio ? state.espacios : servicio === 'drone' ? state.droneItems : state.asesorPuntos;
  const nombre = (id) => { const t = lista.find((x) => x.id === id); return t ? t.nombre : ''; };

  let body;
  if (esEspacio) {
    const pisos = (state.pisos && state.pisos.length ? state.pisos : [...new Set(state.espacios.map((e) => e.piso || 'Sin piso'))]);
    const byPiso = {};
    orden.forEach((id) => {
      const esp = state.espacios.find((x) => x.id === id);
      const p = (esp && esp.piso) || 'Sin piso';
      (byPiso[p] = byPiso[p] || []).push(id);
    });
    let globalNum = 0;
    body = pisos.filter((p) => byPiso[p] && byPiso[p].length).map((p) => {
      const ids = byPiso[p];
      const rows = ids.map((id, idx) => {
        globalNum++;
        const isFirst = idx === 0;
        const isLast = idx === ids.length - 1;
        return `<div class="cuarto-row-wrap">
          <span class="cuarto-row"><span class="cuarto-name"><span class="rec-num">${globalNum}</span>${esc(nombre(id))}</span></span>
          <button class="setup-mini" onclick="moverRecorrido('${id}',-1)" aria-label="Subir"${isFirst ? ' disabled' : ''}><i class="ti ti-chevron-up"></i></button>
          <button class="setup-mini" onclick="moverRecorrido('${id}',1)" aria-label="Bajar"${isLast ? ' disabled' : ''}><i class="ti ti-chevron-down"></i></button>
        </div>`;
      }).join('');
      return `<div class="rec-piso-label">${esc(p)}</div>${rows}`;
    }).join('');
  } else {
    body = orden.map((id, i) => `<div class="cuarto-row-wrap">
      <span class="cuarto-row"><span class="cuarto-name"><span class="rec-num">${i + 1}</span>${esc(nombre(id))}</span></span>
      <button class="setup-mini" onclick="moverRecorrido('${id}',-1)" aria-label="Subir"${i === 0 ? ' disabled' : ''}><i class="ti ti-chevron-up"></i></button>
      <button class="setup-mini" onclick="moverRecorrido('${id}',1)" aria-label="Bajar"${i === orden.length - 1 ? ' disabled' : ''}><i class="ti ti-chevron-down"></i></button>
    </div>`).join('');
  }

  abrirModal(`<div class="sheet-head"><h2>Ordenar recorrido · ${esc(SERVICE_UI[servicio].short)}</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <p class="sheet-note">El orden en que "Siguiente cuarto" te lleva. Se ordena dentro de cada piso.</p>
    <div class="cuarto-list">${body}</div>`);
}

function moverRecorrido(id, dir) {
  const servicio = state.modoActual;
  if (servicio === 'drone' || servicio === 'asesor') return moverLista(servicio, id, dir);
  const orden = recorridoEspacios(servicio);
  const i = orden.indexOf(id), j = i + dir;
  if (j < 0 || j >= orden.length) return;
  const espI = state.espacios.find((x) => x.id === orden[i]);
  const espJ = state.espacios.find((x) => x.id === orden[j]);
  if (!espI || !espJ || espI.piso !== espJ.piso) return;
  const t = orden[i]; orden[i] = orden[j]; orden[j] = t;
  if (!state.recorrido) state.recorrido = {};
  state.recorrido[servicio] = orden;
  scheduleSave();
  abrirOrdenarRecorrido();
}

function renderCapNav(label, changeFn) {
  return `<div class="cap-nav">
    <button class="cap-nav-prev" onclick="siguienteCuarto(-1)" aria-label="Anterior"><i class="ti ti-chevron-left"></i></button>
    <button class="cap-nav-change" onclick="${changeFn}"><i class="ti ti-arrows-exchange"></i> Cambiar ${esc(label)}</button>
    <button class="cap-nav-next" onclick="siguienteCuarto(1)">Siguiente <i class="ti ti-chevron-right"></i></button>
  </div>`;
}

// F26 — barra de navegacion de cuarto para el loop vivo (renderMediaCapture).
// El header ya ofrece "Cuartos" (abrirCambiarCuarto) como home para elegir
// destino, asi que aqui la barra entrega solo anterior / Cambiar / siguiente sin
// duplicar ese chevron: usa siguienteCuarto(±1) (respeta recorrido y limites de
// piso) y, segun el contexto del target, ofrece "Cambiar" hacia el dialogo
// correcto — abrirCambiarPunto() si el target es punto/sujeto y existe, o
// abrirCambiarCuarto() (drone y cuartos normales). Los extremos los maneja
// siguienteCuarto (muestra toast y no rompe la captura).
function renderLoopNav(isDrone, target) {
  const esPunto = !isDrone && target && target.tipo && target.tipo !== 'drone'
    && typeof abrirCambiarPunto === 'function';
  const label = esPunto ? 'punto' : 'cuarto';
  const changeFn = esPunto ? 'abrirCambiarPunto()' : 'abrirCambiarCuarto()';
  return renderCapNav(label, changeFn);
}

function discardShort(file) {
  return { empty: 'vacío', failed: 'fallida', unrelated: 'no relacionado' }[file.discardReason] || 'descarte';
}

// F21 — Terreno: materializa el sujeto unico "El terreno" en state.espacios una
// sola vez (cuando guide.tipoPropiedad === 'terreno' y no hay ya espacios), para
// que el loop de captura tenga un target. Es exterior + kind drone, asi
// camerasForEspacio ofrece Sony/Osmo + drones y suggestionsForTarget devuelve las
// tomas aereas del terreno (terreno_completo). Aditivo: si ya hay espacios, no toca.
function materializarTerrenoSiAplica() {
  const t = logic.terrenoSingleSubject(state);
  if (!t.isTerreno) return;
  if (!Array.isArray(state.espacios)) state.espacios = [];
  if (state.espacios.some((e) => e && e.id === t.subject.id)) return;
  if (state.espacios.length) return;
  const espacio = nuevoEspacio(t.subject.nombre, t.subject.piso || 'Exterior', 'exterior', null, undefined);
  espacio.id = t.subject.id;
  espacio.kind = 'drone';
  espacio.clave = true;
  activeRoomId = espacio.id;
  localStorage.setItem(roomKey(), espacio.id);
  scheduleSave();
}

// ===== F7 — Loop de captura (3 capas, segun mockup 02-loop-captura) =====
function renderMediaCapture() {
  // F21 — Terreno: el loop opera contra el sujeto unico ("El terreno") con sus
  // tomas aereas sugeridas. Si la propiedad es terreno y aun no existe el sujeto
  // en state.espacios, se materializa una sola vez (zona exterior + kind drone)
  // para que el loop tenga target; sus sugerencias salen de suggestionsForTarget.
  materializarTerrenoSiAplica();
  const target = activeTarget();
  if (!target) {
    return `<div class="empty"><h2>Sin espacios todavía</h2><p>Agrega cuartos para empezar a registrar.</p><button class="primary" onclick="abrirSetup()" style="margin-top:12px">Armar cuartos</button></div>`;
  }
  // F21 — la camara disponible la decide el espacio (camerasForEspacio, F18), no
  // el rol: piso Drone -> solo drones; Exterior/Roof/Amenidades -> Sony/Osmo +
  // drones; interiores -> solo Sony/Osmo (el drone NO aparece en interiores). Si
  // la camara activa no aplica a este espacio, se reencuadra a la primera valida
  // (en piso Drone eso entra en drone por defecto).
  const camsForTarget = logic.camerasForEspacio(state, target);
  reencuadrarCamaraSiAplica(target, camsForTarget);
  const isDrone = state.modoActual === 'drone';
  const camera = activeCamera();
  const seq = camera && logic.getCameraSequence(state, camera.id);
  const nextTok = seq && seq.nextToken;
  const files = mediaFilesForTarget(target.id);
  const good = files.filter((f) => f.kind === 'take' && f.good);
  const piso = isDrone ? 'Drone' : (target.piso || 'Sin piso');
  const parentName = !isDrone && target.parentId ? (state.espacios.find((e) => e.id === target.parentId) || {}).nombre : '';
  const noAplicaVideo = state.modoActual === 'video' && target.estados && (target.estados.video || {}).estado === 'no_aplica';

  // Header con regreso a Cuartos + nombre + piso (mockup 02)
  const head = `
  <section class="cap-focus">
    <div class="cap-focus-head">
      <div class="cap-focus-copy">
        <h2 class="cap-room">${parentName ? `<span class="cap-parent">${esc(parentName)}</span>` : ''}${esc(target.nombre)}</h2>
        <span class="cap-floor"><i class="ti ti-stairs-up"></i>${esc(piso)}</span>
      </div>
      <button class="cap-focus-opts" onclick="abrirAccionesFoco()" aria-label="Opciones del cuarto"><i class="ti ti-dots-vertical"></i></button>
    </div>
    ${renderLoopNav(isDrone, target)}
  </section>`;

  if (noAplicaVideo) {
    return `${head}
    <section class="cap-takes"><p class="cap-empty">Este cuarto no lleva video.</p></section>
    <div class="cap-thumb"><button class="cap-btn-toma" style="grid-column:1 / -1" onclick="reactivarVideoFoco()">Reactivar video aquí</button></div>`;
  }

  // Capa 1 — switch de camara (camerasForEspacio, F18/F21) + token del siguiente archivo
  const camStrip = renderCapCamSwitch(camera, isDrone, nextTok, camsForTarget);

  // Capa 2 — sugerencias (tira plegable, secundaria) — etiqueta la proxima toma
  const sugStrip = renderCapSugStrip(target, isDrone);

  // Capa 3 — toma recien hecha (favorita/buena/describir, sin scroll)
  const latestTake = files.length ? files[files.length - 1] : null;
  const latestPanel = (latestTake && latestTake.kind === 'take') ? renderCapLatest(latestTake) : '';

  // Etiqueta de la proxima toma para el boton Toma
  let tomaSubLabel = '';
  if (pendingShotType || pendingMovement) {
    tomaSubLabel = `<span class="cap-toma-sub">${esc(pendingTakeLabel())}</span>`;
  } else if (nextTok) {
    tomaSubLabel = `<span class="cap-toma-sub">+1 · ${esc(nextTok)}</span>`;
  }

  return `${head}
  ${camStrip}
  ${sugStrip}
  <section class="cap-takes">
    <div class="cap-takes-hd"><span>Tomas en ${isDrone ? 'esta toma' : 'este cuarto'}</span><span class="cap-takes-n">${files.length} · ${good.length} buena${good.length === 1 ? '' : 's'}</span></div>
    ${files.length ? renderCapTakes(files) : `<p class="cap-empty">Aún no registras nada aquí. Da Toma cuando grabes.</p>`}
  </section>
  ${latestPanel}
  <div class="cap-thumb">
    <button class="cap-btn-toma" onclick="darToma('${esc(target.id)}')"><span class="cap-toma-lbl">Toma</span>${tomaSubLabel}</button>
    <button class="cap-btn-no" onclick="noSirve('${esc(target.id)}')"><i class="ti ti-circle-x"></i><span>No sirve</span></button>
  </div>`;
}

// F21 — reencuadre de camara por espacio: si la camara activa no esta entre las
// validas para este espacio (camerasForEspacio), conmuta a la primera valida y
// fija su modo. Asi un espacio interior nunca queda con el drone activo, y un
// espacio del piso Drone entra en drone por defecto. Reusa setCamera SIN abrir el
// loop a deltas de render (no llama render/scheduleSave; es idempotente en cada
// renderMediaCapture). Aditivo: si la camara ya aplica, no toca nada.
function reencuadrarCamaraSiAplica(target, camsForTarget) {
  if (!Array.isArray(camsForTarget) || !camsForTarget.length) return;
  const actual = activeCamera();
  if (actual && camsForTarget.some((c) => c.id === actual.id)) return;
  const elegida = camsForTarget[0];
  if (!state.activeCameraByMode) state.activeCameraByMode = {};
  if (elegida.mode) {
    state.modoActual = elegida.mode;
    state.activeCameraByMode[elegida.mode] = elegida.id;
    localStorage.setItem(laneKey(), elegida.mode);
  } else {
    state.activeCameraByMode[state.modoActual] = elegida.id;
  }
}

// Capa 1 — switch de camara como segmented control + token grande + (drone) + foto
// F21 — el switch usa camerasForEspacio (F18), no el filtro por rol de F14: el
// drone solo es alcanzable en piso Drone / exteriores (Exterior, Roof, Amenidades),
// nunca en interiores, y muestra AMBOS drones (Air 3 / Mini 4 Pro) donde aplica,
// cada uno con su contador propio. Elegir una camara cambia el modo activo (ver
// setCamera). camsForTarget se calcula en renderMediaCapture.
function renderCapCamSwitch(camera, isDrone, nextTok, camsForTarget) {
  const cams = Array.isArray(camsForTarget) ? camsForTarget : [];
  const segHtml = cams.length
    ? `<div class="seg cap-cam-seg">${cams.map((c) => `<button class="seg-btn${camera && camera.id === c.id ? ' active' : ''}" onclick="setCamera('${esc(c.id)}')">${esc(c.label)}</button>`).join('')}</div>`
    : `<div class="cap-cam-lbl">Sin cámara</div>`;
  const tokenHtml = nextTok
    ? `<div class="cap-next"><span class="cap-next-lbl">siguiente ${isDrone ? 'video' : 'archivo'}</span><span class="cap-token">${esc(nextTok)}</span></div>`
    : `<button class="cap-next-init" onclick="abrirSecuencia()"><i class="ti ti-player-play"></i>inicia la secuencia antes de grabar</button>`;
  const dronePhoto = (isDrone && nextTok)
    ? `<button class="cap-foto-btn" onclick="agregarFotoDrone()"><i class="ti ti-plus"></i>foto</button>`
    : '';
  return `<div class="cap-cam2">
    ${segHtml}
    <div class="cap-next-row">${tokenHtml}${dronePhoto}</div>
  </div>`;
}

// F15 — etiquetas curadas user-facing del plano (Abierto = general, Detalle = detalle).
// El motor mantiene los labels largos ("Plano general"); aqui se muestran cortos.
const PLANO_LABELS = { general: 'Abierto', detalle: 'Detalle' };

// SVGs de los 7 movimientos reales (copiados del mockup recomendacion.html).
const MOV_SVGS = {
  push_in:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 12h3M17 12h-3M11 10l2 2-2 2M15 10l-2 2 2 2"/></svg>',
  pull_out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 12H7M14 12h3M9 10l-2 2 2 2M15 10l2 2-2 2"/></svg>',
  pan:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>',
  tilt:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg>',
  travel:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="9" width="7" height="6" rx="1"/><path d="M15 12h5M18 10l2 2-2 2"/></svg>',
  orbit:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="12" rx="9" ry="5"/><path d="M11 7l3 1.5-3 1.5"/></svg>',
  reveal:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 4v16M6 12h11M14 8l4 4-4 4"/></svg>',
};

function planoLabel(id) {
  const shotTypes = logic.getShotTypes();
  return PLANO_LABELS[id] || (shotTypes[id] || {}).label || id;
}

// F16 — las sugerencias del motor usan ids historicos (wide, pov, gimbal_walk...).
// Para el detalle de opcion B se normalizan al vocabulario curado del panel
// (Abierto/Detalle + 7 movimientos), que es lo que ve y graba el usuario.
const SHOT_TO_CURATED = {
  general: 'general', wide: 'general', medio: 'general', pov: 'general',
  transicion: 'general', contrapicado: 'general', ventana: 'general',
  reveal: 'general', simetrica: 'general', exterior: 'general',
  detalle: 'detalle', textura: 'detalle',
};
const MOV_TO_CURATED = {
  push_in: 'push_in', pull_out: 'pull_out', pan: 'pan', tilt: 'tilt',
  travel: 'travel', orbit: 'orbit', reveal: 'reveal',
  // historicos -> mejor equivalente curado
  static: 'push_in', dolly: 'travel', gimbal_walk: 'travel', umbral: 'reveal',
  parallax: 'travel', tilt_up: 'tilt', slider: 'travel', tracking: 'travel',
  pedestal: 'tilt', whip: 'pan',
};
function curatedPlano(shotType) {
  if (!shotType) return null;
  return SHOT_TO_CURATED[shotType] || 'general';
}
function curatedMovement(movement) {
  if (!movement) return null;
  return MOV_TO_CURATED[movement] || movement;
}

// Capa 2 — panel "Sugeridas para [cuarto]" plegable (F16, opcion B).
// Expandido sin seleccion: solo la lista de sugerencias del cuarto (glanceable) + chip Libre.
// Al tocar una sugerencia (o Libre) se despliega el detalle: guia + Plano + Movimiento.
function renderCapSugStrip(target, isDrone) {
  const movements = logic.getMovements();
  const planoIds = (logic.CURATED_SHOT_TYPES || ['general', 'detalle']);
  const movIds = (logic.CURATED_MOVEMENTS || ['push_in', 'pull_out', 'pan', 'tilt', 'travel', 'orbit', 'reveal']).filter((id) => movements[id]);

  // Sugerencias del cuarto (video o drone segun modoActual).
  const suggestions = logic.suggestionsForTarget(state, state.modoActual, target) || [];
  const progress = suggestions.map((s) => ({
    s,
    done: logic.suggestionProgress(state, state.modoActual, target.id, s.id).done,
  }));
  const doneN = progress.filter((p) => p.done).length;

  const cuartoLbl = isDrone ? 'el dron' : (target.nombre || 'este cuarto');

  // Linea colapsada: cuenta de sugerencias hechas, o la etiqueta activa.
  let selLine;
  if (activeSugId || tagLibre || pendingShotType || pendingMovement) {
    const parts = [];
    if (pendingShotType) parts.push(planoLabel(curatedPlano(pendingShotType) || pendingShotType));
    if (pendingMovement) parts.push((movements[curatedMovement(pendingMovement)] || movements[pendingMovement] || {}).label || pendingMovement);
    selLine = parts.length ? `<b>${esc(parts.join(' · '))}</b>` : '<b>Libre</b>';
  } else {
    selLine = `<b>${doneN} / ${suggestions.length}</b>`;
  }

  // Chips de sugerencias del cuarto, con palomita las ya hechas.
  const sugChips = progress.map(({ s, done }) => {
    const sel = activeSugId === s.id;
    const check = done ? `<i class="ti ti-check"></i>` : '';
    return `<button class="chip cap-sug-chip${done ? ' done' : ''}${sel ? ' sel' : ''}" onclick="seleccionarSugerencia('${esc(s.id)}')">${check}${esc(s.nombre || s.id)}</button>`;
  }).join('');
  const libreChip = `<button class="chip cap-libre-chip${tagLibre ? ' sel' : ''}" onclick="entrarLibre()"><i class="ti ti-plus"></i>Libre</button>`;

  // Detalle (plano + movimiento) — solo si hay sugerencia activa o modo libre.
  let detailHtml = '';
  if (activeSugId || tagLibre) {
    const activeSug = activeSugId ? logic.findSuggestion(activeSugId, state) : null;
    const guideTxt = activeSug ? (activeSug.enfoque || activeSug.ejemplo || '') : '';
    const guideHtml = guideTxt ? `<div class="cap-sug-guide">Qué grabar: ${esc(guideTxt)}</div>` : '';

    const planoChips = planoIds.map((id) => {
      const sel = curatedPlano(pendingShotType) === id;
      return `<button class="chip cap-plano-chip${sel ? ' sel' : ''}" onclick="seleccionarPlano('${esc(id)}')">${esc(planoLabel(id))}</button>`;
    }).join('');

    const curMov = curatedMovement(pendingMovement);
    const movGrid = movIds.map((id) => {
      const on = curMov === id;
      const svg = MOV_SVGS[id] || '';
      return `<button class="cap-mv${on ? ' mv-on' : ''}" onclick="seleccionarMovimiento('${esc(id)}')">${svg}<span>${esc((movements[id] || {}).label || id)}</span></button>`;
    }).join('');

    detailHtml = `<div class="cap-sug-detail">
      ${guideHtml}
      <div class="cap-mini-lbl">Plano</div>
      <div class="chips cap-plano-chips">${planoChips}</div>
      <div class="cap-mini-lbl" style="margin-top:12px">Movimiento</div>
      <div class="cap-mvgrid">${movGrid}</div>
    </div>`;
  }

  return `<div class="cap-sug">
    <button class="cap-sug-h" onclick="toggleSugStrip()">
      <span class="cap-sug-t"><i class="ti ti-bulb"></i>Sugeridas para ${esc(cuartoLbl)}</span>
      <span class="cap-tag-sel">${selLine} <i class="ti ti-chevron-${sugStripOpen ? 'up' : 'down'}"></i></span>
    </button>
    ${sugStripOpen ? `<div class="cap-sug-body">
      <div class="cap-mini-lbl">Qué grabar aquí</div>
      <div class="chips cap-sug-chips">${sugChips}${libreChip}</div>
      ${detailHtml}
    </div>` : ''}
  </div>`;
}

// Capa 3 — toma recien hecha, acciones de un toque sobre los botones
function renderCapLatest(file) {
  const shotTypes = logic.getShotTypes();
  const movements = logic.getMovements();
  const parts = [];
  if (file.shotType) parts.push((shotTypes[file.shotType] || {}).label || file.shotType);
  if (file.movement) parts.push((movements[file.movement] || {}).label || file.movement);
  const meta = parts.length ? ' · ' + esc(parts.join(' · ')) : '';
  const noteHtml = file.note
    ? `<button class="cap-notef has" onclick="agregarNotaArchivo('${esc(file.id)}')"><i class="ti ti-note"></i>${esc(file.note)}</button>`
    : `<button class="cap-notef" onclick="agregarNotaArchivo('${esc(file.id)}')"><i class="ti ti-plus"></i>describir lo que grabaste</button>`;
  return `<div class="cap-latest">
    <div class="cap-latest-h"><span class="cap-latest-who">recién grabada</span><span class="cap-latest-tk">${esc(file.fileToken)}${meta}</span></div>
    <div class="cap-qa">
      <button class="cap-qbtn fav${file.favorite ? ' on' : ''}" onclick="toggleFavorita('${esc(file.id)}')"><i class="ti ti-star${file.favorite ? '-filled' : ''}"></i>Favorita</button>
      <button class="cap-qbtn good${file.good ? ' on' : ''}" onclick="toggleBuena('${esc(file.id)}')"><i class="ti ti-check"></i>Buena</button>
    </div>
    ${noteHtml}
  </div>`;
}

function pendingTakeLabel() {
  const movements = logic.getMovements();
  const parts = [];
  if (pendingShotType) parts.push(planoLabel(curatedPlano(pendingShotType) || pendingShotType));
  if (pendingMovement) parts.push((movements[curatedMovement(pendingMovement)] || movements[pendingMovement] || {}).label || pendingMovement);
  return parts.join(' · ');
}

function toggleSugStrip() {
  sugStripOpen = !sugStripOpen;
  render();
}

// F16 — cambiar el plano del detalle. Conserva la sugerencia activa (el usuario puede
// ajustar plano/movimiento sin perderla). Tocar de nuevo el mismo plano lo limpia.
function seleccionarPlano(id) {
  pendingShotType = curatedPlano(pendingShotType) === id ? null : id;
  render();
}

// F16 — cambiar el movimiento del detalle. Conserva la sugerencia activa.
function seleccionarMovimiento(mvId) {
  pendingMovement = curatedMovement(pendingMovement) === mvId ? null : mvId;
  render();
}

// F16 — registrar una toma con la camara activa, el cuarto, el plano/movimiento curados
// y el suggestionId de la sugerencia activa (null si es Libre o sin etiquetar). Asi la
// sugerencia se marca hecha (palomita) al capturar. No auto-avanza a la siguiente.
function darToma(targetId) {
  const ctx = (pendingShotType || pendingMovement || activeSugId)
    ? { shotType: pendingShotType, movement: pendingMovement, suggestionId: activeSugId }
    : null;
  registrarArchivo(targetId, 'take', undefined, ctx);
}

// Drone — agrega una foto: mueve el consecutivo sin crear toma.
function agregarFotoDrone() {
  const camera = activeCamera();
  if (!camera || !logic.getCameraSequence(state, camera.id).nextToken) return abrirSecuencia();
  state = logic.bumpCameraCounter(state, camera.id, 1);
  render(); scheduleSave();
}

function toggleFavorita(mediaId) {
  state = logic.toggleMediaFavorite(state, mediaId);
  render(); scheduleSave();
}

function categoriaDe(space) {
  return space.categoria || logic.detectCategoria(space.nombre);
}

function catChipHtml(target) {
  const cats = logic.getRoomCategories();
  const catId = categoriaDe(target);
  const cat = cats.find((c) => c.id === catId);
  return `<button class="cat-chip" onclick="abrirCategoriaSheet('${esc(target.id)}')"><i class="ti ti-tag"></i>${esc(cat ? cat.label : catId)}</button>`;
}

function abrirGateSalida() {
  const videoCoverage = logic.guideCoverage(state, 'video');
  const droneCoverage = logic.guideCoverage(state, 'drone');
  const shotTypes = logic.getShotTypes();
  const movements = logic.getMovements();

  const videoFaltan = videoCoverage.filter((c) => c.must.faltan.length > 0);
  const droneFaltan = droneCoverage.filter((c) => c.must.faltan.length > 0);
  const totalFaltan = videoFaltan.reduce((n, c) => n + c.must.faltan.length, 0) +
                      droneFaltan.reduce((n, c) => n + c.must.faltan.length, 0);
  const espaciosFaltan = videoFaltan.length + droneFaltan.length;

  let verdictHtml;
  if (totalFaltan === 0) {
    verdictHtml = `<div class="gate-verdict ok"><i class="ti ti-circle-check"></i>Listo para irte — todas las tomas clave cubiertas</div>`;
  } else {
    verdictHtml = `<div class="gate-verdict bad"><i class="ti ti-alert-circle"></i>Faltan ${totalFaltan} toma${totalFaltan === 1 ? '' : 's'} clave en ${espaciosFaltan} espacio${espaciosFaltan === 1 ? '' : 's'}</div>`;
  }

  function renderLane(coverageFaltan, lane) {
    if (!coverageFaltan.length) return '';
    const items = coverageFaltan.map((c) => {
      const shots = c.must.faltan.map((s) => {
        const typeLabel = (shotTypes[s.shotType] || {}).label || s.shotType;
        const movLabel = (movements[s.movement] || {}).label || s.movement;
        return `<div class="faltantes-shot"><span class="faltantes-shot-name">${esc(s.nombre)}</span><span class="faltantes-shot-type">${esc(typeLabel)} / ${esc(movLabel)}</span></div>`;
      }).join('');
      const jumpBtn = lane === 'video'
        ? `<button class="faltantes-target-jump" onclick="irACuartoVideo('${c.target.id}')"><i class="ti ti-corner-down-right"></i>ir</button>`
        : '';
      return `<div class="faltantes-target"><div class="faltantes-target-head"><span class="faltantes-target-name">${esc(c.target.nombre)}</span>${jumpBtn}</div>${shots}</div>`;
    }).join('');
    const laneLabel = lane === 'video' ? 'Video' : 'Drone';
    return `<div class="gate-lane-head">${esc(laneLabel)}</div>${items}`;
  }

  const body = (totalFaltan === 0)
    ? '<p class="sheet-note">Todas las tomas clave de la propiedad estan cubiertas.</p>'
    : renderLane(videoFaltan, 'video') + renderLane(droneFaltan, 'drone');

  abrirModal(`<div class="sheet-head"><h2>Resumen de la propiedad</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>${verdictHtml}${body}`);
}

// F16 — tocar una sugerencia: fija activeSugId, sale del modo libre y preselecciona
// plano/movimiento (normalizados al vocabulario curado) desde la sugerencia. Sin auto-avanzar.
// Tocar de nuevo la misma sugerencia la deselecciona y limpia el detalle.
function seleccionarSugerencia(id) {
  if (activeSugId === id) {
    activeSugId = null;
    pendingShotType = null;
    pendingMovement = null;
  } else {
    activeSugId = id;
    tagLibre = false;
    const sug = logic.findSuggestion(id, state);
    pendingShotType = sug ? (curatedPlano(sug.shotType) || null) : null;
    pendingMovement = sug ? (curatedMovement(sug.movement) || null) : null;
  }
  render();
}

// F16 — chip "Libre": modo libre sin sugerencia. Despliega el mismo detalle (Plano +
// Movimiento) pero sin preseleccion; las tomas quedan sin suggestionId. Tocar de nuevo sale.
function entrarLibre() {
  if (tagLibre) {
    tagLibre = false;
    pendingShotType = null;
    pendingMovement = null;
  } else {
    tagLibre = true;
    activeSugId = null;
    pendingShotType = null;
    pendingMovement = null;
  }
  render();
}

function abrirCategoriaSheet(targetId) {
  const space = state.espacios.find((e) => e.id === targetId);
  if (!space) return;
  const cats = logic.getRoomCategories();
  const current = space.categoria || '';
  const chips = [`<button class="chip${!current ? ' active' : ''}" onclick="setCategoriaSpace('${esc(targetId)}',null)">Auto</button>`]
    .concat(cats.map((c) => `<button class="chip${current === c.id ? ' active' : ''}" onclick="setCategoriaSpace('${esc(targetId)}','${esc(c.id)}')">${esc(c.label)}</button>`))
    .join('');
  abrirModal(`<div class="sheet-head"><h2>Categoria del cuarto</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    <p class="sheet-note">Determina las tomas sugeridas. "Auto" la detecta del nombre.</p>
    <div class="chips" style="padding-bottom:12px">${chips}</div>`);
}

function setCategoriaSpace(targetId, catId) {
  const space = state.espacios.find((e) => e.id === targetId);
  if (!space) return;
  if (catId) space.categoria = catId;
  else delete space.categoria;
  cerrarModal();
  scheduleSave();
  render();
}

function abrirPropuestaIA() {
  propuestaIAParsed = null;
  renderPropuestaIA();
}

function renderPropuestaIA() {
  const guide = state.guide || {};
  const desc = guide.descripcion || '';
  const proposal = guide.proposal;
  const totalIA = proposal
    ? Object.values(proposal.porCuarto || {}).reduce((n, arr) => n + arr.length, 0)
    : 0;

  const statusHtml = (proposal && totalIA > 0)
    ? `<div class="propuesta-status"><i class="ti ti-check"></i>${totalIA} toma${totalIA === 1 ? '' : 's'} IA activa${totalIA === 1 ? '' : 's'}</div>`
    : '';

  let previewHtml = '';
  if (propuestaIAParsed) {
    const { proposal: parsed, report } = propuestaIAParsed;
    const cuartoNames = {};
    [...(state.espacios || []), ...(state.droneItems || [])].forEach((t) => { cuartoNames[t.id] = t.nombre; });
    const shotTypes = logic.getShotTypes();
    const movements = logic.getMovements();
    const n = report.agregadas;
    const ig = report.ignoradas;
    const reportLine = `${n} toma${n === 1 ? '' : 's'} propuesta${n === 1 ? '' : 's'}${ig > 0 ? `, ${ig} ignorada${ig === 1 ? '' : 's'}` : ''}`;
    const cuartosHtml = Object.entries(parsed.porCuarto || {}).map(([tid, shots]) => {
      const nombre = cuartoNames[tid] || tid;
      const shotRows = shots.map((s) => {
        const tl = (shotTypes[s.shotType] || {}).label || s.shotType;
        const ml = (movements[s.movement] || {}).label || s.movement;
        return `<div class="propuesta-shot"><span class="propuesta-shot-name">${esc(s.nombre)}</span><span class="propuesta-shot-type">${esc(tl)} / ${esc(ml)}</span></div>`;
      }).join('');
      return `<div class="propuesta-cuarto"><div class="propuesta-cuarto-name">${esc(nombre)}</div>${shotRows}</div>`;
    }).join('');
    const applyBtn = n > 0
      ? `<button class="btn primary" onclick="aplicarPropuestaIA()" style="margin-top:10px">Aplicar propuesta</button>`
      : '';
    previewHtml = `<div class="propuesta-preview">
      <div class="propuesta-report">${esc(reportLine)}</div>
      ${cuartosHtml}
      ${applyBtn}
      ${n === 0 ? `<p class="sheet-note" style="margin-top:8px">No se encontraron tomas validas para aplicar.</p>` : ''}
    </div>`;
  }

  const quitarBtn = proposal
    ? `<button class="btn ghost" onclick="quitarPropuestaIA()"><i class="ti ti-trash"></i>Quitar propuesta</button>`
    : '';

  abrirModal(`<div class="sheet-head"><h2>Propuesta IA</h2><button class="icon-btn" onclick="cerrarModal()"><i class="ti ti-x"></i></button></div>
    ${statusHtml}
    <div class="field-group">
      <label class="field-label">Destacados de la propiedad</label>
      <textarea id="propuestaDescTA" class="field ta" rows="3" placeholder="Vista al lago, terraza amplia, cocina gourmet..." onchange="actualizarDescripcionGuia(this.value)">${esc(desc)}</textarea>
    </div>
    <div class="action-stack">
      <button class="btn" onclick="copiarPromptIA()"><i class="ti ti-copy"></i>Copiar prompt</button>
    </div>
    <div class="field-group" style="margin-top:12px">
      <label class="field-label">Pegar respuesta de la IA</label>
      <textarea id="propuestaRespTA" class="field ta" rows="5" placeholder="Pega aqui la respuesta JSON...">${esc(propuestaIAText)}</textarea>
    </div>
    <div class="action-stack">
      <button class="btn" onclick="analizarPropuestaIA()"><i class="ti ti-search"></i>Analizar</button>
      ${quitarBtn}
    </div>
    ${previewHtml}`);
}

function actualizarDescripcionGuia(val) {
  if (!state.guide) state.guide = {};
  state.guide.descripcion = val;
  scheduleSave();
}

function copiarPromptIA() {
  const ta = document.getElementById('propuestaDescTA');
  if (ta) actualizarDescripcionGuia(ta.value);
  const prompt = logic.buildPropuestaPrompt(state);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(prompt)
      .then(() => showToast('Prompt copiado'))
      .catch(() => mostrarPromptFallback(prompt));
  } else {
    mostrarPromptFallback(prompt);
  }
}

function mostrarPromptFallback(prompt) {
  abrirModal(`<div class="sheet-head"><h2>Prompt</h2><button class="icon-btn" onclick="abrirPropuestaIA()"><i class="ti ti-x"></i></button></div>
    <p class="sheet-note">Selecciona el texto y copialo manualmente.</p>
    <textarea class="field ta" rows="10" onclick="this.select()" readonly style="min-height:200px">${esc(prompt)}</textarea>`);
}

function analizarPropuestaIA() {
  const ta = document.getElementById('propuestaRespTA');
  if (ta) propuestaIAText = ta.value;
  propuestaIAParsed = logic.parsePropuesta(propuestaIAText, state);
  renderPropuestaIA();
}

function aplicarPropuestaIA() {
  if (!propuestaIAParsed || !propuestaIAParsed.proposal) return;
  if (!state.guide) state.guide = {};
  state.guide.proposal = propuestaIAParsed.proposal;
  propuestaIAParsed = null;
  scheduleSave();
  render();
  cerrarModal();
  showToast('Propuesta aplicada');
}

function quitarPropuestaIA() {
  if (state.guide) delete state.guide.proposal;
  propuestaIAParsed = null;
  scheduleSave();
  render();
  cerrarModal();
  showToast('Propuesta eliminada');
}

async function ensureAdminKey() {
  let key = localStorage.getItem('iav_admin_auth');
  if (key) return key;
  key = prompt('Contraseña de admin para editar la biblioteca');
  if (!key) return null;
  try {
    const r = await fetch('/api/obtenerConfigAdmin', { headers: { 'X-Admin-Key': key } });
    if (r.ok) { localStorage.setItem('iav_admin_auth', key); return key; }
  } catch (_) {}
  showToast('Contraseña incorrecta');
  return null;
}

function cerrarConfigGuia() {
  configGuiaOpen = false;
  logic.applyGuideConfig(currentGuideConfig || {});
  if (CONFIG) {
    document.getElementById('app').innerHTML = '<div class="empty"><p>Biblioteca actualizada. Puedes cerrar esta pestaña.</p></div>';
    return;
  }
  render();
}

async function iniciarConfigMode() {
  try {
    const r = await fetch('/api/obtenerConfigGuia');
    const data = r.ok ? await r.json() : null;
    if (data && data.guia) { currentGuideConfig = data.guia; logic.applyGuideConfig(data.guia); }
  } catch (_) {}
  const k = await ensureAdminKey();
  if (!k) {
    mostrarError('Se requiere la contrasena de administrador para editar la biblioteca.');
    return;
  }
  guideConfigDraft = JSON.parse(JSON.stringify(currentGuideConfig || {}));
  logic.applyGuideConfig(guideConfigDraft);
  configGuiaOpen = true;
  render();
}
