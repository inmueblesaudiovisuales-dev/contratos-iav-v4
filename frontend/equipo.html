<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Portal de equipo — IAV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --onyx:   #1C1C1E;
      --gold:   #C9A84C;
      --gold-d: #a8863b;
      --page:   #F4F3F0;
      --card:   #FFFFFF;
      --ink-1:  #1C1C1E;
      --ink-2:  #6B6B6B;
      --ink-3:  #A0A0A0;
      --border: #E6E5E1;
      --success:#2A9D5C;
      --blue:   #3B82F6;
      --r:      14px;
    }

    html, body { min-height: 100vh; background: var(--page); }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      color: var(--ink-1);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      background: var(--onyx); color: #fff;
      padding: max(14px, env(safe-area-inset-top)) 16px 14px;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
    .topbar-inner { max-width: 1080px; margin: 0 auto; }
    .topbar-row { display: flex; align-items: center; gap: 12px; }
    .topbar-logo {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--gold), var(--gold-d));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 11px; color: #1a1000; flex-shrink: 0;
    }
    .topbar-info { flex: 1; min-width: 0; }
    .topbar-folio {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1px;
    }
    .topbar-nombre {
      font-size: 15px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar-meta { font-size: 11px; color: #B8B8B8; margin-top: 2px; font-weight: 500; }
    .topbar-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 9px; border-radius: 20px; flex-shrink: 0;
    }
    .topbar-badge.express { background: #FEF3C7; color: #92400E; }

    /* ===== MAIN ===== */
    .main { padding: 16px; max-width: 880px; margin: 0 auto; }

    /* checklist CTA */
    .checklist-link {
      display: flex; align-items: center; gap: 10px;
      background: var(--onyx); color: #fff;
      padding: 14px 16px; border-radius: var(--r);
      text-decoration: none; margin-bottom: 14px;
      font-size: 13.5px; font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .checklist-link .cl-emoji { font-size: 16px; }
    .checklist-link .cl-text { flex: 1; }
    .checklist-link-arrow { font-size: 18px; color: var(--gold); }

    /* aviso sin contrato */
    .aviso-sin {
      background: var(--card); border: 1px dashed var(--border); border-radius: var(--r);
      padding: 22px 18px; text-align: center; color: var(--ink-2);
      font-size: 13px; line-height: 1.6; margin-bottom: 14px;
    }
    .aviso-sin .av-emoji { font-size: 28px; display: block; margin-bottom: 8px; }

    /* ===== CARDS GRID (masonry en desktop) ===== */
    .cards { }
    @media (min-width: 820px) {
      .main { padding: 28px 24px; max-width: 1080px; }
      .cards { column-count: 2; column-gap: 18px; }
      .cards > .seccion { break-inside: avoid; }
      .checklist-link { max-width: 420px; }
    }

    /* ===== SECCION ===== */
    .seccion {
      background: var(--card); border-radius: var(--r);
      border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .sec-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      background: #FAFAF8;
    }
    .sec-icon {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold), var(--gold-d));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #1a1000;
    }
    .sec-titulo {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--ink-2);
    }
    .sec-body { padding: 14px 16px; }

    /* ===== FILA DE DATO ===== */
    .dato-row {
      display: flex; align-items: flex-start;
      gap: 10px; padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }
    .dato-row:last-child { border-bottom: none; }
    .dato-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--ink-3);
      min-width: 96px; padding-top: 2px; flex-shrink: 0;
    }
    .dato-val { font-size: 13.5px; font-weight: 500; color: var(--ink-1); line-height: 1.5; min-width: 0; word-break: break-word; }
    .dato-val a { color: var(--gold-d); text-decoration: none; font-weight: 600; }
    .dato-val a:hover { text-decoration: underline; }
    /* Enlace a Google Maps: chip tocable con estado :active claro en movil */
    a.maps-link {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 5px;
      background: rgba(201,168,76,0.13); border: 1px solid rgba(201,168,76,0.42);
      color: var(--gold-d); border-radius: 999px; padding: 5px 12px;
      font-size: 12px; font-weight: 600; text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: background .12s ease, transform .06s ease;
    }
    a.maps-link:hover  { background: rgba(201,168,76,0.22); text-decoration: none; }
    a.maps-link:active { background: rgba(201,168,76,0.32); transform: scale(0.97); }

    /* ===== BLOQUE ACCESO ===== */
    .acceso-bloque {
      border-left: 3px solid var(--gold); background: #FDFAF4;
      border-radius: 0 8px 8px 0; padding: 12px 14px; margin-top: 6px;
    }
    .acceso-item { font-size: 12.5px; color: var(--ink-1); line-height: 1.65; }
    .acceso-item strong { font-weight: 700; color: var(--ink-2); }

    /* ===== ARCHIVOS ===== */
    .archivos-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .archivo-card {
      border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; width: 104px;
      display: flex; flex-direction: column; text-decoration: none;
    }
    .archivo-img { width: 100%; height: 82px; object-fit: cover; background: var(--page); }
    .archivo-label {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--ink-2); padding: 6px 7px;
      text-align: center;
    }

    /* ===== DRIVE LINKS ===== */
    .drive-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .drive-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: #F0FFF4; border: 1px solid #BBF7D0; border-radius: 9px;
      padding: 9px 13px; font-size: 12px; font-weight: 600;
      color: #166534; text-decoration: none;
    }
    .drive-link:hover { background: #DCFCE7; }

    /* ===== ENTREGABLES LISTA ===== */
    .entregables-lista { margin-top: 4px; }
    .entregable-item {
      font-size: 12.5px; font-weight: 500; color: var(--ink-1);
      padding: 4px 0; display: flex; align-items: center; gap: 8px;
    }
    .entregable-item::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: var(--gold); flex-shrink: 0;
    }

    /* ===== ADDONS / CHIPS ===== */
    .addon-pill {
      display: inline-flex; align-items: center; gap: 5px;
      background: #F2F1EC; border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 11px; font-size: 11px; font-weight: 600;
      color: var(--ink-1); margin: 3px 4px 3px 0; text-decoration: none;
    }

    /* ===== POST-PRODUCCION ===== */
    .prod-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 0; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .prod-row:last-child { border-bottom: none; }
    .prod-row-left { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; }
    .prod-check {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--border); background: var(--page);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .prod-check.listo { background: var(--success); border-color: var(--success); }
    .prod-check-icon { font-size: 12px; color: #fff; display: none; font-weight: 700; }
    .prod-check.listo .prod-check-icon { display: block; }
    .prod-label-wrap { min-width: 0; }
    .prod-label { font-size: 13.5px; font-weight: 600; }
    .prod-fecha { font-size: 10px; color: var(--ink-3); margin-top: 1px; }
    .btn-marcar {
      font-family: inherit; font-size: 11px; font-weight: 700;
      padding: 7px 15px; border-radius: 20px; cursor: pointer;
      border: 1px solid; transition: filter 0.15s; flex-shrink: 0;
    }
    .btn-marcar.pendiente { background: var(--onyx); color: #fff; border-color: var(--onyx); }
    .btn-marcar.listo { background: #F0FFF4; color: var(--success); border-color: #BBF7D0; }
    .btn-marcar:hover { filter: brightness(0.92); }
    .btn-marcar:disabled { opacity: 0.5; cursor: default; }

    /* ===== RECORRIDO URL INPUT ===== */
    .recorrido-url-wrap { padding: 10px 0 4px; }
    .recorrido-url-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-bottom: 6px; }
    .recorrido-url-row { display: flex; gap: 8px; }
    .recorrido-url-input {
      flex: 1; font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--page); color: var(--ink-1); min-width: 0;
    }
    .recorrido-url-input:focus { outline: none; border-color: var(--gold); }
    .btn-guardar-url {
      font-family: inherit; font-size: 11px; font-weight: 700;
      padding: 9px 15px; border-radius: 9px; cursor: pointer;
      background: var(--onyx); color: #fff; border: none; flex-shrink: 0;
    }
    .btn-guardar-url:disabled { opacity: 0.5; cursor: default; }

    /* ===== TOGGLE RECORRIDO ===== */
    .recorrido-toggle {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0 4px; font-size: 11.5px; color: var(--ink-2); cursor: pointer;
    }
    .recorrido-toggle input { accent-color: var(--gold); width: 15px; height: 15px; cursor: pointer; }

    /* ===== PROP TABS ===== */
    .prop-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .prop-tab {
      flex-shrink: 0; padding: 11px 15px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent;
      background: none; border: none; border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .prop-tab.activo { color: var(--gold-d); border-bottom-color: var(--gold); }
    .prop-panel { display: none; padding: 14px 16px; }
    .prop-panel.activo { display: block; }

    /* ===== PROP SUBTITULO ===== */
    .prop-sec-titulo {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--ink-3); margin: 14px 0 6px;
    }
    .prop-sec-titulo:first-child { margin-top: 0; }

    /* ===== LLAMADAS Y NOTAS ===== */
    .eq-act-item {
      display: flex; gap: 11px; align-items: flex-start;
      padding: 9px 0; border-bottom: 1px solid var(--border);
    }
    .eq-act-item:last-child { border-bottom: none; }
    .eq-act-dot {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #fff;
    }
    .eq-act-dot.llamada { background: var(--blue); }
    .eq-act-dot.nota    { background: var(--ink-3); }
    .eq-act-body { min-width: 0; flex: 1; }
    .eq-act-meta {
      font-size: 9.5px; color: var(--ink-3); margin-bottom: 2px;
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    }
    .eq-act-desc { font-size: 13px; color: var(--ink-1); line-height: 1.5; word-break: break-word; }
    .eq-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .eq-chip { background: #F2F1EC; color: var(--ink-1); border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 600; }
    .eq-link-chip { background: #EAF2FF; color: #1D4ED8; border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 600; text-decoration: none; }
    .eq-link-chip:hover { text-decoration: underline; }
    .eq-btn-nota {
      width: 100%; background: var(--page); border: 1px dashed var(--border);
      border-radius: 10px; padding: 9px 14px; font-size: 12.5px; font-weight: 600;
      color: var(--ink-2); cursor: pointer; margin-top: 12px; font-family: inherit;
    }
    .eq-btn-nota:hover { border-color: var(--gold); color: var(--ink-1); }
    .eq-nota-form { margin-top: 10px; display: none; }
    .eq-nota-textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 9px;
      padding: 10px; font-size: 13px; resize: vertical; box-sizing: border-box;
      font-family: inherit; color: var(--ink-1);
    }
    .eq-nota-textarea:focus { outline: none; border-color: var(--gold); }
    .eq-nota-submit {
      margin-top: 8px; background: var(--onyx); color: #fff; border: none;
      border-radius: 9px; padding: 8px 18px; font-size: 12.5px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }

    /* ===== ESTADOS ===== */
    .estado { text-align: center; padding: 60px 20px; color: var(--ink-2); font-size: 13px; }
    .vacio { font-size: 12.5px; color: var(--ink-3); padding: 4px 0; }

    /* ===== FORM MSG ===== */
    .form-msg-inline { font-size: 11px; color: var(--success); margin-top: 4px; min-height: 16px; }
    .form-msg-inline.error { color: #dc2626; }
  </style>
</head>
<body>

<div id="topbar" class="topbar" style="display:none">
  <div class="topbar-inner">
    <div class="topbar-row">
      <div class="topbar-logo">IAV</div>
      <div class="topbar-info">
        <div class="topbar-folio" id="tb-folio"></div>
        <div class="topbar-nombre" id="tb-nombre"></div>
        <div class="topbar-meta" id="tb-meta" style="display:none"></div>
      </div>
      <div id="tb-express" class="topbar-badge express" style="display:none">Express</div>
    </div>
  </div>
</div>

<div id="estado" class="estado">Cargando sesion...</div>

<div id="app" style="display:none">
  <div class="main">

    <a id="checklist-link" class="checklist-link" href="#" target="_blank" rel="noopener">
      <span class="cl-emoji">&#128247;</span>
      <span class="cl-text">Abrir checklist de rodaje</span>
      <span class="checklist-link-arrow">&#8599;</span>
    </a>

    <div id="no-contrato-aviso" class="aviso-sin" style="display:none">
      <span class="av-emoji">&#128196;</span>
      Sin contrato todavia &mdash; la informacion de produccion aparecera cuando se genere el contrato.
    </div>

    <div class="cards">

      <!-- Cliente -->
      <section class="seccion" id="sec-cliente">
        <div class="sec-header">
          <div class="sec-icon">&#128100;</div>
          <div class="sec-titulo">Cliente</div>
        </div>
        <div class="sec-body" id="cliente-body"></div>
      </section>

      <!-- Llamadas y notas -->
      <section class="seccion" id="sec-llamadas">
        <div class="sec-header">
          <div class="sec-icon">&#128222;</div>
          <div class="sec-titulo">Llamadas y notas</div>
        </div>
        <div class="sec-body">
          <div id="eq-actividades-list"></div>
          <button class="eq-btn-nota" onclick="toggleNotaForm()">+ Agregar nota</button>
          <div class="eq-nota-form" id="eq-nota-form">
            <textarea class="eq-nota-textarea" id="eq-nota-txt" placeholder="Observacion durante la llamada..." rows="3"></textarea>
            <button class="eq-nota-submit" onclick="guardarNotaEquipo()">Guardar nota</button>
          </div>
        </div>
      </section>

      <!-- Propiedades (tabs si hay mas de una) -->
      <section class="seccion" id="sec-propiedad" style="display:none">
        <div class="sec-header">
          <div class="sec-icon">&#127968;</div>
          <div class="sec-titulo" id="sec-prop-titulo">Propiedad</div>
        </div>
        <div id="prop-tabs" class="prop-tabs" style="display:none"></div>
        <div id="prop-paneles"></div>
      </section>

      <!-- Post-produccion -->
      <section class="seccion" id="sec-prod" style="display:none">
        <div class="sec-header">
          <div class="sec-icon">&#9989;</div>
          <div class="sec-titulo">Post-produccion</div>
        </div>
        <div class="sec-body" id="prod-body"></div>
      </section>

      <!-- Cotizacion -->
      <section class="seccion" id="sec-cotizacion" style="display:none">
        <div class="sec-header">
          <div class="sec-icon">&#128221;</div>
          <div class="sec-titulo">Cotizacion</div>
        </div>
        <div class="sec-body" id="cot-body"></div>
      </section>

      <!-- Adicionales contratados -->
      <section id="addons-sec" class="seccion" style="display:none">
        <div class="sec-header">
          <div class="sec-icon">&#43;</div>
          <div class="sec-titulo">Adicionales contratados</div>
        </div>
        <div class="sec-body" id="addons-body"></div>
      </section>

    </div>
  </div>
</div>

<script>
const API = 'https://contratos.inmueblesaudiovisuales.com/api';
const BASE = 'https://contratos.inmueblesaudiovisuales.com';

const FORMATO_LABEL = {
  vertical_nativo: 'Vertical (redes)',
  horizontal_nativo: 'Horizontal (web/YouTube)',
  doble_nativo: 'Vertical + Horizontal',
  horizontal_recorte_vertical: 'Horizontal + recorte vertical'
};

let _data = null;

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Devuelve siempre un href de Maps usable: si link ya es URL la respeta;
// si es texto/coordenadas (o viene vacio) arma una busqueda con la direccion.
function buildMapsHref(link, direccion) {
  var v = (link || '').toString().trim();
  if (/^https?:\/\//i.test(v)) return v;
  var q = v || (direccion || '').toString().trim();
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

function datoRow(label, valHtml) {
  return '<div class="dato-row"><div class="dato-label">' + esc(label) +
    '</div><div class="dato-val">' + valHtml + '</div></div>';
}

function fmxnFecha(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.substring(0,10).split('-').map(Number);
  const fecha = new Date(y,m-1,d,12);
  return fecha.toLocaleDateString('es-MX', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

function fmtFechaCorta(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.substring(0,10).split('-').map(Number);
  return new Date(y,m-1,d,12).toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' });
}

function splitEntregables(txt) {
  if (!txt) return [];
  return txt.split(/\s*[·\n|]\s*/).map(s => s.trim()).filter(Boolean);
}

const params = new URLSearchParams(location.search);
const TOKEN  = params.get('token');

if (!TOKEN) {
  document.getElementById('estado').textContent = 'Token no encontrado en la URL.';
} else {
  cargar();
}

async function cargar() {
  try {
    const res = await fetch(API + '/obtenerEquipo?token=' + encodeURIComponent(TOKEN));
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error al cargar');
    _data = data;
    renderApp(data);
  } catch (e) {
    document.getElementById('estado').textContent = 'Error: ' + e.message;
  }
}

function renderApp(data) {
  window.EQ_DATA = data;

  document.getElementById('estado').style.display = 'none';
  document.getElementById('app').style.display = '';

  // ===== Topbar =====
  const cli = data.cliente || {};
  document.getElementById('tb-folio').textContent = data.folio || (data.tieneContrato ? '' : 'Prospecto');
  document.getElementById('tb-nombre').textContent = data.nombreCliente || cli.nombre || '';
  if (data.entregaExpress) document.getElementById('tb-express').style.display = '';
  document.getElementById('topbar').style.display = '';

  const props = data.propiedades || [];
  const tbMeta = document.getElementById('tb-meta');
  if (props.length === 1 && props[0].fechaSesion) {
    tbMeta.textContent = fmtFechaCorta(props[0].fechaSesion) + (props[0].horaSesion ? ' · ' + props[0].horaSesion : '');
    tbMeta.style.display = '';
  } else if (props.length > 1) {
    tbMeta.textContent = props.length + ' propiedades';
    tbMeta.style.display = '';
  } else {
    tbMeta.style.display = 'none';
  }

  // ===== Cliente (fusionado) =====
  renderCliente(data);

  // ===== Llamadas y notas (CRM) =====
  renderActividades(data);

  // ===== Cotizacion (CRM) =====
  renderCotizacion(data);

  // ===== Toggle de secciones que dependen del contrato =====
  const tiene = !!data.tieneContrato;
  document.getElementById('sec-propiedad').style.display = tiene ? '' : 'none';
  document.getElementById('sec-prod').style.display = tiene ? '' : 'none';
  document.getElementById('checklist-link').style.display = tiene ? '' : 'none';
  document.getElementById('no-contrato-aviso').style.display = tiene ? 'none' : '';

  if (!tiene) {
    document.getElementById('addons-sec').style.display = 'none';
    return;
  }

  // ===== Checklist =====
  document.getElementById('checklist-link').href =
    BASE + '/checklist.html?token=' + encodeURIComponent(TOKEN);

  // ===== Propiedades =====
  renderPropiedades(data);

  // ===== Post-produccion =====
  renderPostProduccion(data);

  // ===== Adicionales =====
  const addonsSec = document.getElementById('addons-sec');
  if (data.extrasAcordados && data.extrasAcordados.length) {
    addonsSec.style.display = '';
    document.getElementById('addons-body').innerHTML =
      data.extrasAcordados.map(a => '<span class="addon-pill">' + esc(a.nombre) + '</span>').join('');
  } else {
    addonsSec.style.display = 'none';
  }
}

function renderCliente(data) {
  const cli = data.cliente || {};
  const nombre = data.nombreCliente || cli.nombre || '—';
  const tel = data.telefonoCliente || cli.telefono || '';
  let h = datoRow('Nombre', esc(nombre));
  if (tel)            h += datoRow('Telefono', '<a href="tel:' + esc(tel) + '">' + esc(tel) + '</a>');
  if (cli.correo)       h += datoRow('Correo', esc(cli.correo));
  if (cli.inmobiliaria) h += datoRow('Inmobiliaria', esc(cli.inmobiliaria));
  if (cli.origen)       h += datoRow('Origen', esc(cli.origen));
  document.getElementById('cliente-body').innerHTML = h;
}

function renderActividades(data) {
  const actividades = data.actividades || [];
  const list = document.getElementById('eq-actividades-list');
  if (!actividades.length) {
    list.innerHTML = '<div class="vacio">Sin actividades registradas.</div>';
    return;
  }
  list.innerHTML = actividades.map(function(a) {
    const esLlamada = a.tipo === 'llamada_agendada';
    const meta = esc(a.fecha_actividad || '') + (a.hora ? ' · ' + esc(a.hora) : '') + ' · ' + (esLlamada ? 'Llamada' : 'Nota');
    return '<div class="eq-act-item">' +
      '<div class="eq-act-dot ' + (esLlamada ? 'llamada' : 'nota') + '">' + (esLlamada ? '&#9742;' : '&#9998;') + '</div>' +
      '<div class="eq-act-body">' +
        '<div class="eq-act-meta">' + meta + '</div>' +
        '<div class="eq-act-desc">' + esc(a.descripcion || '') + '</div>' +
      '</div></div>';
  }).join('');
}

function renderCotizacion(data) {
  const sec = document.getElementById('sec-cotizacion');
  const body = document.getElementById('cot-body');
  const paqCot = data.paquetesCotizados || [];
  const portLinks = data.portafolioLinks || [];
  const has = data.ubicacion || data.notasCotizacion || paqCot.length || portLinks.length;
  if (!has) { sec.style.display = 'none'; return; }
  sec.style.display = '';

  let h = '';
  if (data.ubicacion)       h += datoRow('Ubicacion', esc(data.ubicacion));
  if (data.notasCotizacion) h += datoRow('Notas', '<span style="white-space:pre-wrap">' + esc(data.notasCotizacion) + '</span>');
  if (paqCot.length) {
    h += '<div class="prop-sec-titulo">Paquetes cotizados</div><div class="eq-chips">' +
      paqCot.map(p => '<span class="eq-chip">' + esc(String(p)) + '</span>').join('') + '</div>';
  }
  if (portLinks.length) {
    h += '<div class="prop-sec-titulo">Portafolio enviado</div><div class="eq-chips">' +
      portLinks.map(l => '<a class="eq-link-chip" href="' + esc(l) + '" target="_blank" rel="noopener">' +
        esc(l.replace(/^https?:\/\//,'').substring(0,40)) + '</a>').join('') + '</div>';
  }
  body.innerHTML = h;
}

function renderPropiedades(data) {
  const props = data.propiedades || [];
  const titulo = document.getElementById('sec-prop-titulo');
  const tabsEl = document.getElementById('prop-tabs');
  const panelesEl = document.getElementById('prop-paneles');
  tabsEl.innerHTML = '';
  panelesEl.innerHTML = '';

  if (props.length > 1) {
    titulo.textContent = 'Propiedades (' + props.length + ')';
    tabsEl.style.display = '';
    props.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'prop-tab' + (i === 0 ? ' activo' : '');
      btn.textContent = 'Prop. ' + p.numPropiedad;
      btn.onclick = () => {
        tabsEl.querySelectorAll('.prop-tab').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');
        panelesEl.querySelectorAll('.prop-panel').forEach(el => el.classList.remove('activo'));
        document.getElementById('prop-panel-' + i).classList.add('activo');
      };
      tabsEl.appendChild(btn);
    });
  } else {
    titulo.textContent = 'Propiedad';
    tabsEl.style.display = 'none';
  }

  props.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'prop-panel' + (i === 0 ? ' activo' : '');
    div.id = 'prop-panel-' + i;
    div.innerHTML = renderPropiedad(p);
    panelesEl.appendChild(div);
  });
}

function renderPropiedad(p) {
  let html = '';

  // Sesion
  html += '<div class="prop-sec-titulo">Sesion</div>';
  html += '<div class="dato-row"><div class="dato-label">Fecha</div><div class="dato-val">' + esc(fmxnFecha(p.fechaSesion)) + '</div></div>';
  if (p.horaSesion) html += '<div class="dato-row"><div class="dato-label">Hora</div><div class="dato-val">' + esc(p.horaSesion) + '</div></div>';
  if (p.tipo)       html += '<div class="dato-row"><div class="dato-label">Tipo</div><div class="dato-val">' + esc(p.tipo) + '</div></div>';
  if (p.paquete)    html += '<div class="dato-row"><div class="dato-label">Paquete</div><div class="dato-val">' + esc(p.paquete) + '</div></div>';
  if (p.formatoVideo) html += '<div class="dato-row"><div class="dato-label">Formato video</div><div class="dato-val">' + esc(FORMATO_LABEL[p.formatoVideo] || p.formatoVideo) + '</div></div>';

  // Entregables
  const items = splitEntregables(p.entregables);
  if (items.length) {
    html += '<div class="prop-sec-titulo">Entregables</div>';
    html += '<div class="entregables-lista">';
    items.forEach(item => {
      html += '<div class="entregable-item">' + esc(item) + '</div>';
    });
    html += '</div>';
  }

  // Ubicacion
  html += '<div class="prop-sec-titulo">Ubicacion</div>';
  if (p.direccion) {
    const mapsHref = buildMapsHref(p.linkMaps, p.direccion);
    html += '<div class="dato-row"><div class="dato-label">Direccion</div><div class="dato-val">' +
      esc(p.direccion) + '<br><a class="maps-link" href="' + esc(mapsHref) + '" target="_blank" rel="noopener">Ver en Google Maps &rarr;</a></div></div>';
  }
  if (p.referencias)      html += '<div class="dato-row"><div class="dato-label">Como llegar</div><div class="dato-val">' + esc(p.referencias) + '</div></div>';
  if (p.sobreLaPropiedad) html += '<div class="dato-row"><div class="dato-label">Notas</div><div class="dato-val">' + esc(p.sobreLaPropiedad) + '</div></div>';

  // Acceso / caseta
  if (p.requiereAcceso && p.datosAcceso) {
    html += '<div class="prop-sec-titulo">Acceso y caseta</div>';
    html += renderAcceso(p.datosAcceso);
  }

  // Archivos de referencia
  const archivos = [];
  if (p.fachadaUrl) archivos.push({ url: p.fachadaUrl, label: 'QR / Referencia' });
  if (archivos.length) {
    html += '<div class="prop-sec-titulo">Archivos de referencia</div>';
    html += '<div class="archivos-grid">';
    archivos.forEach(a => {
      const esImagen = /\.(jpg|jpeg|png|gif|webp)/i.test(a.url);
      if (esImagen) {
        html += '<a href="' + esc(a.url) + '" target="_blank" rel="noopener" class="archivo-card">' +
          '<img class="archivo-img" src="' + esc(a.url) + '" loading="lazy" />' +
          '<div class="archivo-label">' + esc(a.label) + '</div></a>';
      } else {
        html += '<a href="' + esc(a.url) + '" target="_blank" rel="noopener" class="addon-pill">Ver ' + esc(a.label) + '</a>';
      }
    });
    html += '</div>';
  }

  // Carpetas Drive
  const links = [];
  if (p.carpetaEntregablesId) links.push({ id: p.carpetaEntregablesId, label: 'Carpeta entregables' });
  if (p.carpetaControlId)     links.push({ id: p.carpetaControlId,     label: 'Carpeta control interno' });
  if (links.length) {
    html += '<div class="prop-sec-titulo">Drive</div>';
    html += '<div class="drive-links">';
    links.forEach(l => {
      const url = 'https://drive.google.com/drive/folders/' + encodeURIComponent(l.id);
      html += '<a href="' + esc(url) + '" target="_blank" rel="noopener" class="drive-link">&#128194; ' + esc(l.label) + '</a>';
    });
    html += '</div>';
  }

  return html;
}

function renderAcceso(ac) {
  if (!ac) return '';
  const METODO_LABEL = {
    interfon: 'Interfon / citofono', portero: 'Portero / guardia',
    app: 'App movil', codigo: 'Codigo de acceso', llave: 'Llave propia', otro: 'Otro'
  };
  const PUNTO_LABEL = {
    afuera_departamento: 'Afuera del departamento', recepcion: 'Recepcion / lobby',
    entrada_oficina: 'Entrada de la oficina', porteria: 'Porteria', otro: 'Otro lugar'
  };
  let html = '<div class="acceso-bloque">';
  const filas = [];
  if (ac.tipoEdificio)          filas.push(['Tipo de inmueble',        ac.tipoEdificio]);
  if (ac.metodoAcceso)          filas.push(['Metodo de acceso',        METODO_LABEL[ac.metodoAcceso] || ac.metodoAcceso]);
  if (ac.puntoEncuentro)        filas.push(['Punto de encuentro',      PUNTO_LABEL[ac.puntoEncuentro] || ac.puntoEncuentro]);
  if (ac.puntoEncuentroDetalle) filas.push(['Detalle punto',           ac.puntoEncuentroDetalle]);
  if (ac.contactoAccesoTipo === 'otro' && ac.contactoAccesoNombre) {
    filas.push(['Contacto de acceso', ac.contactoAccesoNombre + (ac.contactoAccesoTelefono ? ' — ' + ac.contactoAccesoTelefono : '')]);
  } else if (ac.contactoAccesoTipo === 'yo') {
    filas.push(['Contacto de acceso', 'El mismo cliente']);
  }
  if (ac.indicacionesGuardia)  filas.push(['Indicaciones para guardia', ac.indicacionesGuardia]);
  if (ac.estacionamiento)      filas.push(['Estacionamiento',           ac.estacionamiento]);
  if (ac.restricciones)        filas.push(['Restricciones',             ac.restricciones]);
  if (ac.comentariosAcceso)    filas.push(['Comentarios',               ac.comentariosAcceso]);

  filas.forEach(([label, val]) => {
    html += '<div class="acceso-item"><strong>' + esc(label) + ':</strong> ' + esc(val) + '</div>';
  });
  html += '</div>';
  return html;
}

function renderPostProduccion(data) {
  const fotosListo  = !!(data.fotografiaLista && String(data.fotografiaLista).trim());
  const videoListo  = !!(data.videoListo      && String(data.videoListo).trim());
  const recListo    = !!(data.recorridoListo  && String(data.recorridoListo).trim());
  const tieneRec    = data.tieneRecorrido !== 0;

  let html = '';

  // Fotografía
  html += prodRow('fotos', fotosListo, 'Fotografía lista', data.fotografiaLista);
  // Video
  html += prodRow('video', videoListo, 'Video listo', data.videoListo);

  // Toggle recorrido
  html += '<div class="recorrido-toggle">' +
    '<input type="checkbox" id="toggle-recorrido" ' + (tieneRec ? 'checked' : '') + ' onchange="toggleRecorrido(this.checked)">' +
    '<label for="toggle-recorrido">Incluye recorrido 360</label>' +
  '</div>';

  // Recorrido (condicional)
  html += '<div id="recorrido-wrap" style="' + (tieneRec ? '' : 'display:none') + '">';
  html += prodRow('recorrido', recListo, 'Recorrido 360 listo', data.recorridoListo);
  // URL del recorrido
  html += '<div class="recorrido-url-wrap">';
  html += '<div class="recorrido-url-label">URL del recorrido virtual</div>';
  html += '<div class="recorrido-url-row">';
  html += '<input type="url" class="recorrido-url-input" id="recorrido-url-input" placeholder="https://my.matterport.com/..." value="' + esc(data.recorridoUrl || '') + '">';
  html += '<button class="btn-guardar-url" onclick="guardarRecorridoUrl()">Guardar</button>';
  html += '</div>';
  html += '<div class="form-msg-inline" id="msg-recorrido-url"></div>';
  html += '</div>';
  html += '</div>';

  document.getElementById('prod-body').innerHTML = html;
}

function prodRow(tipo, listo, label, fechaVal) {
  const fecha = listo && fechaVal ? fmtFechaCorta(fechaVal) : '';
  return '<div class="prod-row">' +
    '<div class="prod-row-left">' +
      '<div class="prod-check' + (listo ? ' listo' : '') + '" id="chk-' + tipo + '">' +
        '<span class="prod-check-icon">&#10003;</span>' +
      '</div>' +
      '<div class="prod-label-wrap">' +
        '<div class="prod-label">' + esc(label) + '</div>' +
        (fecha ? '<div class="prod-fecha">' + esc(fecha) + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<button class="btn-marcar ' + (listo ? 'listo' : 'pendiente') + '" ' +
      'id="btn-' + tipo + '" onclick="toggleProd(\'' + tipo + '\')">' +
      (listo ? 'Listo' : 'Marcar listo') +
    '</button>' +
  '</div>';
}

async function toggleRecorrido(checked) {
  try {
    const wrap = document.getElementById('recorrido-wrap');
    if (wrap) wrap.style.display = checked ? '' : 'none';
    await fetch(API + '/marcarProduccion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, tieneRecorrido: checked })
    });
    if (_data) _data.tieneRecorrido = checked ? 1 : 0;
  } catch(e) { /* silencioso */ }
}

async function toggleProd(tipo) {
  const btn = document.getElementById('btn-' + tipo);
  const chk = document.getElementById('chk-' + tipo);
  if (!btn) return;

  const eraListo = btn.classList.contains('listo');
  const nuevoValor = !eraListo;
  btn.disabled = true;

  try {
    const body = { token: TOKEN };
    if (tipo === 'fotos')     body.fotografiaLista = nuevoValor;
    if (tipo === 'video')     body.videoListo      = nuevoValor;
    if (tipo === 'recorrido') body.recorridoListo  = nuevoValor;

    const res = await fetch(API + '/marcarProduccion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error');

    if (nuevoValor) {
      btn.classList.replace('pendiente', 'listo');
      btn.textContent = 'Listo';
      chk.classList.add('listo');
      const wrap = btn.closest('.prod-row').querySelector('.prod-label-wrap');
      if (wrap) {
        let fd = wrap.querySelector('.prod-fecha');
        if (!fd) { fd = document.createElement('div'); fd.className = 'prod-fecha'; wrap.appendChild(fd); }
        fd.textContent = new Date().toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' });
      }
    } else {
      btn.classList.replace('listo', 'pendiente');
      btn.textContent = 'Marcar listo';
      chk.classList.remove('listo');
      const fd = btn.closest('.prod-row').querySelector('.prod-fecha');
      if (fd) fd.textContent = '';
    }
  } catch (e) {
    alert('Error al guardar: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function guardarRecorridoUrl() {
  const input = document.getElementById('recorrido-url-input');
  const msg   = document.getElementById('msg-recorrido-url');
  const btn   = document.querySelector('.btn-guardar-url');
  if (!input) return;

  btn.disabled = true;
  if (msg) { msg.textContent = ''; msg.className = 'form-msg-inline'; }

  try {
    const res = await fetch(API + '/marcarProduccion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, recorridoUrl: input.value.trim() })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error');
    if (msg) { msg.textContent = 'Guardado.'; }
    setTimeout(() => { if (msg) msg.textContent = ''; }, 3000);
  } catch (e) {
    if (msg) { msg.textContent = 'Error: ' + e.message; msg.className = 'form-msg-inline error'; }
  } finally {
    btn.disabled = false;
  }
}

function toggleNotaForm() {
  var f = document.getElementById('eq-nota-form');
  if (!f) return;
  f.style.display = f.style.display === 'none' || !f.style.display ? 'block' : 'none';
  if (f.style.display === 'block') {
    var txt = document.getElementById('eq-nota-txt');
    if (txt) txt.focus();
  }
}

async function guardarNotaEquipo() {
  var nota = (document.getElementById('eq-nota-txt') || {}).value || '';
  if (!nota.trim()) return;
  var data = window.EQ_DATA || {};
  var trabajoId = data.trabajoId || '';
  var clienteId = (data.cliente && data.cliente.id) || '';
  try {
    var res = await fetch(API + '/agregarNota', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clienteId: clienteId, trabajoId: trabajoId, descripcion: nota })
    });
    var json = await res.json();
    if (!json.ok) { alert('Error: ' + (json.error || 'desconocido')); return; }
    document.getElementById('eq-nota-txt').value = '';
    document.getElementById('eq-nota-form').style.display = 'none';
    // Reload to show new nota
    cargar();
  } catch(e) { alert('Error de red.'); }
}
</script>
