<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mockup — Armar cuartos v4 (esquema vivo)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root{
    --bg:#f4f1ea; --surface:#fbf9f4; --card:#ffffff; --line:#e3ddd0;
    --ink-1:#23201a; --ink-2:#6b6457; --ink-3:#9a9384;
    --tint:#efeadd; --tint-line:#d8cfb8; --gold:#b89243;
    --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --radius:12px;
    --ts-cap:12px; --ts-body:14px; --ts-base:16px; --ts-lg:18px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink-1);font-size:var(--ts-base);line-height:1.4}
  .wrap{max-width:430px;margin:0 auto;min-height:100vh}
  .top{position:sticky;top:0;background:var(--bg);padding:var(--sp-4) var(--sp-4) var(--sp-2);border-bottom:1px solid var(--line);z-index:5}
  .top h1{font-size:var(--ts-lg);margin:0;font-weight:700}
  .top p{margin:2px 0 0;color:var(--ink-2);font-size:var(--ts-cap)}
  .body{padding:var(--sp-4);padding-bottom:160px}

  /* Quick start */
  .qs{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--sp-4);margin-bottom:var(--sp-5)}
  .qs h2{font-size:var(--ts-body);margin:0 0 4px;font-weight:700}
  .qs .sub{color:var(--ink-2);font-size:var(--ts-cap);margin:0 0 var(--sp-3)}
  .stepper{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
  .stepper .lab{font-size:var(--ts-body);font-weight:600}
  .stepper .ctrls{display:flex;align-items:center;gap:var(--sp-3)}
  .rb{width:38px;height:38px;border-radius:999px;border:1px solid var(--tint-line);background:var(--tint);font-size:20px;font-weight:800;color:var(--ink-1);line-height:1}
  .rb:disabled{opacity:.35}
  .num{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
  .qs-opts{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-3) 0 0;padding-top:var(--sp-3);border-top:1px solid var(--line)}
  .opt{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:var(--ts-body);font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
  .opt.on{background:var(--tint);border-color:var(--tint-line);color:var(--ink-1)}
  .qs-go{margin-top:var(--sp-4);width:100%;min-height:46px;border:0;border-radius:var(--radius);background:var(--ink-1);color:#fff;font-weight:700;font-size:var(--ts-body)}
  .qs.collapsed .qs-inner{display:none}
  .qs .head{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .qs .head .chev{color:var(--ink-3)}

  /* Outline */
  .sec{margin-bottom:var(--sp-5)}
  .sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-2)}
  .sec-h .name{display:flex;align-items:center;gap:8px;font-size:var(--ts-cap);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
  .sec-h .name i{font-size:16px;color:var(--ink-3)}
  .sec-h .cnt{font-size:11px;color:var(--ink-3);font-weight:700}
  .empty{color:var(--ink-3);font-size:var(--ts-body);padding:10px 0;font-style:italic}
  .room{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
  .room-main{display:flex;align-items:center;gap:10px}
  .room-ic{width:34px;height:34px;border-radius:9px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:18px;flex:0 0 auto}
  .room-nm{flex:1;font-weight:700}
  .room-act{display:flex;align-items:center;gap:6px}
  .mini{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:17px}
  .mini.x{color:#b5463a;border-color:#eaccc6}
  .mini .lab{font-size:11px;font-weight:800;margin-left:0}
  .plus1{width:auto;padding:0 10px;gap:3px;font-weight:800;font-size:13px}
  .subs{margin:6px 0 0 44px}
  .sub{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
  .sub .si{color:var(--ink-3);font-size:15px}
  .sub .sn{flex:1;font-size:var(--ts-body);color:var(--ink-1)}
  .sub .sx{width:30px;height:30px;border-radius:7px;border:1px solid #eaccc6;background:#fff;color:#b5463a;font-size:15px}
  .subbar{margin:6px 0 0 44px;display:flex;flex-wrap:wrap;gap:6px}
  .subchip{min-height:34px;padding:0 10px;border:1px dashed var(--tint-line);border-radius:999px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}

  .addfloor{width:100%;min-height:44px;border:1px dashed var(--tint-line);background:transparent;color:var(--ink-2);border-radius:var(--radius);font-weight:700;font-size:var(--ts-body);margin-top:4px}

  /* FAB + Listo */
  .foot{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--bg) 72%,transparent);padding:var(--sp-3) var(--sp-4) var(--sp-5);z-index:6}
  .foot .inner{max-width:430px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .add-big{flex:1;min-height:54px;border:0;border-radius:var(--radius);background:var(--ink-1);color:#fff;font-weight:800;font-size:var(--ts-base);display:flex;align-items:center;justify-content:center;gap:8px}
  .listo{min-height:54px;padding:0 18px;border:0;border-radius:var(--radius);background:var(--gold);color:#241c08;font-weight:800}
  .listo:disabled{background:var(--tint);color:var(--ink-3)}
  .count-line{max-width:430px;margin:0 auto 8px;text-align:center;color:var(--ink-2);font-size:var(--ts-cap);font-weight:600}

  /* Sheet */
  .scrim{position:fixed;inset:0;background:rgba(20,18,14,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;z-index:21;transform:translateY(100%);transition:transform .22s ease;max-height:86vh;display:flex;flex-direction:column}
  .sheet.open{transform:translateY(0)}
  .sheet-h{padding:var(--sp-4) var(--sp-4) var(--sp-2)}
  .sheet-grab{width:40px;height:4px;border-radius:99px;background:var(--tint-line);margin:0 auto 10px}
  .sheet-h .row{display:flex;align-items:center;justify-content:space-between}
  .sheet-h h2{font-size:var(--ts-base);margin:0;font-weight:800}
  .sheet-x{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:18px}
  .tabs{display:flex;gap:6px;margin-top:var(--sp-3)}
  .tab{flex:1;min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-2);font-weight:700;font-size:var(--ts-body)}
  .tab.on{background:var(--tint);border-color:var(--tint-line);color:var(--ink-1)}
  .floorpick{display:flex;align-items:center;gap:8px;margin-top:var(--sp-3);font-size:var(--ts-cap);color:var(--ink-2);font-weight:600}
  .floorpick select{font:inherit;font-weight:700;color:var(--ink-1);border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;min-height:34px}
  .sheet-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;min-height:44px;margin:var(--sp-3) var(--sp-4) 0;color:var(--ink-3)}
  .sheet-search input{border:0;outline:0;flex:1;font:inherit;color:var(--ink-1);background:transparent}
  .tiles{overflow:auto;padding:var(--sp-3) var(--sp-4) var(--sp-5);display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:78px}
  .tile i{font-size:24px;color:var(--ink-1)}
  .tile .tl{font-size:12px;font-weight:700;text-align:center;line-height:1.15;color:var(--ink-1)}
  .tile .badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:999px;background:var(--gold);color:#241c08;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .tile.added{border-color:var(--tint-line);background:var(--tint)}
  .hint{padding:0 var(--sp-4) 6px;color:var(--ink-3);font-size:11px;text-align:center}
  .note{max-width:430px;margin:0 auto;padding:10px var(--sp-4) 0;color:var(--ink-3);font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Armar cuartos</h1><p>Mockup v4 — esquema vivo + hoja para agregar. Solo maqueta.</p></div>
  <div class="body" id="body"></div>
</div>

<div class="foot">
  <div class="count-line" id="countLine"></div>
  <div class="inner">
    <button class="add-big" onclick="openSheet()"><i class="ti ti-plus"></i> Agregar cuarto</button>
    <button class="listo" id="listo" disabled>Listo</button>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-h">
    <div class="sheet-grab"></div>
    <div class="row"><h2>Agregar cuarto</h2><button class="sheet-x" onclick="closeSheet()"><i class="ti ti-x"></i></button></div>
    <div class="tabs" id="tabs"></div>
    <div class="floorpick" id="floorpick"></div>
  </div>
  <div class="sheet-search"><i class="ti ti-search"></i><input id="sheetSearch" placeholder="buscar otro cuarto…" oninput="renderTiles()"></div>
  <div class="hint">Toca un cuarto para agregarlo · la hoja se queda abierta para seguir</div>
  <div class="tiles" id="tiles"></div>
</div>

<div class="note">Mockup de diseño · sin datos reales · iav</div>

<script>
// Biblioteca por zona, en orden de recorrido. {b:nombre base, i:icono tabler, rep:repetible}
var LIB = {
  interior:[
    {b:"Recibidor",i:"door-enter"},{b:"Sala",i:"sofa"},{b:"Comedor",i:"tools-kitchen-2"},
    {b:"Cocina",i:"tools-kitchen-2"},{b:"Antecomedor",i:"cup"},
    {b:"Recámara",i:"bed",rep:1},{b:"Baño",i:"bath",rep:1},{b:"Medio baño",i:"droplet",rep:1},
    {b:"Estudio",i:"books"},{b:"Cuarto de TV",i:"device-tv"},{b:"Lavandería",i:"wash"},
    {b:"Cuarto de servicio",i:"door"}
  ],
  exterior:[
    {b:"Fachada",i:"home"},{b:"Jardín",i:"plant-2"},{b:"Terraza",i:"sun"},
    {b:"Cochera",i:"car",rep:1},{b:"Patio",i:"fence"},{b:"Roof garden",i:"building"}
  ],
  amenidades:[
    {b:"Alberca",i:"pool"},{b:"Casa club",i:"building-community"},{b:"Gimnasio",i:"barbell"},
    {b:"Cancha",i:"ball-football"},{b:"Áreas verdes",i:"trees"},{b:"Caseta",i:"shield-half"}
  ]
};
var SUBS = [{b:"Clóset",i:"hanger"},{b:"Baño",i:"bath"},{b:"Vestidor",i:"shirt"},{b:"Balcón",i:"sun"}];

// Estado
var floors=[{name:"Planta baja",rooms:[]}];
var exterior=[]; var amenidades=[];
var sheetZone="interior", sheetFloor=0, sheetOpen=false;
var qsCollapsed=false, qs={rec:3,ban:2,med:1,pisos:1,opts:{Sala:true,Comedor:true,Cocina:true,Fachada:true}};

function icon(n){return '<i class="ti ti-'+n+'"></i>';}
function uid(){return Math.random().toString(36).slice(2,7);}

function listFor(zone,floorIdx){ return zone==="interior"?floors[floorIdx].rooms:(zone==="exterior"?exterior:amenidades); }
function nextName(list,base){ var n=list.filter(function(r){return r.base===base;}).length; return n===0?base:base+" "+(n+1); }

function addRoom(zone,base,icn,floorIdx){
  var fi = floorIdx==null?sheetFloor:floorIdx;
  var list=listFor(zone,fi);
  list.push({id:uid(),base:base,name:nextName(list,base),icon:icn||"point",subs:[]});
  render();
}
function dup(zone,fi,roomId){
  var list=listFor(zone,fi); var r=list.find(function(x){return x.id===roomId;});
  if(r){ list.push({id:uid(),base:r.base,name:nextName(list,r.base),icon:r.icon,subs:[]}); render(); }
}
function delRoom(zone,fi,roomId){ var list=listFor(zone,fi); var i=list.findIndex(function(x){return x.id===roomId;}); if(i>=0)list.splice(i,1); render(); }
function addSub(zone,fi,roomId,base,icn){
  var list=listFor(zone,fi); var r=list.find(function(x){return x.id===roomId;}); if(!r)return;
  var n=r.subs.filter(function(s){return s.base===base;}).length;
  r.subs.push({id:uid(),base:base,name:n===0?base:base+" "+(n+1),icon:icn});
  render();
}
function delSub(zone,fi,roomId,subId){
  var list=listFor(zone,fi); var r=list.find(function(x){return x.id===roomId;}); if(!r)return;
  var i=r.subs.findIndex(function(s){return s.id===subId;}); if(i>=0)r.subs.splice(i,1); render();
}
function addFloor(){ floors.push({name:floors.length===1?"Planta alta":("Planta "+(floors.length+1)),rooms:[]}); render(); }

// Quick start
function step(k,d){ qs[k]=Math.max(k==="pisos"?1:0,qs[k]+d); render(); }
function toggleOpt(o){ qs.opts[o]=!qs.opts[o]; render(); }
function generar(){
  floors=[]; exterior=[]; amenidades=[];
  for(var p=0;p<qs.pisos;p++) floors.push({name:p===0?"Planta baja":(p===1?"Planta alta":("Planta "+(p+1))),rooms:[]});
  // típicos en planta baja
  var pb=floors[0].rooms;
  ["Sala","Comedor","Cocina"].forEach(function(o){ if(qs.opts[o]){ var L=LIB.interior.find(function(x){return x.b===o;}); pb.push({id:uid(),base:o,name:o,icon:L?L.i:"point",subs:[]}); }});
  if(qs.opts.Fachada) exterior.push({id:uid(),base:"Fachada",name:"Fachada",icon:"home",subs:[]});
  // recámaras y baños repartidos: si hay 2+ pisos, recámaras a planta alta
  var recFloor = qs.pisos>1?1:0;
  for(var r=0;r<qs.rec;r++){ var L=floors[recFloor].rooms; L.push({id:uid(),base:"Recámara",name:nextName(L,"Recámara"),icon:"bed",subs:[]}); }
  for(var b=0;b<qs.ban;b++){ var Lb=floors[recFloor].rooms; Lb.push({id:uid(),base:"Baño",name:nextName(Lb,"Baño"),icon:"bath",subs:[]}); }
  for(var m=0;m<qs.med;m++){ pb.push({id:uid(),base:"Medio baño",name:nextName(pb,"Medio baño"),icon:"droplet",subs:[]}); }
  qsCollapsed=true; render();
}

function totalRooms(){ var n=0; floors.forEach(function(f){n+=f.rooms.length;}); n+=exterior.length+amenidades.length; return n; }

// Render outline
function roomHTML(zone,fi,r){
  var subbar='<div class="subbar">'+SUBS.map(function(s){return '<button class="subchip" onclick="addSub(\''+zone+'\','+fi+',\''+r.id+'\',\''+s.b+'\',\''+s.i+'\')">'+icon(s.i)+s.b+'</button>';}).join('')+'</div>';
  var subs = r.subs.length? '<div class="subs">'+r.subs.map(function(s){return '<div class="sub"><span class="si">'+icon(s.icon)+'</span><span class="sn">'+s.name+'</span><button class="sx" onclick="delSub(\''+zone+'\','+fi+',\''+r.id+'\',\''+s.id+'\')">'+icon("x")+'</button></div>';}).join('')+'</div>':'';
  return '<div class="room"><div class="room-main"><div class="room-ic">'+icon(r.icon)+'</div><div class="room-nm">'+r.name+'</div>'+
    '<div class="room-act">'+
    '<button class="mini plus1" onclick="dup(\''+zone+'\','+fi+',\''+r.id+'\')">'+icon("plus")+'<span class="lab">1</span></button>'+
    '<button class="mini x" onclick="delRoom(\''+zone+'\','+fi+',\''+r.id+'\')">'+icon("trash")+'</button>'+
    '</div></div>'+subs+subbar+'</div>';
}
function secHTML(title,iconN,cnt,inner){
  return '<div class="sec"><div class="sec-h"><div class="name">'+icon(iconN)+title+'</div><div class="cnt">'+cnt+'</div></div>'+inner+'</div>';
}

function renderOutline(){
  var h="";
  // QUICK START
  h+='<div class="qs'+(qsCollapsed?' collapsed':'')+'">'+
     '<div class="head" onclick="qsCollapsed=!qsCollapsed;render()"><h2>Arranque rápido <span style="color:var(--ink-3);font-weight:600">(opcional)</span></h2><span class="chev">'+icon(qsCollapsed?"chevron-down":"chevron-up")+'</span></div>'+
     '<div class="qs-inner"><p class="sub">Dinos el tamaño y armamos el esqueleto; luego ajustas abajo.</p>'+
     [["Recámaras","rec"],["Baños","ban"],["Medios baños","med"],["Pisos","pisos"]].map(function(p){
        return '<div class="stepper"><span class="lab">'+p[0]+'</span><span class="ctrls"><button class="rb" '+((p[1]==="pisos"&&qs.pisos<=1)||(p[1]!=="pisos"&&qs[p[1]]<=0)?"disabled":"")+' onclick="step(\''+p[1]+'\',-1)">−</button><span class="num">'+qs[p[1]]+'</span><button class="rb" onclick="step(\''+p[1]+'\',1)">+</button></span></div>';
     }).join('')+
     '<div class="qs-opts">'+["Sala","Comedor","Cocina","Fachada"].map(function(o){return '<button class="opt'+(qs.opts[o]?' on':'')+'" onclick="toggleOpt(\''+o+'\')">'+icon(qs.opts[o]?"check":"plus")+o+'</button>';}).join('')+'</div>'+
     '<button class="qs-go" onclick="generar()">Generar esqueleto</button></div></div>';

  // OUTLINE por piso
  floors.forEach(function(f,fi){
    var inner = f.rooms.length? f.rooms.map(function(r){return roomHTML("interior",fi,r);}).join('') : '<div class="empty">Sin cuartos en esta planta todavía.</div>';
    h+=secHTML(f.name,"stairs",f.rooms.length+(f.rooms.length===1?" cuarto":" cuartos"),inner);
  });
  h+='<button class="addfloor" onclick="addFloor()">'+icon("plus")+' Agregar planta</button>';
  // Exterior / Amenidades
  h+=secHTML("Exterior","tree",exterior.length, exterior.length?exterior.map(function(r){return roomHTML("exterior",0,r);}).join(''):'<div class="empty">Sin espacios exteriores.</div>');
  h+=secHTML("Amenidades","pool",amenidades.length, amenidades.length?amenidades.map(function(r){return roomHTML("amenidades",0,r);}).join(''):'<div class="empty">Sin amenidades.</div>');

  document.getElementById("body").innerHTML=h;
  var n=totalRooms();
  document.getElementById("countLine").textContent = n? (n+" "+(n===1?"cuarto":"cuartos")+" en total") : "Empieza con + Agregar o el arranque rápido";
  document.getElementById("listo").disabled = n===0;
}

// Render sheet
function renderTabs(){
  var T=[["interior","Interior"],["exterior","Exterior"],["amenidades","Amenidades"]];
  document.getElementById("tabs").innerHTML=T.map(function(t){return '<button class="tab'+(sheetZone===t[0]?' on':'')+'" onclick="setZone(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
  var fp=document.getElementById("floorpick");
  if(sheetZone==="interior"){
    fp.style.display="flex";
    fp.innerHTML='Agregar a: <select onchange="sheetFloor=+this.value;renderTiles()">'+floors.map(function(f,i){return '<option value="'+i+'"'+(i===sheetFloor?" selected":"")+'>'+f.name+'</option>';}).join('')+'</select>';
  } else { fp.style.display="none"; fp.innerHTML=""; }
}
function setZone(z){ sheetZone=z; renderTabs(); renderTiles(); }
function renderTiles(){
  var q=(document.getElementById("sheetSearch").value||"").toLowerCase();
  var lib=LIB[sheetZone].filter(function(x){return x.b.toLowerCase().indexOf(q)>=0;});
  var list=listFor(sheetZone,sheetFloor);
  document.getElementById("tiles").innerHTML=lib.map(function(x){
    var cnt=list.filter(function(r){return r.base===x.b;}).length;
    return '<button class="tile'+(cnt?' added':'')+'" onclick="addRoom(\''+sheetZone+'\',\''+x.b+'\',\''+x.i+'\')">'+(cnt?'<span class="badge">'+cnt+'</span>':'')+icon(x.i)+'<span class="tl">'+x.b+'</span></button>';
  }).join('');
}
function openSheet(){ sheetOpen=true; document.getElementById("scrim").classList.add("open"); document.getElementById("sheet").classList.add("open"); renderTabs(); renderTiles(); }
function closeSheet(){ sheetOpen=false; document.getElementById("scrim").classList.remove("open"); document.getElementById("sheet").classList.remove("open"); }

function render(){ renderOutline(); if(sheetOpen){ renderTabs(); renderTiles(); } }
render();
</script>
</body>
</html>
