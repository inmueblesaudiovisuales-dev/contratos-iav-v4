name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  # Los tests corren ANTES del deploy y lo bloquean si fallan. Sin esta etapa, un
  # push roto llegaba a produccion en ~1 min y el unico aviso era que el admin
  # dejara de cargar. Son ~400 tests de logica pura: tardan segundos.
  test:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Logica del Worker: entregas-core, entregas-media, entregas-zip.
      - name: Tests del worker
        run: node --test "src/**/*.test.js"
        working-directory: worker
      # Logica del checklist. Vive en frontend/ y es CommonJS, por eso va aparte.
      - name: Tests del checklist
        run: node --test frontend/checklist-logic.test.js

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          # La version va FIJA, y tiene que ser 4.x. Con wrangler 3 el binding
          # [images] no se entiende y se DESCARTA EN SILENCIO: el deploy sale verde
          # y la galeria del cliente se cae con "Cannot read properties of undefined
          # (reading 'input')". Eso fue lo que obligo a fijarla en R129, cuando la
          # accion todavia instalaba wrangler 3 por defecto.
          #
          # Desde wrangler-action v4 el default ya es wrangler 4, asi que el peligro
          # de origen desaparecio. Se sigue fijando por otra razon: que el deploy use
          # exactamente la misma version que corre en la maquina de Bruno. Si se sube
          # aqui, hay que subirla TAMBIEN en worker/package.json — si se despegan,
          # lo que pruebas en local deja de ser lo que se despliega.
          wranglerVersion: '4.125.0'
