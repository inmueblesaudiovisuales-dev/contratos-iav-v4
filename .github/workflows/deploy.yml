name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  # Los tests corren ANTES del deploy y lo bloquean si fallan. Sin esta etapa, un
  # push roto llegaba a produccion en ~1 min y el unico aviso era que el admin
  # dejara de cargar. Son ~400 tests de logica pura: tardan segundos.
  test:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Logica del Worker: entregas-core, entregas-media, entregas-zip.
      - name: Tests del worker
        run: node --test "src/**/*.test.js"
        working-directory: worker
      # Logica del checklist. Vive en frontend/ y es CommonJS, por eso va aparte.
      - name: Tests del checklist
        run: node --test frontend/checklist-logic.test.js

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          # R129 — Fijar la version es obligatorio. La que trae la accion por
          # defecto no entiende el binding [images] y lo DESCARTA EN SILENCIO:
          # el deploy sale verde y la galeria del cliente se cae con
          # "Cannot read properties of undefined (reading 'input')".
          wranglerVersion: '4.120.1'
