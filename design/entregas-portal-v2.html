<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup · Portal de control v2</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper-0:#F7F4EC; --paper-1:#FFFDF8; --paper-2:#EFEADF;
  --line:#E2DBCB; --line-2:#D2C9B3;
  --onyx:#1C1C1E; --gold:#B08D2E; --gold-leaf:#C9A84C;
  --ink-1:#211E18; --ink-2:#5C564A; --ink-3:#918975; --ink-4:#B8B0A0;
  --ok:#2F7D55; --ok-bg:#E7F1EA; --danger:#9E3A2F; --danger-bg:#F6E9E7;
  --aviso:#8A6A1F; --aviso-bg:#F7EFD9;
  --font-ui:'Inter',system-ui,sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --font-mono:'Spline Sans Mono',ui-monospace,monospace;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --r:10px; --r-pill:999px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--paper-0);color:var(--ink-1);
  -webkit-font-smoothing:antialiased;font-size:14px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font-family:inherit;cursor:pointer}

.mk{background:#171614;border-bottom:1px solid #2c2a26;padding:9px 16px;display:flex;
  gap:14px;align-items:center;flex-wrap:wrap}
.mk b{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6f6a60}
.seg{display:flex;background:#232120;border-radius:8px;padding:2px;gap:2px}
.seg button{font-size:11.5px;font-weight:500;color:#8b857a;background:none;border:none;
  padding:6px 11px;border-radius:6px}
.seg button.on{background:#3a3733;color:#f0ece2}

/* ── Cabecera ─────────────────────────────────────────────────────────────── */
.top{background:var(--paper-1);border-bottom:1px solid var(--line);padding:10px 20px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.marca{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.marca .ic{width:28px;height:28px;border-radius:7px;background:var(--onyx);color:var(--paper-0);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:12px}
.marca h1{font-family:var(--font-display);font-weight:500;font-size:17px}
.buscar{flex:1;max-width:420px;position:relative}
.buscar input{width:100%;height:34px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--paper-0);padding:0 12px 0 32px;font-family:inherit;font-size:13px;color:var(--ink-1)}
.buscar svg{position:absolute;left:10px;top:9px;color:var(--ink-3)}
.top .der{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{font-size:13px;font-weight:600;border-radius:9px;padding:9px 15px;border:1px solid transparent;
  white-space:nowrap}
.btn-primary{background:var(--gold-leaf);color:#1a1509}
.btn-ghost{background:var(--paper-1);border-color:var(--line-2);color:var(--ink-1)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-block{display:block;width:100%}
.btn-peligro{background:none;border:none;color:var(--ink-3);font-size:12px;text-decoration:underline;
  text-underline-offset:3px}
.btn-peligro:hover{color:var(--danger)}

.wrap{max-width:1100px;margin:0 auto;padding:var(--s5) 20px 60px}

/* ── Lista: filas, no tarjetas ────────────────────────────────────────────── */
.grupo{margin-bottom:var(--s5)}
.grupo h2{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:9px;margin-bottom:var(--s3)}
.grupo h2 .n{font-family:var(--font-mono);font-weight:400;color:var(--ink-3)}
.grupo h2::after{content:'';flex:1;height:1px;background:var(--line)}
.grupo.urge h2{color:var(--aviso)}

.fila{display:grid;grid-template-columns:1fr auto auto;gap:var(--s4);align-items:center;
  background:var(--paper-1);border:1px solid var(--line);border-radius:var(--r);
  padding:12px var(--s4);margin-bottom:6px;cursor:pointer;text-align:left;width:100%;
  font-family:inherit;color:inherit}
.fila:hover{border-color:var(--line-2);background:#fff}
.fila .quien{min-width:0}
.fila .quien b{display:block;font-size:14px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.fila .quien span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block}
.fila .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-4);margin-top:2px}
.fila .toca{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.fila .toca.accion{color:var(--gold)}
.fila .toca.espera{color:var(--ink-3);font-weight:400}
.fila .toca.urge{color:var(--aviso)}
.pill{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--ink-2);
  background:var(--paper-2);white-space:nowrap}
.pill.viva{background:var(--ok-bg);border-color:rgba(47,125,85,.3);color:var(--ok)}
.pill.aviso{background:var(--aviso-bg);border-color:rgba(138,106,31,.3);color:var(--aviso)}
.vacio{padding:30px;text-align:center;color:var(--ink-3);font-size:13px;
  border:1px dashed var(--line-2);border-radius:var(--r)}

/* Configuración: lo que se usa dos veces al año no compite con lo de todos los días */
.menu{position:relative}
.icb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--paper-1);color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.icb:hover{color:var(--ink-1);border-color:var(--ink-4)}
.mpanel{display:none;position:absolute;right:0;top:40px;background:var(--paper-1);
  border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 12px 32px rgba(33,30,24,.13);
  min-width:280px;padding:6px;z-index:40}
.mpanel.on{display:block}
.mpanel button{display:block;width:100%;text-align:left;background:none;border:none;
  padding:9px 11px;border-radius:7px;font-size:13px;color:var(--ink-1)}
.mpanel button:hover{background:var(--paper-2)}
.mpanel button.rojo{color:var(--danger)}
.mpanel button.rojo:hover{background:var(--danger-bg)}
.mpanel hr{border:none;border-top:1px solid var(--line);margin:5px 8px}

/* Modo quitar: borrar deja de ser algo que pasa por acercar el mouse. Hay que
   entrar a propósito, elegir, y confirmar cuántas. */
.selbar{display:flex;align-items:center;gap:10px;background:var(--danger-bg);
  border:1px solid rgba(158,58,47,.25);border-radius:9px;padding:9px 12px;margin-bottom:10px}
.selbar b{font-size:12.5px;color:var(--danger);flex:1}
.tira.sel{border:2px solid var(--danger)}
.tira .marca{position:absolute;inset:0;background:rgba(158,58,47,.42);display:none;
  align-items:center;justify-content:center;color:#fff}
.tira.sel .marca{display:flex}

/* ── Detalle ──────────────────────────────────────────────────────────────── */
.volver{background:none;border:none;font-family:var(--font-mono);font-size:11.5px;
  color:var(--ink-3);padding:0;margin-bottom:var(--s4)}
.volver:hover{color:var(--ink-1)}

/* La barra de acción se queda pegada arriba: lo que hay que hacer no puede vivir
   al final de 50 fotos. */
.accionbar{position:sticky;top:55px;z-index:20;background:var(--paper-1);
  border:1px solid var(--line);border-radius:var(--r);padding:14px var(--s4);
  display:flex;align-items:center;gap:var(--s4);margin-bottom:var(--s4);flex-wrap:wrap}
.accionbar .tit{min-width:0;flex:1}
.accionbar h2{font-family:var(--font-display);font-weight:500;font-size:20px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accionbar .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.accionbar .sub em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.accionbar .acc{display:flex;gap:8px;align-items:center;flex:0 0 auto}
/* En pantallas angostas los botones se llevan el titulo entero por delante. Mejor
   apilarlos que dejar el nombre del cliente en "cas…". */
@media(max-width:820px){
  .accionbar{flex-direction:column;align-items:stretch}
  .accionbar .acc{justify-content:space-between}
  .accionbar .acc .btn{flex:1}
}
.paso{font-size:12px;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px}
.paso b{color:var(--gold)}

.cols{display:grid;grid-template-columns:1fr 300px;gap:var(--s4);align-items:start}
@media(max-width:880px){ .cols{grid-template-columns:1fr} }
.card{background:var(--paper-1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px var(--s4);border-bottom:1px solid var(--line)}
.card-hd b{font-size:13px;font-weight:600}
.card-pad{padding:var(--s4)}

.ent{padding:var(--s4);border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:none}
.ent-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--ok);border-color:var(--ok)}
.ent-hd .lab{flex:1;min-width:0}
.ent-hd .lab b{display:block;font-size:13.5px;font-weight:600}
.ent-hd .lab span{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}

/* Cuadrícula densa: 50 fotos tienen que caber sin scroll infinito. Sin nombres —
   "IAV-2607.17…" repetido 50 veces no distingue nada; el nombre va en el tooltip. */
.tiras{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px}
.tira{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--line);
  background:var(--paper-2) center/cover;padding:0;cursor:pointer}
.tira:hover{border-color:var(--gold-leaf)}
.tira .x{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;
  background:rgba(255,253,248,.94);border:1px solid var(--line-2);color:var(--danger);
  font-size:11px;line-height:1;display:none;align-items:center;justify-content:center;padding:0}
.tira:hover .x{display:flex}
/* La portada se marca con estrella llena y borde dorado. Al pasar el mouse por
   cualquier otra aparece una estrella hueca: es lo que hace descubrible que se
   puede cambiar con un clic. Sin eso, la funcion existe pero nadie la encuentra. */
.tira.port{border:2px solid var(--gold-leaf)}
.tira .est{position:absolute;bottom:2px;left:2px;color:var(--gold-leaf);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.tira .est.fantasma{display:none;color:#fff;opacity:.9}
.tira:hover .est.fantasma{display:block}
.tira .cinta{position:absolute;top:0;left:0;right:0;background:var(--gold-leaf);
  color:#1a1509;font-family:var(--font-mono);font-size:8px;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 0;text-align:center}
.ayuda{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-top:9px;
  display:flex;align-items:center;gap:6px}
.ayuda svg{color:var(--gold-leaf);flex:0 0 auto}
.zona{border:1px dashed var(--line-2);border-radius:9px;padding:14px;text-align:center;
  color:var(--ink-3);font-size:12.5px;margin-top:10px;background:var(--paper-0);cursor:pointer}
.zona:hover{border-color:var(--gold-leaf);color:var(--ink-2)}
.zona b{display:block;font-size:13px;color:var(--ink-1);font-weight:600;margin-bottom:2px}

.money{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0}
.money .k{font-size:12px;color:var(--ink-2)}
.money .v{font-family:var(--font-display);font-size:16px}
.money .v.due{color:var(--danger)}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.liga{display:flex;gap:7px;align-items:center;margin-top:10px}
.liga .u{flex:1;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--paper-0);
  border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.bit div{display:flex;gap:10px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--paper-2)}
.bit div:last-child{border:none}
.bit time{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-4);flex:0 0 52px}
.bit span{color:var(--ink-2)}
.prog{height:5px;background:var(--paper-2);border-radius:var(--r-pill);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--gold-leaf);width:0}
</style>
</head>
<body>

<div class="mk">
  <b>Mockup</b>
  <div class="seg" id="segV">
    <button data-v="lista" class="on">Lista</button>
    <button data-v="detalle">Detalle de una entrega</button>
  </div>
  <div class="seg" id="segE">
    <button data-e="borrador" class="on">Borrador</button>
    <button data-e="publicada">Publicada</button>
    <button data-e="liberada">Liberada</button>
  </div>
</div>

<div class="top">
  <div class="marca"><span class="ic">IA</span><h1>Entregas</h1></div>
  <div class="buscar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" placeholder="Buscar por cliente, folio o dirección…" oninput="pintar()">
  </div>
  <div class="der">
    <div class="menu">
      <button class="icb" onclick="menu()" title="Configuración">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <!-- Lo que borra material vive aqui adentro: se usa dos veces al ano y no
           tiene por que estar al lado del boton de todos los dias. -->
      <div class="mpanel" id="mpanel">
        <button>Cambiar la contraseña</button>
        <button>Buscar material sin dueño</button>
        <hr>
        <button class="rojo">Limpiar material de entregas que nunca pagaron</button>
      </div>
    </div>
    <button class="btn btn-primary">Nueva entrega</button>
  </div>
</div>

<div class="wrap" id="app"></div>

  var filas = D.lista.filter(function(e){
    if(!q) return true;
    return ((e.cliente||'') + ' ' + (e.folio||'') + ' ' + (e.titulo||'')).toLowerCase().indexOf(q) >= 0;
  });

  var grupos = { urge:[], 'tú':[], esperando:[], entregadas:[] };
  filas.forEach(function(e){ grupos[queToca(e).grupo].push(e); });

  var nombres = { urge:'Se borran pronto', 'tú':'Por hacer',
                  esperando:'Esperando pago', entregadas:'Entregadas' };
  var h = '';
  ['urge','tú','esperando','entregadas'].forEach(function(g){
    if(!grupos[g].length) return;
    h += '<div class="grupo' + (g==='urge'?' urge':'') + '"><h2>' + nombres[g] +
      ' <span class="n">' + grupos[g].length + '</span></h2>' +
      grupos[g].map(function(e){
        var t = queToca(e);
        return '<button class="fila" onclick="ir(\'detalle\')">' +
          '<span class="quien"><b>' + esc(e.cliente || 'Sin cliente') + '</b>' +
          '<span>' + esc(e.titulo || 'Sin dirección') + '</span>' +
          '<span class="meta">' + esc(e.folio || 'sin folio') +
            (e.fechaSesion ? ' · sesión ' + esc(e.fechaSesion) : '') + '</span></span>' +
          '<span class="toca ' + t.clase + '">' + esc(t.txt) + '</span>' +
          pill(e) + '</button>';
      }).join('') + '</div>';
  });
  if(!h) h = '<div class="vacio">Nada coincide con “' + esc(q) + '”.</div>';
  return h;
}

function pintarDetalle(){
  var d = D.detalle;
  var e = Object.assign({}, d.entrega, { estado: ESTADO });
  var fotos = d.archivos.filter(function(a){ return /image/.test(a.mime); });
  var pendientes = ESTADO === 'borrador' ? 12 : 0;

  // Barra de acción: SIEMPRE visible, siempre con un solo siguiente paso.
  var acc = '', paso = '';
  if(ESTADO === 'borrador'){
    paso = pendientes
      ? '<span class="paso">Preparando galería · faltan <b>' + pendientes + '</b></span>'
      : '<span class="paso">Todo listo</span>';
    acc = pendientes
      ? '<button class="btn btn-ghost">Preparar galería</button><button class="btn btn-primary">Publicar</button>'
      : '<button class="btn btn-primary">Publicar</button>';
  } else if(ESTADO === 'publicada'){
    paso = '<span class="paso">Saldo <b>' + money(3500) + '</b></span>';
    acc = '<button class="btn btn-ghost">Copiar liga</button><button class="btn btn-primary">Liberar ahora</button>';
  } else {
    paso = '<span class="paso">Vence en <b>14 días</b></span>';
    acc = '<button class="btn btn-ghost">Extender 14 días</button><button class="btn btn-primary">Copiar liga</button>';
  }

  var h = '<button class="volver" onclick="ir(\'lista\')">← Todas las entregas</button>' +
    '<div class="accionbar"><div class="tit"><h2>' + esc(d.cliente.nombre || 'Sin cliente') + '</h2>' +
    '<div class="sub">' + esc(e.titulo || 'Sin dirección') + ' · <em>' +
      esc(e.codigo) + '</em></div></div>' +
    '<div class="acc">' + paso + acc + '</div></div>';

  h += '<div class="cols"><div>';

  h += '<div class="card"><div class="card-hd"><b>Entregables</b>' +
    '<button class="btn btn-ghost btn-sm">Agregar</button></div>';

  d.entregables.forEach(function(it){
    var suyas = it.tipo === 'fotos' ? fotos : [];
    var completo = suyas.length > 0 || it.completo;
    h += '<div class="ent"><div class="ent-hd">' +
      '<span class="tick' + (completo ? ' on' : '') + '">' +
        (completo ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>' : '') +
      '</span><span class="lab"><b>' + esc(it.nombre) + '</b><span>' +
      (suyas.length ? suyas.length + ' archivos · 476 MB' : 'sin archivos') + '</span></span>' +
      (suyas.length && !QUITANDO
        ? '<button class="btn btn-ghost btn-sm" onclick="modoQuitar(true)">Quitar fotos</button>' : '') +
      '</div>';

    if(suyas.length){
      // En modo quitar la barra dice exactamente cuantas se van y como salirse.
      if(QUITANDO){
        h += '<div class="selbar"><b>' + (SEL.length ? 'Vas a quitar ' + SEL.length + ' foto' + (SEL.length===1?'':'s') : 'Toca las fotos que quieras quitar') + '</b>' +
          '<button class="btn btn-ghost btn-sm" onclick="modoQuitar(false)">Cancelar</button>' +
          (SEL.length ? '<button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="modoQuitar(false)">Quitar ' + SEL.length + '</button>' : '') +
          '</div>';
      }
      h += '<div class="tiras">' + suyas.map(function(a, i){
        var pid = D.fotosPublicas[i % D.fotosPublicas.length];
        var sel = SEL.indexOf(i) >= 0;
        var tit = QUITANDO ? esc(a.nombre) + ' — tócala para quitarla'
                : (i===0 ? esc(a.nombre) + ' — es la portada' : esc(a.nombre) + ' — clic para usar como portada');
        return '<button class="tira' + (i===0 && !QUITANDO ? ' port' : '') + (sel ? ' sel' : '') +
          '" title="' + tit + '" onclick="' + (QUITANDO ? 'marcar(' + i + ')' : 'void 0') + '"' +
          ' style="background-image:url(\'' + BASE + '/api/e/foto?a=' + pid + '&w=120&d=60\')">' +
          (i===0 && !QUITANDO
            ? '<span class="cinta">portada</span><span class="est"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg></span>'
            : (!QUITANDO ? '<span class="est fantasma"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg></span>' : '')) +
          '<span class="marca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>' +
          '</button>';
      }).join('') + '</div>';
      // Sin esta linea, elegir portada es una funcion que solo se descubre por
      // accidente. Se muestra solo cuando hay mas de una foto: con una sola no hay
      // nada que elegir.
      if(!QUITANDO && suyas.length > 1){
        h += '<p class="ayuda"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>' +
          'La foto con estrella es la portada que ve el cliente. Toca cualquier otra para cambiarla.</p>';
      }
      if(pendientes) h += '<div class="prog"><i style="width:76%"></i></div>';
    }
    h += '<div class="zona"><b>Arrastra ' + (it.tipo === 'video' ? 'el video' : 'las fotos') + '</b>' +
      'o haz clic para elegirlas</div></div>';
  });
  h += '</div>';

  h += '</div><aside>';
  h += '<div class="card"><div class="card-hd"><b>Pago</b></div><div class="card-pad">' +
    '<div class="money"><span class="k">Total</span><span class="v">' + money(9000) + '</span></div>' +
    '<div class="money"><span class="k">Saldo</span><span class="v' + (ESTADO==='liberada'?'':' due') + '">' +
      money(ESTADO==='liberada'?0:3500) + '</span></div>' +
    '<p class="hint">Se lee del contrato en vivo. Al llegar a cero se libera sola.</p></div></div>';

  h += '<div class="card" style="margin-top:12px"><div class="card-hd"><b>La liga del cliente</b></div>' +
    '<div class="card-pad"><div class="liga"><span class="u">' + esc((e.codigo||'').slice(0,22)) + '…</span>' +
    '<button class="btn btn-ghost btn-sm">Copiar</button></div>' +
    '<p class="hint" style="margin-top:8px">' +
    (ESTADO === 'borrador' ? 'Todavía no muestra nada: la entrega está en borrador.'
      : 'Ya funciona. Mándala por WhatsApp.') + '</p></div></div>';

  h += '<div class="card" style="margin-top:12px"><div class="card-hd"><b>Movimientos</b></div>' +
    '<div class="card-pad bit">' + d.eventos.slice(0,6).map(function(v){
      var n = { creada:'Entrega creada', publicada:'Publicada', liberada:'Liberada',
        vista:'El cliente la abrió', descarga:'Descargó material', pago:'Pago',
        video_limpio:'Video sin marca listo' }[v.tipo] || v.tipo;
      return '<div><time>' + (v.fecha||'').slice(5,10) + '</time><span>' + esc(n) + '</span></div>';
    }).join('') + '</div></div>';

  h += '</aside></div>';
  return h;
}

function pintar(){
  document.getElementById('app').innerHTML =
    VISTA === 'lista' ? pintarLista() : pintarDetalle();
  document.querySelector('.buscar').style.visibility = VISTA === 'lista' ? '' : 'hidden';
}
function ir(v){
  VISTA = v;
  document.querySelectorAll('#segV button').forEach(function(b){
    b.classList.toggle('on', b.dataset.v === v); });
  pintar();
}
document.getElementById('segV').addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if(b) ir(b.dataset.v);
});
document.getElementById('segE').addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on'); ESTADO = b.dataset.e;
  if(VISTA !== 'detalle') ir('detalle'); else pintar();
});
pintar();
</script>
</body>
</html>
