<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup · Portal del cliente v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper-0:#F7F4EC; --paper-1:#FFFDF8; --paper-2:#EFEADF;
  --line:#E2DBCB; --line-2:#D2C9B3;
  --onyx:#1C1C1E; --gold:#B08D2E; --gold-leaf:#C9A84C; --gold-hi:#D4B65C;
  --ink-1:#211E18; --ink-2:#5C564A; --ink-3:#918975; --ink-4:#B8B0A0;
  --ok:#2F7D55; --ok-bg:#E7F1EA; --wa:#25D366;
  --font-ui:'Inter',system-ui,sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --font-mono:'Spline Sans Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-ui);background:#0e0d0b;color:var(--ink-1);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ══ Barra del mockup (NO es parte del diseño) ══════════════════════════════ */
.mk{position:sticky;top:0;z-index:100;background:#171614;border-bottom:1px solid #2c2a26;
  padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.mk b{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#6f6a60}
.seg{display:flex;background:#232120;border-radius:8px;padding:2px;gap:2px}
.seg button{font-family:var(--font-ui);font-size:11.5px;font-weight:500;color:#8b857a;
  background:none;border:none;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#3a3733;color:#f0ece2}

.stage{padding:26px 16px 60px;display:flex;justify-content:center}
.device{width:100%;background:var(--paper-0);position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.5);border-radius:2px;overflow:hidden}
.device.movil{max-width:430px}
.device.escritorio{max-width:1080px}

/* ══ Diseño ═════════════════════════════════════════════════════════════════ */
header{background:var(--onyx);padding:13px 24px;display:flex;align-items:center;justify-content:center}
.logo{font-family:var(--font-display);font-size:14px;color:var(--paper-0);letter-spacing:.03em}
.logo em{font-style:normal;color:var(--gold-leaf)}
.hair{height:1px;background:var(--gold-leaf);opacity:.55}

/* Hero: SIEMPRE una foto (o el video de portada si no hay fotos). Nunca un
   reproductor: el video tiene su propia seccion mas abajo. */
.hero{position:relative;overflow:hidden;background:#3a3630 center/cover;
  height:clamp(260px,42vh,420px)}
.escritorio .hero{height:clamp(340px,52vh,520px)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(20,16,10,.86),rgba(20,16,10,.05) 62%)}
.hero .ov{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  justify-content:flex-end;padding:20px}
.escritorio .hero .ov{padding:34px 40px}
.hero .ey{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-hi);margin-bottom:6px}
.hero .ti{font-family:var(--font-display);font-weight:500;color:#fff;font-size:25px;line-height:1.12}
.escritorio .hero .ti{font-size:38px}

.body{padding:24px 18px 46px}
.escritorio .body{padding:34px 40px 70px}
.sect{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;margin:0 0 13px}
.sect::after{content:'';flex:1;height:1px;background:var(--line-2)}
.sect .n{font-family:var(--font-mono);font-weight:400;color:var(--ink-3);letter-spacing:.02em}
.bloque{margin-bottom:30px}
.escritorio .bloque{margin-bottom:42px}

.banner{border-radius:11px;padding:14px 16px;margin-bottom:26px;display:flex;gap:12px;align-items:flex-start}
.banner.lock{background:var(--paper-2);border:1px solid var(--line-2)}
.banner.live{background:var(--ok-bg);border:1px solid rgba(47,125,85,.3)}
.banner .ic{flex:0 0 auto;margin-top:1px;color:var(--ink-3)}
.banner.live .ic{color:var(--ok)}
.banner b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.banner.live b{color:var(--ok)}
.banner p{font-size:12px;color:var(--ink-2);line-height:1.5}

/* ── Video: una rejilla que se adapta al numero ─────────────────────────────
   1 video  -> una pieza ancha, 16:9, protagonista.
   2 o mas  -> dos columnas en escritorio, apiladas en movil.
   El caso de 3 no deja un huerfano raro porque las piezas son iguales. */
.videos{display:grid;gap:12px;grid-template-columns:1fr}
.escritorio .videos.multi{grid-template-columns:1fr 1fr}
.vcard{position:relative;border-radius:12px;overflow:hidden;background:#2a2724;
  aspect-ratio:16/9;border:none;padding:0;cursor:pointer;display:block;width:100%}
.vcard img{width:100%;height:100%;object-fit:cover;display:block}
.vcard::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(18,15,10,.72),rgba(18,15,10,0) 55%)}
.vcard .pl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
  width:52px;height:52px;border-radius:50%;background:rgba(255,253,248,.94);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(0,0,0,.4)}
.vcard .cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:12px 14px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.vcard .cap b{font-size:13px;font-weight:600;color:#fff;text-align:left;line-height:1.3}
.vcard .cap span{font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,.8);flex:0 0 auto}

/* ── Fotos: mosaico por columnas. Respeta la proporcion real de cada foto, asi
   que una vertical se ve vertical en vez de salir recortada a 4:3. ────────── */
.mosaico{column-count:2;column-gap:8px}
.escritorio .mosaico{column-count:3;column-gap:12px}
.ph{break-inside:avoid;margin:0 0 8px;position:relative;border-radius:9px;overflow:hidden;
  background:var(--paper-2);cursor:pointer;display:block;width:100%;border:none;padding:0}
.escritorio .ph{margin-bottom:12px}
.ph img{width:100%;height:auto;display:block;opacity:0;transition:opacity .35s}
.ph img.ok{opacity:1}
.ph::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(33,30,24,.09);
  border-radius:9px;pointer-events:none}

.tour{display:flex;gap:10px;align-items:center;background:var(--paper-1);border:1px solid var(--line);
  border-radius:12px;padding:15px 16px}
.tour .tx{flex:1;min-width:0}
.tour b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.tour p{font-size:12px;color:var(--ink-2);line-height:1.5}

.btn{font-family:var(--font-ui);font-size:13.5px;font-weight:600;border-radius:9px;
  padding:11px 17px;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--gold-leaf);color:#1a1509}
.btn-ghost{background:var(--paper-1);border-color:var(--line-2);color:var(--ink-1)}
.btn-block{display:block;width:100%}

/* Caja de descarga: lo primero del cuerpo cuando ya se libero. */
.dbox{background:var(--ok-bg);border:1px solid rgba(47,125,85,.3);border-radius:12px;
  padding:16px;margin-bottom:26px}
.dhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.dhead .ic{color:var(--ok);flex:0 0 auto;margin-top:1px}
.dhead b{display:block;font-size:14px;font-weight:600;color:var(--ok);margin-bottom:3px}
.dhead p{font-size:12px;color:var(--ink-2);line-height:1.5}
.verSueltos{display:block;width:100%;background:none;border:none;cursor:pointer;
  font-family:var(--font-ui);font-size:12px;color:var(--ink-2);padding:10px 0 2px;
  text-decoration:underline;text-underline-offset:3px}
.descargas{display:flex;flex-direction:column;gap:9px}
.dl{display:flex;align-items:center;gap:12px;background:var(--paper-1);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit}
.dl .ic{color:var(--ink-3);flex:0 0 auto}
.dl .tx{flex:1;min-width:0}
.dl b{display:block;font-size:13.5px;font-weight:600}
.dl span{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}

.vacio{background:var(--paper-1);border:1px dashed var(--line-2);border-radius:12px;
  padding:26px 20px;text-align:center}
.vacio p{font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* ── Visor ─────────────────────────────────────────────────────────────────
   Lo que hoy no existe: moverse por el material sin abrir y cerrar 45 veces. */
.visor{position:fixed;inset:0;z-index:200;background:rgba(14,12,9,.97);display:none;
  flex-direction:column}
.visor.on{display:flex}
.vtop{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;
  flex:0 0 auto}
.vtop .cnt{font-family:var(--font-mono);font-size:12px;color:rgba(255,253,248,.72)}
.vtop .acc{display:flex;gap:8px;align-items:center}
.icb{width:38px;height:38px;border-radius:50%;background:rgba(255,253,248,.1);border:none;
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icb:hover{background:rgba(255,253,248,.19)}
.vmid{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  padding:0 8px;min-height:0}
.vmid img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.vmid iframe{width:100%;max-width:1100px;aspect-ratio:16/9;border:0;border-radius:8px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  background:rgba(255,253,248,.13);border:none;color:#fff;display:flex;align-items:center;
  justify-content:center;cursor:pointer;z-index:3}
.nav:hover{background:rgba(255,253,248,.24)}
.nav.izq{left:10px} .nav.der{right:10px}
.vbot{flex:0 0 auto;padding:12px 16px 20px;display:flex;justify-content:center}
.vbot .btn-primary{padding:10px 20px}
.vname{font-family:var(--font-mono);font-size:11px;color:rgba(255,253,248,.5);
  text-align:center;padding-bottom:6px}

footer{background:var(--onyx);padding:22px 24px;text-align:center}
footer p{font-size:12px;color:rgba(247,244,236,.6);line-height:1.6}
footer .wa{display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#06331a;
  font-size:13px;font-weight:600;padding:10px 18px;border-radius:9px;text-decoration:none;margin-top:12px}
</style>
</head>

</div>

  <div class="vmid" id="vmid">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

</div>

}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

function datos(){
  var hayFotos = CONT === 'mixto' || CONT === 'fotos' || CONT === 'todo';
  var vids = (CONT === 'mixto') ? VIDEOS_1
           : (CONT === 'unvideo') ? VIDEOS_1
           : (CONT === 'tres' || CONT === 'todo') ? VIDEOS_3 : [];
  return { fotos: hayFotos ? FOTOS : [], videos: vids, liberada: ESTADO === 'live' };
}

function pintar(){
  var d = datos();
  var dev = document.getElementById('device');
  dev.className = 'device ' + ANCHO;

  // Portada: la foto elegida. Sin fotos, cae al video — nunca queda un hueco gris.
  var portada = d.fotos.filter(function(f){ return f.destacado; })[0] || d.fotos[0];
  var hi = document.getElementById('heroImg');
  hi.src = portada ? fotoUrl(portada, ANCHO === 'movil' ? 900 : 1600)
                   : (d.videos.length ? vidThumb(d.videos[0].t) : '');
  document.getElementById('heroEy').textContent =
    'Entrega · IAV-2607.17-A' + (d.liberada ? ' · liberada' : '');

  var h = '';

  // 1. La descarga es lo primero que se ve. Es a lo que vino el cliente.
  h += d.liberada ? bloqueDescarga(d) : bloqueBloqueada();

  // 2. El video va siempre arriba, justo debajo de la descarga. No compite con la
  //    galeria por la atencion: es la pieza que el cliente quiere ver primero.
  h += bloqueVideo(d);

  if(d.fotos.length){
    h += '<div class="bloque"><h3 class="sect">Fotografías <span class="n">' + d.fotos.length + '</span></h3>' +
      '<div class="mosaico" id="mosaico"></div></div>';
  }

  h += '<div class="bloque"><h3 class="sect">Recorrido 360°</h3>' +
    '<div class="tour"><div class="tx"><b>Tour virtual</b>' +
    '<p>Vive en la nube y no expira. Guárdalo o compártelo cuando quieras.</p></div>' +
    '<button class="btn btn-ghost">Abrir</button></div></div>';

  document.getElementById('cuerpo').innerHTML = h;
  if(d.fotos.length) montarMosaico(d.fotos);
}

// Liberada: una sola accion grande arriba de todo, con la fecha limite pegada
// para que nadie la lea "despues". Los archivos sueltos quedan como salida
// secundaria — quien quiere solo una foto la baja desde el visor.
function bloqueDescarga(d){
  var n = d.fotos.length + d.videos.length;
  return '<div class="dbox">' +
    '<div class="dhead"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 11h16v10H4z"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg></span>' +
    '<div><b>Tu material está liberado</b>' +
    '<p>Vence el <b style="display:inline">25 de agosto</b> · quedan 14 días</p></div></div>' +
    '<button class="btn btn-primary btn-block" onclick="descargarActual()">Descargar todo · ' + n + ' archivos</button>' +
    '<button class="verSueltos" onclick="this.nextElementSibling.style.display=\'flex\';this.style.display=\'none\'">Ver archivos por separado</button>' +
    '<div class="descargas" style="display:none;margin-top:11px">' +
      (d.fotos.length ? fila('carpeta', 'Fotografías', d.fotos.length + ' archivos · 476 MB') : '') +
      d.videos.map(function(v){ return fila('video', v.nombre, 'MP4 · ' + v.dur); }).join('') +
    '</div></div>';
}

function bloqueBloqueada(){
  return '<div class="banner lock"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>' +
    '<div><b>Descarga bloqueada</b><p>Puedes ver todo tu material. Al liquidar se libera y tienes 14 días para descargarlo.</p></div></div>';
}

function bloqueVideo(d){
  if(!d.videos.length) return '';
  var titulo = d.videos.length === 1 ? 'Video' : 'Videos';
  return '<div class="bloque"><h3 class="sect">' + titulo +
    (d.videos.length > 1 ? ' <span class="n">' + d.videos.length + '</span>' : '') + '</h3>' +
    '<div class="videos' + (d.videos.length > 1 ? ' multi' : '') + '">' +
    d.videos.map(function(v, i){
      return '<button class="vcard" onclick="verVideo(' + i + ')">' +
        '<img src="' + vidThumb(v.t) + '" alt="">' +
        '<span class="pl"><svg width="20" height="20" viewBox="0 0 24 24" fill="var(--onyx)"><path d="M8 5l12 7-12 7z"/></svg></span>' +
        '<span class="cap"><b>' + esc(v.nombre) + '</b><span>' + v.dur + '</span></span>' +
        '</button>';
    }).join('') + '</div></div>';
}

function fila(tipo, nombre, det){
  var ic = tipo === 'video'
    ? '<path d="M15 10l6-3v10l-6-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/>'
    : '<path d="M3 7h6l2 2h10v10H3z"/>';
  return '<a class="dl" href="#" onclick="return false"><span class="ic">' +
    '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">' + ic + '</svg></span>' +
    '<span class="tx"><b>' + esc(nombre) + '</b><span>' + esc(det) + '</span></span>' +
    '<span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 21h16"/></svg></span></a>';
}

// Carga diferida. NO es un lujo: cada miniatura es una transformacion del Worker,
// y pedir 45 de golpe es exactamente lo que lo tumba. Solo se piden las que estan
// por entrar en pantalla.
function montarMosaico(fotos){
  var cont = document.getElementById('mosaico');
  var ancho = ANCHO === 'movil' ? 420 : 520;
  var obs = new IntersectionObserver(function(entradas, o){
    entradas.forEach(function(en){
      if(!en.isIntersecting) return;
      var img = en.target.querySelector('img');
      if(!img.src) img.src = img.dataset.src;
      o.unobserve(en.target);
    });
  }, { rootMargin: '600px 0px' });

  fotos.forEach(function(f, i){
    var b = document.createElement('button');
    b.className = 'ph';
    b.onclick = function(){ abrirFoto(i); };
    var img = document.createElement('img');
    img.dataset.src = fotoUrl(f, ancho);
    img.alt = f.nombre || '';
    img.onload = function(){ img.className = 'ok'; };
    b.appendChild(img);
    cont.appendChild(b);
    obs.observe(b);
  });
}

// ── Visor ───────────────────────────────────────────────────────────────────
function abrirFoto(i){
  ES_VIDEO = false; LISTA = datos().fotos; IDX = i;
  document.getElementById('visor').classList.add('on');
  pintarVisor();
}
function verVideo(i){
  ES_VIDEO = true; LISTA = datos().videos; IDX = i;
  document.getElementById('visor').classList.add('on');
  pintarVisor();
}
function pintarVisor(){
  var d = datos();
  var mid = document.getElementById('vmid');
  var vi = document.getElementById('vimg');
  var iframe = mid.querySelector('iframe');
  if(iframe) iframe.remove();

  if(ES_VIDEO){
    vi.style.display = 'none';
    var f = document.createElement('iframe');
    f.src = 'https://' + VID_CUST + '.cloudflarestream.com/' + VID_UID +
      '/iframe?poster=' + encodeURIComponent(vidThumb(LISTA[IDX].t));
    f.allow = 'accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;';
    f.allowFullscreen = true;
    mid.appendChild(f);
    document.getElementById('vname').textContent = LISTA[IDX].nombre;
  } else {
    vi.style.display = '';
    vi.src = fotoUrl(LISTA[IDX], ANCHO === 'movil' ? 1200 : 1800);
    document.getElementById('vname').textContent = LISTA[IDX].nombre || '';
  }
  document.getElementById('vcnt').textContent = (IDX + 1) + ' / ' + LISTA.length;
  // La descarga solo existe si esta liberada. Mismo criterio que el resto.
  document.getElementById('vdl').style.display = d.liberada ? '' : 'none';
  document.getElementById('vbot').innerHTML = d.liberada
    ? '<button class="btn btn-primary" onclick="descargarActual()">Descargar ' +
      (ES_VIDEO ? 'este video' : 'esta foto') + '</button>'
    : '<p style="font-size:12px;color:rgba(255,253,248,.45);text-align:center">' +
      'La descarga se habilita al liquidar.</p>';
  document.querySelectorAll('.nav').forEach(function(n){
    n.style.display = LISTA.length > 1 ? '' : 'none';
  });
}
function mover(paso){
  if(!LISTA.length) return;
  IDX = (IDX + paso + LISTA.length) % LISTA.length;
  pintarVisor();
}
function cerrarVisor(){
  document.getElementById('visor').classList.remove('on');
  var f = document.querySelector('#vmid iframe'); if(f) f.remove();
}
function descargarActual(){ alert('Mockup: aquí bajaría el archivo original limpio.'); }

document.addEventListener('keydown', function(e){
  if(!document.getElementById('visor').classList.contains('on')) return;
  if(e.key === 'Escape') cerrarVisor();
  if(e.key === 'ArrowLeft') mover(-1);
  if(e.key === 'ArrowRight') mover(1);
});
// Deslizar en el celular.
var x0 = null;
document.getElementById('vmid').addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; });
document.getElementById('vmid').addEventListener('touchend', function(e){
  if(x0 == null) return;
  var dx = e.changedTouches[0].clientX - x0;
  if(Math.abs(dx) > 45) mover(dx < 0 ? 1 : -1);
  x0 = null;
});

function seg(id, attr, set){
  document.getElementById(id).addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    this.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    set(b.dataset[attr]);
    pintar();
  });
}
seg('segCont', 'c', function(v){ CONT = v; });
seg('segEstado', 'e', function(v){ ESTADO = v; });
seg('segAncho', 'a', function(v){ ANCHO = v; });

pintar();
</script>
