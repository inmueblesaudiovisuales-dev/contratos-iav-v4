<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup · Captura video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root{
    --paper-0:#F7F4EC; --paper-1:#FFFDF8; --paper-2:#EFEADF;
    --line:#E2DBCB; --line-2:#D2C9B3;
    --onyx:#1C1C1E; --onyx-soft:#2A2A2D;
    --gold:#B08D2E; --gold-leaf:#C9A84C; --gold-leaf-hi:#D4B65C; --gold-pale:#F3EAD0; --gold-glow:rgba(176,141,46,.14);
    --ink-1:#211E18; --ink-2:#5C564A; --ink-3:#918975; --ink-4:#B8B0A0;
    --ok:#2F7D55; --ok-bg:#E7F1EA;
    --warn:#B0560E; --warn-bg:#FBEEE2;
    --danger:#B23A2B; --danger-bg:#F8E7E4;
    --r-sm:8px; --r:10px; --r-lg:14px; --r-pill:999px;
    --font-ui:'Inter',system-ui,sans-serif;
    --font-display:'Fraunces',Georgia,serif;
    --font-mono:'Spline Sans Mono',ui-monospace,monospace;
    --shadow-1:0 1px 2px rgba(33,30,24,.04),0 2px 8px rgba(33,30,24,.05);
    --shadow-2:0 2px 6px rgba(33,30,24,.06),0 12px 32px rgba(33,30,24,.10);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--font-ui); background:var(--paper-0); color:var(--ink-1); -webkit-font-smoothing:antialiased; line-height:1.5; }
  .phone{ max-width:412px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }

  /* Topbar */
  .topbar{ background:var(--onyx); border-bottom:1.5px solid var(--gold-leaf); padding:14px 16px 12px; display:flex; align-items:center; gap:12px; }
  .brand{ display:inline-flex; align-items:center; gap:8px; color:rgba(255,255,255,.72); font-size:13px; font-weight:500; white-space:nowrap; }
  .brand .logo{ font-family:var(--font-display); font-weight:600; font-size:13px; letter-spacing:.02em; color:var(--onyx); background:var(--gold-leaf); border-radius:6px; padding:3px 7px; line-height:1; }
  .topbar .spacer{ flex:1; }
  .lane-chip{ display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border-radius:var(--r-pill); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); color:#fff; font-size:13px; font-weight:600; }
  .lane-chip i{ font-size:16px; color:var(--gold-leaf); }
  .lane-chip .chev{ font-size:15px; color:rgba(255,255,255,.5); }
  .sync{ display:inline-flex; align-items:center; gap:6px; color:rgba(255,255,255,.6); font-size:11px; font-weight:600; }
  .sync .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); }

  /* Property line */
  .prop{ padding:10px 16px 0; display:flex; align-items:baseline; gap:8px; }
  .prop .name{ font-size:13px; font-weight:600; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prop .folio{ font-family:var(--font-mono); font-size:11px; color:var(--ink-3); margin-left:auto; }

  /* Active room focus */
  .focus{ padding:14px 16px 4px; }
  .focus .floor{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--gold); margin-bottom:2px; }
  .focus .floor i{ font-size:15px; }
  .focus .room{ font-family:var(--font-display); font-size:30px; font-weight:500; letter-spacing:-.01em; line-height:1.08; }
  .focus .room .parent{ display:block; font-size:13px; font-weight:600; color:var(--ink-3); font-family:var(--font-ui); letter-spacing:0; margin-bottom:1px; }

  /* Camera / next-file token (anti-error) */
  .cam{ margin:12px 16px 0; background:var(--paper-1); border:1px solid var(--line); border-radius:var(--r); padding:11px 12px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-1); }
  .cam .ic{ width:38px; height:38px; border-radius:var(--r-sm); background:var(--gold-pale); display:flex; align-items:center; justify-content:center; flex:none; }
  .cam .ic i{ font-size:21px; color:var(--gold); }
  .cam .copy{ min-width:0; flex:1; }
  .cam .copy .lbl{ font-size:13px; font-weight:600; color:var(--ink-1); }
  .cam .copy .next{ font-size:12px; color:var(--ink-3); margin-top:1px; }
  .cam .copy .next b{ font-family:var(--font-mono); font-weight:600; color:var(--gold); font-size:13px; }
  .cam .swap{ width:36px; height:36px; flex:none; border-radius:var(--r-sm); border:1px solid var(--line-2); background:var(--paper-1); color:var(--ink-2); display:flex; align-items:center; justify-content:center; }
  .cam .swap i{ font-size:18px; }

  /* Change room button */
  .change{ margin:12px 16px 0; height:46px; width:calc(100% - 32px); border:1.5px solid var(--line-2); background:var(--paper-1); border-radius:var(--r); display:flex; align-items:center; justify-content:space-between; padding:0 14px; color:var(--ink-1); font-size:14px; font-weight:600; }
  .change .l{ display:inline-flex; align-items:center; gap:9px; }
  .change i{ font-size:19px; color:var(--ink-3); }
  .change .chev{ color:var(--ink-3); }

  /* Takes in this room */
  .takes{ flex:1; padding:18px 16px 8px; }
  .takes .hd{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .takes .hd .t{ font-size:13px; font-weight:600; color:var(--ink-3); }
  .takes .hd .n{ font-family:var(--font-mono); font-size:12px; color:var(--ink-3); }
  .take{ display:flex; align-items:center; gap:11px; padding:11px 12px; background:var(--paper-1); border:1px solid var(--line); border-radius:var(--r); margin-bottom:7px; box-shadow:var(--shadow-1); }
  .take.latest{ border-color:var(--gold-leaf); box-shadow:0 0 0 1px var(--gold-pale),var(--shadow-1); }
  .take .tok{ font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--ink-1); }
  .take .meta{ font-size:11px; color:var(--ink-3); margin-top:1px; }
  .take .grow{ flex:1; min-width:0; }
  .badge{ display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; border-radius:var(--r-pill); font-size:12px; font-weight:600; white-space:nowrap; }
  .badge i{ font-size:14px; }
  .badge.good{ background:var(--ok-bg); color:var(--ok); }
  .badge.fail{ background:var(--danger-bg); color:var(--danger); }
  .mark{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:var(--r-sm); border:1.5px solid var(--line-2); background:var(--paper-1); color:var(--ink-2); font-size:12px; font-weight:600; }
  .mark i{ font-size:16px; color:var(--gold); }

  /* Thumb zone */
  .thumb{ position:sticky; bottom:0; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top,var(--paper-0) 72%,rgba(247,244,236,0)); display:grid; grid-template-columns:1.7fr 1fr; gap:10px; }
  .btn-toma{ height:64px; border:none; border-radius:var(--r-lg); background:var(--gold-leaf); color:var(--onyx); box-shadow:0 1px 0 var(--gold),0 6px 16px var(--gold-glow); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  .btn-toma .lbl{ font-size:18px; font-weight:700; }
  .btn-toma .sub{ font-family:var(--font-mono); font-size:11px; font-weight:600; color:rgba(28,28,30,.62); }
  .btn-no{ height:64px; border:1.5px solid var(--danger); border-radius:var(--r-lg); background:var(--paper-1); color:var(--danger); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .btn-no i{ font-size:21px; }
  .btn-no .lbl{ font-size:14px; font-weight:600; }
</style>
</head>
<body>
<div class="phone">
  <header class="topbar">
    <span class="brand"><span class="logo">IAV</span>bitácora</span>
    <span class="spacer"></span>
    <span class="lane-chip"><i class="ti ti-video"></i>Video<i class="ti ti-chevron-down chev"></i></span>
    <span class="sync"><span class="dot"></span>en vivo</span>
  </header>

  <div class="prop">
    <span class="name">Casa Cumbres · Sra. Martínez</span>
    <span class="folio">IAV-0428</span>
  </div>

  <section class="focus">
    <span class="floor"><i class="ti ti-stairs"></i>Piso 2</span>
    <h1 class="room">Recámara principal</h1>
  </section>

  <div class="cam">
    <span class="ic"><i class="ti ti-camera"></i></span>
    <div class="copy">
      <div class="lbl">Sony FX30</div>
      <div class="next">siguiente archivo · <b>PIB2819</b></div>
    </div>
    <button class="swap"><i class="ti ti-switch-horizontal"></i></button>
  </div>

  <button class="change">
    <span class="l"><i class="ti ti-arrows-exchange"></i>Cambiar cuarto</span>
    <i class="ti ti-chevron-right chev"></i>
  </button>

  <section class="takes">
    <div class="hd"><span class="t">Tomas en este cuarto</span><span class="n">3 · 1 buena</span></div>

    <div class="take latest">
      <div class="grow">
        <div class="tok">PIB2818</div>
        <div class="meta">hace 12 s · tú</div>
      </div>
      <button class="mark"><i class="ti ti-star"></i>Marcar buena</button>
    </div>

    <div class="take">
      <div class="grow">
        <div class="tok">PIB2817</div>
        <div class="meta">hace 1 min · tú</div>
      </div>
      <span class="badge fail"><i class="ti ti-x"></i>fallida</span>
    </div>

    <div class="take">
      <div class="grow">
        <div class="tok">PIB2816</div>
        <div class="meta">hace 2 min · tú</div>
      </div>
      <span class="badge good"><i class="ti ti-star-filled"></i>buena</span>
    </div>
  </section>

  <div class="thumb">
    <button class="btn-toma"><span class="lbl">Toma</span><span class="sub">+1 · PIB2819</span></button>
    <button class="btn-no"><i class="ti ti-circle-x"></i><span class="lbl">No sirve</span></button>
  </div>
</div>
</body>
</html>
